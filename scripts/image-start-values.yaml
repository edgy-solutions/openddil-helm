# Values on top of the openddil-demo chart defaults for scripts/check-image-start.py.
# The aim: every image of ours (ghcr.io/edgy-solutions/openddil/*) that a full
# deployment runs is in the render. Defaults already run sensor-ingest,
# faust-edge, faust-regional, projector, hub-restate-projector, cm-service,
# asset-registry-service, logistics-fusion-service, frontend, logistics-sim and
# the runtime-bundle loaders. The blocks below add what is off by default.
#
# Nothing here is a deployment setting. Values only need to satisfy the chart's
# render-time checks; the check starts containers with no network.

# --- read-path releasability ---------------------------------------------
# On because it adds the egress gate and pane (image: egress) and the
# bundle-loader init containers of the policy pods. oidc is on because the
# `picture` block below requires it.
releasability:
  enabled: true
  oidc:
    enabled: true

# --- exercise control -----------------------------------------------------
# Needs releasability. Its own workload runs the stock python image with code
# from a ConfigMap, so no image of ours is added; on so that its render path
# (and the adapter checks in the template) stay exercised.
exerciseControl:
  enabled: true
  adapter:
    name: start-check
    endpoint: "http://127.0.0.1:9"
    operations:
      pause: {method: POST, path: /pause}

# --- picture ---------------------------------------------------------------
# Needs releasability and oidc. Adds a PEP route and realm client, no image of
# ours; on for render coverage only.
picture:
  enabled: true

# --- egress components (all run image: egress) ----------------------------
# The assembler and forwarder each get one minimal route. With an empty
# config they subscribe to no topic and exit on a client error, which says
# nothing about the image. The kind is a stand-in with the x-openddil
# pointers the assembler requires (owning_tier and episode).
egress:
  kinds:
    StartCheckKind:
      type: object
      properties:
        ref: {type: string}
        marking: {type: object}
        tier: {type: string}
        subject: {type: string}
        what:
          type: object
          properties:
            part: {type: string}
            code: {type: string}
      x-openddil:
        key: /ref
        label: /marking
        owning_tier: /tier
        episode: {asset: /subject, component: /what/part, fault_code: /what/code}
  assembler:
    enabled: true
    config:
      - {name: start-check, kind: StartCheckKind, trigger_topic: start-check-trigger, output_topic: start-check-assembled}
  intake:
    enabled: true
  forwarder:
    enabled: true
    config:
      - {name: start-check, sink_topic: start-check-assembled, url: "http://127.0.0.1:9/ingest", kind: StartCheckKind}
  stubSink:
    enabled: true

# --- Left off on purpose ---------------------------------------------------
# exerciseControl.stubAdapter (dis-sim): the image is built outside this
# repository, so this check cannot say which build it should run.
# egress.tak: runs tak-server, which is third-party.
