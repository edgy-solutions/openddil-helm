# =============================================================================
# Declared-idle topics — why a fed consumer has nothing to read
# =============================================================================
# "FED IS NOT FLOWING." check_tier_feed asks whether a consumer's topic EXISTS
# on its broker. A topic sitting at high-watermark 0 answers yes and starves
# the consumer just the same. The check printed that as a caveat about itself
# one run before it mattered, which is the tell that it belonged in a
# classification rather than in prose.
#
# So the ladder is now four rungs, not three:
#
#     configured -> created -> subscribed -> FLOWING
#
# and a topic that is created but not flowing must say WHY. An undeclared
# empty topic is a finding; a declared one is a known state with a name.
# This is the same move as the releasability gate's declared-empty tables:
# absence of data and absence of an explanation are different absences, and
# only the second is a defect in the system rather than a fact about it.
#
# STATUSES
#   declared    Expected for this deployment. Not a defect; the declaration
#               is what stops it reading as one.
#   held        A KNOWN DEFECT, deliberately deferred by decision. Named so it
#               cannot quietly become "expected" through familiarity.
#   investigate Nobody knows yet. This is the honest status and it is meant to
#               be uncomfortable — it should not survive many runs.
#
# SCOPE
#   tiers: [<tier id>, ...]   Optional, flow list only. With no `tiers:` key an
#               entry applies at every tier. With it, the entry applies only
#               at the listed tiers; at any other tier the topic is judged as
#               if undeclared. A `tiers:` line in any other form refuses the
#               run, and a listed id that is not a deployed tier fails it.
#
# `held` and `investigate` are NOT passes. They keep the check green-with-a-
# reason rather than green, and the summary counts them separately so a
# growing pile is visible.
# =============================================================================
version: 1

topics:

  asset-capability-snapshot:
    status: declared
    reason: >-
      DIS EntityStatePDU carries no loadout or stores information, so nothing
      in this deployment can author a capability snapshot. ADR-0038 already
      states it. Watermark 0 on every broker is the correct value, not a gap.
    revisit: >-
      A feed that does carry loadout — AFSim/VR-Forces, or a customer source —
      changes this from declared to expected-flowing, and this entry should be
      removed rather than amended. That producer must stamp provenance.edge_id
      on every snapshot: when other nodes run their own fusion, logistics
      fusion holds (never derives) an asset whose inputs name no producing
      edge, so an unstamped capability-only asset would never get a status.

  asset-element-telemetry:
    status: declared
    tiers: [region-east, region-west]
    reason: >-
      The per-element tree stays at the owning edge: logistics-sim publishes
      it to that edge's broker and only an asset-level rollup, in
      asset-telemetry-windows, crosses the uplink. So the topic is idle by
      design on a region broker. It does flow on an edge that hosts an asset
      with an element profile (the DIS mapper declares the sensor subsystem,
      so the profile matches), and an edge with no such asset has nothing to
      publish. The checker scopes by tier and cannot say "idle except where a
      profiled asset lives", so edges are deliberately out of scope: an
      empty edge topic stays a finding to read, rather than a regression
      hidden behind a blanket declaration.
    revisit: >-
      If an edge with no profiled asset keeps reading as a finding, add that
      edge to the scope. Remove the entry if the tree ever crosses the uplink.

  asset-element-inventory:
    status: declared
    reason: >-
      Published on HQ only, so it is idle on every tier broker by design;
      nothing relays it down.
    revisit: If inventory is ever published at the edge, scope this to HQ-fed tiers or remove it.

  asset-telemetry-windows:
    status: investigate
    reason: >-
      It now flows on an edge with a profiled asset, from the rollup of the
      element tree, and on the region above that edge via the edge bridge. The
      region's tier uplink relays it on to HQ as well. It is not
      scoped, because a blanket declaration would hide a stalled edge. Still
      open: whether faust-edge's windowing produces anything for assets with
      no element profile.
    revisit: When that is answered, narrow this to declared for the tiers that carry no profiled asset.

  cm-events:
    status: declared
    reason: >-
      This deployment has NO CM event source. Verified rather than assumed:
      no cm-ingest workload exists in the namespace, and `cm-items` — the
      other topic on that path — is also at watermark 0. Configuration
      baselines are seeded statically (coverage measured at 3 of 14 assets),
      so there is no stream of configuration CHANGES for cm-service to apply.
      Found by the flowing rung on its first run, on a tier the three-rung
      check had been reporting as 15 of 15.
    revisit: >-
      A deployment with a real CM/PDM feed makes this expected-flowing, and
      the entry should be removed rather than amended. Note the asymmetry:
      cm-service-cm-events is gated OFF at a tier without direct ingest, so
      this topic is only ever consumed where it is ingested.

  effector-events:
    status: declared
    tiers: [edge-02]
    reason: >-
      Only a tier with a launcher entity produces effector events. In this
      deployment edge-02 has none, so its effector-events stays at watermark
      0. Edge-01 does have a launcher, so its topic must flow: it is
      deliberately out of scope here, and an empty edge-01 topic stays a
      finding. Declared 2026-10-08.
    revisit: >-
      When a launcher is assigned to edge-02, remove edge-02 from the scope
      (and the entry, if no tier is left).
