# =============================================================================
# OpenDDIL — Artifactory (or any private-registry) values override
# =============================================================================
# Use with `helm install -f values-artifactory.yaml` to redirect every
# image pull from upstream (ghcr.io / Docker Hub / docker.redpanda.com)
# to your mirror registry. Pairs with scripts/mirror-to-artifactory.ps1
# which pulls + retags + pushes images to that mirror.
#
# Usage:
#   1. Mirror the images:
#      scripts/mirror-to-artifactory.ps1 -RepoBase artifactory.mycorp.com/docker-openddil
#
#   2. Substitute <ARTIFACTORY> below with the same -RepoBase value. On
#      PowerShell:
#        (Get-Content values-artifactory.yaml) -replace '<ARTIFACTORY>', `
#          'artifactory.mycorp.com/docker-openddil' | `
#          Set-Content values-mycorp.yaml
#
#   3. Create the docker-registry pull secret in the openddil namespace:
#        kubectl create namespace openddil
#        kubectl create secret docker-registry artifactory-pull-secret `
#          --namespace openddil `
#          --docker-server=artifactory.mycorp.com `
#          --docker-username=<USER> `
#          --docker-password=<TOKEN-or-PASSWORD>
#
#   4. Install:
#        helm install openddil oci://artifactory.mycorp.com/docker-openddil/edgy-solutions/openddil/charts/openddil-demo `
#          --version 0.1.1 `
#          --namespace openddil `
#          -f values-mycorp.yaml `
#          --set ingress.host=openddil.mycluster.local
#
# Naming convention: <ARTIFACTORY> is the FULL "<host>/<base-path>" string
# (e.g. artifactory.mycorp.com/docker-openddil). The destinations below
# preserve every image's path-after-registry — the script does the same.

# --- Global -----------------------------------------------------------------
global:
  # OpenDDIL-owned images live at <ARTIFACTORY>/<imagePrefix>/<name>:<tag>
  # — composition done by the openddil.image helper in _helpers.tpl.
  imageRegistry: <ARTIFACTORY>
  imagePrefix: edgy-solutions/openddil
  imagePullPolicy: IfNotPresent
  clusterDomain: ""

  # The pull secret name must match what you created in step 3 above
  # (kubectl create secret docker-registry ...).
  imagePullSecrets:
    - name: artifactory-pull-secret

  imageTag: "latest"

# --- Runtime-bundle image ---------------------------------------------------
# The bundle uses the global.imageRegistry + imagePrefix composition, so
# overriding those two above is enough for the bundle. No per-section
# override needed here.

# --- Third-party images (each gets its repository overridden) ---------------
# These aren't included in the global.imageRegistry composition (their
# `repository` fields are full paths in values.yaml). Each needs the
# full new path.
#
# Tag pins (chart 0.1.4+): every third-party image is pinned by semver
# tag in values.yaml (redpanda v26.1.7, redpanda-connect 4.91.0, electric
# 1.6.2, atlas 0.32.0, etc). The repository overrides below inherit those
# tags. Optionally opt into digest pinning per service by setting
# `digest:` to a sha256 string here — the openddil.thirdPartyImage helper
# will then compose <repo>@<digest> instead of <repo>:<tag>.

redpandaEdge:
  image:
    repository: <ARTIFACTORY>/redpandadata/redpanda

redpandaHq:
  image:
    repository: <ARTIFACTORY>/redpandadata/redpanda

redpandaConnect:
  image:
    repository: <ARTIFACTORY>/redpandadata/connect

edgeHqBridge:
  image:
    repository: <ARTIFACTORY>/redpandadata/connect

postgresHq:
  image:
    repository: <ARTIFACTORY>/library/postgres

toxiproxy:
  image:
    repository: <ARTIFACTORY>/shopify/toxiproxy

electric:
  image:
    repository: <ARTIFACTORY>/electricsql/electric

restate:
  image:
    repository: <ARTIFACTORY>/restatedev/restate

# --- Template-internal utility images (chart 0.1.2+) ------------------------
# atlas runs the postgres-schema-init Job's Atlas migration step (critical
# — blocks install if unavailable); alpine is the schema-init Job's no-op
# main container (also critical); curlimages/curl runs the helm-test
# connectivity pods (only needed for `helm test`, non-critical).
#
# Parameterized in chart version 0.1.2 (templates/postgres-schema-init.yaml
# + templates/tests/connectivity.yaml). Earlier chart versions had these
# hardcoded — if you're on 0.1.1 or earlier, these overrides are silently
# ignored and you need a pull-through cache instead.
utilities:
  atlas:
    repository: <ARTIFACTORY>/arigaio/atlas
  alpine:
    repository: <ARTIFACTORY>/library/alpine
  curl:
    repository: <ARTIFACTORY>/curlimages/curl
