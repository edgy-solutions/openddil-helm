name: Build and publish runtime-bundle image

# Builds ghcr.io/edgy-solutions/openddil/runtime-bundle from a composed
# checkout of FOUR sibling openddil-* repos plus this one. This workflow
# replaces the local `scripts/build-bundle.sh` for users who want
# registry-driven builds.
#
# It also publishes .../openddil/dis-sim, the DIS generator's image, in a
# second independent job -- see the comment above `build-dis-sim` for why a
# fixture image is published here rather than anywhere else.
#
# Sources: bundle-sources.lock at the root of this repo names the commit of
# each of the four source repos (contracts, stack, tactical-agents, demo). It
# is the only place those commits are chosen. Changing a source means a helm
# commit that changes the lock; the first step refuses a malformed lock
# (scripts/bundle-sources.sh). One helm commit therefore builds one bundle.
#
# Triggers:
#   1. push to master of THIS repo touching bundle/**, bundle-sources.lock or
#      this workflow file.
#   2. pull_request to master touching the same paths: a branch build of this
#      repo's Dockerfile against the locked commits.
#   3. workflow_dispatch -- manual, on any branch of this repo. Inputs:
#      compare_to and tag only. There is no source input: a source is changed
#      in the lock.
# There is no schedule and no repository_dispatch: with the sources pinned
# they could only rebuild the same commits.
#
# Tags (see "Compute tags"):
#   :sha-<7>  every build. <7> is the first 7 hex of the sha256 of the five
#             source commits (helm, contracts, stack, tactical-agents, demo),
#             so the same five commits give the same tag. The commits are on
#             the image as io.openddil.bundle.source.<repo> labels and in the
#             job summary.
#   :pr-<N>   a pull request build.
#   :<tag>    a v* tag push, or the `tag` input (never `latest`).
#   :latest   a push or a dispatch on master. Nothing else moves it: a branch,
#             a pull request or a tag never does.
# A pull request from a fork builds but pushes nothing.
#
# Pinning a deployment: the job summary prints `bundle.image.digest`, the
# value the chart takes to pull the bundle by digest. With the `compare_to`
# input, the job also lists every file under /bundle that differs from that
# earlier bundle (by git blob hash), so a pinned build can be checked to
# carry only the change it was built for.

on:
  push:
    branches: [ "master" ]
    paths:
      - "bundle/**"
      - "bundle-sources.lock"
      - ".github/workflows/build-bundle.yml"
    # Version tags do not build here. A release adds the version tag to a
    # bundle already built (release.yml -> release-retag.yml); it never
    # rebuilds and never moves :latest.
  pull_request:
    branches: [ "master" ]
    paths:
      - "bundle/**"
      - "bundle-sources.lock"
      - ".github/workflows/build-bundle.yml"
  workflow_dispatch:
    inputs:
      compare_to:
        description: "Earlier bundle digest (sha256:...) to list every changed /bundle file against. Optional."
        required: false
        default: ""
      tag:
        description: "Additional tag (optional, e.g. v0.2.0). Never latest."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      # Each repo gets checked out to a sibling path under $GITHUB_WORKSPACE
      # so the Dockerfile's COPY openddil-contracts/... etc. work without
      # any layout transformation. GITHUB_TOKEN suffices for public repos
      # in the same org; if any of these go private, swap to a PAT secret
      # (e.g. ${{ secrets.OPENDDIL_READ_PAT }}) with `token:` on each
      # checkout step.
      #
      # Each source is checked out at the commit bundle-sources.lock names.
      # On a pull request this repo is checked out at the branch head, not
      # GitHub's merge commit.
      - name: Checkout openddil-helm (self)
        uses: actions/checkout@v4
        with:
          path: openddil-helm
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read bundle-sources.lock
        id: lock
        run: bash openddil-helm/scripts/bundle-sources.sh openddil-helm/bundle-sources.lock >> "$GITHUB_OUTPUT"

      - name: Checkout openddil-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-contracts
          path: openddil-contracts
          ref: ${{ steps.lock.outputs.contracts }}

      - name: Checkout openddil-stack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-stack
          path: openddil-stack
          ref: ${{ steps.lock.outputs.stack }}

      - name: Checkout openddil-tactical-agents
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-tactical-agents
          path: openddil-tactical-agents
          ref: ${{ steps.lock.outputs.tactical-agents }}

      - name: Checkout openddil-demo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-demo
          path: openddil-demo
          ref: ${{ steps.lock.outputs.demo }}

      # The five commits this bundle is built from. A pinned build is a pull
      # request or a ref other than master: it never moves :latest.
      - name: Record source commits
        id: src
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          S="$RUNNER_TEMP/bundle-sources.txt"
          : > "$S"
          for r in helm contracts stack tactical-agents demo; do
            echo "$r $(git -C "openddil-$r" rev-parse HEAD)" >> "$S"
          done
          cat "$S"
          id=$(sha256sum "$S" | cut -c1-7)
          pinned=false
          if [ -n "$PR_NUMBER" ] || [ "$GITHUB_REF" != "refs/heads/master" ]; then
            pinned=true
          fi
          echo "bundle id $id, pinned=$pinned"
          {
            echo "id=$id"
            echo "pinned=$pinned"
            echo "labels<<LABELS_END"
            while read -r r c; do echo "io.openddil.bundle.source.$r=$c"; done < "$S"
            echo "LABELS_END"
          } >> "$GITHUB_OUTPUT"

      # The chart validates algorithm overrides against its own copy of each
      # unit.yaml; the bundle ships the tactical-agents copy. They must be the
      # same file. Exit 2 (checkout absent) fails here too: the checkout is
      # always present in this job, so a SKIP would mean the path is wrong.
      - name: Check algorithm declarations match the chart copy
        run: bash openddil-helm/scripts/check-algorithm-declarations.sh openddil-tactical-agents

      # openddil-contracts gitignores gen/ (per its .gitignore: "Generated
      # Protobuf code is built on demand via `make` and never committed").
      # The bundle Dockerfile COPYs openddil-contracts/gen/python/, so we
      # have to run codegen against the fresh checkout before docker build
      # — otherwise the COPY fails with "path not found in build context."
      #
      # The Makefile's `python` target uses raw `protoc --python_out`, no
      # gRPC plugin — only protobuf-compiler is needed.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Generate Python proto bindings in openddil-contracts
        run: |
          make -C openddil-contracts python

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<id> always, :pr-<N> on a pull request, :<tag> on a v* tag or
      # from the `tag` input; :latest only from an unpinned build on master.
      - name: Compute tags
        id: tags
        env:
          ID: ${{ steps.src.outputs.id }}
          PINNED: ${{ steps.src.outputs.pinned }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXTRA: ${{ inputs.tag }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/runtime-bundle
          T="$REG:sha-$ID"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ -n "$EXTRA" ]; then
            if [ "$EXTRA" = "latest" ]; then
              echo "::error::the tag input cannot be latest"
              exit 1
            fi
            T="$T,$REG:$EXTRA"
          fi
          if [ "$PINNED" = "false" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime-bundle
        id: build
        uses: docker/build-push-action@v5
        with:
          # Build context = workspace root (parent of all 5 checked-out
          # repos). The Dockerfile's COPY paths (openddil-contracts/proto,
          # openddil-stack/schema, etc.) resolve relative to this context.
          context: .
          file: openddil-helm/bundle/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.src.outputs.labels }}
          # No build-args — the bundle image has none.

      # The pin, and with `compare_to` the file diff, read back from the
      # pushed image itself rather than from the build context. Files are
      # named by git blob hash, so any one can be held against a repo tree.
      - name: Pin and compare
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPARE_TO: ${{ inputs.compare_to }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/runtime-bundle
          export LC_ALL=C
          TAB=$(printf '\t')
          manifest() {
            d="$RUNNER_TEMP/m-$2"
            mkdir -p "$d"
            cid=$(docker create "$REG@$1" /bin/true)
            docker cp "$cid:/bundle" "$d/"
            docker rm "$cid" > /dev/null
            (cd "$d" && find bundle -type f | sort > list.txt \
              && git hash-object --no-filters --stdin-paths < list.txt | paste - list.txt)
          }
          manifest "$DIGEST" new > "$RUNNER_TEMP/new.txt"
          echo "PIN bundle.image.digest=$DIGEST"
          echo "files in bundle: $(wc -l < "$RUNNER_TEMP/new.txt")"
          {
            echo "### runtime-bundle"
            echo ""
            echo "Pin: \`bundle.image.digest: $DIGEST\`"
            echo ""
            echo "Sources:"
            echo '```'
            cat "$RUNNER_TEMP/bundle-sources.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COMPARE_TO" ]; then
            case "$COMPARE_TO" in
              sha256:*) ;;
              *) echo "::error::compare_to must be sha256:<hex>"; exit 1 ;;
            esac
            manifest "$COMPARE_TO" old > "$RUNNER_TEMP/old.txt"
            join -t "$TAB" -1 2 -2 2 -a 1 -a 2 -e MISSING -o 0,1.1,2.1 \
              "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt" \
              | awk -F "$TAB" -v OFS=' ' '$2 != $3 { s = ($2 == "MISSING") ? "added" : ($3 == "MISSING") ? "removed" : "changed"; print s, $1, $2, $3 }' \
              > "$RUNNER_TEMP/diff.txt"
            echo "files differing from $COMPARE_TO: $(wc -l < "$RUNNER_TEMP/diff.txt")"
            cat "$RUNNER_TEMP/diff.txt"
            {
              echo ""
              echo "Files differing from \`$COMPARE_TO\` ($(wc -l < "$RUNNER_TEMP/diff.txt")):"
              echo '```'
              cat "$RUNNER_TEMP/diff.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # dis-sim — the DIS PDU generator's image
  # ---------------------------------------------------------------------------
  # Not part of the bundle image. It rides this workflow because this is where
  # OpenDDIL images get published, and because a test fixture does not deserve
  # a workflow of its own.
  #
  # WHY IT IS PUBLISHED AT ALL
  # --------------------------
  # opendis is baked into it so the generator needs no PyPI at container start.
  # That fixed one problem and created a smaller one: an image nothing pushes
  # cannot be pulled, so every cluster needed `build.sh --load` run against its
  # nodes first, and missing that step arrives as ImagePullBackOff in a
  # simulator pod -- which reads as a broken fixture rather than a missing
  # build. Publishing it closes the registry half of that. The mirror
  # inventory in scripts/mirror-to-artifactory.ps1 carries it for air-gapped
  # sites, and scripts/check-mirror-coverage.sh pass 4 holds the manifest's
  # reference against that inventory, because this image is deployed by a
  # manifest in another repo and the chart render can never see it.
  #
  # NO `needs:` ON THE BUNDLE JOB. A fixture image must not be able to fail
  # the runtime bundle, and the bundle must not have to succeed for the
  # fixture to publish.
  #
  # TRIGGERS: the Dockerfile lives in openddil-customer-bundle-example, so
  # this repo's `paths` filter cannot see a change to it. With the schedule
  # removed, a change there is published by the next master push of this repo
  # or a manual dispatch.
  #
  # SINGLE PLATFORM, ON PURPOSE. linux/amd64 only, because `load: true` is
  # what makes the verification step below possible and load is
  # single-platform. The consequence is stated rather than discovered: an
  # arm64 node cannot run this image and reports "no matching manifest".
  # Giving it an arm64 child means adding `platforms:` and giving up a
  # pre-publish proof that the dependency is really in there -- and the proof
  # is worth more than an architecture nothing in the lab uses.
  #
  # MASTER ONLY. It pushes :1.0 and :latest, so a pull request, a branch
  # dispatch or a tag run skips it rather than publish from a branch.
  build-dis-sim:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openddil-customer-bundle-example
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-customer-bundle-example
          path: openddil-customer-bundle-example

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :1.0 is the opendis version, which is the whole content of this
      # image and the wire contract with sensor-ingest's decoder. It moves
      # when that pin moves and not when a build happens. :latest exists for
      # the mirror-script convention and is not what the manifests deploy.
      - name: Build dis-sim (load, do not push yet)
        uses: docker/build-push-action@v5
        with:
          context: openddil-customer-bundle-example/tools/dis-sim
          file: openddil-customer-bundle-example/tools/dis-sim/Dockerfile
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:1.0
            ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:latest

      # The same pre-publish gate the bundle has for atlas migrations, and
      # the same one build.sh runs locally: prove the dependency is IN the
      # image with no network at all. A build log cannot tell a real install
      # from a base image that already had it or a RUN line that no-opped,
      # and --network none is what makes a container that would still reach
      # PyPI fail HERE instead of in a lab at 03:00.
      - name: Prove opendis is baked in, with no network
        run: |
          docker run --rm --network none \
            ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:1.0 \
            python -c "from opendis.dis7 import EntityStatePdu; from opendis.DataOutputStream import DataOutputStream; print('ok')"

      - name: Push dis-sim
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:1.0
          docker push ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:latest
