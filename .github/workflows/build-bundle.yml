name: Build and publish runtime-bundle image

# Builds ghcr.io/edgy-solutions/openddil/runtime-bundle:latest from a
# composed checkout of FOUR sibling openddil-* repos. This workflow
# replaces the local `scripts/build-bundle.sh` for users who want
# registry-driven builds.
#
# It also publishes .../openddil/dis-sim, the DIS generator's image, in a
# second independent job -- see the comment above `build-dis-sim` for why a
# fixture image is published here rather than anywhere else.
#
# Triggers:
#   * push to master of THIS repo (e.g. someone edits the Dockerfile)
#   * manual workflow_dispatch (e.g. rebuild after openddil-contracts
#     adds a new proto without anything in openddil-helm changing)
#
# Cross-repo triggers — three paths to a rebuild:
#
#   1. push to master of THIS repo (bundle/** or this workflow file)
#   2. repository_dispatch from a sibling source repo's own workflow
#      (currently wired: openddil-contracts via its
#      notify-bundle-rebuild.yml. Same pattern can be copy-pasted into
#      openddil-stack / openddil-tactical-agents / openddil-demo when
#      churn there warrants it.) The dispatching workflow needs a PAT
#      with contents:write on this repo, stored as a secret in the
#      source repo (BUNDLE_REBUILD_PAT).
#   3. schedule — daily, regardless of activity, as a safety net for
#      any source repo NOT yet wired to dispatch. Catches drift even
#      when nobody manually triggers and no dispatch fires. Bundle
#      build takes ~3-5 minutes; daily cost is negligible.
#   4. workflow_dispatch — manual button in the Actions UI for ad-hoc
#      rebuilds (e.g. retrying a flaky build, or specifying an extra
#      tag).

on:
  push:
    branches: [ "master" ]
    paths:
      - "bundle/**"
      - ".github/workflows/build-bundle.yml"
    # Tag pushes (v1.0.0, ...) publish a versioned bundle image
    # (:v1.0.0) alongside :latest so the helm chart + customer
    # values-pinned.yaml can pin to a release. No `paths` filter on
    # the tag trigger -- a release tag should always rebuild the
    # bundle, regardless of which file the tagged commit touched.
    tags: [ "v*" ]
  repository_dispatch:
    types: [source-repo-changed]
  schedule:
    # 06:00 UTC daily. Picks up any source-repo change that wasn't
    # dispatch-triggered (e.g. unwired source repos, or a dispatch that
    # failed silently). Cron uses GitHub Actions UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional tag besides :latest (optional, e.g. v0.2.0)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      # Each repo gets checked out to a sibling path under $GITHUB_WORKSPACE
      # so the Dockerfile's COPY openddil-contracts/... etc. work without
      # any layout transformation. GITHUB_TOKEN suffices for public repos
      # in the same org; if any of these go private, swap to a PAT secret
      # (e.g. ${{ secrets.OPENDDIL_READ_PAT }}) with `token:` on each
      # checkout step.
      - name: Checkout openddil-helm (self)
        uses: actions/checkout@v4
        with:
          path: openddil-helm

      - name: Checkout openddil-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-contracts
          path: openddil-contracts

      - name: Checkout openddil-stack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-stack
          path: openddil-stack

      - name: Checkout openddil-tactical-agents
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-tactical-agents
          path: openddil-tactical-agents

      - name: Checkout openddil-demo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-demo
          path: openddil-demo

      # openddil-contracts gitignores gen/ (per its .gitignore: "Generated
      # Protobuf code is built on demand via `make` and never committed").
      # The bundle Dockerfile COPYs openddil-contracts/gen/python/, so we
      # have to run codegen against the fresh checkout before docker build
      # — otherwise the COPY fails with "path not found in build context."
      #
      # The Makefile's `python` target uses raw `protoc --python_out`, no
      # gRPC plugin — only protobuf-compiler is needed.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Python proto bindings in openddil-contracts
        run: |
          make -C openddil-contracts python

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: always :latest. Additionally:
      #   * On a v* git tag push: :<tag-name> (e.g. :v1.0.0). Consumers
      #     pin to this in values-pinned.yaml for reproducible deploys.
      #   * On workflow_dispatch with the `tag` input: :<input-value>.
      #     Lets the operator publish an ad-hoc tag (e.g. retry rebuild
      #     under a specific name).
      - name: Compute tags
        id: tags
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/runtime-bundle
          T="$REG:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            T="$T,$REG:${{ github.ref_name }}"
          fi
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            T="$T,$REG:${{ github.event.inputs.tag }}"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime-bundle
        uses: docker/build-push-action@v5
        with:
          # Build context = workspace root (parent of all 5 checked-out
          # repos). The Dockerfile's COPY paths (openddil-contracts/proto,
          # openddil-stack/schema, etc.) resolve relative to this context.
          context: .
          file: openddil-helm/bundle/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # No build-args — the bundle image has none.

  # ---------------------------------------------------------------------------
  # dis-sim — the DIS PDU generator's image
  # ---------------------------------------------------------------------------
  # Not part of the bundle image. It rides this workflow because this is where
  # OpenDDIL images get published, and because a test fixture does not deserve
  # a workflow of its own.
  #
  # WHY IT IS PUBLISHED AT ALL
  # --------------------------
  # opendis is baked into it so the generator needs no PyPI at container start.
  # That fixed one problem and created a smaller one: an image nothing pushes
  # cannot be pulled, so every cluster needed `build.sh --load` run against its
  # nodes first, and missing that step arrives as ImagePullBackOff in a
  # simulator pod -- which reads as a broken fixture rather than a missing
  # build. Publishing it closes the registry half of that. The mirror
  # inventory in scripts/mirror-to-artifactory.ps1 carries it for air-gapped
  # sites, and scripts/check-mirror-coverage.sh pass 4 holds the manifest's
  # reference against that inventory, because this image is deployed by a
  # manifest in another repo and the chart render can never see it.
  #
  # NO `needs:` ON THE BUNDLE JOB. A fixture image must not be able to fail
  # the runtime bundle, and the bundle must not have to succeed for the
  # fixture to publish.
  #
  # TRIGGERS: the Dockerfile lives in openddil-customer-bundle-example, so
  # this repo's `paths` filter cannot see a change to it. The daily schedule
  # is what covers that -- exactly the unwired-source-repo case it was added
  # for. Wiring a repository_dispatch from that repo would need a
  # BUNDLE_REBUILD_PAT secret there (contents:write on THIS repo); until that
  # secret exists, a notify workflow would fail on every push, so the
  # schedule is the wiring.
  #
  # SINGLE PLATFORM, ON PURPOSE. linux/amd64 only, because `load: true` is
  # what makes the verification step below possible and load is
  # single-platform. The consequence is stated rather than discovered: an
  # arm64 node cannot run this image and reports "no matching manifest".
  # Giving it an arm64 child means adding `platforms:` and giving up a
  # pre-publish proof that the dependency is really in there -- and the proof
  # is worth more than an architecture nothing in the lab uses.
  build-dis-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openddil-customer-bundle-example
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-customer-bundle-example
          path: openddil-customer-bundle-example

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :1.0 is the opendis version, which is the whole content of this
      # image and the wire contract with sensor-ingest's decoder. It moves
      # when that pin moves and not when a build happens. :latest exists for
      # the mirror-script convention and is not what the manifests deploy.
      - name: Build dis-sim (load, do not push yet)
        uses: docker/build-push-action@v5
        with:
          context: openddil-customer-bundle-example/tools/dis-sim
          file: openddil-customer-bundle-example/tools/dis-sim/Dockerfile
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:1.0
            ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:latest

      # The same pre-publish gate the bundle has for atlas migrations, and
      # the same one build.sh runs locally: prove the dependency is IN the
      # image with no network at all. A build log cannot tell a real install
      # from a base image that already had it or a RUN line that no-opped,
      # and --network none is what makes a container that would still reach
      # PyPI fail HERE instead of in a lab at 03:00.
      - name: Prove opendis is baked in, with no network
        run: |
          docker run --rm --network none \
            ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:1.0 \
            python -c "from opendis.dis7 import EntityStatePdu; from opendis.DataOutputStream import DataOutputStream; print('ok')"

      - name: Push dis-sim
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:1.0
          docker push ghcr.io/${{ github.repository_owner }}/openddil/dis-sim:latest
