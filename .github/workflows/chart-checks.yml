name: Chart checks

# Render-integrity guards for openddil-demo.
#
# `helm lint` does not catch either defect these guard against — both render
# valid YAML and exit 0. Demonstrated, not assumed: with a loop-boundary
# separator deleted, `helm lint` reports "0 chart(s) failed" and
# `helm template` exits 0 while an object has silently vanished from the
# release. That is why this job exists alongside lint rather than instead of.
#
# AUDIT-2026-08-15 F2 found these checks had only ever been run by hand, once,
# in the sessions that found each defect. Nothing would have failed if either
# came back.

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "openddil-demo/**"
      - "scripts/check-chart-render.sh"
      - "scripts/check-entity-assignment.sh"
      - "scripts/check-tier-config.sh"
      - "scripts/check-mirror-coverage.sh"
      - "scripts/mirror-to-artifactory.ps1"
      - "values-artifactory.yaml"
      - ".github/workflows/chart-checks.yml"
  pull_request:
    paths:
      - "openddil-demo/**"
      - "scripts/check-chart-render.sh"
      - "scripts/check-entity-assignment.sh"
      - "scripts/check-tier-config.sh"
      - "scripts/check-mirror-coverage.sh"
      - "scripts/mirror-to-artifactory.ps1"
      - "values-artifactory.yaml"
      - ".github/workflows/chart-checks.yml"
  workflow_dispatch:

jobs:
  render-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Red-check 1 finds the pre-0.1.135 chart by commit message.
          fetch-depth: 0

      # Pass 4 of the mirror check asks whether the images deployed OUTSIDE
      # the chart are mirrored too -- dis-sim, from that repo's k8s manifest.
      # Without this checkout the pass says "NOT RUN" and the check still
      # exits 0, which is a green check asserting less than it did yesterday:
      # exactly what the restate-wipe default flip nearly did to pass 1. So CI
      # supplies the sibling and the skip becomes a local-only condition.
      #
      # It lands in a subdirectory of this repo's working tree rather than
      # beside it, because actions/checkout will not write outside the
      # workspace. Nothing commits it; OPENDDIL_BUNDLE_EXAMPLE is how the
      # script is told to look there instead of at ../.
      - name: Checkout openddil-customer-bundle-example (for mirror pass 4)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-customer-bundle-example
          path: openddil-customer-bundle-example

      # The producing repos' produces.yaml manifests, for the produces-declarations check (guard 13). Like the
      # customer-bundle checkout above, each lands in a subdirectory of the workspace (actions/checkout cannot
      # write outside it); PRODUCES_REPOS_ROOT tells the script to look there instead of at ../. Default
      # branches only. The list is scripts/produces-repos.txt; keep the two in step.
      - name: Checkout openddil-tactical-agents (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-tactical-agents
          path: produces-repos/openddil-tactical-agents

      - name: Checkout openddil-cm-service (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-cm-service
          path: produces-repos/openddil-cm-service

      - name: Checkout openddil-logistics-fusion-service (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-logistics-fusion-service
          path: produces-repos/openddil-logistics-fusion-service

      - name: Checkout openddil-sensor-ingest (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-sensor-ingest
          path: produces-repos/openddil-sensor-ingest

      - name: Checkout openddil-projector (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-projector
          path: produces-repos/openddil-projector

      - name: Checkout openddil-logistics-sim (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-logistics-sim
          path: produces-repos/openddil-logistics-sim

      - name: Checkout openddil-stack (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-stack
          path: produces-repos/openddil-stack

      - name: Checkout openddil-demo (produces.yaml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-demo
          path: produces-repos/openddil-demo

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: helm lint
        run: helm lint ./openddil-demo

      # The guards lint cannot express.
      - name: Render integrity guards
        env:
          PRODUCES_REPOS_ROOT: ${{ github.workspace }}/produces-repos
        run: ./scripts/check-chart-render.sh

      # A check nobody has watched fail is a check nobody has tested. Three plants, each of which must exit
      # non-zero AND print the name it should: (1) the chart before 0.1.135 (the aggregator's changelog and
      # sweep-tick topics undeclared), (2) a stray topic in an annotation, (3) a workload key missing from a
      # manifest.
      - name: Produces declarations red-check
        env:
          PRODUCES_REPOS_ROOT: ${{ github.workspace }}/produces-repos
        run: |
          red() { # label, expected-name..., then "--" and the command
            local label=$1; shift; local want=(); while [ "$1" != "--" ]; do want+=("$1"); shift; done; shift
            if "$@" > /tmp/red.log 2>&1; then cat /tmp/red.log; echo "RED CHECK FAILED ($label): the plant passed"; exit 1; fi
            for w in "${want[@]}"; do
              grep -qF -- "$w" /tmp/red.log || { cat /tmp/red.log; echo "RED CHECK FAILED ($label): failed, but without naming $w"; exit 1; }
            done
            echo "red-check green ($label): failed naming ${want[*]}"
          }
          # 1. under-declared: the chart one commit before 0.1.135
          rev=$(git log --format=%H -n1 --grep='^chart 0.1.135: faust-regional declares')
          [ -n "$rev" ] || { echo "RED CHECK FAILED: the 0.1.135 commit is not in this checkout's history"; exit 1; }
          mkdir /tmp/old-chart && git archive "${rev}^" openddil-demo | tar -x -C /tmp/old-chart
          red "under-declared" \
            "region_region_east_emitted_partials-changelog" "region-region-east-aggregator-sweep-tick" \
            "region_region_west_emitted_partials-changelog" "region-region-west-aggregator-sweep-tick" \
            -- python scripts/check-produces-declarations.py --chart /tmp/old-chart/openddil-demo
          # 2. over-declared: a stray topic added to one annotation of the fixture render
          helm template t ./openddil-demo -f scripts/produces-fixture-values.yaml > /tmp/fixture.yaml
          sed 's#openddil.io/produces-topics: "edge-01/link-heartbeat"#openddil.io/produces-topics: "edge-01/link-heartbeat edge-01/stray-topic"#' /tmp/fixture.yaml > /tmp/fixture-stray.yaml
          cmp -s /tmp/fixture.yaml /tmp/fixture-stray.yaml && { echo "plant target not found: the red-check would test nothing"; exit 1; }
          red "over-declared" "over-declared: t-projector-edge-01 stray-topic" \
            -- python scripts/check-produces-declarations.py --rendered /tmp/fixture-stray.yaml
          # 3. unmanifested: cm-service's key removed from a scratch copy of the manifests
          mkdir /tmp/scratch-root
          for r in $(sed 's#.*/##' scripts/produces-repos.txt); do
            mkdir "/tmp/scratch-root/$r"
            cp "$PRODUCES_REPOS_ROOT/$r/produces.yaml" "$PRODUCES_REPOS_ROOT/$r/produces_manifest.py" "/tmp/scratch-root/$r/"
          done
          echo 'workloads: {}' > /tmp/scratch-root/openddil-cm-service/produces.yaml
          PRODUCES_REPOS_ROOT=/tmp/scratch-root red "unmanifested" "t-cm-service" "t-tier-cm-region-east" \
            -- python scripts/check-produces-declarations.py --rendered /tmp/fixture.yaml
          # 4. the `when:` config form: a render that fields one asset (the annotation then carries asset-fielding)
          #    with the logistics-sim ConfigMap's fielding records emptied and the annotation left alone
          printf 'logisticsSim:\n  config:\n    fielding:\n      records:\n        - {site: edge-01}\n' > /tmp/fielded.yaml
          helm template t ./openddil-demo -f scripts/produces-fixture-values.yaml -f /tmp/fielded.yaml > /tmp/fielded-render.yaml
          python scripts/check-produces-declarations.py --rendered /tmp/fielded-render.yaml > /dev/null \
            || { echo "RED CHECK FAILED: the fielded render itself does not pass"; exit 1; }
          sed '/^      records:$/{N;s/.*/      records: []/}' /tmp/fielded-render.yaml > /tmp/fielded-empty.yaml
          cmp -s /tmp/fielded-render.yaml /tmp/fielded-empty.yaml && { echo "plant target not found: the red-check would test nothing"; exit 1; }
          red "fielding when:" "over-declared: t-logistics-sim asset-fielding" \
            -- python scripts/check-produces-declarations.py --rendered /tmp/fielded-empty.yaml

      # The deployment-layer users (releasability.deploymentLayer.usersPromotedYaml / realmUsersJson): the
      # render proof, against the shipped realm template from the demo checkout above. Exit 2 (no python with
      # PyYAML) fails the step too: a skip here would read as green while checking nothing.
      - name: Deployment-layer users render test
        env:
          REALM: ${{ github.workspace }}/produces-repos/openddil-demo/policy/realm-openddil.json
        run: bash scripts/tests/test_deployment_layer_users.sh

      # Two plants, each of which must make the test exit non-zero AND print the check it breaks: (1) the merge
      # script with its username-clash refusal removed, (2) the chart's merge container with its two arguments
      # swapped (overlay merged into, realm read as the overlay).
      - name: Deployment-layer users red-check
        env:
          REALM: ${{ github.workspace }}/produces-repos/openddil-demo/policy/realm-openddil.json
        run: |
          plant() { # label, expected line, chart copy
            if CHART="$3" bash scripts/tests/test_deployment_layer_users.sh > /tmp/dlu-red.log 2>&1; then
              cat /tmp/dlu-red.log; echo "RED CHECK FAILED ($1): the plant passed"; exit 1; fi
            grep -qF -- "$2" /tmp/dlu-red.log || { cat /tmp/dlu-red.log; echo "RED CHECK FAILED ($1): failed, but without $2"; exit 1; }
            echo "red-check green ($1): $2"
          }
          cp -r openddil-demo /tmp/dlu-clash
          sed -i 's#raise SystemExit("FATAL: username %r is used by more than one realm user after the merge" % name)#pass#' \
            /tmp/dlu-clash/files/merge-realm-users.py
          cmp -s openddil-demo/files/merge-realm-users.py /tmp/dlu-clash/files/merge-realm-users.py \
            && { echo "plant target not found: the red-check would test nothing"; exit 1; }
          plant "clash refusal removed" "FAIL R3 username clash with a bundle user is refused" /tmp/dlu-clash
          cp -r openddil-demo /tmp/dlu-args
          sed -i 's#"/bundle-realm/realm-openddil.json", "/subst/realm-users-overlay.json"\]#"/subst/realm-users-overlay.json", "/bundle-realm/realm-openddil.json"]#' \
            /tmp/dlu-args/templates/releasability.yaml
          cmp -s openddil-demo/templates/releasability.yaml /tmp/dlu-args/templates/releasability.yaml \
            && { echo "plant target not found: the red-check would test nothing"; exit 1; }
          plant "merge arguments swapped" "FAIL R1 merge container runs the script on the staged realm" /tmp/dlu-args

      # Does the render actually carry the DIS entity allow-list that
      # sensorIngest.entityAssignment (values.yaml) declares?
      # templates/edge.yaml's own render-time validation already refuses a
      # MALFORMED map (bad id, duplicate id, unknown edge, an edge with no
      # entries while the list is non-empty) -- this catches a well-formed
      # map that renders the WRONG thing: an id dropped from a sidecar, or
      # copied into a second one.
      - name: Entity assignment coverage
        run: ./scripts/check-entity-assignment.sh ./openddil-demo

      # Does the chart emit a tier config the FRONTEND will accept?
      #
      # The chart writes deployment.json and the frontend parses it — two
      # artifacts in two repositories agreeing by convention and by nothing
      # else. UD-9 is what that costs when they drift: a per-tier env var
      # read by nothing, every tier's UI silently on the root's store, no
      # error at any layer.
      #
      # Also carries ADR-0033's forcing function: a FOURTH tier, supplied at
      # render time and present in no committed values file, must produce a
      # well-formed config with no code change.
      - name: Tier config contract
        run: ./scripts/check-tier-config.sh

      # Does the runtime bundle carry every path a bundle-loader copies from it?
      # A missing COPY renders fine and fails every pod that loads it in Init.
      - name: Bundle sources
        run: python scripts/check_bundle_sources.py

      # Red-check: drop one COPY the templates need and require a non-zero exit.
      - name: Bundle sources red-check
        run: |
          grep -v 'declaration-intake.yaml' bundle/Dockerfile > /tmp/Dockerfile.planted
          if python scripts/check_bundle_sources.py --dockerfile /tmp/Dockerfile.planted; then
            echo "RED CHECK FAILED: a Dockerfile missing a loaded path passed"
            exit 1
          fi
          echo "red-check green: the missing path was reported"

      # Can an air-gapped site actually pull what this chart renders?
      #
      # The mirror script's image list is hand-written and the chart's images
      # are not. Between 2026-06-13 and 2026-09-23 the chart gained four the
      # list never learned about — about 30 chart versions of silence, one of
      # them a PRE-INSTALL hook's image, which fails an air-gapped install
      # before a single workload starts and reports only "timed out waiting
      # for the condition".
      - name: Mirror coverage
        env:
          OPENDDIL_BUNDLE_EXAMPLE: ${{ github.workspace }}/openddil-customer-bundle-example
        run: ./scripts/check-mirror-coverage.sh

      # toxiproxy renders only with link control on, so the default render
      # above never sees its image. Cover that render too.
      - name: Mirror coverage, link control on
        env:
          OPENDDIL_BUNDLE_EXAMPLE: ${{ github.workspace }}/openddil-customer-bundle-example
        run: |
          printf 'linkControl:\n  enabled: true\n' > /tmp/link-control-on.yaml
          ./scripts/check-mirror-coverage.sh --extra-values /tmp/link-control-on.yaml

      # A check nobody has watched fail is a check nobody has tested. Plant an
      # image no mirror has ever heard of and require a non-zero exit. The
      # plant turns link control on: with it off, toxiproxy is not rendered
      # and the planted image could never fail anything.
      - name: Mirror coverage red-check
        run: |
          cat > /tmp/planted.yaml <<'YAML'
          linkControl:
            enabled: true
          toxiproxy:
            image:
              repository: docker.io/library/nginx
              tag: "1.27"
              digest: ""
          YAML
          if ./scripts/check-mirror-coverage.sh --extra-values /tmp/planted.yaml; then
            echo "RED CHECK FAILED: an unmirrored image passed the coverage check"
            exit 1
          fi
          echo "red-check green: the planted image was rejected"

      # And the same for pass 4, which has its own input and would otherwise
      # be the one pass nobody had seen fail. Planted in a fake sibling tree,
      # so the real manifest is not touched.
      - name: Mirror coverage red-check, pass 4
        run: |
          mkdir -p /tmp/fake-bundle-example/tools/planted/k8s
          cat > /tmp/fake-bundle-example/tools/planted/k8s/planted.yaml <<'YAML'
          spec:
            containers:
              - name: planted
                image: ghcr.io/edgy-solutions/openddil/no-such-image:1.0
          YAML
          if OPENDDIL_BUNDLE_EXAMPLE=/tmp/fake-bundle-example ./scripts/check-mirror-coverage.sh; then
            echo "RED CHECK FAILED: an unmirrored out-of-chart image passed pass 4"
            exit 1
          fi
          echo "red-check green: pass 4 rejected the planted manifest image"

      # Pass 5 has no values knob that drops a pull secret, so the plant is a
      # copy of the chart with ONE imagePullSecrets block cut out of one
      # template. The failure must come from pass 5, not from anything else.
      - name: Mirror coverage red-check, pass 5
        run: |
          cp -r ./openddil-demo /tmp/planted-chart
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/planted-chart/templates/releasability.yaml")
          block = ("      {{- with $root.Values.global.imagePullSecrets }}\n"
                   "      imagePullSecrets:\n"
                   "        {{- toYaml . | nindent 8 }}\n"
                   "      {{- end }}\n")
          text = p.read_text(encoding="utf-8")
          assert block in text, "plant target not found: the red-check would test nothing"
          p.write_text(text.replace(block, "", 1), encoding="utf-8")
          PY
          if OPENDDIL_CHART=/tmp/planted-chart ./scripts/check-mirror-coverage.sh > /tmp/pass5-red.log 2>&1; then
            cat /tmp/pass5-red.log
            echo "RED CHECK FAILED: a pod spec without its pull secret passed"
            exit 1
          fi
          cat /tmp/pass5-red.log
          grep -q "FAIL \[pass 5 pullable\]" /tmp/pass5-red.log \
            || { echo "RED CHECK FAILED: the check failed, but not in pass 5"; exit 1; }
          echo "red-check green: pass 5 rejected the pod spec with its pull secret removed"
