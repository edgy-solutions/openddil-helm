name: Chart checks

# Render-integrity guards for openddil-demo.
#
# `helm lint` does not catch either defect these guard against — both render
# valid YAML and exit 0. Demonstrated, not assumed: with a loop-boundary
# separator deleted, `helm lint` reports "0 chart(s) failed" and
# `helm template` exits 0 while an object has silently vanished from the
# release. That is why this job exists alongside lint rather than instead of.
#
# AUDIT-2026-08-15 F2 found these checks had only ever been run by hand, once,
# in the sessions that found each defect. Nothing would have failed if either
# came back.

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "openddil-demo/**"
      - "scripts/check-chart-render.sh"
      - "scripts/check-tier-config.sh"
      - "scripts/check-mirror-coverage.sh"
      - "scripts/mirror-to-artifactory.ps1"
      - "values-artifactory.yaml"
      - ".github/workflows/chart-checks.yml"
  pull_request:
    paths:
      - "openddil-demo/**"
      - "scripts/check-chart-render.sh"
      - "scripts/check-tier-config.sh"
      - "scripts/check-mirror-coverage.sh"
      - "scripts/mirror-to-artifactory.ps1"
      - "values-artifactory.yaml"
      - ".github/workflows/chart-checks.yml"
  workflow_dispatch:

jobs:
  render-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: helm lint
        run: helm lint ./openddil-demo

      # The guards lint cannot express.
      - name: Render integrity guards
        run: ./scripts/check-chart-render.sh

      # Does the chart emit a tier config the FRONTEND will accept?
      #
      # The chart writes deployment.json and the frontend parses it — two
      # artifacts in two repositories agreeing by convention and by nothing
      # else. UD-9 is what that costs when they drift: a per-tier env var
      # read by nothing, every tier's UI silently on the root's store, no
      # error at any layer.
      #
      # Also carries ADR-0033's forcing function: a FOURTH tier, supplied at
      # render time and present in no committed values file, must produce a
      # well-formed config with no code change.
      - name: Tier config contract
        run: ./scripts/check-tier-config.sh

      # Can an air-gapped site actually pull what this chart renders?
      #
      # The mirror script's image list is hand-written and the chart's images
      # are not. Between 2026-06-13 and 2026-09-23 the chart gained four the
      # list never learned about — about 30 chart versions of silence, one of
      # them a PRE-INSTALL hook's image, which fails an air-gapped install
      # before a single workload starts and reports only "timed out waiting
      # for the condition".
      - name: Mirror coverage
        run: ./scripts/check-mirror-coverage.sh

      # A check nobody has watched fail is a check nobody has tested. Plant an
      # image no mirror has ever heard of and require a non-zero exit.
      - name: Mirror coverage red-check
        run: |
          cat > /tmp/planted.yaml <<'YAML'
          toxiproxy:
            image:
              repository: docker.io/library/nginx
              tag: "1.27"
              digest: ""
          YAML
          if ./scripts/check-mirror-coverage.sh --extra-values /tmp/planted.yaml; then
            echo "RED CHECK FAILED: an unmirrored image passed the coverage check"
            exit 1
          fi
          echo "red-check green: the planted image was rejected"
