name: Build and publish reset-runner image

# Builds ghcr.io/<owner>/openddil/reset-runner: the image the chart's reset Job
# runs (exerciseControl.resetJob). It holds this repo's scripts/ plus the GNU
# tools they need, so it is rebuilt whenever scripts/ changes.
#
# Only this repo is checked out. The Dockerfile's build context is the
# workspace root, so its COPY path starts with openddil-helm/.
#
# Pin the published image by digest together with the chart; the digest is
# printed at the end of the build.

on:
  push:
    branches: [ "master" ]
    paths:
      - "scripts/**"
      - "reset-runner/**"
      - ".github/workflows/build-reset-runner.yml"
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-reset-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openddil-helm (self)
        uses: actions/checkout@v4
        with:
          path: openddil-helm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/reset-runner
          SHORT="$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
          echo "tags=$REG:latest,$REG:sha-$SHORT" >> "$GITHUB_OUTPUT"

      - name: Build and push reset-runner
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: openddil-helm/reset-runner/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Print the pushed digest
        run: echo "containerimage.digest=${{ steps.build.outputs.digest }}"
