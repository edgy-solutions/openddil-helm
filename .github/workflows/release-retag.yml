name: Release by retag

# Reusable. A release names, by digest, images that were already built. It never
# rebuilds and never moves the floating tag. Called from a short workflow in
# each image repo (see release/caller-template.yml), triggered on a version tag.
#
# Retag mode: for each image, find the digest built from the tagged commit
# (scripts/release/find_build.py checks SLSA provenance), add the version tag to
# that digest, and create the GitHub release with the digests in the notes.
#
# Suite mode (plain v* tag with suite_manifest set): tags nothing. Reads
# release/suite-<version>.yaml from the tagged commit, checks it, checks that
# every listed image and the bundle already carry their tag at the listed
# digest, and creates the release with the whole manifest in the notes.

on:
  workflow_call:
    inputs:
      images:
        description: "GHCR package names under ghcr.io/edgy-solutions/openddil/, newline or space separated"
        type: string
        required: true
      expected:
        description: "Lines of <image>=sha256:<64 hex>; the found digest must equal it"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Resolve, check and print the plan; tag nothing, create no release"
        type: boolean
        default: false
      suite_manifest:
        description: "Non-empty: a plain v* tag runs suite mode"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REGISTRY: ghcr.io/edgy-solutions/openddil
      IMAGES: ${{ inputs.images }}
      EXPECTED: ${{ inputs.expected }}
      DRY_RUN: ${{ inputs.dry_run }}
      SUITE_MANIFEST: ${{ inputs.suite_manifest }}
    steps:
      - name: Parse the tag
        id: tag
        run: |
          set -euo pipefail
          images="$(printf '%s' "$IMAGES" | tr -s ' \n\r\t' '    ' | sed 's/^ //; s/ $//')"
          ref="$GITHUB_REF_NAME"
          vre='v[0-9]+\.[0-9]+\.[0-9]+(-rc\.?[0-9]+)?'
          mode=retag
          if [[ "$ref" =~ ^($vre)$ ]]; then
            version="$ref"
            scope="$images"
            if [ -n "$SUITE_MANIFEST" ]; then mode=suite; scope=""; fi
          elif [[ "$ref" =~ ^([a-z0-9-]+)/($vre)$ ]]; then
            img="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            case " $images " in
              *" $img "*) scope="$img" ;;
              *) echo "::error::image-scoped tag names $img, which is not in images ($images)"; exit 1 ;;
            esac
            if [ "$img" = latest ]; then echo "::error::image name latest is refused"; exit 1; fi
          else
            echo "::error::tag '$ref' is not vX.Y.Z[-rcN] or <image>/vX.Y.Z[-rcN]. A dispatch run must be started from a tag ref."
            exit 1
          fi
          case "$version" in *latest*) echo "::error::version names latest"; exit 1 ;; esac
          prerelease=false
          case "$version" in *-rc*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "scope=$scope"
            echo "mode=$mode"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode version=$version scope=[$scope] commit=$GITHUB_SHA"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false

      # The tools come from the default branch of the openddil-helm repo, which
      # is also what the caller's `uses:` line names.
      - name: Check out the release tools
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-helm
          ref: master
          path: tools
          persist-credentials: false

      - name: Install crane
        if: steps.tag.outputs.mode == 'retag' || steps.tag.outputs.mode == 'suite'
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$GITHUB_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Python and PyYAML
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Find the builds
        id: find
        if: steps.tag.outputs.mode == 'retag'
        env:
          SCOPE: ${{ steps.tag.outputs.scope }}
        run: |
          set -euo pipefail
          : > results.jsonl
          for img in $SCOPE; do
            exp="$(printf '%s\n' "$EXPECTED" | sed -n "s/^[[:space:]]*$img=//p" | head -n1 | tr -d '[:space:]')"
            python3 tools/scripts/release/find_build.py --image "$img" --repo "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --expected "$exp" >> results.jsonl
          done
          cat results.jsonl

      - name: Plan the retag
        id: plan
        if: steps.tag.outputs.mode == 'retag'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          : > plan.txt
          while read -r line; do
            [ -n "$line" ] || continue
            img="$(printf '%s' "$line" | jq -r .image)"
            dig="$(printf '%s' "$line" | jq -r .digest)"
            echo "crane tag $REGISTRY/$img@$dig $VERSION" >> plan.txt
          done < results.jsonl
          cat plan.txt

      - name: Guard, no floating tag in the plan
        if: steps.tag.outputs.mode == 'retag'
        run: |
          if grep -q ':latest\b' plan.txt || grep -qw latest plan.txt; then
            echo "::error::the plan names the floating tag"
            exit 1
          fi

      - name: Retag
        if: steps.tag.outputs.mode == 'retag' && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          while read -r line; do
            [ -n "$line" ] || continue
            img="$(printf '%s' "$line" | jq -r .image)"
            dig="$(printf '%s' "$line" | jq -r .digest)"
            ref="$REGISTRY/$img"
            have="$(crane digest "$ref:$VERSION" 2>/dev/null || true)"
            if [ "$have" = "$dig" ]; then
              echo "$img: $VERSION already at $dig, skipping"
            elif [ -n "$have" ]; then
              echo "::error::$img: $VERSION is at $have, not $dig; version tags are immutable"
              exit 1
            else
              crane tag "$ref@$dig" "$VERSION"
              now="$(crane digest "$ref:$VERSION")"
              [ "$now" = "$dig" ] || { echo "::error::$img: after tagging, $VERSION is $now, not $dig"; exit 1; }
              echo "$img: tagged $VERSION at $dig"
            fi
          done < results.jsonl

      - name: Check the suite is published
        if: steps.tag.outputs.mode == 'suite'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          m="src/release/suite-$VERSION.yaml"
          [ -f "$m" ] || { echo "::error::$m is not in the tagged commit"; exit 1; }
          python3 tools/scripts/release/check_suite_manifest.py "$m"
          python3 - "$m" "$VERSION" <<'PY'
          import sys, yaml
          m = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          if str(m["suite"]) != sys.argv[2]:
              sys.exit("suite %s does not equal the tag %s" % (m["suite"], sys.argv[2]))
          PY
          python3 tools/scripts/release/check_suite_published.py "$m"

      - name: Release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          MODE: ${{ steps.tag.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = suite ]; then
            python3 tools/scripts/release/make_notes.py suite --repo "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" --manifest "src/release/suite-$VERSION.yaml" > notes.md
          else
            python3 tools/scripts/release/make_notes.py retag --repo "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" --results results.jsonl > notes.md
          fi
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or edit the release
        if: env.DRY_RUN != 'true'
        env:
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd src
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file ../notes.md
          else
            flag=""
            [ "$PRERELEASE" = true ] && flag="--prerelease"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file ../notes.md $flag
          fi
