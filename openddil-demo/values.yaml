# =============================================================================
# OpenDDIL Demo — Helm values
# =============================================================================
# Mirrors the docker-compose topology: 3 edge clusters (each with its own
# redpanda broker, DIS sensor-ingest, redpanda-connect, faust-edge,
# projector, edge-hq-bridge), 2 regional faust aggregators, and an HQ
# tier (postgres-hq, electric-sync, restate-server, restate-hub,
# projector-hq, cm-service, logistics-fusion, frontend, toxiproxy).
#
# To shrink to a smaller footprint, drop entries from `edges:` and
# `regions:` below — the templates loop over these lists.
# =============================================================================

# --- Global -----------------------------------------------------------------
global:
  imageRegistry: ghcr.io
  imagePrefix: edgy-solutions/openddil
  imagePullPolicy: IfNotPresent
  # Suffix for internal k8s service resolution (e.g., .default.svc.cluster.local).
  # Leave empty for in-namespace resolution.
  clusterDomain: ""
  imagePullSecrets: []
  # Bake-time tag for ALL openddil-owned images (frontend, cm-service,
  # logistics-fusion, faust-edge, faust-regional, sensor-ingest, projector,
  # hub-restate-projector, runtime-bundle). Overridable per-service below.
  imageTag: "latest"

# --- Runtime bundle image ---------------------------------------------------
# Built from ../bundle/Dockerfile. Bakes openddil-contracts/, openddil-stack/,
# openddil-tactical-agents/hub/restate_hub.py, and openddil-demo/ configs
# into a single image. Init containers in every consumer pod copy the
# subtree they need out of /bundle/* into a shared emptyDir volume.
bundle:
  image:
    name: runtime-bundle
    tag: ""               # Empty -> falls back to global.imageTag
    digest: ""            # Non-empty -> <registry>/<prefix>/<name>@<digest>
                          # bypassing tag entirely. Mirror-time digest
                          # pinning lives in a values-pinned.yaml file
                          # emitted by scripts/mirror-to-artifactory.ps1.
                          # See README "Digest pinning" section.
    pullPolicy: ""        # Empty -> falls back to global.imagePullPolicy
  # Resources for the bundle-loader initContainer that every consumer pod
  # runs. It only does `cp -r` of config subtrees out of the bundle image
  # into an emptyDir, so it is cheap and short-lived. Explicit so it does
  # NOT inherit a too-small cluster-default LimitRange (a cp starved of
  # memory still completes, but being explicit removes the variable).
  initResources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# --- Hook Jobs (topic-init, postgres-schema-init, *-bootstrap) --------------
# The four Helm-hook Jobs were previously shipped with NO resources block,
# so under a constraining ResourceQuota they would be admission-rejected,
# and under a small cluster-default LimitRange they risk OOMKill mid-run
# (a postgres-schema-init OOMKilled mid-`atlas migrate apply` leaves the
# DB half-migrated). Shared block sized generously enough for rpk, atlas,
# psql, and the Python bootstrap scripts.
jobs:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- Topology ---------------------------------------------------------------
# Each edge gets its own redpanda broker StatefulSet + sensor-ingest +
# redpanda-connect + faust-edge + projector + edge-hq-bridge. The id is
# embedded in service names, hostnames advertised to Kafka, and FAUST_APP_ID.
# Region binding controls which faust-regional aggregator the edge feeds.
#
# Each entry may also carry `attachment: tier | hq` (optional, declared only
# -- never inferred). It tells the HQ screens how this edge's rows reach
# postgres, so they can label rows that will not survive a WAN cut the same
# way a tiered edge's rows do:
#   - tier: projects into its own tier store; survives an uplink cut; goes
#     stale at HQ during one.
#   - hq: writes straight to HQ; has no edge store; stays fresh at HQ during
#     an uplink cut because HQ is where it lives.
# A declaration must agree with the chart's own tierNode topology (checked by
# openddil.validateEdgeAttachment at render time) -- omitting it is fine, but
# a wrong one fails the render rather than mislabeling the screens.
edges:
  # udpPort: container listen port. Same value (62040-62042) used as NodePort
  # if sensorIngest.externalAccess.enabled=true. Hold for in-cluster-only
  # clusters that ban NodePort (default: false, ClusterIP only).
  - id: edge-01
    region: region-east
    udpPort: 62040
  - id: edge-02
    region: region-east
    udpPort: 62041
  - id: edge-03
    region: region-west
    udpPort: 62042

regions:
  - id: region-east
  - id: region-west

# --- Persistence ------------------------------------------------------------
# storageClass is the default StorageClass for EVERY PersistentVolumeClaim
# the chart creates (redpanda-edge x N, redpanda-hq, postgres-hq,
# restate-server). The three per-component overrides take precedence when
# non-empty; an empty override falls back to storageClass; an empty
# storageClass falls back to the cluster's default StorageClass. All PVCs
# are ReadWriteOnce with volumeMode: Filesystem.
#
# Examples:
#   # vSphere class for every PVC:
#   persistence: { storageClass: vsphere }
#   # vSphere for redpanda only, cluster-default for postgres + restate:
#   persistence: { redpandaStorageClass: vsphere }
#   # or at install time:  --set persistence.redpandaStorageClass=vsphere
#
# redpandaStorageClass covers BOTH redpanda-edge and redpanda-hq. Each
# rendered claim carries accessModes [ReadWriteOnce], volumeMode
# Filesystem, the resolved storageClassName, and the *Size below.
persistence:
  storageClass: ""           # default for all PVCs; empty -> cluster default
  redpandaStorageClass: ""   # override for redpanda-edge + redpanda-hq
  postgresStorageClass: ""   # override for postgres-hq
  restateStorageClass: ""    # override for restate-server
  redpandaSize: 10Gi
  postgresSize: 20Gi
  restateSize: 5Gi

  # NFS-incompatible cluster escape hatch.
  #
  # redpanda and restate both require POSIX file-locking semantics that
  # NFS doesn't honor. On clusters where the ONLY available PVC storage
  # class is NFS-backed, the pods CrashLoopBackOff at storage init. The
  # historical workaround was to manually edit each StatefulSet post-
  # deploy to swap the PVC for a node-local emptyDir, then scale down/up
  # to apply. That manual scale cycle gives the broker pod a NEW IP every
  # deploy, and every long-lived Kafka client (faust-edge, faust-
  # regional, asset-registry-service, the bridge) caches the OLD IP at
  # connect time -- they sit on stale metadata until restarted, which
  # made every redeploy break the data plane.
  #
  # Setting either of these to true switches the StatefulSet to use an
  # emptyDir at chart render time -- no post-deploy editing, no scale
  # cycle, no stale-IP drift. The brokers come up cleanly first time
  # with stable hostnames via the headless Service.
  #
  # Trade-off: emptyDir is node-local and ephemeral. A pod restart
  # loses ALL state -- topics, partitions, consumer offsets for
  # redpanda; Virtual Object journals for restate. For dev / demo
  # clusters where state durability isn't the contract, that's fine.
  # NEVER set true in production -- you'll lose customer data on the
  # first node maintenance event.
  # Both emptyDirs are bounded by sizeLimit, set from redpandaSize /
  # restateSize above so the escape hatch carries the same bound as the PVC
  # path it replaces. An escape hatch that silently drops a constraint is a
  # second failure mode hiding inside a workaround for the first.
  #
  # SCOPE, stated rather than left implicit: only these two data volumes are
  # bounded. The chart's other emptyDirs are bundle-asset and config copies
  # whose contents are fixed by the image, so their size is bounded by
  # construction rather than by policy. They were reviewed and deliberately
  # left alone -- not missed. If one ever becomes a destination for
  # component-generated data, it needs a sizeLimit at that moment.
  redpandaUseEmptyDir: false
  restateUseEmptyDir: false

# --- Redpanda (per-edge) ----------------------------------------------------
# Third-party images pinned by semver tag — bumped 2026-05-19 from the
# stale :latest defaults to the actual versions we tested with, identified
# by running each image's binary with --version inside a throwaway
# container. Versions chosen to be security-team-approvable (real release
# tags, no SHA digests or canary builds). Bump deliberately when you roll
# forward; the `digest:` field is kept empty so the openddil.thirdPartyImage
# helper renders <repo>:<tag>. Set `digest:` non-empty per service to opt
# into digest-pinning where stricter reproducibility is needed.
redpandaEdge:
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: "v26.1.7"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  # Kafka listener on 9092, OUTSIDE listener (host-debug) on 9093.
  internalPort: 9092
  outsidePort: 9093
  adminPort: 9644

# --- Redpanda HQ (single broker, advertises via toxiproxy) ------------------
# The OUTSIDE/PLAINTEXT split here is load-bearing: edge-hq-bridge connects
# via toxiproxy:8474 (the only way DDIL sever is real), so PLAINTEXT must
# advertise toxiproxy. The OUTSIDE listener is for debug / kubectl-port-forward.
redpandaHq:
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: "v26.1.7"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  kafkaPort: 19092
  outsidePort: 19093
  adminPort: 19644

# --- Redpanda auto-create-topics enforcement ---------------------------------
# See openddil-contracts/decisions/FOLLOW-UPS.md, "OPEN 2026-09-27 —
# auto_create_topics_enabled=false, as a revision 52 chart change": Redpanda's
# default (true, by omission) lets a misdirected/racing client silently
# materialise a topic instead of failing loudly (the frozen HQ/region-east
# changelog twin; the reset-scenario TOPIC_ALREADY_EXISTS recreate-race).
#
# TWO PATHS, not one, because neither covers both cluster ages: the
# redpanda-edge/redpanda-hq StatefulSets also carry
# `--set redpanda.auto_create_topics_enabled=false` on `redpanda start`
# (fresh-install path — a cluster property seeded once at first formation,
# inert on a cluster that already existed). This flag gates
# hook-redpanda-auto-create-off.yaml, a post-install/post-upgrade Job that
# runs `rpk cluster config set` + a read-back against every broker's Admin
# API on every install/upgrade — the path that reaches a cluster already
# running on a PVC that predates the StatefulSet flag.
#
# EMPTYDIR: with persistence.redpandaUseEmptyDir=true a broker restart loses
# its controller log and re-forms the cluster, and the start arg seeds false
# again at that formation (measured 2026-09-29: the lab had re-formed on
# emptyDir and read false on 5/5 before this Job existed). So on emptyDir the
# start arg is the path that holds; this Job is for clusters that persist.
redpandaAutoCreateTopics:
  enforceOff: true

# --- Postgres HQ ------------------------------------------------------------
postgresHq:
  image:
    repository: postgres
    tag: "15"
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: password
    database: openddil
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  port: 5432

# --- Toxiproxy --------------------------------------------------------------
# DDIL sever mechanism. Mediates produce traffic from edge-hq-bridge to
# redpanda-hq. Disabling the proxy severs the link; re-enabling it
# restores buffered traffic.
toxiproxy:
  image:
    repository: ghcr.io/shopify/toxiproxy
    # Bumped 2.9.0 -> 2.12.0 (2026-05-19): the local image being tested
    # had version label 2.12.0; the prior 2.9.0 chart pin was stale.
    # Semver tag (not digest) because the upstream image carries a real
    # version label.
    tag: "2.12.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  apiPort: 8474
  proxyPort: 8475
  # Base port for the PER-TIER uplink proxies (openddil.uplinkLinks):
  # one port per link, this value plus the link's index in that list.
  # The same number is used in three places for a given link -- toxiproxy's
  # listen address, the parent broker's extra `uplink_<n>` listener, and
  # that broker's Service port -- so it is fully deterministic and needs
  # no state. hq-link's own apiPort above is unaffected.
  uplinkPortBase: 18400

# --- Electric SQL -----------------------------------------------------------
electric:
  image:
    repository: electricsql/electric
    tag: "1.6.2"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 5133

# --- Restate (server + hub projector) ---------------------------------------
restate:
  image:
    repository: docker.io/restatedev/restate
    # Bumped 1.1 -> 1.6.2 to match docker-compose. The 1.1 default in the
    # chart was older than what compose has been testing with; 1.6.2 is the
    # version compose pins and that the restate-sdk-python 0.17.1 discovery
    # protocol requires (Phase 5 close note in tests/hero_scenario_v3/
    # README.md documents the 1.1.2 -> 1.6.2 bump rationale).
    tag: "1.6.2"
    digest: ""
    pullPolicy: IfNotPresent
  # restate-server is a RocksDB-backed stateful event processor — 512Mi
  # OOMKills it once CM/fusion Virtual Object state accumulates, which in
  # turn times out the *-bootstrap hook Jobs' registration POSTs.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi }
  ingressPort: 8080
  adminPort: 9070

  # ephemeralOnUpgrade — when true, a Helm pre-install/pre-upgrade hook
  # (hook-restate-wipe.yaml) scales EVERY restate-server to 0 and deletes
  # its PVC before applying chart changes — the root's and all three
  # tiers'. The cm-service-bootstrap + logistics-fusion-bootstrap
  # post-install hooks then re-register services against the fresh state
  # on the way back up.
  #
  # DEFAULT FALSE, AND THE DEFAULT IS THE POINT.
  #
  # This defaulted to true, which meant the destructive direction was the
  # one an operator got by not deciding. Read the hook's own note: the
  # hazard it records is that "the operator reads `ephemeralOnUpgrade` and
  # believes the wipe happened", and, under ADR-0042 intent custody, that
  # this flag becomes "the thing that silently destroys the audit trail, on
  # every upgrade, under a flag the operator reads as already answered".
  #
  # A default that destroys data is only safe while nothing durable lives
  # there. That is true today and ADR-0042 ends it, and the end arrives as
  # a change in the DATA's class with no change here to notice — the same
  # hazard the hook already carries a note about, from the other direction.
  # So the safe value is the one you get for free, and the destructive one
  # has to be asked for by name. Asking is cheap; a wipe that was wrong is
  # not recoverable by re-running anything.
  #
  # SET TRUE for demo/lab iteration, where Restate state is rebuildable and
  # handler-code changes between deploys would otherwise cause
  # VMException(570) ("code path mismatch between previous execution and
  # this execution") on every event for assets whose Virtual Object journal
  # was written by old code. The lab sets it explicitly — see
  # PILOT-RUNBOOK.md §3.
  #
  # LEAVE FALSE anywhere Restate state durability matters across redeploys,
  # and anywhere intent custody will ever live (ADR-0042). With it false,
  # handler-code changes need an explicit out-of-band
  # `flush-assets.sh --deep` to clean state when needed — which is a
  # deliberate act, logged, rather than a side effect of upgrading.
  ephemeralOnUpgrade: false

  # Image used by the restate-wipe hook Job. This is the ONLY consumer of a
  # kubectl-runner image in the chart -- an earlier version of this comment
  # claimed other hooks shared it; they do not.
  wipe:
    image:
      # WAS docker.io/bitnami/kubectl:1.30. That tag NO LONGER EXISTS.
      # Bitnami's Aug-2025 catalog restructure withdrew the historical
      # bitnami/kubectl tags from Docker Hub; both :1.30 and :1.31 now
      # return HTTP 404. Verified 2026-08-08 against the registry API.
      #
      # This failed in the worst available way: the pre-install hook Job
      # sat in ImagePullBackOff and helm reported only
      #   "Error: failed pre-install: timed out waiting for the condition"
      # which names nothing about an image. Nothing in the chart changed --
      # the registry did.
      #
      # THE REPLACEMENT MUST CONTAIN A SHELL. The hook runs a POSIX sh
      # script, which rules out the obvious modern picks -- both
      # registry.k8s.io/kubectl:v1.31.4 and docker.io/rancher/kubectl:v1.31.4
      # exist but are distroless and fail at container init with
      #   exec: "sh": executable file not found in $PATH
      # Verified by running all three candidates on a real cluster rather
      # than inferring from their base images.
      #
      # alpine/k8s ships kubectl on Alpine, so /bin/sh is BusyBox ash --
      # still POSIX-only, so the "no pipefail" constraint in
      # hook-restate-wipe.yaml continues to apply unchanged.
      #
      # OVERRIDE for air-gapped / mirror-only deploys:
      #   --set restate.wipe.image.repository=<your-registry>/path/to/kubectl
      #   --set restate.wipe.image.tag=<your-version>
      # Any replacement needs kubectl AND a shell; check both.
      #
      # If you add this to scripts/mirror-to-artifactory.ps1, add a
      # values-pinned.yaml mapping entry alongside it.
      repository: docker.io/alpine/k8s
      tag: "1.31.4"
      digest: ""
      pullPolicy: IfNotPresent

restateHub:
  image:
    # Note: published image's Dockerfile copies hub_restate_projector.py;
    # docker-compose runs restate_hub.py via bind-mount. We restore the
    # compose behavior by mounting restate_hub.py from the bundle image
    # over /app/restate_hub.py. See openddil-tactical-agents/hub/.
    name: hub-restate-projector
    tag: ""
    digest: ""
    pullPolicy: ""
  # Long-running Python consumer — explicit resources so it does not
  # inherit a too-small cluster-default LimitRange and get OOMKilled.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- Per-edge services ------------------------------------------------------
# ---------------------------------------------------------------------------
# relayStallProbe — liveness for the Benthos relays (bridge, uplink, mapper)
# ---------------------------------------------------------------------------
# Fires only when input advanced AND confirmed output did not AND (for a relay
# with a remote destination) that destination is reachable. The third term is
# what keeps a severance from becoming a crash loop: under a cut the relay's
# output legitimately stops, because buffering IS the designed degraded mode.
#
# GENEROUS ON PURPOSE. periodSeconds x failureThreshold is the budget:
# 60s x 3 = three minutes of confirmed stall. A flapping liveness probe on a
# relay is an outage of this system's own making, and a wedge lasting three
# minutes is still caught long before a person notices it.
relayStallProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 60
  failureThreshold: 3

sensorIngest:
  # Stall detection -> LIVENESS. The endpoint reports 503 only when input
  # advanced over its window and output did not; see openddil-sensor-ingest's
  # stall.py for why both terms are required and why this is liveness rather
  # than readiness.
  #
  # GENEROUS ON PURPOSE. periodSeconds x failureThreshold is the real budget:
  # 30s x 4 = two minutes of confirmed stall before a restart, on top of the
  # detector's own 3-minute window. A wedge lasting five minutes is still
  # caught long before anyone notices; a probe that restarts a healthy pod is
  # an outage this system inflicted on itself.
  stallProbe:
    enabled: true
    initialDelaySeconds: 180
    periodSeconds: 30
    failureThreshold: 4
  image:
    name: sensor-ingest
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  httpPort: 8080
  # If your DIS PDU producer (VR-Forces, test harness, etc.) lives OUTSIDE
  # the cluster, set externalAccess.enabled=true to expose the UDP port via
  # NodePort. The cluster's --service-node-port-range must include each
  # edge's udpPort (default range is 30000-32767; defaults here are
  # 62040-62042). For 443-only clusters where NodePort is banned, leave
  # this off and run the producer as a pod in the same namespace, or use
  # `kubectl exec` to inject test PDUs from inside.
  externalAccess:
    enabled: false
  # Per-edge DIS entity allow-list. A LIST of {id: "dis:S:A:E", edge: <one
  # of edges[].id>} -- one entry per admitted entity, not one entry per
  # edge. Empty (the default) renders no DIS_ADMITTED_ENTITY_IDS env at
  # all, and behaviour is unchanged: the sensor-ingest sidecar admits
  # every entity it hears on its UDP port, same as today.
  #
  # Non-empty, every sensor-ingest Deployment gets DIS_ADMITTED_ENTITY_IDS
  # set to the sorted, comma-joined ids assigned to its own edge (the
  # sidecar image already reads this env var). Validated at render time
  # (templates/edge.yaml): every id must match ^dis:[0-9]+:[0-9]+:[0-9]+$,
  # no id may appear twice, every `edge` must name a real edges[].id, and
  # once this list is non-empty every edge needs at least one entry here --
  # a sidecar given no list admits every entity it hears, so a silently
  # unlisted edge would be wide open while its neighbours were scoped.
  #
  # Example:
  #   entityAssignment:
  #     - { id: "dis:1:1:1", edge: edge-01 }
  #     - { id: "dis:1:1:2", edge: edge-01 }
  #     - { id: "dis:2:1:7", edge: edge-02 }
  entityAssignment: []

redpandaConnect:
  image:
    repository: docker.redpanda.com/redpandadata/connect
    tag: "4.91.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  httpPort: 4196

faustEdge:
  image:
    name: faust-edge
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # WAS "demo-visibility overrides", and the visibility lasted about an hour.
  #
  # ENGINE_LIFE_TOTAL_HOURS was "1". Engine hours are wall-clock since the
  # asset was first observed (ADR-0020: DIS carries no engine-on signal, so
  # observed time stands in), so every asset passed one hour of "total life"
  # in its first hour and stayed pegged. Measured 2026-09-06: 647.3 observed
  # hours against a 1-hour life, consumed/total clamped to 1.0, 0% remaining,
  # wear reported at exactly 100.0% — for all 14 assets, on both axes.
  #
  # A fleet reading 14/14 CRITICAL is what a demo audience reads as broken,
  # and the tuning that produced it was chosen to make degradation VISIBLE.
  # It made the first hour visible and every hour after it identical.
  #
  # These are now the values coefficients.py itself declares. That is a
  # deliberate choice of DECLARED defaults over invented ones: per ADR-0020
  # and the coefficients file's own header, real calibration is the
  # AFSim/VR-Forces phase, and a number picked here to produce a pleasing
  # spread would be authored fiction wearing a physical unit.
  #
  # ⚠ WHAT THIS DOES NOT FIX, because numbers cannot:
  #   * Engine hours are IDENTICAL for every asset by construction, so that
  #     axis can show no distribution at any coefficient. A real fleet has
  #     assets at different points in their life; this model starts every
  #     asset at zero the moment OpenDDIL first sees it. Prior service life
  #     is a SOURCE fact and has no home yet.
  #   * The wear models are platform-agnostic. Track km spans 1,282 to
  #     32,334 across this fleet because aircraft accrue "track" wear from
  #     distance flown. One global track life cannot be right for both a
  #     tank and an MQ-9, so the spread below is arithmetic rather than
  #     engineering until the coefficients are per-platform.
  prognosticsEnv:
    TRACK_LIFE_TOTAL_KM:      "5000"
    ENGINE_LIFE_TOTAL_HOURS:  "5000"
    TERRAIN_TOTAL_DEG_KM:     "100000"
    BARREL_LIFE_TOTAL_ROUNDS: "1000"

projector:
  image:
    name: projector
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 8084

# DIS Fire/Detonation launch records. Mounted into
# every projector that carries the effector_launch mapping (projector-hq,
# a non-tier-managed edge's own root projector, and every tier projector):
# see openddil.effectorDeclaredLoadYaml (_helpers.tpl), the ConfigMaps
# rendered from it in hub.yaml/edge.yaml/tier-node.yaml, and
# EFFECTOR_DECLARED_LOAD_PATH/EFFECTOR_TERMINAL_TIMEOUT_S on each projector
# container.
#
# OSS DEFAULT IS EMPTY, same posture as edge_assignment above: no launcher
# variants or declared loads are customer or lab reality, so this chart
# ships none. An overlay (or the compose demo fixture) supplies its own
# `asset`/`variant` maps.
effectors:
  # Detonation timeout sweep (src/effector_sweep.py): a Fire with no
  # Detonation within this many seconds is marked unresolved
  # (effector_unresolved_total). 300s matches the module's own code
  # default; set here too so a values.yaml reader sees the number that is
  # actually live rather than having to open the other repo to find it.
  terminalTimeoutSeconds: 300
  declaredLoad:
    asset: {}
    variant: {}

edgeHqBridge:
  image:
    repository: docker.redpanda.com/redpandadata/connect
    tag: "4.91.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- Per-region service -----------------------------------------------------
faustRegional:
  image:
    name: faust-regional
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- HQ services ------------------------------------------------------------
cmService:
  image:
    name: cm-service
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 9080
  # Customer overlays that want to layer additional baseline YAMLs on
  # top of the OSS set (the runtime-bundle's contracts/baselines) do so
  # via the standard overlay-patch pattern -- a post-install Job in the
  # customer chart `kubectl patch`es this Deployment to add a
  # /baselines-overlay volumeMount + CM_BASELINES_DIRS env. This chart
  # stays customer-agnostic; no knob lives here. Same pattern the
  # customer-overlay bundle uses for the frontend + projector overlays. See
  # openddil-customer-bundle-customer-overlay/chart/templates/
  # hook-patch-cm-service.yaml for the canonical example.

# The first write path into the CM event log: an authenticated report
# becomes one CmEvent on the tier's cm-events topic. Disabled by default so
# a default install's rendered output is unchanged -- enabling this adds a
# cm-intake Deployment+Service per managed tier (plus hub, when hub has its
# own cm-service), a NetworkPolicy restricting ingress to that tier's PEP,
# and new PEP env/volumes pointing at it.
cmReports:
  enabled: false
  # A per-platform-variant fault catalog the PEP will check a report's
  # fault_code against, rendered to a ConfigMap and mounted read-only into
  # the PEP. Generated by openddil-demo/tools/fault_catalog/
  # build_fault_catalog.py from the manual's S1000D fault-isolation data
  # modules, keyed by platform variant -- there is NO global code list: an
  # asset is only ever offered (and only ever accepted for) its own
  # variant's codes. Empty means no file and no
  # OPENDDIL_FAULT_CATALOG_PATH, and the PEP then serves no write route at
  # all (404). A non-empty catalog with zero variants still serves the
  # write route, since a report with no fault_code ("not listed") is
  # always allowed.
  faultCatalog: {}
  # Stamped onto each CmEvent as its report source. Generic by design: this
  # chart has no knowledge of what's upstream of the PEP.
  source: operator_report

  # The SECOND write path into the CM event log: a DIS Event Report PDU,
  # decoded at the edge, becomes a CmEvent at that edge's own cm-intake --
  # no operator in the loop. Disabled by `eventType` being empty (the
  # default): no DIS wire format fact fixes what a given event type or
  # datum id means, so every one of these is a deployment choice, not a
  # protocol constant. Empty eventType renders no new env on any
  # redpanda-connect pod and leaves the cm-intake NetworkPolicy
  # unchanged -- same "default install is unchanged" stance as the rest
  # of this block.
  #
  # Only takes effect on an edge that is ALSO a tierNode tier (tierNode
  # .enabled, and tierNode.tiers empty or containing that edge's id) --
  # that is the only place this chart renders a cm-intake an edge's own
  # redpanda-connect can reach. An edge outside the active tierNode set
  # has nowhere for this path to post to, so it renders nothing, same as
  # eventType empty.
  eventReport:
    # DIS Event Report `event_type`, read off the decoded PDU. No default:
    # unset means "this deployment has not turned this feature on".
    eventType: ""
    # Variable datum ids (as the wire sends them: numeric, read as text)
    # holding the component slot id and the fault code. Required once
    # eventType is set -- see dis-event-report.yaml's "missing_datum" case.
    componentDatum: ""
    faultCodeDatum: ""
    # Optional: a free-text description datum. Blank means the mapping's
    # own default text is used ("reported by built-in test").
    descriptionDatum: ""
    severity: MAJOR
    # Optional override of the CmEvent's recordedBy. Blank means the
    # mapping's own default ("system:dis-event-report").
    recordedBy: ""
    source: telemetry_bit

logisticsFusion:
  image:
    name: logistics-fusion-service
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 9081

# asset-registry-service (ADR-0028) -- centralized writer for the
# canonical asset->edge->region mapping. One pod, HQ-tier, composes
# per-edge Faust Apps in-process. Reads telemetry-latest-state from
# each edge's broker, runs edge-assignment.yaml, upserts asset_registry
# in HQ postgres, publishes asset-registry-events to HQ broker for
# consumer cache invalidation. See ADR-0028 for the priority + divergence
# semantics. Service lives in openddil-stack/asset-registry-service/.
assetRegistry:
  image:
    name: asset-registry-service
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    # Light footprint -- one upsert per telemetry event, no in-memory
    # aggregation. Bumps may be needed for high-asset-count deployments
    # (the in-pod cache scales linearly with asset count).
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # Base port for Faust web/health. Per-edge Apps increment from this
  # (port + 1 for edge-02, +2 for edge-03, ...). Service exposes the
  # base.
  webPort: 6070
  # Topics the service writes. Pre-created by the topic-init Job so the
  # service doesn't have to declare on-startup (matches the rest of the
  # chart's "explicit topic provisioning" stance).
  outputTopic: asset-registry-events

# openddil-logistics-sim -- per-element sub-component telemetry simulator
# for the maintainer-tier 3D drill-down. Multi-profile: MRAD first;
# LTAMDS / Patriot / future asset types land as additional entries in
# config.asset_profiles[] with no code change. Discovers assets via
# telemetry-latest-state, tracks per-asset OperationalState (power_state,
# health_state, actively_transmitting, actively_receiving), generates
# per-element values honoring the upstream state, publishes one whole-
# asset snapshot per tick to asset-element-telemetry on HQ. The
# MaintainerApp SensorArrayView (MRAD_CONFIG path today) consumes via
# the useAssetElementTelemetry ElectricSQL hook. See openddil-logistics-
# sim/README.md for envelope shape + element id format.
logisticsSim:
  # Optional -- disable to run without the per-element sim. The
  # SensorArrayView falls back to seeded-RNG synthesis when no live
  # data exists, so the demo still looks alive without this -- it just
  # won't reflect the customer-sim operational_state / tx / rx state.
  enabled: true
  image:
    name: logistics-sim
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    # Light footprint -- one consumer per edge + one producer + one
    # tick loop. Memory bound by the in-memory roster (one AssetState
    # per matched asset). Scale up only if you push the tick interval
    # well below 30s with high asset counts.
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # Topic the sim writes. Generic so multi-profile snapshots share one
  # projector consumer rather than forking per asset type. Pre-created
  # by topic-init.
  outputTopic: asset-element-telemetry
  # Sim config -- mounted as a ConfigMap into /etc/openddil/logistics-sim/.
  # Override to retune tick cadence, asset_profiles, degraded-state
  # mappings, or synthesis ranges without re-baking the image. Set
  # `config: null` to use the image's baked default at
  # /app/config/default.yaml.
  config:
    tick_interval_s: 30
    output_topic: asset-element-telemetry
    # PowerState / HealthState enum names from openddil/telemetry/v1/
    # telemetry.proto that count as "asset is degraded" for synthesis.
    # When the customer sim reports any of these on telemetry-latest-
    # state, the per-element values bump into the DEGRADED / CRITICAL
    # band so the 3D drill-down lights up red in lockstep.
    degraded_power_states:
      - POWER_STATE_OFF
      - POWER_STATE_SHUTTING_DOWN
      - POWER_STATE_MAINTENANCE
    degraded_health_states:
      - HEALTH_STATE_DEGRADED
      - HEALTH_STATE_FAULT
      - HEALTH_STATE_FAILED
    # Multi-profile: one entry per asset TYPE. MRAD ships today; add
    # LTAMDS / Patriot / etc. as additional entries -- no code
    # change. A discovered asset routes to the FIRST profile whose
    # matches_platform_variants includes its variant.
    asset_profiles:
      - name: mrad
        # MRAD profile models the SENSOR subsystem only. After the
        # 2026-06-24 per-site sensor identity fix, a single radar site
        # produces a `*_radar` chassis Unit asset AND a
        # `*_radar_MRAD_Sensor` sensor subsystem asset (both carry
        # variant=MRAD_Sensor after aliasing). Only the sensor has the
        # multi-element array; match_asset_id_suffix gates the
        # chassis (and other non-sensor MRAD_Sensor-variant assets)
        # out of discovery. MRAD_Interceptor (launchers) intentionally
        # absent -- launchers don't have arrays. See the comment block
        # in openddil-logistics-sim/config/default.yaml for the full
        # rationale.
        matches_platform_variants:
          - MRAD_Sensor
          - MRAD_Radar        # aliases to MRAD_Sensor; kept for safety
          - MRAD2_radar       # customer-overlay NLD demo:*_MRAD2_radar token
        match_asset_id_suffix: "_Sensor"
        # IMPORTANT: cols×rows MUST match the frontend's MRAD_CONFIG.layers
        # in openddil-demo/frontend/src/components/SensorArrayView.tsx — the
        # path-encoded element ids (TR-.../BOARD-i-j/MODULE-i-j/CHIP-i-j)
        # only resolve when both sides agree on the grid. Tree cardinality
        # history:
        #   23,712 (96 × 6×4×9) — 5MB serialized, current. Restored after
        #                          visual quality pass; the 4,080 trim
        #                          looked sparse vs the original dense
        #                          grid + pulse animation on critical
        #                          tiles.
        #    8,160 (96 × 4×4×4) — 1.6MB intermediate trim.
        #    4,080 (48 × 4×4×4) — 0.8MB deepest trim. Use this if a
        #                          target deployment has integrated-GPU
        #                          clients that can't hold WebGL context.
        # asset-element-telemetry topic needs max.message.bytes=16MB
        # (set in infrastructure.yaml) to admit the 5MB snapshot.
        # Mirrors openddil-logistics-sim/config/default.yaml.
        layers:
          - { name: "RADAR UNIT",     prefix: "TR" }
          - { name: "BACKPLANE",      prefix: "BOARD",  cols: 2, rows: 3 }
          - { name: "PROCESSOR BANK", prefix: "MODULE", cols: 2, rows: 2 }
          - { name: "GAN MMIC CHIP",  prefix: "CHIP",   cols: 3, rows: 3 }
        faces:
          - { name: "PRIMARY APERTURE", cols: 8, rows: 12 }
        synthesis:
          health_nominal_min: 0.55
          health_nominal_max: 0.85

          # Per-tier yellow/red fractions of FACE elements that lift
          # into the >0.90 (yellow) and >0.97 (red) health bands.
          # Mirrors openddil-logistics-sim/config/default.yaml. Mapping:
          #   NOMINAL  → no lift (all green)
          #   DEGRADED → yellow only ("minor faults, still operational")
          #   FAULT    → yellow + small red ("real problems")
          #   FAILED   → heavier mix ("asset is down")
          # AssetState.severity_tier() resolves the upstream proto
          # power_state + health_state + tx/rx into one of these four
          # tiers; the sim's _synth_health then lifts the configured
          # fraction of face cells (subtree children inherit via the
          # rollup cap).
          degraded_yellow_fraction: 0.15
          degraded_red_fraction:    0.00
          fault_yellow_fraction:    0.20
          fault_red_fraction:       0.05
          failed_yellow_fraction:   0.30
          failed_red_fraction:      0.20

          # Legacy back-compat knob -- kept for older configs that
          # don't yet carry the per-tier fields. Loader uses this
          # only when NONE of the tier_*_fraction fields are set.
          degraded_fraction: 0.15

          temp_min: 30
          temp_max: 75
          load_min: 5
          load_max: 95
          tick_drift_temp: 1.5
          tick_drift_load: 5.0

frontend:
  image:
    name: frontend
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  port: 80
  branding:
    # Optional ConfigMap holding branding.json (title, logo) plus image
    # files; served unauthenticated at /branding/ on every UI. Empty =
    # <release>-branding. Absent ConfigMap = OpenDDIL defaults.
    configMap: ""
  figures:
    # Optional ConfigMap of <ICN>.svg illustrated-parts figures, mounted
    # read-only on the HUB frontend at /usr/share/nginx/html/figures and
    # served session-gated at /figures/. Empty = no mount. A released-records
    # pane shows one when its entry carries a `figure` pointer pair.
    configMap: ""
  # Hub-view-only tables of records released to a destination, per ADR-0046
  # §5: each entry is {title, destination, kind, columns:[{header, pointer}]}
  # and is passed through as opaque JSON into the hub frontend's
  # deployment.json. Empty by default -- no panes, no ConfigMap, no mount.
  releasedRecordsPanes: []

# --- Egress gate + its pane (ADR-0043 Arc 2 Slice 2, ledger row LR-0043-C) --
# ONE image, TWO Deployments: the gate (image default command, main.py) and
# the pane API (pane_api.py). Both import the same gate.py, so they cannot
# disagree about what a decision means. Rendered only when releasability is
# enabled -- the gate asks the hub's Topaz, and without it every record would
# be refused `pdp_unavailable`, which is an outage presenting as a policy.
#
# HUB ONLY, like egress-c2-status itself: a gate on a tier would be a second
# boundary, and the claim is that there is one.
egress:
  image:
    name: egress
    tag: ""
    digest: ""
    pullPolicy: ""
  # The destination is a SUBJECT in the entitlements corpus. Absent from the
  # corpus, the gate refuses every record `destination_unknown`.
  destination: "system:c2-stand-in-atl"
  sourceTopic: asset-logistics-status
  sinkTopic: egress-c2-status
  paneApi:
    port: 8090
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  # taky on the hub as a tier workload, fed by the CoT adapter above. DEFAULT
  # OFF: unlike the gate and the pane, this ships an image (tak-server) that
  # has to be reachable from the cluster's own registry before a Deployment
  # referencing it can even schedule -- the gate/pane's egress image was
  # already being built and pushed for other reasons, this one is not, and a
  # chart that defaulted a brand-new image reference to "on" would turn a
  # missing build into a crash-looping pod rather than an opt-in step.
  tak:
    enabled: false
    image:
      name: tak-server
      tag: ""
      digest: ""
      pullPolicy: ""
    port: 8087
    # taky replays every tracked non-stale event to a client on connect and
    # broadcasts to every connected socket (router.send_persist) -- "stale"
    # is the only thing bounding how long a disconnected/stopped asset keeps
    # showing on the picture. 300s matches compose's taky.conf-adjacent
    # default and the adapter's own OPENDDIL_COT_STALE_S default.
    staleSeconds: 300
    cotType: a-u-G
    resources:
      requests: { cpu: 50m,  memory: 128Mi }
      limits:   { cpu: 300m, memory: 256Mi }
    # Mutual-TLS listener for ONE device class reaching this TAK server from
    # outside the cluster (a phone or laptop running ATAK/WinTAK). taky
    # itself stays plaintext on `port` above, unchanged -- this is a
    # ghostunnel sidecar in the SAME pod that terminates TLS on its own port
    # and forwards to 127.0.0.1:<tak.port>. Inert by default: rendering
    # needs `egress.tak.enabled` AND `tls.enabled` together, and the render
    # `fail`s if either `secretName` or `allowedClientCNs` is still empty
    # once tls.enabled is true -- a half-configured listener (a port open
    # with no way to admit anyone, or a port open admitting everyone CA-only)
    # is not a safe default to render quietly.
    #
    # THE AUDIENCE RULE: a device admitted here receives this TAK server's
    # entire picture -- the same undifferentiated audience egress.destination
    # already defines for every other reader (see releasability.yaml's
    # `<rel>-tak-server-readers-only` NetworkPolicy comment). Admitting a
    # device's CN admits it to that audience; there is no per-device filter
    # downstream of this listener.
    tls:
      enabled: false
      port: 8089
      secretName: ""          # Secret keys: server.pem, server.key, ca.pem
      allowedClientCNs: []    # e.g. ["demo-device-01"]
      service:
        type: LoadBalancer
      proxy:
        image:
          # Pinned by digest, same convention as redpandaEdge/redpandaHq/etc
          # above: `docker.io` repository + released tag recorded for
          # security-team review, `digest:` the content hash actually
          # pulled. Resolved 2026-10-02 from the registry (docker-content-
          # digest for the v1.11.3 multi-arch manifest list).
          repository: ghostunnel/ghostunnel
          tag: "v1.11.3"
          digest: "sha256:2599b8a04bae16d70a4209495618dea61b46a00a9a05fcf74da282688ad3517f"
        resources:
          requests: { cpu: 10m,  memory: 32Mi }
          limits:   { cpu: 200m, memory: 64Mi }
  # --- extra routes, kinds, the assembler, the forwarder, the stub sink ---
  # All off/empty by default, so a deployment that sets none of these
  # renders this chart's egress.yaml exactly as it rendered before any of
  # them existed -- see egress.yaml's own comment on why. The HQ-only
  # topic-init loop's `parts-availability` topic (infrastructure.yaml) is
  # the one default-render change this release makes: it is not a value
  # here (nothing to toggle), but it is scoped to the same
  # `releasability.enabled` gate as everything else under `egress:`, so a
  # release with releasability off renders that loop exactly as before.
  #
  # Extra route objects, appended AFTER the one C2 route (built above from
  # sourceTopic/destination/sinkTopic). Shape is routes.py's own: {name,
  # source_topic, destination, sink_topic, kind?}. `group` is refused here
  # (the template `fail`s, naming the entry) and refused again by routes.py
  # at startup: every route shares the gate's ONE consumer group.
  routes: []
  # kind name -> JSON Schema object (Draft 2020-12, kinds.py's own
  # vocabulary, `x-openddil` included). Rendered as one <name>.schema.json
  # key per kind in the egress-kinds ConfigMap, mounted read-only into the
  # gate (and the assembler, when enabled) at OPENDDIL_EGRESS_KINDS_DIR.
  kinds: {}
  # Extra "name|rpk args" specs, appended to the HQ-only topic-init loop
  # (infrastructure.yaml) after egress-c2-status and parts-availability --
  # like the rest of `egress:`, only when releasability.enabled is true (the
  # loop still creates egress-c2-status unconditionally; that predates this
  # gate and is unchanged). Any rpk topic-create/alter-config args are
  # accepted as-is, including a delete-policy topic -- the loop never forces
  # compaction on anything beyond the topics it declares for itself.
  hubTopics: []
  # egress-assembler (ADR-0046): reads a CM episode stream (and, when a
  # config entry names one, a parts-availability stream) and assembles each
  # into a declared kind's record. `config` is OPENDDIL_ASSEMBLER_CONFIG's
  # own JSON list (assembler.py's AssemblerRoute shape, including the
  # optional per-route `battle_condition` map) -- this chart passes every
  # entry through as opaque JSON. The one field it reads is each entry's
  # `output_topic`, to declare it in openddil.io/produces-topics.
  assembler:
    enabled: false
    config: []
  # egress-intake: polls a destination's artifacts by kind, per ADR-0046 §5,
  # and turns each into a record the rest of the pipeline can carry. `config`
  # is OPENDDIL_EGRESS_INTAKE_CONFIG's own JSON list, passed through as
  # opaque JSON; the chart reads only each entry's `onward_topic`, to
  # declare it in openddil.io/produces-topics. Off by default, same
  # reason as the assembler: a release that sets neither renders egress.yaml
  # exactly as it rendered before either existed.
  intake:
    enabled: false
    config: []
  # egress-forwarder: consumes one or more sink topics and POSTs each
  # admitted record to its route's destination URL. `config` is
  # OPENDDIL_FORWARD_CONFIG's own JSON list (forwarder.py's ForwardRoute
  # shape). When `tokenSecret` names a Secret, its `token` key is mounted
  # read-only at /etc/openddil/egress-forwarder-token/token -- point a
  # config entry's `token_file` there. The chart never reads, creates or
  # renders the token itself, only the mount.
  # A route entry may also set `held` (bool, default false: never POSTs,
  # just logs/counts and -- if `dedupe_field` is set -- records a 'held'
  # row) and `dedupe_field` (string, optional: the top-level key of the
  # decoded record holding its event identity; when set, the route
  # consults the durable egress_delivered_events table before every send
  # so a re-emitted event_id is not sent twice). Both are opt-in per
  # route; this chart's defaults set neither, so rendered behaviour is
  # unchanged (no route held, no dedupe).
  forwarder:
    enabled: false
    config: []
    tokenSecret: ""
    # extraEnv: a list of {name, value} entries appended, in order, to the
    # forwarder container's env -- for example OPENDDIL_FORWARD_RETRY_MAX_S,
    # OPENDDIL_FORWARD_MAX_POLL_INTERVAL_MS, OPENDDIL_FORWARD_SESSION_TIMEOUT_MS.
    # Empty = the forwarder's own defaults.
    extraEnv: []
  # A destination's OAuth2 client_credentials secret (client_credentials.py,
  # forwarder.py's/intake.py's `auth`): `existingSecret` names a Kubernetes
  # Secret created OUT OF BAND -- the chart never creates, renders or reads
  # its value, only the mount. When set, the whole Secret (every key) is
  # mounted read-only at /etc/openddil/egress-credentials/ into both
  # egress-forwarder and egress-intake. The convention is key
  # `client-secret`, referenced from a forwarder route's or an intake
  # poll's `auth.client_secret_file`:
  #   auth:
  #     token_url: https://example.invalid/oauth/token
  #     client_id: openddil-egress
  #     client_secret_file: /etc/openddil/egress-credentials/client-secret
  # Create the Secret from a file that lives outside any repo, and delete
  # that file afterwards:
  #   kubectl create secret generic <name> \
  #     --from-file=client-secret=<path-outside-any-repo>
  credentials:
    existingSecret: ""
  # Extra CA trust for the forwarder and intake Deployments, for a
  # destination behind a private/corporate CA (never a way to disable
  # verification -- forwarder.py/intake.py still verify TLS, just against a
  # bigger trust store). `caConfigMap` names a ConfigMap created OUT OF BAND
  # -- the chart never creates it -- whose every key is a PEM file of one or
  # more CA certificates:
  #   kubectl create configmap <name> \
  #     --from-file=corp-ca.pem=<path-outside-any-repo>
  # When set, an initContainer concatenates the image's own system CA bundle
  # with every file in the ConfigMap into one file on an emptyDir, and
  # SSL_CERT_FILE points both containers at it -- the extra CAs are trusted
  # IN ADDITION to the system bundle, which is never replaced. Empty (the
  # default): no initContainer, no env, no volumes -- unchanged behaviour.
  trust:
    caConfigMap: ""
  # egress-stub-sink (stub_sink.py): the stand-in destination for whatever
  # does not have a real credential yet. STUB_SINK_DIR is an emptyDir at
  # /data -- the cluster's PVCs are NFS-backed, and an emptyDir survives a
  # container restart but NOT a reschedule, which is fine for "something
  # real for the forwarder to hit" and not meant as a durable receipt log.
  stubSink:
    enabled: false
    port: 8099
    kindField: kind
    idField: id
    # Artifacts the stub serves at GET /artifacts as {"items": [...]}, for an
    # intake polling a destination's artifacts by kind (ADR-0046 §5). Opaque
    # JSON, passed through as-is. Empty by default -- no mount, no file.
    artifacts: []

# --- Utility images (template-internal: Atlas, Alpine, curl) ----------------
# Three small images referenced by chart templates rather than by service-
# level definitions. Parameterized here so a private-registry deployment
# (Artifactory etc.) can redirect all three to a mirror via values
# overrides. Pairs with values-artifactory.yaml.
#
# - atlas: arigaio/atlas runs the Atlas migration step in the postgres-
#   schema-init Job. CRITICAL — without it, the migration step doesn't run
#   and postgres-hq comes up with zero tables.
# - alpine: the no-op "complete" main container of the postgres-schema-
#   init Job. CRITICAL — Job pod won't reach Ready without it; Job
#   never completes; install hangs.
# - curl: curlimages/curl runs the electric-sync + frontend connectivity
#   helm-test pods. NON-critical — only used when running `helm test`.
utilities:
  atlas:
    repository: arigaio/atlas
    # 0.32.0 is the latest STABLE atlas tag in the 0.x line. The
    # arigaio/atlas:latest tag points at a CANARY build (`v1.2.1-canary`
    # locally), which is not a release-stable pin and won't pass typical
    # security review. 0.32.0 implements the same `migrate apply` surface
    # we use and is API-stable for HCL schema migrations.
    tag: "0.32.0"
    digest: ""
    pullPolicy: IfNotPresent
  alpine:
    repository: alpine
    tag: "3.20"
    digest: ""
    pullPolicy: IfNotPresent
  curl:
    repository: curlimages/curl
    tag: "8.9.1"
    digest: ""
    pullPolicy: IfNotPresent

# --- Ingress ----------------------------------------------------------------
# Two routes on one host:
#   /            -> frontend (nginx-served static SPA)
#   /electric/   -> electric-sync:5133 (Electric SQL shape API)
#
# The /electric/ route is only useful AFTER the frontend image is rebuilt
# with VITE_ELECTRIC_URL=/electric/v1/shape (or an absolute URL pointing
# here). The PUBLISHED frontend image bakes localhost:5133, which won't
# reach anything in-cluster. See README "Known smells / follow-ups."
ingress:
  enabled: true
  className: ""           # e.g. "nginx" / "traefik", leave blank for cluster default
  host: openddil.local
  annotations: {}
  # Common annotations for cert-manager + body-size lift for shape responses:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls: []
  # tls:
  #   - hosts: [openddil.example.com]
  #     secretName: openddil-tls
  # Secret served for every TIER host whose publicOrigin is https:// (see
  # tierNode.tiers below). The chart never creates this Secret — it is
  # expected to exist in the release namespace already, same as the root's
  # own tls[].secretName above.
  #
  # Empty (default) -> use the secretName of ingress.tls[0], on the
  # assumption that one certificate (wildcard or multi-SAN) already covers
  # both the root host and every tier host. Set this only when the tier
  # hosts need a DIFFERENT certificate from the root's.
  tierTlsSecretName: ""

  # Redirect plain http to https on every host this chart serves over TLS
  # (the root host when ingress.tls is set; a tier host when its publicOrigin
  # is https://). Traefik only: renders a traefik.io/v1alpha1 Middleware
  # (redirectScheme https, permanent) and references it from those Ingresses.
  # Off by default because the Middleware CRD does not exist on other
  # controllers. Without it, http to a TLS host still routes, and a Secure
  # session cookie is then never sent back.
  httpsRedirect:
    enabled: false

# --- Tier presentation node (ADR-0032 §d, Arc 1 Phase 3) --------------------
# The deployable unit that makes a tier's own truth visible AT that tier, and
# keeps it visible when the uplink is cut.
#
# Named tier-agnostically on purpose: this is the generic recursive node's
# presentation kit (ADR-0033), attachable to ANY broker-bearing tier at any
# depth — not an "edge" thing. In THIS deployment it instantiates at the leaf
# tiers, because those are the tiers configured with brokers and staffed with
# operators. The root already has an equivalent stack.
#
# Components, and why each is here:
#   postgres      — the tier-local read model. Without it the tier has state
#                   (compacted topics) but no queryable surface over it.
#   schema-init   — same Atlas migrations as root. IDENTICAL DDL at every
#                   tier (ADR-0032 §b) so the read contract is tier-independent.
#   projector     — tier-scoped topic set; reads THIS tier's broker, writes
#                   THIS tier's store.
#   restate       — durable-workflow substrate for fusion + cm-service today,
#                   configurable analytics and sovereignty process workflows
#                   later (ADR-0032 §d three legs, ADR-0034 execution classes).
#   fusion + cm   — detection at the tier that presents, so a severed tier
#                   still computes severity and CM state rather than showing
#                   position without judgement.
#   electric      — streams the tier store to the tier's own UI.
#   frontend      — served locally; a bundle fetched from the parent cannot
#                   load DURING severance (ADR-0032 §e).
#   topaz         — deployed, healthy, DECIDING NOTHING. Arc 2's landing zone
#                   (ADR-0029); shipping the seat now means Arc 2 adds rules
#                   to a deployed component rather than adding a component.
# ---------------------------------------------------------------------------
# EVENT RETENTION, DECLARED PER TIER KIND
# ---------------------------------------------------------------------------
# The projector has always had a retention pruner and a `retention_hours`
# field. NOTHING EVER SET IT. It defaults to None, the pruner skips any table
# without it, and `tactical_events` was therefore append-forever -- while its
# handler docstring says "a background pruner deletes rows older than
# retention_hours", which was true and vacuous at the same time.
#
# Found 2026-09-18 with 18,573 rows in one region store, the oldest ten days
# old. Most of those were residue from a separate defect, but the unbounded
# growth is its own problem and would have arrived on its own schedule.
#
# WHY PER KIND AND NOT ONE NUMBER. An intermediate accumulates events from its
# WHOLE SUBTREE plus its own ingest; a leaf accumulates only its own. The
# region is not "a bigger edge" -- it is an edge times its children. Same
# scaling argument as the Restate subtree row: the ratio is arithmetic about
# subtree size that merely coincides with tier kind in a topology with one
# region and two edges.
#
# These are DEPLOYMENT CHOICES, not constants. A fleet that must retain events
# for a post-exercise review sets them higher and sizes the store for it; the
# point is that the number is declared somewhere an operator can find rather
# than implied by the absence of a setting.
#
# The read path cares about this directly: every retained row is bytes in an
# Electric shape that a PEP must carry. Retention here and the shape ceiling
# in the PEP are two ends of the same budget.
# THE GRADIENT WAS INVERTED, and correcting it is the point of this row.
#
# First cut had leaves 168h, intermediates 72h and the root 24h -- the tier
# with the most storage and the ARCHIVAL role retaining the least, and the
# leaves with the least storage retaining the most. That was not a decision:
# the root's 24h was a pre-existing default in a different repo, the tiers had
# no value at all, and nothing anywhere disagreed because nothing compared
# them.
#
# Sized by ROLE and by what each tier can hold:
#
#   root         longest   it is the record; a theatre-level alert history is
#                          the thing an after-action review reads
#   intermediate medium    aggregates its subtree, serves the regional screen
#   leaf         shortest  least storage, and its events have already been
#                          relayed upward -- a short local window is a cache,
#                          not an archive
#
# Every retained row is also bytes in an Electric shape a PEP must carry, so
# this and the shape ceiling are two ends of one budget. The gradient puts the
# volume where the storage is and keeps the read-heavy tiers narrow.
#
# A SECOND EFFECT WORTH NAMING: with the root at 24h its tactical_events
# emptied within a day, so `sparse` was the steady state there rather than the
# exception -- and a category that fires constantly stops carrying
# information. At 30 days the root holds its alert history and sparse becomes
# rare, which is what it should be.
#
# THE ROOT'S NUMBER STILL LIVES IN ANOTHER REPO
# (openddil-projector/src/config/projector_config.yaml). It is set there, to
# the value below, and NOT mirrored here as a knob -- a values.yaml entry that
# nothing reads is the same trap as a pruner whose input is never set. Making
# one place declare all three needs a retention override on the root
# projector; recorded as a follow-up row rather than half-built here.
#
#   root: 720h (30 days) -- projector_config.yaml, matches the tactical-events
#         topic's own retention.ms of 30 days, so the store and the log agree
eventRetention:
  # A leaf: least storage, already relayed upward. A short local window.
  edgeHours: 72         # 3 days
  # An intermediate: aggregates its subtree and serves the regional screen.
  regionHours: 168      # 7 days

tierNode:
  # Additive and off by default. Enabling changes nothing about the existing
  # root-tier stack — this phase ADDS, it does not modify.
  enabled: false

  # PER-TIER SHAPE AND ADDRESS — the fields an `edges[]` entry may carry for
  # the tier-parameterized presentation (ADR-0033 §Tier-parameterized
  # presentation). All optional, and the defaults are correct for an edge:
  #
  #   hasChildren    does this tier roll anything up? Default false — an
  #                  edge is a leaf. Set true for an intermediate.
  #   parent         defaults to the entry's `region`, because an edge's
  #                  parent IS its region and the topology list already
  #                  says so. Set explicitly for a tier that is not an edge.
  #   label          human label for the tier header. Defaults to `id`.
  #   publicOrigin   the tier's own URL, e.g. https://edge-01.example. When
  #                  set, the tier gets its OWN Ingress and its OWN OIDC
  #                  client — a redirect URI is per host, so a tier reached
  #                  at its own hostname cannot share the root's client.
  #                  When absent the tier is in-cluster only and its PEP
  #                  runs in header mode, which the PEP announces at boot.
  #
  # NOTE the shape fields are read as SHAPE, never as name: nothing branches
  # on `id`. That is what makes a fourth tier render with no code change —
  # subject to GD-01, which is why it cannot yet be SCOPED. See
  # openddil-contracts/decisions/PLAN-tier-presentation-opening-package.md §2.

  # Which configured tiers get the kit. Empty => all entries in `edges`.
  # The framework rule (ADR-0032 §a) is that ANY tier may take the kit but a
  # severance-tolerant one requires that tier's OWN broker; this list is the
  # instantiation of that rule for this deployment.
  tiers: []

  postgres:
    image:
      repository: postgres
      tag: "15"
      # Same shape as every other image block, so a mirrored deployment can
      # pin this one too. scripts/check-mirror-coverage.sh fails if any
      # rendered reference has no digest to carry.
      digest: ""
      pullPolicy: IfNotPresent
    auth:
      username: openddil
      password: openddil
      database: openddil
    port: 5432
    storageSize: 8Gi
    storageClass: ""
    useEmptyDir: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 1Gi }

  restate:
    # MEASURED 2026-08-08, not guessed (ADR-0032 §d):
    #   24 partitions (product default) -> 243 MiB budget / 389 MiB RSS idle
    #    6 partitions                   ->  61 MiB budget / 167 MiB RSS idle
    # Roughly linear over a ~110 MiB runtime floor; per-asset state is
    # negligible (order-KB/asset), so the cost is BASELINE, not data.
    #
    # PROVISION-TIME ONLY. restate-server documents that
    # --default-num-partitions "only impacts the INITIAL number of
    # partitions" — it cannot be changed after first boot. So this is a
    # first-boot template parameter, not a tuning knob, and it is sized for
    # CAPACITY (partitions are the parallelism substrate ADR-0034's
    # registration contract keys against) rather than for the prettiest idle
    # figure. Being wrong costs a reprovision.
    defaultNumPartitions: 6
    storageSize: 2Gi
    useEmptyDir: false
    # THE 1Gi LIMIT WAS OOM-KILLING TWO OF THREE TIERS. Measured 2026-09-17:
    # tier-restate-edge-01 at 1600 restarts and region-east at 1124, both
    # `OOMKilled` (exit 137) after catching up their partitions in ~16s; the
    # one survivor, edge-02, sat at 975Mi against the 1Gi cap — next in line.
    #
    # THE CAUSE WAS NOT DATA GROWTH. An earlier version of this note guessed
    # "the invocation journal grows with data" from a survivor sitting at
    # 975Mi. That guess was wrong, and it would have sent the next person to
    # tune retention.
    #
    # Restate reads the cgroup limit and sets `rocksdb-total-memory-size` to
    # ALL OF IT, then prints an ERROR about itself at every startup asking for
    # under 50%. At a 1Gi limit that is a 1 GiB budget inside a 1 GiB cap —
    # arithmetic, not data. RAISING THE LIMIT DID NOT FIX IT: at 2Gi the
    # budget became 2 GiB of a 2 GiB cap, and region-east peaked at 1656Mi of
    # 2048 still walking toward the same wall. The restart counter stopping
    # was mistaken for the memory plateauing; they are different measurements.
    #
    # Fixed by RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE at 50% of this limit (see
    # tier-node.yaml). Proven by an accidental A/B: the fix went to
    # region-east alone while a watch was running, and over the next 52
    # minutes it was the ONLY node that went flat while the three unfixed
    # ones climbed — edge-02 monotonically at ~6.5 MiB/min, on course for the
    # cap in ~3.5 hours.
    #
    # SIZING RECORD, measured 2026-09-17 over 90 minutes with all four nodes
    # under a 1 GiB RocksDB budget and the derive stage actually running —
    # which no previous figure was:
    #
    #   node                  range        peak / 2Gi
    #   root restate-server   265-407Mi       20%
    #   tier edge-01          165-374Mi       18%
    #   tier edge-02          148-375Mi       18%
    #   tier region-east      989-1192Mi      58%
    #
    # All four sawtooth (RocksDB releasing on compaction, refilling) with no
    # trend. 2Gi is now a SIZING ANSWER and not headroom: the budget is the
    # thing that bounds RSS, and it is derived from this limit, so the two
    # move together. region-east runs ~3x the edges because it consumes both
    # children plus its own ingest; size the regional tier from that ratio
    # rather than from an edge measurement.
    #
    # The 167 MiB figure is RETIRED as a sizing input. It measured an idle
    # process, and it measured the PARTITION budget — a different number from
    # the one that kills the process.
    #
    # Nodes have headroom for it: 18-47% of ~8Gi at the time of the change.
    resources:
      requests: { cpu: 150m, memory: 512Mi }
      limits:   { cpu: 500m, memory: 2Gi }

  # Passive policy sidecar — Arc 2's seat. Deployed and healthy; no rules
  # loaded, no decisions made. See ADR-0029.
  topaz:
    # RE-ENABLED — the seat is proven occupied, not merely reserved.
    #
    # It shipped as `true` claiming "deployed, healthy, deciding nothing" and
    # was none of those: a missing YAML separator discarded the Deployment for
    # every tier but the last (0.1.37), and once it finally rendered it exited
    # immediately on `args: ["run"]` with `required flag(s) "config-file" not
    # set`. Two defects, one hiding the other.
    #
    # GATE RESULT (2026-08-09, topazd 0.33.16, run on a real cluster):
    #   PASS  correct invocation: run --config-file <path>, with -b/--bundle
    #         available for local policy roots. Read from `topazd run --help`
    #         inside the image — the original defect came from guessing.
    #   PASS  starts, stays Running, serves authorizer 8282/8383 + health 9494.
    #   PASS  answers real decisions against a hand-authored local bundle and
    #         an asserted-entitlement corpus (the users.yaml shape of
    #         ADR-0029). 4/4 correct, including default-deny for a subject
    #         absent from the corpus.
    #   FAIL  decision logging NOT configured. Both `plugins` and
    #         `decision_logger` — documented online and present in the
    #         published JSON schema — are REJECTED by this build with
    #         "'config.Config' has invalid keys". ADR-0029's auditability
    #         requirement is therefore an OPEN Arc 2 item, not something this
    #         seat satisfies today.
    #
    # What ships enabled is the authorizer with an EMPTY bundle: running,
    # healthy, and genuinely deciding nothing. Arc 2 adds rules to a deployed,
    # verified component — which was always the argument for the early seat.
    # Policy CONTENT stays out of the chart; it belongs in a deployment overlay.
    enabled: true
    image:
      repository: ghcr.io/aserto-dev/topaz
      # PINNED. `latest` is how this component's config schema silently
      # diverged from its own published documentation — two config keys that
      # the docs and the online schema both describe are rejected by the build
      # that `latest` resolved to. A component that will carry authorization
      # decisions does not float.
      tag: "0.33.16"
      digest: "sha256:835868c04bdd7129127ea43642ffff7363d0bd26d5e1a37631fa881431054360"
    resources:
      requests: { cpu: 50m,  memory: 64Mi }
      limits:   { cpu: 200m, memory: 256Mi }

# --- picture route for service clients ---------------------------------------
# DEFAULT OFF. When enabled, the hub egress assembler serves a picture
# endpoint (GET /picture?event_id=&destination=) on `port`, and the hub PEP
# exposes it as GET /picture to callers that present a Bearer token from this
# release's realm. The assembler endpoint does no authentication of its own:
# a NetworkPolicy limits it to the hub PEP, which is the only authenticated
# door. Requires releasability.enabled and releasability.oidc.enabled.
picture:
  enabled: false
  port: 8097
  # `aud` value the PEP requires in the token, and the realm client mapper adds.
  audience: "openddil-picture"
  # One realm client (client_credentials) per consumer. Each entry:
  #   clientId:       realm client id, unique and distinct from the PEP clients
  #   destination:    destination string the PEP maps this client to
  #   existingSecret: {name, key} of a Secret holding the client secret. The
  #                   value is read by the Keycloak pod only; it is never
  #                   rendered into a manifest or ConfigMap.
  serviceClients: []

# --- ADR-0029 Arc 2 Slice 1: read-path releasability -------------------------
# DEFAULT OFF. Enabling changes what users can see, and a chart that turned on
# enforcement by default would turn it on in deployments whose §7 completeness
# gate has never been run. Label first, enforce second, never the reverse.
releasability:
  enabled: false

  # Close the direct route to Electric. Off by default because it breaks any
  # existing direct consumer, and breaking reads is not something a chart
  # should do unasked — but WITHOUT IT THE PEP IS A SUGGESTION: any pod in the
  # namespace can read every nation's rows by using one different hostname.
  lockDownElectric: false

  topaz:
    image:
      repository: ghcr.io/aserto-dev/topaz
      # PINNED, and pinned for a reason this component earned: `latest` is how
      # its config schema silently diverged from its own published
      # documentation. A component carrying authorization decisions does not
      # float.
      tag: "0.33.16"
      digest: "sha256:835868c04bdd7129127ea43642ffff7363d0bd26d5e1a37631fa881431054360"
    policyVolumeSize: 16Mi
    dbVolumeSize: 64Mi
    resources:
      requests: { cpu: 50m,  memory: 64Mi }
      limits:   { cpu: 200m, memory: 256Mi }

  # The app's public origin. Derived from the ingress when empty; set it
  # explicitly for a deployment reached some other way. Everything the OIDC
  # flow needs — the redirect URI, the issuer, the Keycloak public URL — is
  # derived from this ONE value, because those three must agree exactly and
  # the usual repair for a mismatch is to widen the client to a wildcard.
  publicOrigin: ""

  # Which entitlements corpus the authorizer loads, by basename under
  # policy/. `users` is the one a deployment runs. `users-promoted` is a
  # rehearsal aid for the demo's last beat and differs by exactly one list.
  #
  # A REAL DEPLOYMENT HAS ONE CORPUS and changes it by a pull request against
  # that file — which is the whole basis of ADR-0029 §5's claim that every
  # entitlement has a named author, a reviewer and a date. Two files that
  # both claimed to be current would be the two-truths failure this project
  # keeps writing about.
  policyVariant: users

  # THE DEPLOYMENT'S OWN DESTINATION REGISTRY OVERLAY (ADR-0046 §7).
  #
  # EMPTY BY DEFAULT, deliberately. The shipped registry in the runtime
  # bundle (policy/destinations.yaml) is ALSO always `entries: {}` — a
  # concrete destination names a real downstream system and belongs in
  # neither the chart defaults nor the bundle image. A deployment that wants
  # one supplies it here, in its OWN values file, outside this chart's repo.
  #
  # Non-empty `entries` renders one ConfigMap
  # (`<release>-destinations-deployment`), mounted into every topaz's
  # policy-loader (optional, so a tier that predates this feature still
  # starts) and folded into openddil.policyChecksum, so a registry change
  # rolls every topaz that reads it. Topaz reads policy only at process
  # start — there is no hot reload yet.
  #
  # Shape, per entry (same idea as a users.yaml row, see that file's header):
  #   "system:<name>": {display_name, nations: [...], accepts: [...],
  #                      asserted_by, asserted_on}
  destinations:
    version: ""
    entries: {}

  # --- authentication ---------------------------------------------------------
  # OFF by default, which leaves the PEP in `header` mode: the subject arrives
  # in a trusted header and the PEP is only safe where it is unreachable from
  # outside the cluster. That is the correct default for a component whose
  # other deployment mode needs an identity provider to exist.
  oidc:
    enabled: false
    clientId: openddil-pep
    # PUBLISHED, AND THEREFORE A LAB CREDENTIAL ONLY. A deployment that means
    # it supplies this from its own secret store.
    clientSecret: "openddil-pep-dev-secret"
    # DDIL PARAMETER, not a security constant. Existing sessions survive a
    # severed link; new logins do not, because the code exchange is a live
    # call to the token endpoint. This is the ABSOLUTE CEILING on a session
    # (oidc.py's hard_expires) — renewal never extends past it, only up to
    # it. A deployment that wants sessions to outlast a longer severance
    # window sets this in its own overlay, not here.
    sessionTtlSeconds: 900
    # How long before the session's renewal point (the ID token's expiry,
    # or the ceiling if sooner) renewal is attempted — see get_session in
    # oidc.py. Keeps a tab that is making requests right up
    # to the deadline from losing the race between "renew" and "expired."
    refreshLeadSeconds: 60
    # `Lax`, deliberately. `Strict` breaks the login round trip when the IdP
    # is on a different SITE — the post-callback navigation is attributed to
    # the cross-site initiator and the cookie is withheld, so the user lands
    # logged out and a reload fixes it. Intermittent, and indistinguishable
    # from a flaky login. With the bundled Keycloak on the app's own host the
    # two are same-site and `Strict` is available.
    cookieSameSite: Lax

  # WHICH TABLES CARRY RELEASABILITY LABELS, and so may be served at all.
  #
  # `policy_predicate` filters on originator_nation / releasable_to. A table
  # without those columns cannot be filtered by it, and until 2026-09-06 the
  # PEP forwarded the predicate anyway: Electric rejected the query and the
  # browser got a 502 that its panels rendered as an ABSENCE OF DATA.
  #
  # Measured on the lab that day, through a fully-entitled session: five of
  # fourteen served tables answered 200 and NINE answered 502 — the alert
  # feed, inventory, buffer status, telemetry windows, the asset registry,
  # the audit log and all three regional rollups. The read path had only
  # ever been completed for the five, and nothing said so, because the
  # completeness gate enumerated tables that HAVE the label columns and
  # checked those for NULLs. The nine were never in its enumeration.
  #
  # Listing them here does not reduce what is served — those nine are
  # already unserved. It converts nine silent transport failures into nine
  # stated refusals with a cause, which is the difference between data that
  # is missing and data the system refuses to serve because it cannot scope
  # it.
  #
  # ⚠ THIS LIST AND THE DATABASE SCHEMA ARE TWO COPIES OF ONE FACT.
  # `check-releasability-completeness.sh` reconciles them: every table with
  # both label columns must appear here, and every table here must have
  # them. Adding a table to the read path without labels is meant to be
  # noisy.
  # --- CLASS 1: nation-filtered. The ADR-0029 predicate applies. ---
  labeledTables:
    - telemetry_latest_state
    - asset_logistics_status
    - asset_cm_state
    - asset_capability_state
    - asset_element_telemetry
    # Joined 2026-09-06 by the labelling block. tactical_events is stamped by
    # fusion from the same state that stamps asset_logistics_status;
    # asset_telemetry_windows has the columns and no rows yet, so it serves
    # empty rather than refused — which is the accurate statement about it.
    - tactical_events
    - asset_telemetry_windows
    # Effector tracking: one row per Fire/Detonation event_urn, labelled
    # from the launcher the same way tactical_events is. The declared-load
    # table and the per-launcher counts view are NOT listed: neither carries
    # labels, and this list controls what the PEP will serve.
    - effector_launch
    # Joined 2026-09-08. The rollups, labelled by COMPOSITION: the aggregator
    # intersects its contributors' releasable_to over the same snapshot the
    # counts come from, so an aggregate is no more visible than its least
    # visible input. Their originator_nation stays NULL on purpose — the §4
    # predicate is a disjunction, so a nation stamped on a rollup would ALONE
    # grant access and bypass the intersection while looking like a label.
    - region_fleet_summary
    - region_top_factors
    - region_wear_trends
    # Promoted the same day, after the completeness gate refused the halfway
    # position: both now HAVE the columns and have ZERO unlabelled rows
    # (asset_registry 14/0 by backfill, inventory_items 0/0 because empty),
    # so refusing them was "a lie about the data" in the gate's words.
    #
    # "Label first, enforce second" is about not enforcing over UNLABELLED
    # rows. There are none here, so holding these back was a misreading of
    # the rule rather than an application of it.
    #
    # The residual gap is real and is a follow-up, not a reason to refuse a
    # table: the asset-registry-service does not stamp its own writes, so
    # rows it adds after the backfill arrive unlabelled and deny-unlabeled
    # hides them. That is the safe direction, and the gate counts them.
    - asset_registry
    - inventory_items

  # --- CLASS 2: role-served. Nothing to partition BY. ---
  #
  # A DECLARED POSITION, not an oversight: `edge_buffer_status` holds bridge
  # lag, a severance flag and a probe result. No asset data, no nation, and
  # therefore no partition — refusing it as "unlabelable" removed HQ's
  # severance indicator, which is precisely what a severance recording
  # exists to show. Infrastructure topology is visible to authenticated
  # operators.
  #
  # ⚠ THE CLASS IS THE RISK. Anything asset-bearing put in this list is a
  # bypass wearing the name of a policy. The completeness gate refuses a
  # table here that carries label columns, because a table that CAN be
  # partitioned and is served unfiltered is the failure this whole read path
  # exists to prevent.
  roleServedTables:
    - edge_buffer_status

  # --- CLASS 3: subject-scoped. Partitioned by WHO, not by nation. ---
  # `table:column` — the column naming the subject a row belongs to. A
  # subject sees their own rows; a subject holding an oversight role sees
  # every row, which is what an auditor's remit means.
  subjectScopedTables:
    - audit_log:actor
  oversightRoles:
    - auditor

  # The WAN sever/restore toggle is gated separately from the oversight
  # roles above: it is an AFFORDANCE check (gateway/pep.py's /proxies/
  # route), not a row filter, so it lives beside OPENDDIL_OVERSIGHT_ROLES's
  # source (this block) rather than under a new top-level key. A string,
  # not a list, because it is handed straight through as the
  # OPENDDIL_WAN_CONTROL_ROLES env var, which the gateway parses as CSV
  # (_parse_roles_csv) the same way its own built-in default "supervisor"
  # already is.
  wanControlRoles: "supervisor"

  # --- CLASS 4: known to need labels, not yet stamped. REFUSED meanwhile. ---
  #
  # Declared so the gate can tell "a table we know about and have not
  # finished" from "a table nobody has classified at all" — the second being
  # the loud case, because it is how a new table joins the read path
  # unpartitioned without anyone deciding that it should.
  #
  # These four are asset-bearing (each carries asset_id) and derive from
  # assets that ARE labelled, so stamping them is propagation rather than
  # new policy. The three region_* rollups are NOT here: a rollup over many
  # assets needs a composition rule, which is the regional node's §4
  # decision and deliberately not defaulted.
  pendingLabelTables:
    # EMPTY, as of 2026-09-08. The three rollups were the last entries and
    # they are labelled now — by COMPOSITION rather than propagation, which
    # is why they were held back while every other table was promoted.
    #
    # The rule is intersection, applied in the aggregator over the same
    # snapshot the counts come from: a rollup is no more visible than its
    # least visible input. One ATL-only asset makes every rollup in that
    # region ATL-only; one UNLABELLED asset makes it releasable to nobody,
    # because under deny-unlabeled an unlabelled row is releasable to no one
    # and intersecting with no-one gives no-one.
    #
    # AN EMPTY LIST HERE IS A CLAIM, not an oversight, and the completeness
    # gate is what keeps it honest: it enumerates every PEP-served table and
    # reports anything unlabelable as a finding, so this list going empty is
    # checkable rather than asserted.
    []

  # A DEMO identity provider: start-dev, in-memory H2, published passwords,
  # no TLS. Correct for a lab and disqualifying anywhere else. A real
  # deployment turns this off and points releasability.oidc at the identity
  # provider it already runs — which is why the PEP takes an issuer URL
  # rather than embedding a Keycloak client.
  keycloak:
    enabled: false
    image:
      repository: quay.io/keycloak/keycloak
      tag: "26.0"
      digest: ""
    # The sign-in page carries a minimal `openddil` login theme (chart-
    # owned, no values flag of its own: it renders whenever keycloak is
    # enabled). It activates for the `realm` below. Its logo and full-page
    # background default to the OpenDDIL images in the frontend image
    # (/brand/); the SAME frontend.branding.configMap every UI mounts
    # overrides them per key (signin-logo.png, signin-background.jpg) and
    # supplies the sign-in strings (keycloak-messages_en.properties). A
    # ConfigMap change reaches the sign-in page after a keycloak rollout
    # restart.
    realm: openddil
    # Served under a sub-path of the app's own host, so the IdP and the app
    # are same-site and the login round trip needs no CORS.
    basePath: /idp
    adminUser: admin
    adminPassword: admin
    realmVolumeSize: 8Mi
    # AN ABSOLUTE HEAP CAP PLUS HEADROOM, rather than a bigger limit.
    #
    # Keycloak 26 was OOMKilled at 1Gi and again at 2Gi. Raising the limit
    # alone does not help: the JVM sizes its heap as a PERCENTAGE of the
    # limit it is given, so a larger limit produces a proportionally larger
    # heap and the same overshoot once metaspace, code cache and direct
    # buffers are added on top.
    #
    # The symptom is a CrashLoopBackOff whose container log ends mid-startup
    # with no error — the kill happens outside the JVM, so there is no
    # OutOfMemoryError to print, and the process is simply gone. Diagnosable
    # only from the pod's lastState (`reason: OOMKilled`), which is not where
    # anyone looks first.
    javaOpts: "-Xms256m -Xmx1024m"
    resources:
      requests: { cpu: 100m, memory: 768Mi }
      limits:   { cpu: 1000m, memory: 3Gi }

  pep:
    image:
      # A stock python image running stdlib-only source from the bundle. No
      # openddil image to build, no wheels to resolve at start-up.
      repository: python
      tag: "3.11-slim"
      digest: ""
    appVolumeSize: 8Mi
    logLevel: INFO
    resources:
      requests: { cpu: 50m,  memory: 64Mi }
      limits:   { cpu: 300m, memory: 256Mi }

# Exercise control: a small HQ-only adapter that drives external
# pause/resume/stop/restart/run operations and watches the edge sensor-ingest
# rate against a floor. Ships as source from the bundle (demo/exercise), run
# under the same stock python image as the root pep -- see releasability.pep
# above for why that pattern exists (no image to build, no wheels at start).
exerciseControl:
  # HQ only; off by default. The root pep only gets
  # OPENDDIL_EXERCISE_CONTROL_URL/ROLES when this is true (releasability.yaml).
  enabled: false
  port: 8095
  # Gateway role list, same parsing as releasability.wanControlRoles (comma
  # list, no further validation at render time -- control.py's own consumer
  # owns that).
  roles: "supervisor"
  # {name, endpoint, operations: {op: {method, path, body}}}. Overlays carry
  # the real map; op keys must be one of pause/resume/stop/restart/run --
  # same ALLOWED_OPS set control.py refuses to start without (see exercise/
  # control.py), checked again here at render time so a bad map fails
  # `helm template`, not a CrashLoop.
  adapter: {}
  # Empty -> every edge's sensor-ingest http port, one URL per edges[]
  # entry (there is no Service port literally named "metrics" today; see
  # templates/exercise-control.yaml's comment on this).
  rateSources: []
  rateWindowSeconds: 30
  # How old a measured zero (the reset record) may be before exercise-control
  # stops accepting it for a restart. The restart op is refused without a
  # fresh, unused zero; must be > 0 or the service refuses to start.
  restartMaxZeroAgeSeconds: 1800
  rateMin: 0.1
  scrapeIntervalSeconds: 5
  # NetworkPolicy egress peers+ports for the adapter endpoint, verbatim --
  # list of {to: [...], ports: [...]}, same shape kubernetes NetworkPolicy
  # egress rules take.
  adapterEgress: []
  resources: {}
