# =============================================================================
# OpenDDIL Demo — Helm values
# =============================================================================
# Mirrors the docker-compose topology: 3 edge clusters (each with its own
# redpanda broker, DIS sensor-ingest, redpanda-connect, faust-edge,
# projector, edge-hq-bridge), 2 regional faust aggregators, and an HQ
# tier (postgres-hq, electric-sync, restate-server, restate-hub,
# projector-hq, cm-service, logistics-fusion, frontend, toxiproxy).
#
# To shrink to a smaller footprint, drop entries from `edges:` and
# `regions:` below — the templates loop over these lists.
# =============================================================================

# --- Global -----------------------------------------------------------------
global:
  imageRegistry: ghcr.io
  imagePrefix: edgy-solutions/openddil
  imagePullPolicy: IfNotPresent
  # Suffix for internal k8s service resolution (e.g., .default.svc.cluster.local).
  # Leave empty for in-namespace resolution.
  clusterDomain: ""
  imagePullSecrets: []
  # Bake-time tag for ALL openddil-owned images (frontend, cm-service,
  # logistics-fusion, faust-edge, faust-regional, sensor-ingest, projector,
  # hub-restate-projector, runtime-bundle). Overridable per-service below.
  imageTag: "latest"

# --- Runtime bundle image ---------------------------------------------------
# Built from ../bundle/Dockerfile. Bakes openddil-contracts/, openddil-stack/,
# openddil-tactical-agents/hub/restate_hub.py, and openddil-demo/ configs
# into a single image. Init containers in every consumer pod copy the
# subtree they need out of /bundle/* into a shared emptyDir volume.
bundle:
  image:
    name: runtime-bundle
    tag: ""               # Empty -> falls back to global.imageTag
    digest: ""            # Non-empty -> <registry>/<prefix>/<name>@<digest>
                          # bypassing tag entirely. Mirror-time digest
                          # pinning lives in a values-pinned.yaml file
                          # emitted by scripts/mirror-to-artifactory.ps1.
                          # See README "Digest pinning" section.
    pullPolicy: ""        # Empty -> falls back to global.imagePullPolicy
  # Resources for the bundle-loader initContainer that every consumer pod
  # runs. It only does `cp -r` of config subtrees out of the bundle image
  # into an emptyDir, so it is cheap and short-lived. Explicit so it does
  # NOT inherit a too-small cluster-default LimitRange (a cp starved of
  # memory still completes, but being explicit removes the variable).
  initResources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# --- Hook Jobs (topic-init, postgres-schema-init, *-bootstrap) --------------
# The four Helm-hook Jobs were previously shipped with NO resources block,
# so under a constraining ResourceQuota they would be admission-rejected,
# and under a small cluster-default LimitRange they risk OOMKill mid-run
# (a postgres-schema-init OOMKilled mid-`atlas migrate apply` leaves the
# DB half-migrated). Shared block sized generously enough for rpk, atlas,
# psql, and the Python bootstrap scripts.
jobs:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- Topology ---------------------------------------------------------------
# Each edge gets its own redpanda broker StatefulSet + sensor-ingest +
# redpanda-connect + faust-edge + projector + edge-hq-bridge. The id is
# embedded in service names, hostnames advertised to Kafka, and FAUST_APP_ID.
# Region binding controls which faust-regional aggregator the edge feeds.
edges:
  # udpPort: container listen port. Same value (62040-62042) used as NodePort
  # if sensorIngest.externalAccess.enabled=true. Hold for in-cluster-only
  # clusters that ban NodePort (default: false, ClusterIP only).
  - id: edge-01
    region: region-east
    udpPort: 62040
  - id: edge-02
    region: region-east
    udpPort: 62041
  - id: edge-03
    region: region-west
    udpPort: 62042

regions:
  - id: region-east
  - id: region-west

# --- Persistence ------------------------------------------------------------
# storageClass is the default StorageClass for EVERY PersistentVolumeClaim
# the chart creates (redpanda-edge x N, redpanda-hq, postgres-hq,
# restate-server). The three per-component overrides take precedence when
# non-empty; an empty override falls back to storageClass; an empty
# storageClass falls back to the cluster's default StorageClass. All PVCs
# are ReadWriteOnce with volumeMode: Filesystem.
#
# Examples:
#   # vSphere class for every PVC:
#   persistence: { storageClass: vsphere }
#   # vSphere for redpanda only, cluster-default for postgres + restate:
#   persistence: { redpandaStorageClass: vsphere }
#   # or at install time:  --set persistence.redpandaStorageClass=vsphere
#
# redpandaStorageClass covers BOTH redpanda-edge and redpanda-hq. Each
# rendered claim carries accessModes [ReadWriteOnce], volumeMode
# Filesystem, the resolved storageClassName, and the *Size below.
persistence:
  storageClass: ""           # default for all PVCs; empty -> cluster default
  redpandaStorageClass: ""   # override for redpanda-edge + redpanda-hq
  postgresStorageClass: ""   # override for postgres-hq
  restateStorageClass: ""    # override for restate-server
  redpandaSize: 10Gi
  postgresSize: 20Gi
  restateSize: 5Gi

# --- Redpanda (per-edge) ----------------------------------------------------
# Third-party images pinned by semver tag — bumped 2026-05-19 from the
# stale :latest defaults to the actual versions we tested with, identified
# by running each image's binary with --version inside a throwaway
# container. Versions chosen to be security-team-approvable (real release
# tags, no SHA digests or canary builds). Bump deliberately when you roll
# forward; the `digest:` field is kept empty so the openddil.thirdPartyImage
# helper renders <repo>:<tag>. Set `digest:` non-empty per service to opt
# into digest-pinning where stricter reproducibility is needed.
redpandaEdge:
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: "v26.1.7"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  # Kafka listener on 9092, OUTSIDE listener (host-debug) on 9093.
  internalPort: 9092
  outsidePort: 9093
  adminPort: 9644

# --- Redpanda HQ (single broker, advertises via toxiproxy) ------------------
# The OUTSIDE/PLAINTEXT split here is load-bearing: edge-hq-bridge connects
# via toxiproxy:8474 (the only way DDIL sever is real), so PLAINTEXT must
# advertise toxiproxy. The OUTSIDE listener is for debug / kubectl-port-forward.
redpandaHq:
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: "v26.1.7"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  kafkaPort: 19092
  outsidePort: 19093
  adminPort: 19644

# --- Postgres HQ ------------------------------------------------------------
postgresHq:
  image:
    repository: postgres
    tag: "15"
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: password
    database: openddil
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  port: 5432

# --- Toxiproxy --------------------------------------------------------------
# DDIL sever mechanism. Mediates produce traffic from edge-hq-bridge to
# redpanda-hq. Disabling the proxy severs the link; re-enabling it
# restores buffered traffic.
toxiproxy:
  image:
    repository: ghcr.io/shopify/toxiproxy
    # Bumped 2.9.0 -> 2.12.0 (2026-05-19): the local image being tested
    # had version label 2.12.0; the prior 2.9.0 chart pin was stale.
    # Semver tag (not digest) because the upstream image carries a real
    # version label.
    tag: "2.12.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  apiPort: 8474
  proxyPort: 8475

# --- Electric SQL -----------------------------------------------------------
electric:
  image:
    repository: electricsql/electric
    tag: "1.6.2"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 5133

# --- Restate (server + hub projector) ---------------------------------------
restate:
  image:
    repository: docker.io/restatedev/restate
    # Bumped 1.1 -> 1.6.2 to match docker-compose. The 1.1 default in the
    # chart was older than what compose has been testing with; 1.6.2 is the
    # version compose pins and that the restate-sdk-python 0.17.1 discovery
    # protocol requires (Phase 5 close note in tests/hero_scenario_v3/
    # README.md documents the 1.1.2 -> 1.6.2 bump rationale).
    tag: "1.6.2"
    digest: ""
    pullPolicy: IfNotPresent
  # restate-server is a RocksDB-backed stateful event processor — 512Mi
  # OOMKills it once CM/fusion Virtual Object state accumulates, which in
  # turn times out the *-bootstrap hook Jobs' registration POSTs.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi }
  ingressPort: 8080
  adminPort: 9070

  # ephemeralOnUpgrade — when true, a Helm pre-install/pre-upgrade hook
  # (hook-restate-wipe.yaml) scales restate-server to 0 and deletes its
  # PVC before applying chart changes. The cm-service-bootstrap +
  # logistics-fusion-bootstrap post-install hooks then re-register
  # services against the fresh state on the way back up.
  #
  # Right for demo iteration where handler-code changes between deploys
  # would otherwise cause VMException(570) ("code path mismatch between
  # previous execution and this execution") on every event for assets
  # whose Virtual Object journal was written by old code.
  #
  # Set false for environments where Restate state durability matters
  # across redeploys (prod-like CM history preservation). In that case
  # handler-code changes require an explicit out-of-band
  # `flush-assets.sh --deep` to clean state when needed.
  ephemeralOnUpgrade: true

  # Image used by the restate-wipe hook Job. Same kubectl-runner the
  # other overlay hooks use; bumping it independently of the chart's
  # default kubectl version is rarely needed but possible here.
  wipe:
    image:
      repository: docker.io/bitnami/kubectl
      tag: "1.30"
      pullPolicy: IfNotPresent

restateHub:
  image:
    # Note: published image's Dockerfile copies hub_restate_projector.py;
    # docker-compose runs restate_hub.py via bind-mount. We restore the
    # compose behavior by mounting restate_hub.py from the bundle image
    # over /app/restate_hub.py. See openddil-tactical-agents/hub/.
    name: hub-restate-projector
    tag: ""
    digest: ""
    pullPolicy: ""
  # Long-running Python consumer — explicit resources so it does not
  # inherit a too-small cluster-default LimitRange and get OOMKilled.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- Per-edge services ------------------------------------------------------
sensorIngest:
  image:
    name: sensor-ingest
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  httpPort: 8080
  # If your DIS PDU producer (VR-Forces, test harness, etc.) lives OUTSIDE
  # the cluster, set externalAccess.enabled=true to expose the UDP port via
  # NodePort. The cluster's --service-node-port-range must include each
  # edge's udpPort (default range is 30000-32767; defaults here are
  # 62040-62042). For 443-only clusters where NodePort is banned, leave
  # this off and run the producer as a pod in the same namespace, or use
  # `kubectl exec` to inject test PDUs from inside.
  externalAccess:
    enabled: false

redpandaConnect:
  image:
    repository: docker.redpanda.com/redpandadata/connect
    tag: "4.91.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  httpPort: 4196

faustEdge:
  image:
    name: faust-edge
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # Demo-visibility overrides (see docker-compose.override.yml for rationale).
  prognosticsEnv:
    TRACK_LIFE_TOTAL_KM:     "10"
    ENGINE_LIFE_TOTAL_HOURS: "1"
    TERRAIN_TOTAL_DEG_KM:    "50"
    BARREL_LIFE_TOTAL_ROUNDS: "100"

projector:
  image:
    name: projector
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 8084

edgeHqBridge:
  image:
    repository: docker.redpanda.com/redpandadata/connect
    tag: "4.91.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- Per-region service -----------------------------------------------------
faustRegional:
  image:
    name: faust-regional
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- HQ services ------------------------------------------------------------
cmService:
  image:
    name: cm-service
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 9080
  # Customer overlays that want to layer additional baseline YAMLs on
  # top of the OSS set (the runtime-bundle's contracts/baselines) do so
  # via the standard overlay-patch pattern -- a post-install Job in the
  # customer chart `kubectl patch`es this Deployment to add a
  # /baselines-overlay volumeMount + CM_BASELINES_DIRS env. This chart
  # stays customer-agnostic; no knob lives here. Same pattern the
  # customer-overlay bundle uses for the frontend + projector overlays. See
  # openddil-customer-bundle-customer-overlay/chart/templates/
  # hook-patch-cm-service.yaml for the canonical example.

logisticsFusion:
  image:
    name: logistics-fusion-service
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  port: 9081

# asset-registry-service (ADR-0028) -- centralized writer for the
# canonical asset->edge->region mapping. One pod, HQ-tier, composes
# per-edge Faust Apps in-process. Reads telemetry-latest-state from
# each edge's broker, runs edge-assignment.yaml, upserts asset_registry
# in HQ postgres, publishes asset-registry-events to HQ broker for
# consumer cache invalidation. See ADR-0028 for the priority + divergence
# semantics. Service lives in openddil-stack/asset-registry-service/.
assetRegistry:
  image:
    name: asset-registry-service
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    # Light footprint -- one upsert per telemetry event, no in-memory
    # aggregation. Bumps may be needed for high-asset-count deployments
    # (the in-pod cache scales linearly with asset count).
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # Base port for Faust web/health. Per-edge Apps increment from this
  # (port + 1 for edge-02, +2 for edge-03, ...). Service exposes the
  # base.
  webPort: 6070
  # Topics the service writes. Pre-created by the topic-init Job so the
  # service doesn't have to declare on-startup (matches the rest of the
  # chart's "explicit topic provisioning" stance).
  outputTopic: asset-registry-events

frontend:
  image:
    name: frontend
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  port: 80

# --- Utility images (template-internal: Atlas, Alpine, curl) ----------------
# Three small images referenced by chart templates rather than by service-
# level definitions. Parameterized here so a private-registry deployment
# (Artifactory etc.) can redirect all three to a mirror via values
# overrides. Pairs with values-artifactory.yaml.
#
# - atlas: arigaio/atlas runs the Atlas migration step in the postgres-
#   schema-init Job. CRITICAL — without it, the migration step doesn't run
#   and postgres-hq comes up with zero tables.
# - alpine: the no-op "complete" main container of the postgres-schema-
#   init Job. CRITICAL — Job pod won't reach Ready without it; Job
#   never completes; install hangs.
# - curl: curlimages/curl runs the electric-sync + frontend connectivity
#   helm-test pods. NON-critical — only used when running `helm test`.
utilities:
  atlas:
    repository: arigaio/atlas
    # 0.32.0 is the latest STABLE atlas tag in the 0.x line. The
    # arigaio/atlas:latest tag points at a CANARY build (`v1.2.1-canary`
    # locally), which is not a release-stable pin and won't pass typical
    # security review. 0.32.0 implements the same `migrate apply` surface
    # we use and is API-stable for HCL schema migrations.
    tag: "0.32.0"
    digest: ""
    pullPolicy: IfNotPresent
  alpine:
    repository: alpine
    tag: "3.20"
    digest: ""
    pullPolicy: IfNotPresent
  curl:
    repository: curlimages/curl
    tag: "8.9.1"
    digest: ""
    pullPolicy: IfNotPresent

# --- Ingress ----------------------------------------------------------------
# Two routes on one host:
#   /            -> frontend (nginx-served static SPA)
#   /electric/   -> electric-sync:5133 (Electric SQL shape API)
#
# The /electric/ route is only useful AFTER the frontend image is rebuilt
# with VITE_ELECTRIC_URL=/electric/v1/shape (or an absolute URL pointing
# here). The PUBLISHED frontend image bakes localhost:5133, which won't
# reach anything in-cluster. See README "Known smells / follow-ups."
ingress:
  enabled: true
  className: ""           # e.g. "nginx" / "traefik", leave blank for cluster default
  host: openddil.local
  annotations: {}
  # Common annotations for cert-manager + body-size lift for shape responses:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls: []
  # tls:
  #   - hosts: [openddil.example.com]
  #     secretName: openddil-tls
