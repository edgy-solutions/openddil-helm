{{- /*
   tier-node.yaml — the TIER PRESENTATION NODE (ADR-0032 §d, Arc 1 Phase 3)

   Renders the full presentation kit per configured tier:
     postgres + schema-init + projector + restate + fusion + cm-service
     + electric + frontend + topaz (passive)

   NAMED TIER-AGNOSTICALLY ON PURPOSE. This is the generic recursive node's
   presentation kit (ADR-0033), attachable to any BROKER-BEARING tier at any
   depth. It is not an "edge" thing — in this deployment it happens to
   instantiate at the leaf tiers because those are the tiers configured with
   brokers and staffed with operators.

   WHY THIS EXISTS (ADR-0032, the reachback finding): every projector wrote
   to the ROOT store, so a tier had state (compacted topics) but no queryable
   surface over it, and its UI was served from and read from the root. The
   persona closest to the equipment had the stalest view of it, and lost it
   entirely under severance. This node closes that.

   ADDITIVE. Gated on .Values.tierNode.enabled (default false). Nothing here
   modifies the existing root-tier stack.

   ---- INTERIM BINDINGS (do not mistake for settled design) ----------------

   * ANALYTICS BINDINGS ARE INTERIM (ADR-0034 §Constraints). fusion and
     cm-service are wired here as hardcoded services. They are
     durable-workflow-class units by construction (per-key state + a cadence
     timer) and will be re-expressed as REGISTERED units bound by config —
     migrating ONTO configurable workflows, not off Restate.

   * THE UI IS INTERIM (ADR-0033 §Tier-parameterized presentation). The
     framework artifact is one presentation parameterized by tier, showing
     local truth + subtree rollup. What ships here is the current
     three-view SPA because nothing else exists to ship. It is legitimate as
     a demo shell; it is not the framework artifact. GD-04.

   * TREE-SHAPED CONFIG ONLY, not tree-shaped mechanism (ADR-0033 constraint
     5). Nothing here may assume strictly-tree data flow as an invariant.
*/}}
{{- if .Values.tierNode.enabled }}
{{- $root := . -}}
{{- $tn := .Values.tierNode -}}
{{- range .Values.edges }}
{{- $tier := . }}
{{- if or (not $tn.tiers) (has $tier.id $tn.tiers) }}
{{- /*
SCHEME MUST MATCH THE ROOT, and this fails the render rather than the login.

A tier served on a different scheme from the root gets a session cookie the
browser silently discards -- Secure on plain http, or a cross-scheme
SameSite rejection -- and the symptom is a login that "succeeds" and returns
to the login page with nothing logged anywhere to say why. It is
indistinguishable at the screen from a session bug, and it costs an hour.

Both hosts sit behind one ingress controller routing on Host header, so
there is no ordinary reason for them to differ. Checked only when OIDC is
on, because without it there is no cookie to lose.
*/ -}}
{{- if and $tier.publicOrigin $root.Values.releasability.oidc.enabled }}
{{- $tierHttps := hasPrefix "https://" $tier.publicOrigin }}
{{- $rootHttps := not (empty $root.Values.ingress.tls) }}
{{- if ne $tierHttps $rootHttps }}
{{- fail (printf "tier %s publicOrigin is %s but the root ingress is %s. A scheme mismatch loses the session cookie silently: the login redirects, the cookie is dropped, and the browser returns to the login page with no error. Set the tier's publicOrigin to %s, or give both hosts TLS." $tier.id (ternary "https" "http" $tierHttps) (ternary "https" "http" $rootHttps) (ternary "https://..." "http://..." $rootHttps)) }}
{{- end }}
{{- end }}
{{- $broker := printf "%s-redpanda-%s%s:%d" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) (int $root.Values.redpandaEdge.internalPort) }}
{{- $pgHost := printf "%s-tier-pg-%s%s" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) }}
{{- $dsn := printf "postgres://%s:%s@%s:%d/%s" $tn.postgres.auth.username $tn.postgres.auth.password $pgHost (int $tn.postgres.port) $tn.postgres.auth.database }}
---
# LOOP-BOUNDARY SEPARATOR — do not remove.
#
# The 19 objects below are separated from each other, but that only covers
# separators WITHIN one iteration. Without this one, the LAST object of tier N
# (the topaz Deployment) and the FIRST object of tier N+1 (the tier-pg Service)
# concatenate into a single YAML document with duplicate top-level keys, and
# last-wins silently swallows the Deployment for every tier except the last.
#
# The failure is invisible in `helm template | grep`: the raw text still
# contains both `kind:` lines, so only a real parse catches it. Observed as
# 3 topaz Services against 1 topaz Deployment. Guarded by the render audit in
# tests/test_tier_node_renders_against_overlay.py, which now asserts Service
# and workload counts match per component.
# ===========================================================================
# tier-pg-{{ $tier.id }} — the tier-local read model
# ===========================================================================
# The substrate the whole node exists for. Derived, NOT durable: this store is
# a projection, fully rebuildable from the tier's own compacted topics, so it
# gets no backup regime (ADR-0032 §d). Stated here so nobody later designs one
# for derived data.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-pg-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: {{ $tn.postgres.port }}
      targetPort: 5432
      name: postgres
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $root.Release.Name }}-tier-pg-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  serviceName: {{ $root.Release.Name }}-tier-pg-{{ $tier.id }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $tn.postgres.image.repository "tag" $tn.postgres.image.tag "root" $root) }}
          # wal_level=logical is REQUIRED, exactly as for postgres-hq
          # (infrastructure.yaml). tier-electric is an ElectricSQL instance
          # and refuses to start without it:
          #   [emergency] Electric requires wal_level >= logical
          # It then exits, so the symptom is a CrashLoopBackOff on electric
          # while postgres itself looks perfectly healthy — the failing pod
          # is not the misconfigured one.
          args: ["postgres", "-c", "wal_level=logical"]
          env:
            - name: POSTGRES_USER
              value: {{ $tn.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ $tn.postgres.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ $tn.postgres.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $tn.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $tn.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if $tn.postgres.useEmptyDir }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if not $tn.postgres.useEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $tn.postgres.storageClass }}
        storageClassName: {{ $tn.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $tn.postgres.storageSize }}
  {{- end }}

---
# ===========================================================================
# tier-schema-init-{{ $tier.id }} — IDENTICAL DDL to every other tier
# ===========================================================================
# ADR-0032 §b: every tier-local store is created with the FULL, IDENTICAL
# schema — not a per-tier subset. Content is edge-scoped by construction (a
# projector consuming only this tier's topics can only write this tier's
# rows); rollup tables simply sit empty here. Identical DDL is what keeps the
# read contract tier-INDEPENDENT, which is what lets ADR-0031's read seam be
# written once instead of per-tier. Empty tables cost ~nothing; schema
# variants cost permanently.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-tier-schema-init-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "stack/schema" "dst" "schema")
          ) "root" $root) | nindent 8 }}
        # WAIT HERE, NOT INSIDE atlas-apply.
        #
        # The arigaio/atlas image has no shell and no `nc` — its ENTRYPOINT
        # is the atlas binary itself. A wait loop in that container dies at
        # container init with:
        #   exec: "/bin/sh": stat /bin/sh: no such file or directory
        # which reads as a broken image rather than a wrong invocation.
        #
        # postgres-schema-init.yaml had already solved this and says so in
        # its comments. This template copied that Job's SHAPE and lost the
        # constraint — similarity is a code claim, not a deployment claim.
        # Blocking in a container that DOES have a shell is the fix, and the
        # postgres image is the natural one: it ships pg_isready, so the
        # check is a real readiness probe rather than a port knock.
        - name: wait-postgres
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $tn.postgres.image.repository "tag" $tn.postgres.image.tag "root" $root) }}
          resources:
            {{- toYaml $root.Values.jobs.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "waiting for tier store {{ $tier.id }} ..."
              until pg_isready -h {{ $pgHost }} -p {{ $tn.postgres.port }} -U {{ $tn.postgres.auth.username }} -d {{ $tn.postgres.auth.database }}; do
                sleep 2
              done
              echo "tier store {{ $tier.id }} accepting connections"
      containers:
        # Entrypoint IS the atlas binary, so `args:` carries only subcommand
        # arguments — no `command:` override, no shell.
        - name: atlas-apply
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.utilities.atlas.repository "tag" $root.Values.utilities.atlas.tag "root" $root) }}
          # Bounded, so an OOM cannot leave a tier DB half-migrated. The
          # root-tier Jobs have always had this; the tier Jobs did not.
          resources:
            {{- toYaml $root.Values.jobs.resources | nindent 12 }}
          args:
            - migrate
            - apply
            - --dir
            - "file:///bundle/schema/migrations"
            - --url
            - "{{ $dsn }}?sslmode=disable"
          volumeMounts:
            - name: bundle-shared
              mountPath: /bundle
      volumes:
        - name: bundle-shared
          emptyDir: {}

---
# ===========================================================================
# tier-projector-config-{{ $tier.id }} — TIER-SCOPED TOPIC SET
# ===========================================================================
# The third parameterization axis, exercised for the first time.
#
# The Arc 1 gate decomposed "the projector is tier-parameterizable" into three
# axes with three different evidentiary states: BROKER (already proven in
# production — four instances, different brokers), DSN (proven by the gate,
# the genuinely untested one), and TOPIC SET (mechanism exists via
# PROJECTOR_CONFIG, never turned — all four deployed projectors share one
# baked-in config listing 11 topics).
#
# This turns it. A tier subscribes to the topics its own broker actually
# carries and omits root-only rollups — which ALSO dissolves the
# UNKNOWN_TOPIC_OR_PART warning noise the gate observed: a tier that never
# lists rollup topics never warns about them. The noise was a symptom of the
# unturned knob, not a bug to suppress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-projector-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  projector_config.yaml: |
    # Tier-scoped projector mapping for {{ $tier.id }}.
    # Root-only rollup topics (region-fleet-summary, region-top-factors,
    # region-wear-trends) are deliberately ABSENT: they are produced by the
    # aggregator to the root broker and would never arrive here.
    settings:
      rate_limit_per_sec: 10
    mappings:
      - topic: telemetry-latest-state
        handler: telemetry_latest
        table: telemetry_latest_state
        consumer_group: tier-projector-telemetry-latest-{{ $tier.id }}
        decode_as: openddil.telemetry.v1.EntityTelemetryEvent
        mode: upsert
        asset_ttl_hours: 24
      - topic: asset-cm-state
        handler: cm_state
        table: asset_cm_state
        consumer_group: tier-projector-cm-state-{{ $tier.id }}
        decode_as: json
        mode: upsert
      - topic: asset-logistics-status
        handler: logistics_status
        table: asset_logistics_status
        consumer_group: tier-projector-logistics-status-{{ $tier.id }}
        decode_as: openddil.logistics.v1.AssetLogisticsStatusUpdate
        mode: upsert
        asset_ttl_hours: 24
      - topic: asset-capability-snapshot
        handler: capability_state
        table: asset_capability_state
        consumer_group: tier-projector-capability-{{ $tier.id }}
        decode_as: json
        mode: upsert
      - topic: asset-telemetry-windows
        handler: telemetry_windows
        table: asset_telemetry_windows
        consumer_group: tier-projector-windows-{{ $tier.id }}
        decode_as: json
        mode: upsert
      - topic: tactical-events
        handler: tactical_events
        table: tactical_events
        consumer_group: tier-projector-tactical-events-{{ $tier.id }}
        decode_as: cloudevents.json
        mode: append
      - topic: asset-element-telemetry
        handler: asset_element_telemetry
        table: asset_element_telemetry
        consumer_group: tier-projector-element-telemetry-{{ $tier.id }}
        decode_as: json
        mode: upsert
      - topic: asset-element-inventory
        handler: asset_element_inventory
        table: inventory_items
        consumer_group: tier-projector-element-inventory-{{ $tier.id }}
        decode_as: json
        mode: upsert

---
# ===========================================================================
# tier-restate-config-{{ $tier.id }} — this tier's broker ONLY
# ===========================================================================
# GATE FINDING (2026-08-08): Restate 1.6.x has NO POST /clusters admin
# endpoint — it returns 404, and a subscription naming an unknown cluster
# fails with "specified cluster in the source URI does not exist. Make sure
# it is defined in the KafkaOptions". Kafka clusters are SERVER CONFIG.
#
# So a per-tier Restate needs a per-tier config file naming its own broker,
# rendered by the chart rather than registered by a bootstrap API call. This
# was discovered by running the gate before templating; templating first
# would have discovered it as a broken deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-restate-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  restate.toml: |
    # Tier-scoped: names ONLY this tier's broker, so a subscription here
    # cannot accidentally resolve to a sibling tier's cluster.
    [[ingress.kafka-clusters]]
    name = "openddil-{{ $tier.id }}"
    brokers = ["{{ $broker }}"]

---
# ===========================================================================
# tier-restate-{{ $tier.id }} — durable-workflow substrate
# ===========================================================================
# Three legs justify this, not one (ADR-0032 §d):
#   1. detection today       — fusion + cm-service must compute at the tier
#                              that presents, or a severed tier shows
#                              position without judgement;
#   2. configurable analytics — ADR-0034's durable-workflow execution class;
#   3. sovereignty process workflows — a maintainer mid-procedure must not
#                              lose workflow state to a WAN drop. Locality
#                              (PRINCIPLES) applied to process execution.
#
# One substrate per tier serves two services today and the whole
# detection-plus-workflow plane tomorrow.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-restate-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: ingress
    - port: 9070
      name: admin
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $root.Release.Name }}-tier-restate-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  serviceName: {{ $root.Release.Name }}-tier-restate-{{ $tier.id }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 8 }}
      annotations:
        checksum/restate-config: {{ printf "%s-%s" $tier.id $broker | sha256sum }}
    spec:
      containers:
        - name: restate
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.restate.image.repository "tag" $root.Values.restate.image.tag "root" $root) }}
          # PROVISION-TIME ONLY — see values.yaml tierNode.restate. This flag
          # affects the INITIAL partition count and cannot be changed after
          # first boot, so it is a template parameter rather than a knob.
          args:
            - "--default-num-partitions"
            - {{ $tn.restate.defaultNumPartitions | quote }}
          env:
            - name: RESTATE_CONFIG
              value: /config/restate.toml
          ports:
            - containerPort: 8080
            - containerPort: 9070
          resources:
            {{- toYaml $tn.restate.resources | nindent 12 }}
          volumeMounts:
            - name: restate-config
              mountPath: /config
            - name: data
              mountPath: /restate-data
      volumes:
        - name: restate-config
          configMap:
            name: {{ $root.Release.Name }}-tier-restate-config-{{ $tier.id }}
        {{- if $tn.restate.useEmptyDir }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if not $tn.restate.useEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $tn.restate.storageSize }}
  {{- end }}

---
# ===========================================================================
# tier-projector-{{ $tier.id }} — reads THIS tier, writes THIS tier
# ===========================================================================
# The reachback closed in one object: KAFKA_BROKERS and POSTGRES_DSN both
# point at this tier. Previously the second pointed at the root, which is why
# a tier had no queryable surface over its own data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-projector-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-projector-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-projector-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-projector-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: projector
          image: {{ include "openddil.image" (dict "name" $root.Values.projector.image.name "tag" $root.Values.projector.image.tag "digest" $root.Values.projector.image.digest "root" $root) }}
          env:
            - name: KAFKA_BROKERS
              value: {{ $broker | quote }}
            - name: POSTGRES_DSN
              value: {{ $dsn | quote }}
            # PACKAGING NOTE (gate finding): the image's default config path
            # is /app/src/config/projector_config.yaml. A tier-scoped config
            # MUST be pointed at explicitly — running without this silently
            # falls back to the baked-in 11-topic root config.
            - name: PROJECTOR_CONFIG
              value: /tier-config/projector_config.yaml
            - name: OPENDDIL_EDGE_ID
              value: {{ $tier.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $tier.region | quote }}
            # SEVERANCE-INDICATOR INVERSION (ADR-0032 §f), and it needs no
            # schema change — only this tier's broker.
            #
            # The monitor writes a singleton row id='edge' to
            # edge_buffer_status. At the ROOT that was one global row: HQ's
            # view of an edge, observed centrally, and unavailable to the
            # edge when the edge most needed it. Here each tier has its OWN
            # store, so the singleton row per store IS that tier's own
            # uplink state — "my data is current, my uplink is down, N
            # events are buffered."
            #
            # The lag probe reads THIS tier's broker, so it keeps working
            # while severed, which is the whole point.
            - name: BUFFER_MONITOR_ENABLED
              value: "true"
            # Per-tier group name — see the identical fix in edge.yaml for why
            # the bare "bridge-group" default is a silent zero rather than an
            # error. This line previously carried that default verbatim.
            - name: BRIDGE_CONSUMER_GROUP
              value: "bridge-group-{{ $tier.id }}"
            - name: TOXIPROXY_API_URL
              value: {{ printf "http://%s-toxiproxy%s:8475" $root.Release.Name (include "openddil.svcDomain" $root) | quote }}
            - name: HQ_LINK_PROXY
              value: "hq-link"
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml $root.Values.projector.resources | nindent 12 }}
          volumeMounts:
            - name: tier-projector-config
              mountPath: /tier-config
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
      volumes:
        - name: tier-projector-config
          configMap:
            name: {{ $root.Release.Name }}-tier-projector-config-{{ $tier.id }}
        - name: bundle-shared
          emptyDir: {}

---
# ===========================================================================
# tier-electric-{{ $tier.id }} — streams the TIER store to the TIER UI
#
# That heading was ASPIRATIONAL until 2026-09-05 and is now true. Until then
# the tier UI reached `electric-sync`, the root's alias Service, because the
# env var meant to point it here was read by nothing (UD-9). Two comments on
# one path both asserted a property the deployment did not have.
# ===========================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-electric-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-electric-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      containers:
        - name: electric
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.electric.image.repository "tag" $root.Values.electric.image.tag "root" $root) }}
          env:
            - name: DATABASE_URL
              value: {{ printf "%s?sslmode=disable" $dsn | quote }}
            - name: ELECTRIC_INSECURE
              value: "true"
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml $root.Values.electric.resources | nindent 12 }}

---
# ===========================================================================
# tier-frontend-{{ $tier.id }} — SERVED LOCALLY (ADR-0032 §e)
# ===========================================================================
# A bundle fetched from the parent tier cannot LOAD during severance. An
# already-open tab might survive on cache; a reload, a new tab, or a shift
# change gets nothing. "Works only if you loaded it before the link dropped"
# is luck with a good story, not severance tolerance.
#
# *** INTERIM (GD-04) *** — what ships is the current three-view SPA, because
# nothing else exists to ship. The framework artifact is ONE presentation
# parameterized by tier (local truth + subtree rollup); this is the demo
# instantiation serving in its slot. See ADR-0033
# §Tier-parameterized presentation.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-frontend-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-frontend-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "openddil.image" (dict "name" $root.Values.frontend.image.name "tag" $root.Values.frontend.image.tag "digest" $root.Values.frontend.image.digest "root" $root) }}
          env:
            # WHERE THE BROWSER'S READ PATH GOES, and it is an nginx upstream
            # rather than an application setting — deliberately.
            #
            # UD-9: this block previously set `ELECTRIC_URL`, with a comment
            # citing the ADR-0032 §e corollary, and NOTHING READ IT. The
            # application's ELECTRIC_URL is a Vite BUILD-TIME constant baked
            # into the bundle; a container env var cannot reach it. nginx
            # defaulted its upstream to `electric-sync` — the ROOT's alias
            # Service — so every tier's UI read the ROOT's store while this
            # comment asserted tier-locality. No error at any layer.
            #
            # These two names ARE read: 40-resolver.sh substitutes them into
            # nginx.conf at container start and FAILS if any placeholder
            # survives. That is the difference between a setting and a claim.
            - name: OPENDDIL_ELECTRIC_UPSTREAM
              value: {{ include "openddil.tierReadUpstream" (dict "tier" $tier "root" $root) | quote }}
            - name: OPENDDIL_ELECTRIC_PORT
              value: {{ include "openddil.tierReadPort" (dict "tier" $tier "root" $root) | quote }}
            {{- if $root.Values.releasability.enabled }}
            - name: OPENDDIL_PEP_UPSTREAM
              value: {{ printf "%s-tier-pep-%s" $root.Release.Name $tier.id | quote }}
            {{- end }}
          volumeMounts:
            # The tier's identity, delivered on the channel that actually
            # works: a file the application FETCHES at startup. One image,
            # zero tier knowledge at build time, tier identity supplied
            # entirely at deploy time.
            - name: deployment-config
              mountPath: /usr/share/nginx/html/deployment
          ports:
            - containerPort: 80
          resources:
            {{- toYaml $root.Values.frontend.resources | nindent 12 }}
      volumes:
        - name: deployment-config
          configMap:
            name: {{ $root.Release.Name }}-tier-frontend-config-{{ $tier.id }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-frontend-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  # THE TIER PARAMETER. Fetched by the app at startup from
  # /deployment/deployment.json — the same channel that already carried
  # branding and FOB topology, which is why this needed no new mechanism.
  #
  # SHAPE, NOT NAME. Nothing downstream branches on `id`: `has_children` and
  # `parent` select the panels, so a fourth tier resolves by shape with no
  # code change. `id` is display and correlation only.
  #
  # `scope` is null because a tier node reads its OWN store, which holds its
  # subtree and nothing else — scoping it again would be filtering a set by
  # a property every member already has. Explicit null rather than omitted:
  # the parser REJECTS an omitted scope, because omission reads as an
  # oversight and an unscoped read at a tier WITH children would show the
  # whole subtree under a leaf's label.
  deployment.json: |
    {
      "title": {{ $root.Values.frontend.title | default "OpenDDIL" | quote }},
      "tier": {
        "id": {{ $tier.id | quote }},
        "label": {{ $tier.label | default $tier.id | quote }},
        "scope": null,
        "has_children": {{ $tier.hasChildren | default false }},
        {{- /* An edge's parent IS its region, and `edges[].region` already
               says so — so the existing topology list describes the tree
               and no new configuration is needed for the common case.
               `parent` overrides it for a tier that is not an edge. */}}
        "parent": {{ with (or $tier.parent $tier.region) }}{{ . | quote }}{{ else }}null{{ end }}
      }
    }
{{- if $root.Values.releasability.enabled }}
---
# ===========================================================================
# tier-pep-{{ $tier.id }} — THIS TIER'S read-path enforcement point
# ===========================================================================
# Slice 1 shipped ONE PEP, at the root, and one NetworkPolicy naming the
# root's Electric. A tier node's read path was therefore unauthenticated AND
# (per UD-9) reading the root's store — the two defects composing into the
# worst available combination, which is why they are fixed together.
#
# ITEMS 2 AND 3 OF THE CHART DELTA LAND TOGETHER OR THE TIER IS WORSE THAN
# BEFORE. Pointing the tier's nginx at a PEP that does not exist breaks the
# UI; deploying a tier PEP without repointing nginx leaves the bypass open.
# Both come from `openddil.tierReadUpstream`, so they cannot disagree.
#
# THE PDP IS STILL THE ROOT'S TOPAZ. Per-tier local authorizers are ADR-0029
# §6's architecture and land with the tier-bridge slice; Slice 1's scope
# decision stands. So this tier ENFORCES locally and DECIDES remotely, and
# under severance it fails CLOSED — which is correct, and is NOT the
# capstone. Do not record a severance demo against this and call it
# tier-local authorization: the read path is tier-local, the decision is not.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-pep-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-pep-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  # One replica, and the reason is an authorization property rather than a
  # capacity one: shape-handle bindings and sessions are in-memory, so a
  # second replica would refuse valid resumptions. Failing closed is the
  # right direction; scaling out needs shared storage.
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 8 }}
      annotations:
        openddil.io/policy-revision: {{ $root.Release.Revision | quote }}
    spec:
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/gateway" "dst" "app")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: pep
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.pep.image.repository "tag" $root.Values.releasability.pep.image.tag "digest" $root.Values.releasability.pep.image.digest "root" $root) }}
          command: ["python", "-u", "/app/pep.py"]
          env:
            # THIS TIER'S Electric, which is the whole point.
            - name: OPENDDIL_ELECTRIC_URL
              value: {{ printf "http://%s-tier-electric-%s%s:3000" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            # THIS TIER'S OWN PDP — and this line is the difference between a
            # degraded mode and an outage.
            #
            # Pointing a tier's PEP at the ROOT's Topaz made the read path
            # SEVERANCE-INTOLERANT: cut the uplink and the PEP cannot reach
            # its decision point, so it fails closed — correctly, loudly, with
            # the marker — and the maintainer UI at a severed edge shows
            # DENIED instead of data.
            #
            # That is ADR-0036 clause 4 violated BY THE ENFORCEMENT POINT: a
            # severed tier is supposed to degrade, not stop. And it regressed
            # a capability that already worked — Phase 5 rung (iii), "the tier
            # UI live while severed", could no longer be demonstrated with
            # enforcement on, because the enforcement was the thing going
            # dark.
            #
            # With the tier's own authorizer, fail-closed regains its correct
            # meaning: "MY OWN PDP is down", which is a real local fault,
            # rather than "the link is cut", which is a mode this system is
            # built to survive.
            - name: OPENDDIL_TOPAZ_URL
              value: {{ printf "http://%s-tier-topaz-%s%s:8383" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: OPENDDIL_PEP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ $root.Values.releasability.pep.logLevel | quote }}
            {{- if and $root.Values.releasability.oidc.enabled $tier.publicOrigin }}
            # AUTH CLIENT PER TIER (chart delta item 4). A redirect URI is
            # per host, so a tier reached at its own hostname needs its own
            # confidential client and its own EXACT redirect URI. Configured
            # only when the tier declares a public origin; a tier without one
            # is reachable in-cluster and runs in header mode, which the PEP
            # announces at boot rather than leaving to be inferred.
            - name: OPENDDIL_OIDC_ISSUER
              value: {{ include "openddil.keycloakIssuer" $root | quote }}
            - name: OPENDDIL_OIDC_INTERNAL_ISSUER
              value: {{ printf "http://%s-keycloak%s:8080%s/realms/%s" $root.Release.Name (include "openddil.svcDomain" $root) ($root.Values.releasability.keycloak.basePath | trimSuffix "/") $root.Values.releasability.keycloak.realm | quote }}
            - name: OPENDDIL_OIDC_CLIENT_ID
              # Same helper the Keycloak realm renders its clients from, so
              # the id the PEP presents and the id the realm defines cannot
              # drift apart. See openddil.tierClientId.
              value: {{ include "openddil.tierClientId" (dict "id" $tier.id "root" $root) | quote }}
            - name: OPENDDIL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-pep-oidc
                  key: client-secret
            - name: OPENDDIL_OIDC_REDIRECT_URI
              value: {{ printf "%s/auth/callback" ($tier.publicOrigin | trimSuffix "/") | quote }}
            - name: OPENDDIL_SESSION_TTL_SECONDS
              value: {{ $root.Values.releasability.oidc.sessionTtlSeconds | quote }}
            - name: OPENDDIL_COOKIE_SAMESITE
              value: {{ $root.Values.releasability.oidc.cookieSameSite | quote }}
            - name: OPENDDIL_COOKIE_SECURE
              # WAS NOT SET AT ALL, and the PEP defaults it to false — so a
              # tier served over HTTPS emitted session cookies WITHOUT the
              # Secure flag while the root, deriving from its own ingress,
              # set it correctly. Not a login failure; a quiet weakening
              # that only appears on the deployments that took the trouble
              # to configure TLS.
              #
              # Derived from the TIER's own origin. The failure in the other
              # direction is louder and stranger: Secure on plain HTTP means
              # the browser accepts the redirect, drops the cookie, and
              # returns the user to a login page with nothing logged
              # anywhere to say why.
              value: {{ include "openddil.tierCookieSecure" (dict "origin" $tier.publicOrigin) | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.releasability.pep.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app
              subPath: app
      volumes:
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.pep.appVolumeSize }}
{{- if $root.Values.releasability.lockDownElectric }}
---
# BYPASS PREVENTION AT THE TIER. Slice 1's policy named the ROOT's
# electric-sync and left every tier's Electric uncovered — so a tier node
# was, until this, protected by nothing at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-tier-electric-pep-only-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
{{- end }}
{{- if $tier.publicOrigin }}
---
# INGRESS PER TIER HOST (chart delta item 5) — each tier is a URL.
#
# That is not packaging: it is what makes the tab switcher unnecessary. A
# tier's UI is reached at the tier's own endpoint, so "which view" stops
# being a control on the page and becomes a fact about where you connected.
# It is also what the per-tier auth client needs, since a redirect URI is
# per host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Release.Name }}-tier-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  {{- with $root.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $tier.publicOrigin | trimPrefix "https://" | trimPrefix "http://" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Release.Name }}-tier-frontend-{{ $tier.id }}
                port:
                  number: 80
{{- end }}
---
# ===========================================================================
# tier-fusion-{{ $tier.id }} / tier-cm-{{ $tier.id }} — DETECTION AT THE TIER
# ===========================================================================
# The reason the (a) decision was taken. Before this, both services ran ONCE
# at the root and reached DOWN into child brokers, so a severed tier computed
# no severity and no CM state at all — the presentation plane's reachback
# finding repeated one plane over. Now each computes at the tier that
# presents, and publishes to that tier's own broker where the tier projector
# can read it.
#
# Both are Restate Virtual Objects, which is why the tier needed the durable
# substrate above. Both ran UNMODIFIED against a tier-scoped Restate in the
# Arc 1 gate — zero application code changed.
#
# *** INTERIM BINDING (GD-07 / ADR-0034 §Constraints) *** — wired here as
# hardcoded services. They are durable-workflow-class by construction and
# will be re-expressed as REGISTERED units bound by config, migrating ONTO
# configurable workflows rather than off Restate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-fusion-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/ontology" "dst" "ontology")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: logistics-fusion
          image: {{ include "openddil.image" (dict "name" $root.Values.logisticsFusion.image.name "tag" $root.Values.logisticsFusion.image.tag "digest" $root.Values.logisticsFusion.image.digest "root" $root) }}
          env:
            # Produces to THIS tier's broker. This single value is what makes
            # severity reachable by a tier-local projector.
            - name: FUSION_KAFKA_BROKERS
              value: {{ $broker | quote }}
            - name: FUSION_HTTP_PORT
              value: "9081"
            - name: ONTOLOGY_DIR
              value: /ontology
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 9081
          resources:
            {{- toYaml $root.Values.logisticsFusion.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-fusion-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 9081
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-cm-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      initContainers:
        # GATE FINDING: cm-service needs BOTH the proto mount (+PYTHONPATH)
        # and a BASELINES mount. The baselines are load-bearing, not
        # decoration — without them the service produces meaningless CM
        # output. Its deployment surface diverged from fusion's even though
        # the two are structural twins at the code layer.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/baselines" "dst" "baselines")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: cm-service
          image: {{ include "openddil.image" (dict "name" $root.Values.cmService.image.name "tag" $root.Values.cmService.image.tag "digest" $root.Values.cmService.image.digest "root" $root) }}
          env:
            - name: CM_KAFKA_BROKERS
              value: {{ $broker | quote }}
            - name: CM_HTTP_PORT
              value: "9080"
            - name: CM_BASELINES_DIR
              value: /baselines
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 9080
          resources:
            {{- toYaml $root.Values.cmService.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /baselines
              subPath: baselines
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-cm-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 9080
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 4 }}

---
# ===========================================================================
# tier-restate-bootstrap-{{ $tier.id }} — register services + subscriptions
# ===========================================================================
# Restate does not discover services; they must be registered, and their Kafka
# subscriptions created, against THIS tier's Restate. The sequence below is
# exactly the one proven in the Arc 1 gate.
#
# The cluster name matches the tier-restate ConfigMap above. A subscription
# whose source URI names a cluster absent from Restate's SERVER CONFIG fails
# with "specified cluster in the source URI does not exist" — which is why the
# cluster is rendered into restate.toml rather than POSTed here. There is no
# POST /clusters endpoint on 1.6.x.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-tier-restate-bootstrap-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # ---------------------------------------------------------------------
      # WAS A SHELL SCRIPT POSTING `curl` PER SUBSCRIPTION (UD-12).
      # ---------------------------------------------------------------------
      # That script was a second implementation of what
      # `openddil_bootstrap.restate_subscriptions` already did for the root,
      # and it lost the part that mattered: the dedup pre-check. Restate 1.6
      # answers a duplicate POST with 200, so every helm upgrade added
      # another copy of all seven subscriptions. Measured here after two
      # upgrades: 14 subscriptions over 7 distinct triples, every one
      # duplicated x2, output still correct, nothing reporting it.
      #
      # It is now the same program the root runs, which is the actual fix --
      # the tier is not a different kind of node, so its bootstrap is not a
      # different kind of program. It also prunes, so a subscription
      # retired from the desired set is deleted rather than merely not
      # re-created.
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/bootstrap" "dst" "openddil_bootstrap")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "openddil.image" (dict "name" $root.Values.cmService.image.name "tag" $root.Values.cmService.image.tag "digest" $root.Values.cmService.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.cmService.image.pullPolicy "root" $root) }}
          command: ["python", "-u", "/app/openddil_bootstrap/register_tier_subscriptions.py"]
          env:
            - name: TIER_ID
              value: {{ $tier.id | quote }}
            - name: RESTATE_ADMIN_URL
              value: {{ printf "http://%s-tier-restate-%s%s:9070" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: TIER_CM_ENDPOINT
              value: {{ printf "http://%s-tier-cm-%s%s:9080" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: TIER_FUSION_ENDPOINT
              value: {{ printf "http://%s-tier-fusion-%s%s:9081" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: PYTHONPATH
              value: "/app"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml $root.Values.jobs.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app/openddil_bootstrap
              subPath: openddil_bootstrap
      volumes:
        - name: bundle-shared
          emptyDir: {}

{{- if $tn.topaz.enabled }}
---
# ===========================================================================
# tier-topaz-{{ $tier.id }} — RESERVED SEAT. Arc 2's landing zone.
# ===========================================================================
# DEFAULT OFF, and the honest description is "not yet runnable" rather than
# the "deployed, healthy, deciding nothing" this comment used to claim.
#
# That claim was never tested, because a missing YAML separator meant this
# Deployment was discarded at render time for every tier but the last. The
# first render that produced it showed `args: ["run"]` is not a runnable
# topaz — it exits with `required flag(s) "config-file" not set`. A component
# that never rendered could not reveal that it also never worked; two
# defects, one hiding the other.
#
# Enabling it is Arc 2 work: a config ConfigMap, a --config-file argument,
# and a pinned image tag. See values.yaml tierNode.topaz.
#
# The intent is unchanged and still good: shipping the seat means Arc 2
# (ADR-0029) adds RULES to a deployed component rather than adding a
# COMPONENT under enforcement pressure. It is
# also the per-tier local authorizer the architecture requires — decisions
# local, so a severed tier still decides, and (ADR-0033 §Lateral peer
# topology) a peer request is answered from the RESPONDING tier's own policy
# with no reachback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-topaz-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  # Minimal config, VERIFIED against topazd 0.33.16 by running it. Two keys
  # that appear in the published docs and the online JSON schema are REJECTED
  # by this build — `plugins` and `decision_logger` both fail startup with
  # "'config.Config' has invalid keys". Consequence: DECISION LOGGING IS NOT
  # CONFIGURED HERE and remains unproven; ADR-0029's auditability requirement
  # ("every decision records the policy version that produced it") is an open
  # item for Arc 2, not something this seat currently satisfies.
  config.yaml: |
    version: 2
    logging:
      prod: true
      log_level: info
    directory:
      db_path: /db/tier-{{ $tier.id }}.db
      request_timeout: 5s
    api:
      health:
        listen_address: "0.0.0.0:9494"
      services:
        authorizer:
          grpc:
            connection_timeout_seconds: 2
            listen_address: "0.0.0.0:8282"
          gateway:
            listen_address: "0.0.0.0:8383"
            # Plaintext inside the cluster; the tier's mesh boundary is the
            # trust boundary. Revisit with mTLS when Arc 2 lands.
            http: true
    opa:
      instance_id: openddil-tier-{{ $tier.id }}
      graceful_shutdown_period_seconds: 2
      local_bundles:
        paths:
          - /policy
        skip_verification: true

  # EMPTY BUNDLE — a valid bundle root with no policy in it.
  #
  # This is what makes "deployed, healthy, deciding nothing" TRUE rather than
  # aspirational: the authorizer runs, serves, and answers nothing because it
  # has been given nothing to answer with. Arc 2 (ADR-0029) adds rules to a
  # component that is already deployed and verified, which was the whole
  # argument for shipping the seat early.
  #
  # Policy CONTENT deliberately does not live here — it is Arc 2's, and it
  # belongs in a deployment's own overlay rather than baked into the chart.
  #
  # roots must NAME the namespace even when nothing occupies it. `{"roots":
  # []}` is not an empty bundle, it is an invalid one — OPA refuses it with
  #   manifest roots [] do not permit data at path '/'
  # and topazd exits. Declaring `openddil` reserves the namespace Arc 2 will
  # fill while permitting the bundle to contain nothing today.
  .manifest: |
    {"roots": ["openddil"]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-topaz-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8282
      name: grpc
    - port: 8383
      name: authz-http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-topaz-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- if $root.Values.releasability.enabled }}
      # THE SEAT IS OCCUPIED. Until 2026-09-05 this Topaz loaded an EMPTY
      # bundle — running, healthy, and deciding nothing, which was honest and
      # was the whole point of shipping the seat early (ADR-0029 Phase 3).
      #
      # It is filled by the SAME distribution seam the root's authorizer
      # uses: the runtime bundle, pulled at pod start. That is ADR-0029 §6's
      # model exactly — "policy distributed as versioned bundles", each tier
      # deciding against its own copy, a severed link stopping policy UPDATES
      # rather than decisions. A tier running yesterday's bundle through a
      # severance window is a correct and acceptable posture, and it is
      # auditable because every decision records the policy and corpus
      # versions that produced it.
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/policy/.manifest"          "dst" "policy/.manifest")
            (dict "src" "demo/policy/releasability.rego" "dst" "policy/releasability.rego")
          ) "root" $root) | nindent 8 }}
        - name: policy-loader
          image: {{ include "openddil.image" (dict "name" $root.Values.bundle.image.name "tag" $root.Values.bundle.image.tag "digest" $root.Values.bundle.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.bundle.image.pullPolicy "root" $root) }}
          env:
            - name: OPENDDIL_POLICY_VARIANT
              value: {{ $root.Values.releasability.policyVariant | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              src="/bundle/demo/policy/${OPENDDIL_POLICY_VARIANT}.yaml"
              # A missing variant would leave an EMPTY data document, and an
              # empty corpus is a working authorizer that denies everyone —
              # indistinguishable from a correctly-enforced revocation and
              # arriving with no error.
              if [ ! -f "$src" ]; then
                echo "FATAL: no entitlements corpus at $src" >&2
                ls /bundle/demo/policy/*.yaml >&2
                exit 1
              fi
              mkdir -p /shared/policy/openddil
              cp "$src" /shared/policy/openddil/data.yaml
              echo "tier {{ $tier.id }} corpus: ${OPENDDIL_POLICY_VARIANT}.yaml"
          resources:
            {{- toYaml $root.Values.bundle.initResources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /shared
      {{- end }}
      containers:
        - name: topaz
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $tn.topaz.image.repository "tag" $tn.topaz.image.tag "root" $root) }}
          # THE PROVEN INVOCATION — established by running the image, not
          # inferred. `args: ["run"]` alone exits immediately with
          #   required flag(s) "config-file" not set
          # `topazd run --help` (read from inside the image) gives the real
          # contract: -c/--config-file, and -b/--bundle for local policy roots.
          args: ["run", "--config-file", "/config/config.yaml"]
          ports:
            - containerPort: 8282
              name: grpc
            - containerPort: 8383
              name: authz-http
            - containerPort: 9494
              name: health
          # TCP, not HTTP. Topaz's health service on 9494 speaks the gRPC
          # health protocol — an HTTP GET against it never becomes ready, and
          # the pod sits 0/1 forever while the logs say every server started.
          # A TCP probe on the authorizer's own gRPC port is true by
          # construction: the port is open exactly when the service is
          # listening. Upgrade to a grpc: probe if a richer signal is wanted.
          readinessProbe:
            tcpSocket: { port: 8282 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $tn.topaz.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $root.Values.releasability.enabled }}
            # The real bundle, from the shared emptyDir the init containers
            # filled. Replaces the ConfigMap's empty `.manifest`.
            - name: bundle-shared
              mountPath: /policy
              subPath: policy
            {{- else }}
            # subPath -> a REAL FILE. A whole-ConfigMap mount produces a
            # symlink farm (..data -> ..<timestamp>/) and OPA's bundle loader
            # walks real directory entries.
            - name: policy
              mountPath: /policy/.manifest
              subPath: .manifest
            {{- end }}
            - name: db
              mountPath: /db
      volumes:
        - name: config
          configMap:
            name: {{ $root.Release.Name }}-tier-topaz-config-{{ $tier.id }}
        {{- if $root.Values.releasability.enabled }}
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.topaz.policyVolumeSize }}
        {{- else }}
        - name: policy
          configMap:
            name: {{ $root.Release.Name }}-tier-topaz-config-{{ $tier.id }}
        {{- end }}
        - name: db
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.topaz.dbVolumeSize }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}
