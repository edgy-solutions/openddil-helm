{{- /*
   tier-node.yaml — the TIER PRESENTATION NODE (ADR-0032 §d, Arc 1 Phase 3)

   Renders the full presentation kit per configured tier:
     postgres + schema-init + projector + restate + fusion + cm-service
     + electric + frontend + topaz (passive)

   NAMED TIER-AGNOSTICALLY ON PURPOSE. This is the generic recursive node's
   presentation kit (ADR-0033), attachable to any BROKER-BEARING tier at any
   depth. It is not an "edge" thing — in this deployment it happens to
   instantiate at the leaf tiers because those are the tiers configured with
   brokers and staffed with operators.

   WHY THIS EXISTS (ADR-0032, the reachback finding): every projector wrote
   to the ROOT store, so a tier had state (compacted topics) but no queryable
   surface over it, and its UI was served from and read from the root. The
   persona closest to the equipment had the stalest view of it, and lost it
   entirely under severance. This node closes that.

   ADDITIVE. Gated on .Values.tierNode.enabled (default false). Nothing here
   modifies the existing root-tier stack.

   ---- INTERIM BINDINGS (do not mistake for settled design) ----------------

   * ANALYTICS BINDINGS ARE INTERIM (ADR-0034 §Constraints). fusion and
     cm-service are wired here as hardcoded services. They are
     durable-workflow-class units by construction (per-key state + a cadence
     timer) and will be re-expressed as REGISTERED units bound by config —
     migrating ONTO configurable workflows, not off Restate.

   * THE UI IS INTERIM (ADR-0033 §Tier-parameterized presentation). The
     framework artifact is one presentation parameterized by tier, showing
     local truth + subtree rollup. What ships here is the current
     three-view SPA because nothing else exists to ship. It is legitimate as
     a demo shell; it is not the framework artifact. GD-04.

   * TREE-SHAPED CONFIG ONLY, not tree-shaped mechanism (ADR-0033 constraint
     5). Nothing here may assume strictly-tree data flow as an invariant.
*/}}
{{- include "openddil.cmReportsFaultCodesGuard" . }}
{{- if .Values.tierNode.enabled }}
{{- $root := . -}}
{{- $tn := .Values.tierNode -}}
{{- /* RANGES OVER TIERS, NOT EDGES.

     This loop read `.Values.edges`, which made a REGION structurally
     incapable of being a tier node — regions live in `.Values.regions` and
     never entered it. The fourth-tier render check passed by injecting a
     synthetic entry into `edges`, so it validated shape resolution and was
     later cited for deployability it never tested.

     `openddil.tierList` composes edges and regions into one list with an
     explicit `kind` and `parent`. Nothing else in the chart changes; this is
     a third view over declarations that already existed. */ -}}
{{- $tiers := include "openddil.tierList" . | fromYamlArray }}
{{- range $tier := $tiers }}
{{- if or (not $tn.tiers) (has $tier.id $tn.tiers) }}
{{- /*
SCHEME MUST MATCH THE ROOT, and this fails the render rather than the login.

A tier served on a different scheme from the root gets a session cookie the
browser silently discards -- Secure on plain http, or a cross-scheme
SameSite rejection -- and the symptom is a login that "succeeds" and returns
to the login page with nothing logged anywhere to say why. It is
indistinguishable at the screen from a session bug, and it costs an hour.

Both hosts sit behind one ingress controller routing on Host header, so
there is no ordinary reason for them to differ. Checked only when OIDC is
on, because without it there is no cookie to lose.
*/ -}}
{{- if and $tier.publicOrigin $root.Values.releasability.oidc.enabled }}
{{- $tierHttps := hasPrefix "https://" $tier.publicOrigin }}
{{- $rootHttps := not (empty $root.Values.ingress.tls) }}
{{- if ne $tierHttps $rootHttps }}
{{- fail (printf "tier %s publicOrigin is %s but the root ingress is %s. A scheme mismatch loses the session cookie silently: the login redirects, the cookie is dropped, and the browser returns to the login page with no error. Set the tier's publicOrigin to %s, or give both hosts TLS." $tier.id (ternary "https" "http" $tierHttps) (ternary "https" "http" $rootHttps) (ternary "https://..." "http://..." $rootHttps)) }}
{{- end }}
{{- end }}
{{- $broker := printf "%s-redpanda-%s%s:%d" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) (int $root.Values.redpandaEdge.internalPort) }}
{{- $pgHost := printf "%s-tier-pg-%s%s" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) }}
{{- $dsn := printf "postgres://%s:%s@%s:%d/%s" $tn.postgres.auth.username $tn.postgres.auth.password $pgHost (int $tn.postgres.port) $tn.postgres.auth.database }}
---
# LOOP-BOUNDARY SEPARATOR — do not remove.
#
# The 19 objects below are separated from each other, but that only covers
# separators WITHIN one iteration. Without this one, the LAST object of tier N
# (the topaz Deployment) and the FIRST object of tier N+1 (the tier-pg Service)
# concatenate into a single YAML document with duplicate top-level keys, and
# last-wins silently swallows the Deployment for every tier except the last.
#
# The failure is invisible in `helm template | grep`: the raw text still
# contains both `kind:` lines, so only a real parse catches it. Observed as
# 3 topaz Services against 1 topaz Deployment. Guarded by the render audit in
# tests/test_tier_node_renders_against_overlay.py, which now asserts Service
# and workload counts match per component.
# ===========================================================================
# tier-pg-{{ $tier.id }} — the tier-local read model
# ===========================================================================
# The substrate the whole node exists for. Derived, NOT durable: this store is
# a projection, fully rebuildable from the tier's own compacted topics, so it
# gets no backup regime (ADR-0032 §d). Stated here so nobody later designs one
# for derived data.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-pg-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: {{ $tn.postgres.port }}
      targetPort: 5432
      name: postgres
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $root.Release.Name }}-tier-pg-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  serviceName: {{ $root.Release.Name }}-tier-pg-{{ $tier.id }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pg-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "openddil.thirdPartyImage" $tn.postgres.image }}
          # wal_level=logical is REQUIRED, exactly as for postgres-hq
          # (infrastructure.yaml). tier-electric is an ElectricSQL instance
          # and refuses to start without it:
          #   [emergency] Electric requires wal_level >= logical
          # It then exits, so the symptom is a CrashLoopBackOff on electric
          # while postgres itself looks perfectly healthy — the failing pod
          # is not the misconfigured one.
          args: ["postgres", "-c", "wal_level=logical"]
          env:
            - name: POSTGRES_USER
              value: {{ $tn.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ $tn.postgres.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ $tn.postgres.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $tn.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $tn.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if $tn.postgres.useEmptyDir }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if not $tn.postgres.useEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $tn.postgres.storageClass }}
        storageClassName: {{ $tn.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $tn.postgres.storageSize }}
  {{- end }}

---
# ===========================================================================
# tier-schema-init-{{ $tier.id }} — IDENTICAL DDL to every other tier
# ===========================================================================
# ADR-0032 §b: every tier-local store is created with the FULL, IDENTICAL
# schema — not a per-tier subset. Content is edge-scoped by construction (a
# projector consuming only this tier's topics can only write this tier's
# rows); rollup tables simply sit empty here. Identical DDL is what keeps the
# read contract tier-INDEPENDENT, which is what lets ADR-0031's read seam be
# written once instead of per-tier. Empty tables cost ~nothing; schema
# variants cost permanently.
#
# HOOK PHASE CHOSEN AT RENDER TIME, PER TIER, NOT HARD-CODED:
#   install            -> post-install
#   existing backend   -> pre-upgrade   (runs before Helm applies this
#                          release's updated StatefulSets, so the old tier
#                          pods are still the ones serving traffic when this
#                          Job executes -- a tier projector that needs a new
#                          table never gets the chance to start first and
#                          fail against a store that doesn't carry it yet.
#                          Constraint that comes with it: every migration
#                          applied here must be expand-only for one release,
#                          same as postgres-schema-init.yaml)
#   new backend        -> post-upgrade  (a pre-upgrade hook against a
#                          postgres StatefulSet that does not exist yet would
#                          fail this hook, and a failed hook fails the whole
#                          release -- see the atlas-apply note below for why
#                          that case cannot instead be a runtime no-op)
# tier-restate-bootstrap-{{ $tier.id }} still runs post-upgrade unconditionally,
# after the new tier pods are up, which is what it needs regardless of branch.
#
# "existing backend" is decided by `lookup "v1" "Service" <namespace>
# <this tier's postgres Service>` returning non-empty: a Service created by
# a prior release is there on an upgrade before any hook runs, and cannot be
# false-positive "existing" for a brand-new tier, because pre-upgrade hooks
# run before Helm applies this release's ordinary resources. `lookup`
# returns nothing under `helm template` and client-side dry runs (no live
# cluster to query), so those render the install branch, or the new-backend
# (post-upgrade) branch once rendered with `--is-upgrade`. Only a
# server-side dry run (`helm upgrade --dry-run=server`) or a real
# `helm upgrade` can see the existing-backend (pre-upgrade) branch, because
# only those actually query the live API server.
{{- $pgSvcName := printf "%s-tier-pg-%s" $root.Release.Name $tier.id }}
{{- $schemaHook := "post-install" }}
{{- if not $root.Release.IsInstall }}
{{- if lookup "v1" "Service" $root.Release.Namespace $pgSvcName }}
{{- $schemaHook = "pre-upgrade" }}
{{- else }}
{{- $schemaHook = "post-upgrade" }}
{{- end }}
{{- end }}
#
# ATLAS-APPLY HAS NO SHELL, SO THE PHASE MUST BE A TEMPLATE-TIME FACT, NOT A
# RUNTIME ONE. An earlier version of this Job tried to keep a single
# post-install,pre-upgrade,post-upgrade Job and have wait-postgres decide at
# runtime (via a DNS check) whether to defer. That cannot work: wait-postgres
# is an initContainer, atlas-apply is this Job's `containers:` entry, and
# Kubernetes starts every `containers:` entry once every initContainer has
# exited 0 -- there is no "succeeded, but skip the rest" signal an
# initContainer can give. The arigaio/atlas image has no shell (see the
# comment at atlas-apply below), so it cannot itself read a flag and no-op;
# a runtime "defer" would still have atlas-apply attempt --url against a
# postgres Service that does not exist yet, and fail the hook anyway. Only
# one Job, with one hook annotation chosen before any of this runs, avoids
# that: a post-upgrade-only Job's containers never start until post-upgrade,
# by Helm's own hook-phase contract, no runtime decision required.
#
# NOT post-rollback: Atlas migrations are forward-only -- same reasoning as
# postgres-schema-init.yaml. A refused re-apply fails this hook and blocks
# every registration Job at a later weight.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-tier-schema-init-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $schemaHook }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # 0, not 10: an unready store has a real problem retrying 10x would only
  # delay surfacing, and SCHEMA_INIT_REFUSED is meant to fail this hook
  # loudly and fast.
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "stack/schema" "dst" "schema")
          ) "root" $root) | nindent 8 }}
        # WAIT HERE, NOT INSIDE atlas-apply.
        #
        # The arigaio/atlas image has no shell and no `nc` — its ENTRYPOINT
        # is the atlas binary itself. A wait loop in that container dies at
        # container init with:
        #   exec: "/bin/sh": stat /bin/sh: no such file or directory
        # which reads as a broken image rather than a wrong invocation.
        #
        # postgres-schema-init.yaml had already solved this and says so in
        # its comments. This template copied that Job's SHAPE and lost the
        # constraint — similarity is a code claim, not a deployment claim.
        # Blocking in a container that DOES have a shell is the fix, and the
        # postgres image is the natural one: it ships pg_isready, so the
        # check is a real readiness probe rather than a port knock.
        #
        # No DNS branch here any more: the Service either exists (pre-upgrade
        # branch, above) or this Job doesn't run until post-upgrade, by which
        # point Helm has already applied the tier's postgres StatefulSet as
        # an ordinary resource. So the only outcome left to distinguish is
        # "resolves and becomes ready" vs. "never comes up" -- bounded at
        # 300s (150 x 2s), matching topic-init-{{ $tier.id }}'s broker wait.
        - name: wait-postgres
          image: {{ include "openddil.thirdPartyImage" $tn.postgres.image }}
          resources:
            {{- toYaml $root.Values.jobs.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "waiting for tier store {{ $tier.id }} ..."
              attempts=0
              until pg_isready -h {{ $pgHost }} -p {{ $tn.postgres.port }} -U {{ $tn.postgres.auth.username }} -d {{ $tn.postgres.auth.database }}; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 150 ]; then
                  echo "SCHEMA_INIT_REFUSED postgres_unready {{ $tier.id }}"
                  exit 1
                fi
                sleep 2
              done
              echo "tier store {{ $tier.id }} accepting connections"
      containers:
        # Entrypoint IS the atlas binary, so `args:` carries only subcommand
        # arguments — no `command:` override, no shell.
        - name: atlas-apply
          image: {{ include "openddil.thirdPartyImage" $root.Values.utilities.atlas }}
          # Bounded, so an OOM cannot leave a tier DB half-migrated. The
          # root-tier Jobs have always had this; the tier Jobs did not.
          resources:
            {{- toYaml $root.Values.jobs.resources | nindent 12 }}
          # --tx-mode none: six migrations carry their own BEGIN/COMMIT. Under the
          # default per-file transaction, that COMMIT ends Atlas's transaction early;
          # the file and its revision row commit, then Atlas's own commit finds the
          # connection idle and exits 1 ("unexpected transaction status idle"). A
          # fresh store crashed once per such file: 6 times, then succeeded on the 7th.
          # Files that need atomicity carry their own BEGIN/COMMIT.
          #
          # IDEMPOTENT BY CONSTRUCTION: Atlas records each applied migration
          # file's revision in its own tracking table (`atlas_schema_revisions`,
          # inside the target database) and `migrate apply` only applies
          # files not already recorded there -- so re-running this Job against
          # a store it already migrated is always safe.
          args:
            - migrate
            - apply
            - --dir
            - "file:///bundle/schema/migrations"
            - --tx-mode
            - none
            - --url
            - "{{ $dsn }}?sslmode=disable"
          volumeMounts:
            - name: bundle-shared
              mountPath: /bundle
      volumes:
        - name: bundle-shared
          emptyDir: {}

# topic-init-{{ $tier.id }} used to live here, gated additionally by
# `tierNode.enabled`/`tierNode.tiers` -- narrower than the broker
# StatefulSet's own predicate (infrastructure.yaml: edge unconditionally,
# region only when tier-managed), so a default render or a `tierNode.tiers`
# exclusion left that edge's broker with no topic-init at all, relying on
# auto-create at broker defaults. Moved to infrastructure.yaml, into the
# SAME range/if the broker StatefulSet renders from, so the two cannot
# drift apart again (see that file's topic-init-<id> header comment).

---
# ===========================================================================
# tier-projector-config-{{ $tier.id }} — TIER-SCOPED TOPIC SET
# ===========================================================================
# The third parameterization axis, exercised for the first time.
#
# The Arc 1 gate decomposed "the projector is tier-parameterizable" into three
# axes with three different evidentiary states: BROKER (already proven in
# production — four instances, different brokers), DSN (proven by the gate,
# the genuinely untested one), and TOPIC SET (mechanism exists via
# PROJECTOR_CONFIG, never turned — all four deployed projectors share one
# baked-in config listing 11 topics).
#
# This turns it. A tier subscribes to the topics its own broker actually
# carries and omits root-only rollups — which ALSO dissolves the
# UNKNOWN_TOPIC_OR_PART warning noise the gate observed: a tier that never
# lists rollup topics never warns about them. The noise was a symptom of the
# unturned knob, not a bug to suppress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-projector-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  projector_config.yaml: |
    {{- include "openddil.tierProjectorConfig" (dict "tier" $tier "root" $root) | nindent 4 }}
---
# ===========================================================================
# tier-restate-config-{{ $tier.id }} — this tier's broker ONLY
# ===========================================================================
# GATE FINDING (2026-08-08): Restate 1.6.x has NO POST /clusters admin
# endpoint — it returns 404, and a subscription naming an unknown cluster
# fails with "specified cluster in the source URI does not exist. Make sure
# it is defined in the KafkaOptions". Kafka clusters are SERVER CONFIG.
#
# So a per-tier Restate needs a per-tier config file naming its own broker,
# rendered by the chart rather than registered by a bootstrap API call. This
# was discovered by running the gate before templating; templating first
# would have discovered it as a broken deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-restate-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  restate.toml: |
{{- include "openddil.tierRestateToml" (dict "tier" $tier "broker" $broker) | nindent 4 }}
---
# ===========================================================================
# tier-restate-{{ $tier.id }} — durable-workflow substrate
# ===========================================================================
# Three legs justify this, not one (ADR-0032 §d):
#   1. detection today       — fusion + cm-service must compute at the tier
#                              that presents, or a severed tier shows
#                              position without judgement;
#   2. configurable analytics — ADR-0034's durable-workflow execution class;
#   3. sovereignty process workflows — a maintainer mid-procedure must not
#                              lose workflow state to a WAN drop. Locality
#                              (PRINCIPLES) applied to process execution.
#
# One substrate per tier serves two services today and the whole
# detection-plus-workflow plane tomorrow.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-restate-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: ingress
    - port: 9070
      name: admin
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $root.Release.Name }}-tier-restate-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  serviceName: {{ $root.Release.Name }}-tier-restate-{{ $tier.id }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-restate-%s" $tier.id) "root" $root) | nindent 8 }}
      annotations:
        # Hashes the RENDERED BODY, not a hand-listed tuple of the values
        # that feed it. See the template for the failure that produced this
        # rule: a tuple-hash misses the first change outside the tuple, and
        # presents as green everywhere with nothing moved.
        checksum/restate-config: {{ include "openddil.tierRestateToml" (dict "tier" $tier "broker" $broker) | sha256sum }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: restate
          image: {{ include "openddil.thirdPartyImage" $root.Values.restate.image }}
          # PROVISION-TIME ONLY — see values.yaml tierNode.restate. This flag
          # affects the INITIAL partition count and cannot be changed after
          # first boot, so it is a template parameter rather than a knob.
          args:
            - "--default-num-partitions"
            - {{ $tn.restate.defaultNumPartitions | quote }}
          env:
            - name: RESTATE_CONFIG
              value: /config/restate.toml
            # -----------------------------------------------------------------
            # ROCKSDB BUDGET, AND WHY THE MEMORY LIMIT ALONE NEVER FIXED IT
            # -----------------------------------------------------------------
            # Restate reads the cgroup limit and then sets
            # `rocksdb-total-memory-size` to ALL OF IT, and says so at every
            # startup, as an ERROR it prints about itself:
            #
            #   'rocksdb-total-memory-size' parameter is set to 2.0 GiB, more
            #   than 90% of the process memory limit of 2.0 GiB. This risks an
            #   OOM under load; keep it under 50% of process memory
            #
            # At the old 1Gi limit that budget was 1 GiB of a 1 GiB cap, which
            # is not a tuning problem but an arithmetic one -- and it drove the
            # ~1600 OOMKills on edge-01 and 1124 on region-east. RAISING THE
            # LIMIT DID NOT FIX IT, it re-scaled it: at 2Gi the budget became
            # 2 GiB of a 2 GiB cap and region-east still peaked at 1656Mi/2048.
            #
            # The diagnosis was in the logs at every one of those ~1600 starts.
            # Nobody was reading that line, so the memory limit was treated as
            # the variable when it was the multiplier.
            #
            # Set to 50% of the container limit, which is what the error asks
            # for. Verified 2026-09-17 on region-east: error gone, partition
            # budget 810.3 MiB -> 405.2 MiB, zero restarts.
            #
            # Bytes, not "1 GiB": the env override is parsed more strictly than
            # the TOML field, and a unit string it rejects would be ignored --
            # leaving the default in place and this comment describing a fix
            # that is not applied. (That failure mode has its own entry in
            # PRINCIPLES.md; it is not a hypothetical here.)
            - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
              value: {{ include "openddil.halfMemoryBytes" $tn.restate.resources.limits.memory | quote }}
          ports:
            - containerPort: 8080
            - containerPort: 9070
          resources:
            {{- toYaml $tn.restate.resources | nindent 12 }}
          volumeMounts:
            - name: restate-config
              mountPath: /config
            - name: data
              mountPath: /restate-data
      volumes:
        - name: restate-config
          configMap:
            name: {{ $root.Release.Name }}-tier-restate-config-{{ $tier.id }}
        {{- if $tn.restate.useEmptyDir }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if not $tn.restate.useEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $tn.restate.storageSize }}
  {{- end }}

---
# ===========================================================================
# tier-projector-{{ $tier.id }} — reads THIS tier, writes THIS tier
# ===========================================================================
# The reachback closed in one object: KAFKA_BROKERS and POSTGRES_DSN both
# point at this tier. Previously the second pointed at the root, which is why
# a tier had no queryable surface over its own data.
{{- $tierProjectorPairs := list }}
{{- range include "openddil.tierProjectorGroupIds" (dict "tier" $tier "root" $root) | splitList " " }}
{{- $tierProjectorPairs = append $tierProjectorPairs (printf "%s/%s" $tier.id .) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-projector-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-projector-%s" $tier.id) "root" $root) | nindent 4 }}
  annotations:
    # Groups PARSED from openddil.tierProjectorConfig via
    # openddil.tierProjectorGroupIds (_helpers.tpl), not re-typed -- so this
    # can never disagree with the mapping set actually mounted below.
    openddil.io/consumer-groups: {{ join " " $tierProjectorPairs | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-projector-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      annotations:
        # THE CONFIG THAT RENDERED, APPLIED, AND NEVER ARRIVED.
        #
        # This deployment had NO checksum annotation, so adding
        # `retention_hours` to the projector config on 2026-09-18 updated
        # the live ConfigMap and changed nothing in the pod template.
        # Kubernetes correctly rolled nothing, helm reported success, and
        # the projector kept the mapping set it had loaded at startup --
        # every rendered artifact saying the new thing while the process
        # held the old one. Same shape as the bridge retarget.
        #
        # Hashes the RENDERED BODY via the shared helper, not a
        # hand-listed tuple of the values feeding it: a tuple hash misses
        # the first change to anything outside the tuple, which is the
        # defect that produced this rule in the first place.
        checksum/projector-config: {{ include "openddil.tierProjectorConfig" (dict "tier" $tier "root" $root) | sha256sum }}
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-projector-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: projector
          image: {{ include "openddil.image" (dict "name" $root.Values.projector.image.name "tag" $root.Values.projector.image.tag "digest" $root.Values.projector.image.digest "root" $root) }}
          env:
            - name: KAFKA_BROKERS
              value: {{ $broker | quote }}
            - name: POSTGRES_DSN
              value: {{ $dsn | quote }}
            # PACKAGING NOTE (gate finding): the image's default config path
            # is /app/src/config/projector_config.yaml. A tier-scoped config
            # MUST be pointed at explicitly — running without this silently
            # falls back to the baked-in 11-topic root config.
            - name: PROJECTOR_CONFIG
              value: /tier-config/projector_config.yaml
            - name: OPENDDIL_EDGE_ID
              value: {{ $tier.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $tier.region | quote }}
            # SEVERANCE-INDICATOR INVERSION (ADR-0032 §f), and it needs no
            # schema change — only this tier's broker.
            #
            # The monitor writes a singleton row id='edge' to
            # edge_buffer_status. At the ROOT that was one global row: HQ's
            # view of an edge, observed centrally, and unavailable to the
            # edge when the edge most needed it. Here each tier has its OWN
            # store, so the singleton row per store IS that tier's own
            # uplink state — "my data is current, my uplink is down, N
            # events are buffered."
            #
            # The lag probe reads THIS tier's broker, so it keeps working
            # while severed, which is the whole point.
            - name: BUFFER_MONITOR_ENABLED
              value: "true"
            # Per-tier group name — see the identical fix in edge.yaml for why
            # the bare "bridge-group" default is a silent zero rather than an
            # error. This line previously carried that default verbatim.
            #
            # AND THE NAME FOLLOWS THE RELAY KIND, not the tier id alone. A
            # LEAF's outbound relay is a bridge and commits under
            # `bridge-group-<id>`; an INTERMEDIATE's is an uplink and commits
            # under `uplink-group-<id>`. Rendering "bridge-group-region-east"
            # named a group that has never existed, so the probe raised
            # BridgeGroupAbsent and the region's link indicator read
            # PROBE DOWN on a fully connected region.
            #
            # The honest sentinel worked exactly as ADR-0036 clause 1 intends
            # — it showed the probe unhealthy rather than a confident zero —
            # which is why this was a visible defect and not a silent one.
            # It is UD-10's naming class arriving at the first tier that is
            # neither leaf nor root: the id was parameterised and the KIND
            # was not.
            #
            # A severance test on a tier whose link probe is already down
            # proves nothing, so this blocks the cut rather than following it.
            - name: BRIDGE_CONSUMER_GROUP
              value: {{ if $tier.hasChildren }}{{ printf "uplink-group-%s" $tier.id | quote }}{{ else }}{{ printf "bridge-group-%s" $tier.id | quote }}{{ end }}
            # THE SAME LIST THE RELAY ACTUALLY CARRIES. Unset until 2026-09-09,
            # so the monitor used its code default
            # "raw-sensor-stream,tactical-events" while a tier-managed edge's
            # bridge had stopped carrying raw-sensor-stream entirely.
            #
            # A consumer group keeps its committed offset on a topic it no
            # longer subscribes to, and that offset falls behind FOREVER. The
            # monitor counted it: 106,409 messages of DDIL buffer reported on
            # a link whose every real topic sat at lag 0 or 1 — on the exact
            # indicator a severance test watches. A retired subscription's
            # abandoned offset reading as a buffer is the migration rule at
            # the consumer-group level.
            #
            # Derived from the helper the relay config itself renders from, so
            # the thing measured and the thing measuring cannot disagree.
            - name: BRIDGE_TOPICS
              value: {{ if $tier.hasChildren }}{{ include "openddil.tierUplinkTopics" $root | quote }}{{ else }}{{ include "openddil.edgeBridgeTopics" (dict "edge" $tier "root" $root) | quote }}{{ end }}
            # The link this tier owns, named for what it is. A leaf's is the
            # edge->HQ bridge; an intermediate's is its own uplink, and its
            # screen should not say EDGE->HQ BUFFER while showing a region's
            # link.
            - name: BUFFER_ROW_ID
              value: {{ $tier.id | quote }}
            # Reachability threshold input, not a toxiproxy address. Measured
            # relay commit gaps at rest: 0.5-1.5s for tier bridges/uplinks.
            # The monitor severs after 2*(E+H) = 2*(1.5+2) = 7s with no
            # exchange, and restores after 2 consecutive exchanges.
            - name: LINK_EXCHANGE_PERIOD_S
              value: "1.5"
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml $root.Values.projector.resources | nindent 12 }}
          volumeMounts:
            - name: tier-projector-config
              mountPath: /tier-config
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
      volumes:
        - name: tier-projector-config
          configMap:
            name: {{ $root.Release.Name }}-tier-projector-config-{{ $tier.id }}
        - name: bundle-shared
          emptyDir: {}

---
# ===========================================================================
# tier-electric-{{ $tier.id }} — streams the TIER store to the TIER UI
#
# That heading was ASPIRATIONAL until 2026-09-05 and is now true. Until then
# the tier UI reached `electric-sync`, the root's alias Service, because the
# env var meant to point it here was read by nothing (UD-9). Two comments on
# one path both asserted a property the deployment did not have.
# ===========================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-electric-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-electric-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: electric
          image: {{ include "openddil.thirdPartyImage" $root.Values.electric.image }}
          env:
            - name: DATABASE_URL
              value: {{ printf "%s?sslmode=disable" $dsn | quote }}
            - name: ELECTRIC_INSECURE
              value: "true"
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml $root.Values.electric.resources | nindent 12 }}

---
# ===========================================================================
# tier-frontend-{{ $tier.id }} — SERVED LOCALLY (ADR-0032 §e)
# ===========================================================================
# A bundle fetched from the parent tier cannot LOAD during severance. An
# already-open tab might survive on cache; a reload, a new tab, or a shift
# change gets nothing. "Works only if you loaded it before the link dropped"
# is luck with a good story, not severance tolerance.
#
# *** INTERIM (GD-04) *** — what ships is the current three-view SPA, because
# nothing else exists to ship. The framework artifact is ONE presentation
# parameterized by tier (local truth + subtree rollup); this is the demo
# instantiation serving in its slot. See ADR-0033
# §Tier-parameterized presentation.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-frontend-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-frontend-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-frontend-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "openddil.image" (dict "name" $root.Values.frontend.image.name "tag" $root.Values.frontend.image.tag "digest" $root.Values.frontend.image.digest "root" $root) }}
          env:
            # WHERE THE BROWSER'S READ PATH GOES, and it is an nginx upstream
            # rather than an application setting — deliberately.
            #
            # UD-9: this block previously set `ELECTRIC_URL`, with a comment
            # citing the ADR-0032 §e corollary, and NOTHING READ IT. The
            # application's ELECTRIC_URL is a Vite BUILD-TIME constant baked
            # into the bundle; a container env var cannot reach it. nginx
            # defaulted its upstream to `electric-sync` — the ROOT's alias
            # Service — so every tier's UI read the ROOT's store while this
            # comment asserted tier-locality. No error at any layer.
            #
            # These two names ARE read: 40-resolver.sh substitutes them into
            # nginx.conf at container start and FAILS if any placeholder
            # survives. That is the difference between a setting and a claim.
            - name: OPENDDIL_ELECTRIC_UPSTREAM
              value: {{ include "openddil.tierReadUpstream" (dict "tier" $tier "root" $root) | quote }}
            - name: OPENDDIL_ELECTRIC_PORT
              value: {{ include "openddil.tierReadPort" (dict "tier" $tier "root" $root) | quote }}
            {{- if $root.Values.releasability.enabled }}
            - name: OPENDDIL_PEP_UPSTREAM
              value: {{ printf "%s-tier-pep-%s" $root.Release.Name $tier.id | quote }}
            # THE SHELL REQUIRES A SESSION, not just the data paths.
            # Set from the SAME condition that puts this tier's PEP into
            # oidc mode, because the gate is only satisfiable when something
            # can answer /auth/me: with no PEP that is a 502 and in header
            # mode a 404, and nginx's auth_request turns either into a 500
            # for the whole app. Tying them to one condition is what stops a
            # deployment having a gate with nothing behind it.
            - name: OPENDDIL_SESSION_GATE
              value: {{ ternary "on" "off" (and $root.Values.releasability.oidc.enabled (not (empty $tier.publicOrigin))) | quote }}
            {{- end }}
          volumeMounts:
            # The tier's identity, delivered on the channel that actually
            # works: a file the application FETCHES at startup. One image,
            # zero tier knowledge at build time, tier identity supplied
            # entirely at deploy time.
            - name: deployment-config
              mountPath: /usr/share/nginx/html/deployment
            # Branding is OPTIONAL and supplied by a separate overlay chart,
            # not this one. `optional: true` on the volume below is what
            # makes a missing ConfigMap a non-error instead of a stuck pod;
            # the kubelet populates this mount once the ConfigMap shows up,
            # with no restart needed. The SPA reads /branding/branding.json
            # and falls back to OpenDDIL defaults when the file is absent.
            - name: branding
              mountPath: /usr/share/nginx/html/branding
              readOnly: true
          ports:
            - containerPort: 80
          resources:
            {{- toYaml $root.Values.frontend.resources | nindent 12 }}
      volumes:
        - name: deployment-config
          configMap:
            name: {{ $root.Release.Name }}-tier-frontend-config-{{ $tier.id }}
        - name: branding
          configMap:
            name: {{ $root.Values.frontend.branding.configMap | default (printf "%s-branding" $root.Release.Name) }}
            optional: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-frontend-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  # THE TIER PARAMETER. Fetched by the app at startup from
  # /deployment/deployment.json — the same channel that already carried
  # branding and FOB topology, which is why this needed no new mechanism.
  #
  # SHAPE, NOT NAME. Nothing downstream branches on `id`: `has_children` and
  # `parent` select the panels, so a fourth tier resolves by shape with no
  # code change. `id` is display and correlation only.
  #
  # `scope` is null because a tier node reads its OWN store, which holds its
  # subtree and nothing else — scoping it again would be filtering a set by
  # a property every member already has. Explicit null rather than omitted:
  # the parser REJECTS an omitted scope, because omission reads as an
  # oversight and an unscoped read at a tier WITH children would show the
  # whole subtree under a leaf's label.
  deployment.json: |
    {
      "title": {{ $root.Values.frontend.title | default "OpenDDIL" | quote }},
      "tier": {
        "id": {{ $tier.id | quote }},
        "label": {{ $tier.label | default $tier.id | quote }},
        "scope": null,
        "has_children": {{ $tier.hasChildren | default false }},
        {{- /* PARENT COMES FROM THE TIER LIST, WHICH ALREADY RESOLVED IT.

               This used to read `or $tier.parent $tier.region`, because an
               edge's parent IS its region and `edges[].region` said so. Once
               regions became tiers that fallback made a REGION ITS OWN
               PARENT: the list carries `region: <own id>` for a region, so
               an empty `parent` fell through to itself. A self-parenting
               tier is an intermediate whose uplink is itself, and the shape
               resolution would have been wrong in a way no panel could show.

               `openddil.tierList` resolves parent for every kind — an edge
               gets its region, a region gets the root's id — so the
               fallback is not merely redundant now, it is the bug.

               THE INVARIANT BOTH BUGS VIOLATED, stated where the
               resolution happens: NO PARENT BELONGS TO THE ROOT ALONE. Any
               other tier has one, and a tier that appears to have none is
               either the root or a resolution error — there is no third
               reading. A self-parent is the same violation wearing a
               different value. */}}
        "parent": {{ with $tier.parent }}{{ . | quote }}{{ else }}null{{ end }}
      }
    }
{{- if $root.Values.releasability.enabled }}
---
# ===========================================================================
# tier-pep-{{ $tier.id }} — THIS TIER'S read-path enforcement point
# ===========================================================================
# Slice 1 shipped ONE PEP, at the root, and one NetworkPolicy naming the
# root's Electric. A tier node's read path was therefore unauthenticated AND
# (per UD-9) reading the root's store — the two defects composing into the
# worst available combination, which is why they are fixed together.
#
# ITEMS 2 AND 3 OF THE CHART DELTA LAND TOGETHER OR THE TIER IS WORSE THAN
# BEFORE. Pointing the tier's nginx at a PEP that does not exist breaks the
# UI; deploying a tier PEP without repointing nginx leaves the bypass open.
# Both come from `openddil.tierReadUpstream`, so they cannot disagree.
#
# THE PDP IS STILL THE ROOT'S TOPAZ. Per-tier local authorizers are ADR-0029
# §6's architecture and land with the tier-bridge slice; Slice 1's scope
# decision stands. So this tier ENFORCES locally and DECIDES remotely, and
# under severance it fails CLOSED — which is correct, and is NOT the
# capstone. Do not record a severance demo against this and call it
# tier-local authorization: the read path is tier-local, the decision is not.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-pep-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-pep-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  # One replica, and the reason is an authorization property rather than a
  # capacity one: shape-handle bindings and sessions are in-memory, so a
  # second replica would refuse valid resumptions. Failing closed is the
  # right direction; scaling out needs shared storage.
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 8 }}
      annotations:
        checksum/policy: {{ include "openddil.policyChecksum" (dict "root" $root "extra" (concat (list
            $tier.id
            ($tier.publicOrigin | default "")
            (ternary $root.Values.releasability.oidc.clientSecret "" (not (not (and $root.Values.releasability.oidc.enabled $tier.publicOrigin))))
          ) (ternary (list (toJson $root.Values.cmReports.faultCatalog)) (list) $root.Values.cmReports.enabled))) | sha256sum | quote }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/gateway" "dst" "app")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: pep
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.pep.image.repository "tag" $root.Values.releasability.pep.image.tag "digest" $root.Values.releasability.pep.image.digest "root" $root) }}
          command: ["python", "-u", "/app/pep.py"]
          env:
            # THIS TIER'S Electric, which is the whole point.
            - name: OPENDDIL_ELECTRIC_URL
              value: {{ printf "http://%s-tier-electric-%s%s:3000" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            # THIS TIER'S OWN PDP — and this line is the difference between a
            # degraded mode and an outage.
            #
            # Pointing a tier's PEP at the ROOT's Topaz made the read path
            # SEVERANCE-INTOLERANT: cut the uplink and the PEP cannot reach
            # its decision point, so it fails closed — correctly, loudly, with
            # the marker — and the maintainer UI at a severed edge shows
            # DENIED instead of data.
            #
            # That is ADR-0036 clause 4 violated BY THE ENFORCEMENT POINT: a
            # severed tier is supposed to degrade, not stop. And it regressed
            # a capability that already worked — Phase 5 rung (iii), "the tier
            # UI live while severed", could no longer be demonstrated with
            # enforcement on, because the enforcement was the thing going
            # dark.
            #
            # With the tier's own authorizer, fail-closed regains its correct
            # meaning: "MY OWN PDP is down", which is a real local fault,
            # rather than "the link is cut", which is a mode this system is
            # built to survive.
            - name: OPENDDIL_TOPAZ_URL
              value: {{ printf "http://%s-tier-topaz-%s%s:8383" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: OPENDDIL_PEP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ $root.Values.releasability.pep.logLevel | quote }}
            {{- if $root.Values.cmReports.enabled }}
            # --- the CM write path, THIS TIER's own cm-intake --------
            - name: OPENDDIL_CM_INTAKE_URL
              value: {{ printf "http://%s-tier-cm-intake-%s%s:4197/cm-events" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: OPENDDIL_REPORT_SOURCE
              value: {{ $root.Values.cmReports.source | quote }}
            {{- if $root.Values.cmReports.faultCatalog }}
            # Unset (not an empty-catalog file) when no fault catalog is
            # configured — same "route exists, nothing to serve" shape as
            # EGRESS_PANE elsewhere: pep.py 404s the discrepancy route
            # rather than accepting writes against a taxonomy of zero.
            - name: OPENDDIL_FAULT_CATALOG_PATH
              value: /etc/openddil/cm-fault-catalog.json
            {{- end }}
            {{- end }}
            {{- if and $root.Values.releasability.oidc.enabled $tier.publicOrigin }}
            # AUTH CLIENT PER TIER (chart delta item 4). A redirect URI is
            # per host, so a tier reached at its own hostname needs its own
            # confidential client and its own EXACT redirect URI. Configured
            # only when the tier declares a public origin; a tier without one
            # is reachable in-cluster and runs in header mode, which the PEP
            # announces at boot rather than leaving to be inferred.
            - name: OPENDDIL_OIDC_ISSUER
              value: {{ include "openddil.keycloakIssuer" $root | quote }}
            - name: OPENDDIL_OIDC_INTERNAL_ISSUER
              value: {{ printf "http://%s-keycloak%s:8080%s/realms/%s" $root.Release.Name (include "openddil.svcDomain" $root) ($root.Values.releasability.keycloak.basePath | trimSuffix "/") $root.Values.releasability.keycloak.realm | quote }}
            - name: OPENDDIL_OIDC_CLIENT_ID
              # Same helper the Keycloak realm renders its clients from, so
              # the id the PEP presents and the id the realm defines cannot
              # drift apart. See openddil.tierClientId.
              value: {{ include "openddil.tierClientId" (dict "id" $tier.id "root" $root) | quote }}
            - name: OPENDDIL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-pep-oidc
                  key: client-secret
            - name: OPENDDIL_OIDC_REDIRECT_URI
              value: {{ printf "%s/auth/callback" ($tier.publicOrigin | trimSuffix "/") | quote }}
            - name: OPENDDIL_SESSION_TTL_SECONDS
              value: {{ $root.Values.releasability.oidc.sessionTtlSeconds | quote }}
            - name: OPENDDIL_LABELED_TABLES
              # Tables that can be partitioned, therefore tables that may be
              # served. Anything else is refused with cause `unlabelable` —
              # a statement about the DATA, identical for every subject,
              # rather than a decision against the viewer.
              value: {{ join "," $root.Values.releasability.labeledTables | quote }}
            - name: OPENDDIL_ROLE_SERVED_TABLES
              # No nation filter. Declared position; see values.yaml.
              value: {{ join "," $root.Values.releasability.roleServedTables | quote }}
            - name: OPENDDIL_SUBJECT_SCOPED_TABLES
              value: {{ join "," $root.Values.releasability.subjectScopedTables | quote }}
            - name: OPENDDIL_OVERSIGHT_ROLES
              value: {{ join "," $root.Values.releasability.oversightRoles | quote }}
            # WAN sever/restore control. Base URL only -- the gateway
            # appends /proxies/hq-link itself (gateway/pep.py). Port is
            # toxiproxy's proxyPort (8475), which is actually the admin API
            # port despite the name; see infrastructure.yaml's own comment.
            - name: OPENDDIL_WAN_CONTROL_URL
              value: {{ printf "http://%s-toxiproxy%s:%v" $root.Release.Name (include "openddil.svcDomain" $root) $root.Values.toxiproxy.proxyPort | quote }}
            - name: OPENDDIL_WAN_CONTROL_ROLES
              value: {{ $root.Values.releasability.wanControlRoles | quote }}
            # P5: THIS TIER'S own uplink, if it has one (openddil.uplinkPort
            # non-empty for a tier in openddil.uplinkLinks). Falls back to
            # hq-link -- unreachable in practice for a tier PEP, since a
            # tier is rendered only when it's an edge or a tier-managed
            # region, and both are always in the link set -- so a tier PEP
            # degrades to the pre-P5 shared link rather than naming nothing.
            {{- $tierUplinkPort := include "openddil.uplinkPort" (dict "tier" $tier "root" $root) }}
            {{- $tierWanUplink := "hq-link" }}
            {{- if $tierUplinkPort }}{{- $tierWanUplink = printf "uplink-%s" $tier.id }}{{- end }}
            - name: OPENDDIL_WAN_UPLINK
              value: {{ $tierWanUplink | quote }}
            - name: OPENDDIL_WAN_LINKS
              value: {{ $tierWanUplink | quote }}
            - name: OPENDDIL_COOKIE_SAMESITE
              value: {{ $root.Values.releasability.oidc.cookieSameSite | quote }}
            - name: OPENDDIL_COOKIE_SECURE
              # WAS NOT SET AT ALL, and the PEP defaults it to false — so a
              # tier served over HTTPS emitted session cookies WITHOUT the
              # Secure flag while the root, deriving from its own ingress,
              # set it correctly. Not a login failure; a quiet weakening
              # that only appears on the deployments that took the trouble
              # to configure TLS.
              #
              # Derived from the TIER's own origin. The failure in the other
              # direction is louder and stranger: Secure on plain HTTP means
              # the browser accepts the redirect, drops the cookie, and
              # returns the user to a login page with nothing logged
              # anywhere to say why.
              value: {{ include "openddil.tierCookieSecure" (dict "origin" $tier.publicOrigin) | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.releasability.pep.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app
              subPath: app
            {{- if and $root.Values.cmReports.enabled $root.Values.cmReports.faultCatalog }}
            - name: cm-fault-codes
              mountPath: /etc/openddil
              readOnly: true
            {{- end }}
      volumes:
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.pep.appVolumeSize }}
        {{- if and $root.Values.cmReports.enabled $root.Values.cmReports.faultCatalog }}
        - name: cm-fault-codes
          configMap:
            name: {{ $root.Release.Name }}-cm-fault-codes
        {{- end }}
{{- if $root.Values.releasability.lockDownElectric }}
---
# BYPASS PREVENTION AT THE TIER. Slice 1's policy named the ROOT's
# electric-sync and left every tier's Electric uncovered — so a tier node
# was, until this, protected by nothing at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-tier-electric-pep-only-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-electric-%s" $tier.id) "root" $root) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
{{- end }}
{{- if $tier.publicOrigin }}
---
# INGRESS PER TIER HOST (chart delta item 5) — each tier is a URL.
#
# That is not packaging: it is what makes the tab switcher unnecessary. A
# tier's UI is reached at the tier's own endpoint, so "which view" stops
# being a control on the page and becomes a fact about where you connected.
# It is also what the per-tier auth client needs, since a redirect URI is
# per host.
{{- $tierHost := $tier.publicOrigin | trimPrefix "https://" | trimPrefix "http://" }}
{{- $tierTlsSecret := "" }}
{{- if hasPrefix "https://" $tier.publicOrigin }}
{{- $tierTlsSecret = $root.Values.ingress.tierTlsSecretName }}
{{- if not $tierTlsSecret }}
{{- if not (empty $root.Values.ingress.tls) }}
{{- $tierTlsSecret = (first $root.Values.ingress.tls).secretName }}
{{- end }}
{{- end }}
{{- if not $tierTlsSecret }}
{{- fail (printf "tier %s publicOrigin (%s) is https but no TLS secret name could be resolved for its Ingress: ingress.tierTlsSecretName is empty, and ingress.tls has no entry with a usable secretName to fall back to. Set one of the two." $tier.id $tier.publicOrigin) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Release.Name }}-tier-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
  {{- with $root.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $root.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tierTlsSecret }}
  tls:
    - hosts: [{{ $tierHost | quote }}]
      secretName: {{ $tierTlsSecret | quote }}
  {{- end }}
  rules:
    - host: {{ $tierHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Release.Name }}-tier-frontend-{{ $tier.id }}
                port:
                  number: 80
{{- end }}
---
# ===========================================================================
# tier-fusion-{{ $tier.id }} / tier-cm-{{ $tier.id }} — DETECTION AT THE TIER
# ===========================================================================
# The reason the (a) decision was taken. Before this, both services ran ONCE
# at the root and reached DOWN into child brokers, so a severed tier computed
# no severity and no CM state at all — the presentation plane's reachback
# finding repeated one plane over. Now each computes at the tier that
# presents, and publishes to that tier's own broker where the tier projector
# can read it.
#
# Both are Restate Virtual Objects, which is why the tier needed the durable
# substrate above. Both ran UNMODIFIED against a tier-scoped Restate in the
# Arc 1 gate — zero application code changed.
#
# *** INTERIM BINDING (GD-07 / ADR-0034 §Constraints) *** — wired here as
# hardcoded services. They are durable-workflow-class by construction and
# will be re-expressed as REGISTERED units bound by config, migrating ONTO
# configurable workflows rather than off Restate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-fusion-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- /*
          THE OVERLAY ONTOLOGY BELONGS HERE TOO, and its absence was a
          TIER/ROOT ASYMMETRY IN REFERENCE DATA — the same computation at two
          tiers reading different inputs.

          The root's fusion (hub.yaml) layers `demo/ontology` over
          `contracts/ontology`; this one did not, so a tier fusion had five
          files where the root had eight. It surfaced when the wear-component
          manifest landed: the root could gate wear axes by platform and the
          tiers could not, so every axis on every tier-managed asset read
          UNDECLARED and no wear factor was emitted at all — a silent
          divergence in what two nodes believe about the same fleet.

          Overlay-supplied reference data is not root-tier data. Any file the
          root reads to decide something, a tier reading the same store must
          read too.
        */ -}}
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/ontology" "dst" "ontology")
            (dict "src" "demo/ontology" "dst" "ontology" "overlay" true)
          ) "root" $root) | nindent 8 }}
      containers:
        - name: logistics-fusion
          image: {{ include "openddil.image" (dict "name" $root.Values.logisticsFusion.image.name "tag" $root.Values.logisticsFusion.image.tag "digest" $root.Values.logisticsFusion.image.digest "root" $root) }}
          env:
            # Produces to THIS tier's broker. This single value is what makes
            # severity reachable by a tier-local projector.
            - name: FUSION_KAFKA_BROKERS
              value: {{ $broker | quote }}
            - name: FUSION_HTTP_PORT
              value: "9081"
            - name: ONTOLOGY_DIR
              value: /ontology
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 9081
          resources:
            {{- toYaml $root.Values.logisticsFusion.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-fusion-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 9081
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-fusion-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-cm-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # GATE FINDING: cm-service needs BOTH the proto mount (+PYTHONPATH)
        # and a BASELINES mount. The baselines are load-bearing, not
        # decoration — without them the service produces meaningless CM
        # output. Its deployment surface diverged from fusion's even though
        # the two are structural twins at the code layer.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/baselines" "dst" "baselines")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: cm-service
          image: {{ include "openddil.image" (dict "name" $root.Values.cmService.image.name "tag" $root.Values.cmService.image.tag "digest" $root.Values.cmService.image.digest "root" $root) }}
          env:
            - name: CM_KAFKA_BROKERS
              value: {{ $broker | quote }}
            - name: CM_HTTP_PORT
              value: "9080"
            - name: CM_BASELINES_DIR
              value: /baselines
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 9080
          resources:
            {{- toYaml $root.Values.cmService.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /baselines
              subPath: baselines
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-cm-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 9080
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-%s" $tier.id) "root" $root) | nindent 4 }}
{{- if $root.Values.cmReports.enabled }}
---
# ===========================================================================
# tier-cm-intake-{{ $tier.id }} — the one CM event log, at this tier
# ===========================================================================
# Structural twin of redpanda-connect-{{ "{{ $edge.id }}" }} (edge.yaml): same
# connect image, same bundleInit-for-/proto pattern, broker resolved the same
# way every other tier-local consumer resolves it ($broker, set once above).
# Unlike that sibling, this one's input is `http_server`, not a Kafka
# consumer — so it needs a Service, and the NetworkPolicy below is what
# makes "the tier PEP is its only caller" true rather than aspirational.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-cm-intake-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-intake-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-intake-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-intake-%s" $tier.id) "root" $root) | nindent 8 }}
      annotations:
        # HASHES THE BUNDLE IMAGE REFERENCE (or Release.Revision when
        # unpinned), not this pod's own rendered spec — same mechanism
        # openddil.policyChecksum gives the identity pods, extended here
        # because cm-intake.yaml ships as a static bundle file this
        # initContainer only copies once at pod start: a bundle update with
        # no other pod-spec change would otherwise leave a running cm-intake
        # on stale config exactly the way edge-hq-bridge's connect-config
        # comment describes for a chart-generated file. This is the same
        # staleness hazard for a bundle-shipped one.
        checksum/bundle: {{ include "openddil.policyChecksum" (dict "root" $root "extra" (list "tier-cm-intake" $tier.id)) | sha256sum | quote }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/proto"          "dst" "proto")
            (dict "src" "demo/cm-intake.yaml"       "dst" "connect.yaml")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: connect
          image: "{{ include "openddil.thirdPartyImage" $root.Values.redpandaConnect.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.redpandaConnect.image.pullPolicy "root" $root) }}
          args: ["--chilled", "run", "/connect.yaml"]
          env:
            - name: REDPANDA_BROKER
              value: {{ $broker | quote }}
          ports:
            - name: http
              containerPort: 4197
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /connect.yaml
              subPath: connect.yaml
          resources:
            {{- toYaml $root.Values.redpandaConnect.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-cm-intake-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 4197
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-intake-%s" $tier.id) "root" $root) | nindent 4 }}
---
# BYPASS PREVENTION, SAME SHAPE AS tier-electric-pep-only-{{ "{{ $tier.id }}" }}
# ABOVE. cm-intake takes an authenticated write and trusts its caller's
# identity unchecked — it is a transport, not a second gate (see
# cm-intake.yaml's own header comment) — so the only thing making that safe
# is that nothing but the tier PEP can reach it. Gated on cmReports.enabled,
# not lockDownElectric: a deployment that has not turned the CM write path
# on at all has no cm-intake pod for this policy to select in the first
# place, but the gate is named for ITS OWN flag rather than borrowing
# lockDownElectric's, since the two features ship independently.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-tier-cm-intake-pep-only-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-cm-intake-%s" $tier.id) "root" $root) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Another writer into this one intake log adds its own podSelector
    # entry here rather than a second policy.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" (printf "tier-pep-%s" $tier.id) "root" $root) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4197
    {{- /* The second writer: this tier's own redpanda-connect (edge.yaml),
       forwarding DIS Event Report CmEvents, when that path is configured.
       Same $eventReportOn condition as edge.yaml -- recomputed here since
       this file has no access to edge.yaml's range-local variable. Gated
       additionally on `kind == "edge"`: edge.yaml's redpanda-connect-
       {{ $edge.id }} only ever exists for `.Values.edges` entries, never
       for a region -- without this, a region tier would get a podSelector
       clause that can never match any pod this chart renders. */}}
    {{- if and (eq $tier.kind "edge") $root.Values.cmReports.eventReport.eventType $root.Values.tierNode.enabled (or (not $root.Values.tierNode.tiers) (has $tier.id $root.Values.tierNode.tiers)) }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $tier.id) "root" $root) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4197
    {{- end }}
{{- end }}
---
# ===========================================================================
# tier-restate-bootstrap-{{ $tier.id }} — register services + subscriptions
# ===========================================================================
# Restate does not discover services; they must be registered, and their Kafka
# subscriptions created, against THIS tier's Restate. The sequence below is
# exactly the one proven in the Arc 1 gate.
#
# The cluster name matches the tier-restate ConfigMap above. A subscription
# whose source URI names a cluster absent from Restate's SERVER CONFIG fails
# with "specified cluster in the source URI does not exist" — which is why the
# cluster is rendered into restate.toml rather than POSTed here. There is no
# POST /clusters endpoint on 1.6.x.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-tier-restate-bootstrap-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,post-rollback
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # ---------------------------------------------------------------------
      # WAS A SHELL SCRIPT POSTING `curl` PER SUBSCRIPTION (UD-12).
      # ---------------------------------------------------------------------
      # That script was a second implementation of what
      # `openddil_bootstrap.restate_subscriptions` already did for the root,
      # and it lost the part that mattered: the dedup pre-check. Restate 1.6
      # answers a duplicate POST with 200, so every helm upgrade added
      # another copy of all seven subscriptions. Measured here after two
      # upgrades: 14 subscriptions over 7 distinct triples, every one
      # duplicated x2, output still correct, nothing reporting it.
      #
      # It is now the same program the root runs, which is the actual fix --
      # the tier is not a different kind of node, so its bootstrap is not a
      # different kind of program. It also prunes, so a subscription
      # retired from the desired set is deleted rather than merely not
      # re-created.
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/bootstrap" "dst" "openddil_bootstrap")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "openddil.image" (dict "name" $root.Values.cmService.image.name "tag" $root.Values.cmService.image.tag "digest" $root.Values.cmService.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.cmService.image.pullPolicy "root" $root) }}
          command: ["python", "-u", "/app/openddil_bootstrap/register_tier_subscriptions.py"]
          env:
            - name: TIER_ID
              value: {{ $tier.id | quote }}
            - name: RESTATE_ADMIN_URL
              value: {{ printf "http://%s-tier-restate-%s%s:9070" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: TIER_CM_ENDPOINT
              value: {{ printf "http://%s-tier-cm-%s%s:9080" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            - name: TIER_FUSION_ENDPOINT
              value: {{ printf "http://%s-tier-fusion-%s%s:9081" $root.Release.Name $tier.id (include "openddil.svcDomain" $root) | quote }}
            {{- /* DETECTION BINDS TO DIRECT INGEST ONLY (ADR-0032 §a).

                   A tier derives state only for assets it ingests itself; for
                   assets below it, it consumes their DERIVED state and never
                   re-derives. Region-east arrived with cm-service-silver and
                   fusion-service-silver reading `raw-sensor-stream` AT THE
                   REGION, because the tier node renders the full leaf topology
                   and the relayed raw stream gave them something to read —
                   the reachback inverted, with the topic delivered rather than
                   fetched.

                   The bootstrap treats its returned set as COMPLETE and prunes
                   the rest, so passing this false RETIRES those subscriptions
                   on a region that already has them, rather than only
                   declining to create them. */}}
            - name: TIER_DIRECT_INGEST
              value: {{ $tier.directIngest | default false | quote }}
            - name: PYTHONPATH
              value: "/app"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml $root.Values.jobs.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app/openddil_bootstrap
              subPath: openddil_bootstrap
      volumes:
        - name: bundle-shared
          emptyDir: {}

{{- if $tn.topaz.enabled }}
---
# ===========================================================================
# tier-topaz-{{ $tier.id }} — RESERVED SEAT. Arc 2's landing zone.
# ===========================================================================
# DEFAULT OFF, and the honest description is "not yet runnable" rather than
# the "deployed, healthy, deciding nothing" this comment used to claim.
#
# That claim was never tested, because a missing YAML separator meant this
# Deployment was discarded at render time for every tier but the last. The
# first render that produced it showed `args: ["run"]` is not a runnable
# topaz — it exits with `required flag(s) "config-file" not set`. A component
# that never rendered could not reveal that it also never worked; two
# defects, one hiding the other.
#
# Enabling it is Arc 2 work: a config ConfigMap, a --config-file argument,
# and a pinned image tag. See values.yaml tierNode.topaz.
#
# The intent is unchanged and still good: shipping the seat means Arc 2
# (ADR-0029) adds RULES to a deployed component rather than adding a
# COMPONENT under enforcement pressure. It is
# also the per-tier local authorizer the architecture requires — decisions
# local, so a severed tier still decides, and (ADR-0033 §Lateral peer
# topology) a peer request is answered from the RESPONDING tier's own policy
# with no reachback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-topaz-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  # Minimal config, VERIFIED against topazd 0.33.16 by running it. Two keys
  # that appear in the published docs and the online JSON schema are REJECTED
  # by this build — `plugins` and `decision_logger` both fail startup with
  # "'config.Config' has invalid keys". Consequence: DECISION LOGGING IS NOT
  # CONFIGURED HERE and remains unproven; ADR-0029's auditability requirement
  # ("every decision records the policy version that produced it") is an open
  # item for Arc 2, not something this seat currently satisfies.
  config.yaml: |
    version: 2
    logging:
      prod: true
      log_level: info
    directory:
      db_path: /db/tier-{{ $tier.id }}.db
      request_timeout: 5s
    api:
      health:
        listen_address: "0.0.0.0:9494"
      services:
        authorizer:
          grpc:
            connection_timeout_seconds: 2
            listen_address: "0.0.0.0:8282"
          gateway:
            listen_address: "0.0.0.0:8383"
            # Plaintext inside the cluster; the tier's mesh boundary is the
            # trust boundary. Revisit with mTLS when Arc 2 lands.
            http: true
    opa:
      instance_id: openddil-tier-{{ $tier.id }}
      graceful_shutdown_period_seconds: 2
      local_bundles:
        paths:
          - /policy
        skip_verification: true

  # EMPTY BUNDLE — a valid bundle root with no policy in it.
  #
  # This is what makes "deployed, healthy, deciding nothing" TRUE rather than
  # aspirational: the authorizer runs, serves, and answers nothing because it
  # has been given nothing to answer with. Arc 2 (ADR-0029) adds rules to a
  # component that is already deployed and verified, which was the whole
  # argument for shipping the seat early.
  #
  # Policy CONTENT deliberately does not live here — it is Arc 2's, and it
  # belongs in a deployment's own overlay rather than baked into the chart.
  #
  # roots must NAME the namespace even when nothing occupies it. `{"roots":
  # []}` is not an empty bundle, it is an invalid one — OPA refuses it with
  #   manifest roots [] do not permit data at path '/'
  # and topazd exits. Declaring `openddil` reserves the namespace Arc 2 will
  # fill while permitting the bundle to contain nothing today.
  .manifest: |
    {"roots": ["openddil"]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-tier-topaz-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8282
      name: grpc
    - port: 8383
      name: authz-http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-topaz-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-topaz-%s" $tier.id) "root" $root) | nindent 8 }}
      # Same content roll as the tier PEP it answers. Without it this pod never
      # rolled on upgrade: measured 2026-09-30, all three tier Topaz pods were
      # still on the 2026-09-26 bundle digest while their PEPs had just pulled
      # 2026-09-30's (policy files happened to be identical that night).
      annotations:
        checksum/policy: {{ include "openddil.policyChecksum" (dict "root" $root "extra" (list (toJson $root.Values.releasability.destinations))) | sha256sum | quote }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.releasability.enabled }}
      # THE SEAT IS OCCUPIED. Until 2026-09-05 this Topaz loaded an EMPTY
      # bundle — running, healthy, and deciding nothing, which was honest and
      # was the whole point of shipping the seat early (ADR-0029 Phase 3).
      #
      # It is filled by the SAME distribution seam the root's authorizer
      # uses: the runtime bundle, pulled at pod start. That is ADR-0029 §6's
      # model exactly — "policy distributed as versioned bundles", each tier
      # deciding against its own copy, a severed link stopping policy UPDATES
      # rather than decisions. A tier running yesterday's bundle through a
      # severance window is a correct and acceptable posture, and it is
      # auditable because every decision records the policy and corpus
      # versions that produced it.
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/policy/.manifest"          "dst" "policy/.manifest")
            (dict "src" "demo/policy/releasability.rego" "dst" "policy/releasability.rego")
          ) "root" $root) | nindent 8 }}
        - name: policy-loader
          image: {{ include "openddil.image" (dict "name" $root.Values.bundle.image.name "tag" $root.Values.bundle.image.tag "digest" $root.Values.bundle.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.bundle.image.pullPolicy "root" $root) }}
          env:
            - name: OPENDDIL_POLICY_VARIANT
              value: {{ $root.Values.releasability.policyVariant | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              src="/bundle/demo/policy/${OPENDDIL_POLICY_VARIANT}.yaml"
              # A missing variant would leave an EMPTY data document, and an
              # empty corpus is a working authorizer that denies everyone —
              # indistinguishable from a correctly-enforced revocation and
              # arriving with no error.
              if [ ! -f "$src" ]; then
                echo "FATAL: no entitlements corpus at $src" >&2
                ls /bundle/demo/policy/*.yaml >&2
                exit 1
              fi
              mkdir -p /shared/policy/openddil
              cp "$src" /shared/policy/openddil/data.yaml
              echo "tier {{ $tier.id }} corpus: ${OPENDDIL_POLICY_VARIANT}.yaml"
              # THE SHIPPED DESTINATION REGISTRY (ADR-0046 §7). Always ships
              # `entries: {}` — concrete destinations are a deployment
              # overlay, never chart-default content. ABSENT IS ALSO LEGAL:
              # an older bundle built before this file existed must still
              # start, so a missing file here is a smaller shipped surface,
              # not the FATAL the missing entitlements corpus is above.
              if [ -f /bundle/demo/policy/destinations.yaml ]; then
                mkdir -p /shared/policy/openddil/destinations
                cp /bundle/demo/policy/destinations.yaml /shared/policy/openddil/destinations/data.yaml
                echo "tier {{ $tier.id }} destinations registry (shipped): present"
              else
                echo "tier {{ $tier.id }} destinations registry (shipped): none in this bundle"
              fi
              # THE DEPLOYMENT'S OWN OVERLAY, mounted as a ConfigMap only when
              # releasability.destinations.entries is non-empty (optional, so
              # its absence is not an error either).
              if [ -f /destinations-deployment/data.yaml ]; then
                mkdir -p /shared/policy/openddil/destinations_deployment
                cp /destinations-deployment/data.yaml /shared/policy/openddil/destinations_deployment/data.yaml
                echo "tier {{ $tier.id }} destinations registry (deployment overlay): present"
              else
                echo "tier {{ $tier.id }} destinations registry (deployment overlay): none"
              fi
          resources:
            {{- toYaml $root.Values.bundle.initResources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /shared
            {{- if $root.Values.releasability.destinations.entries }}
            - name: destinations-deployment
              mountPath: /destinations-deployment
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: topaz
          image: {{ include "openddil.thirdPartyImage" $tn.topaz.image }}
          # THE PROVEN INVOCATION — established by running the image, not
          # inferred. `args: ["run"]` alone exits immediately with
          #   required flag(s) "config-file" not set
          # `topazd run --help` (read from inside the image) gives the real
          # contract: -c/--config-file, and -b/--bundle for local policy roots.
          args: ["run", "--config-file", "/config/config.yaml"]
          ports:
            - containerPort: 8282
              name: grpc
            - containerPort: 8383
              name: authz-http
            - containerPort: 9494
              name: health
          # TCP, not HTTP. Topaz's health service on 9494 speaks the gRPC
          # health protocol — an HTTP GET against it never becomes ready, and
          # the pod sits 0/1 forever while the logs say every server started.
          # A TCP probe on the authorizer's own gRPC port is true by
          # construction: the port is open exactly when the service is
          # listening. Upgrade to a grpc: probe if a richer signal is wanted.
          readinessProbe:
            tcpSocket: { port: 8282 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $tn.topaz.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $root.Values.releasability.enabled }}
            # The real bundle, from the shared emptyDir the init containers
            # filled. Replaces the ConfigMap's empty `.manifest`.
            - name: bundle-shared
              mountPath: /policy
              subPath: policy
            {{- else }}
            # subPath -> a REAL FILE. A whole-ConfigMap mount produces a
            # symlink farm (..data -> ..<timestamp>/) and OPA's bundle loader
            # walks real directory entries.
            - name: policy
              mountPath: /policy/.manifest
              subPath: .manifest
            {{- end }}
            - name: db
              mountPath: /db
      volumes:
        - name: config
          configMap:
            name: {{ $root.Release.Name }}-tier-topaz-config-{{ $tier.id }}
        {{- if $root.Values.releasability.enabled }}
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.topaz.policyVolumeSize }}
        {{- if $root.Values.releasability.destinations.entries }}
        - name: destinations-deployment
          configMap:
            name: {{ $root.Release.Name }}-destinations-deployment
            optional: true
        {{- end }}
        {{- else }}
        - name: policy
          configMap:
            name: {{ $root.Release.Name }}-tier-topaz-config-{{ $tier.id }}
        {{- end }}
        - name: db
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.topaz.dbVolumeSize }}
{{- end }}

{{- /* ===================================================================
     tier-uplink-bridge-{{ $tier.id }} — an INTERMEDIATE's bridge upward
     ===================================================================
     An edge's bridge lives in edge.yaml because an edge has one whether or
     not it is tier-managed. A REGION has no bridge at all today, because
     regions were never tiers — so a region receiving its edges' derived
     state would hold it and nothing would carry it to HQ.

     That is the "goes EMPTY rather than stale" trap, one level up: retire
     the root's reach into the edges, retarget those edges at the region,
     and HQ loses the whole subtree unless the region publishes upward.
     Rendered only for a tier that HAS children — a leaf's uplink is
     edge.yaml's. */ -}}
{{- if and $tier.hasChildren (include "openddil.isTierManaged" (dict "id" $tier.id "root" $root)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-tier-uplink-config-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  connect.yaml: |
{{- include "openddil.tierUplinkConnectYaml" (dict "tier" $tier "root" $root "broker" $broker) | nindent 4 }}
---
{{- $tierUplinkGroup := (include "openddil.tierUplinkConnectYaml" (dict "tier" $tier "root" $root "broker" $broker) | fromYaml).input.kafka.consumer_group }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-tier-uplink-{{ $tier.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "tier-uplink-%s" $tier.id) "root" $root) | nindent 4 }}
  annotations:
    # Group PARSED from the generated connect.yaml
    # (openddil.tierUplinkConnectYaml in _helpers.tpl), not re-typed.
    openddil.io/consumer-groups: {{ printf "%s/%s" $tier.id $tierUplinkGroup | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "tier-uplink-%s" $tier.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Hashes the RENDERED BODY, not a hand-listed tuple of the values
        # that feed it. See the template for the failure that produced this
        # rule: a tuple-hash misses the first change outside the tuple, and
        # presents as green everywhere with nothing moved.
        checksum/uplink-config: {{ include "openddil.tierUplinkConnectYaml" (dict "tier" $tier "root" $root "broker" $broker) | sha256sum }}
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "tier-uplink-%s" $tier.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uplink
          image: "{{ include "openddil.thirdPartyImage" $root.Values.edgeHqBridge.image }}"
          imagePullPolicy: {{ $root.Values.edgeHqBridge.image.pullPolicy | default "IfNotPresent" }}
          args: ["-c", "/connect/connect.yaml"]
          resources:
            {{- toYaml $root.Values.edgeHqBridge.resources | nindent 12 }}
          {{- if $root.Values.relayStallProbe.enabled }}
          # THE RELAY DIMENSION 1 CUTS. When the region is severed from HQ,
          # THIS uplink's output legitimately stops -- buffering is the
          # designed degraded mode -- so without the destination term this
          # probe would restart it every three minutes for the whole duration
          # of the cut, turning a demonstrated DDIL behaviour into a crash
          # loop on camera.
          #
          # The destination is taken from bridgeTarget, so it is whatever this
          # relay actually publishes through and a NetworkPolicy sever affects
          # the probe exactly as it affects the relay.
          env:
            - name: DEST_HOST
              value: {{ include "openddil.bridgeTarget" (dict "tier" $tier "root" $root) | splitList ":" | first | quote }}
            - name: DEST_PORT
              value: {{ include "openddil.bridgeTarget" (dict "tier" $tier "root" $root) | splitList ":" | last | quote }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "/probe/relay-stall-probe.sh"]
            initialDelaySeconds: {{ $root.Values.relayStallProbe.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.relayStallProbe.periodSeconds }}
            failureThreshold: {{ $root.Values.relayStallProbe.failureThreshold }}
            timeoutSeconds: 10
          {{- end }}
          volumeMounts:
            - name: connect-config
              mountPath: /connect
            {{- if $root.Values.relayStallProbe.enabled }}
            - name: stall-probe
              mountPath: /probe
            {{- end }}
      volumes:
        {{- if $root.Values.relayStallProbe.enabled }}
        - name: stall-probe
          configMap:
            name: {{ $root.Release.Name }}-relay-stall-probe
            defaultMode: 0755
        {{- end }}
        - name: connect-config
          configMap:
            name: {{ $root.Release.Name }}-tier-uplink-config-{{ $tier.id }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}
