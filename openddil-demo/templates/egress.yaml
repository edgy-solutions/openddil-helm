{{- if .Values.releasability.enabled }}
{{- /*
===========================================================================
egress — the releasability gate toward a C2, and the pane that shows it
===========================================================================
ADR-0043 Arc 2 Slice 2, ledger row LR-0043-C. Under compose both processes
borrow the projector image and bind-mount ./egress; a pod cannot, so they
run from the egress image, which bakes the code and the generated protos and
refuses to build if the decision tests fail.

ONE image, TWO Deployments. They are separate processes for the reason
pane_api.py's docstring gives: the gate's loop is a blocking Kafka consumer
and the pane is a synchronous HTTP server, and grafting one onto the other
means one blocks the other.

HUB ONLY. egress-c2-status is declared on the hub broker alone (topic-init),
for the recorded reason that a topic on a tier is a topic something on that
tier can produce to, and the gate's claim is that there is ONE boundary.
*/}}
{{- $hqBroker := printf "%s-redpanda-hq%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.redpandaHq.kafkaPort) }}
{{- $pgDsn := printf "postgres://%s:%s@%s-postgres-hq%s:%d/%s"
    .Values.postgresHq.auth.username
    .Values.postgresHq.auth.password
    .Release.Name
    (include "openddil.svcDomain" .)
    (int .Values.postgresHq.port)
    .Values.postgresHq.auth.database }}
{{- $topazUrl := printf "http://%s-topaz-hq%s:8383" .Release.Name (include "openddil.svcDomain" .) }}
{{- $image := include "openddil.image" (dict "name" .Values.egress.image.name "tag" .Values.egress.image.tag "digest" .Values.egress.image.digest "root" .) }}
{{- $pullPolicy := include "openddil.pullPolicy" (dict "policy" .Values.egress.image.pullPolicy "root" .) }}
{{- /*
Extra routes, kinds, the assembler and the forwarder -- all opt-in, all
off/empty by default, so a deployment that sets none of them renders this
file exactly as it rendered before they existed. See values.yaml's comments
on egress.routes/.kinds/.assembler/.forwarder/.stubSink for the shapes.
*/}}
{{- $routesMountPath := "/etc/openddil/egress-routes" }}
{{- $kindsMountPath := "/etc/openddil/egress-kinds" }}
{{- $assemblerConfigMountPath := "/etc/openddil/egress-assembler" }}
{{- $intakeConfigMountPath := "/etc/openddil/egress-intake" }}
{{- $forwarderConfigMountPath := "/etc/openddil/egress-forwarder" }}
{{- $forwarderTokenMountPath := "/etc/openddil/egress-forwarder-token" }}
{{- $credentialsMountPath := "/etc/openddil/egress-credentials" }}
{{- $stubArtifactsMountPath := "/etc/openddil/egress-stub-artifacts" }}
{{- $egressTrustExtraMountPath := "/etc/openddil/egress-trust-extra" }}
{{- $egressTrustMountPath := "/etc/openddil/egress-trust" }}
{{- range $i, $r := .Values.egress.routes }}
{{- if $r.group }}
{{- fail (printf "egress.routes[%d]: per-route 'group' is not supported -- every route shares the gate's ONE consumer group (routes.py refuses this too; see egress.yaml's comment on egress-gate-c2)" $i) }}
{{- end }}
{{- end }}
{{- $c2Route := dict "name" "c2" "source_topic" .Values.egress.sourceTopic "destination" .Values.egress.destination "sink_topic" .Values.egress.sinkTopic }}
{{- $allRoutes := prepend .Values.egress.routes $c2Route }}
{{- $routesJSON := toJson $allRoutes }}
{{- $gateProduces := list }}
{{- range $allRoutes }}
{{- $gateProduces = append $gateProduces (printf "hq/%s" .sink_topic) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-gate-c2
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-gate-c2" "root" .) | nindent 4 }}
  annotations:
    # "egress-gate-c2" is a CODE DEFAULT group id (matches the gate's own
    # component name; no group env var exists to derive from -- see the
    # Problem section of SPEC-consumer-declarations.md, measured on the lab:
    # a consumer reaching a broker through a proxy resolved to PROXY/...
    # under IP-based ownership, so a reset never quiesced it).
    openddil.io/consumer-groups: "hq/egress-gate-c2"
    # openddil.io/produces-topics -- every route's sink_topic, on hq: the
    # c2 route's is the SAME .Values.egress.sinkTopic value
    # OPENDDIL_EGRESS_SINK_TOPIC below reads, and the rest come from the
    # same $allRoutes list the routes ConfigMap is rendered from.
    openddil.io/produces-topics: {{ $gateProduces | uniq | join " " | quote }}
spec:
  # ONE REPLICA. The consumer group would split partitions between two, which
  # is safe for the decision, but the per-record DECISION log is the audit
  # trail and one process writing it is one place to read it.
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-gate-c2" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-gate-c2" "root" .) | nindent 8 }}
      annotations:
        # With releasability.liveReload the gate re-asks topaz-hq every
        # OPENDDIL_REGISTRY_REFRESH_S, so a registry change no longer restarts
        # it and `extra` is empty (only the bundle digest rolls it). With
        # liveReload off the gate resolves each route's destination once, at
        # startup, so a registry change must restart it too: same inputs as
        # topaz-hq's checksum/policy, so both roll on exactly the same upgrades.
        # Rolling together does not order them: a gate that starts before the
        # new topaz-hq serves still resolves against the old registry.
        checksum/registries: {{ include "openddil.policyChecksum" (dict "root" . "extra" (ternary (list) (list (toJson .Values.releasability.destinations)) .Values.releasability.liveReload.enabled)) | sha256sum | quote }}
        {{- if .Values.egress.routes }}
        checksum/routes: {{ $routesJSON | sha256sum | quote }}
        {{- end }}
        {{- if .Values.egress.kinds }}
        checksum/kinds: {{ toJson .Values.egress.kinds | sha256sum | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # No command override: the image's default command IS the gate.
        - name: gate
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          env:
            - name: OPENDDIL_EGRESS_BROKERS
              value: {{ $hqBroker | quote }}
            - name: OPENDDIL_EGRESS_SOURCE_TOPIC
              value: {{ .Values.egress.sourceTopic | quote }}
            - name: OPENDDIL_EGRESS_SINK_TOPIC
              value: {{ .Values.egress.sinkTopic | quote }}
            - name: OPENDDIL_EGRESS_DESTINATION
              value: {{ .Values.egress.destination | quote }}
            - name: OPENDDIL_TOPAZ_URL
              value: {{ $topazUrl | quote }}
            - name: OPENDDIL_REGISTRY_REFRESH_S
              value: {{ ternary (.Values.releasability.liveReload.intervalSeconds | toString) "0" .Values.releasability.liveReload.enabled | quote }}
            {{- if .Values.egress.routes }}
            - name: OPENDDIL_EGRESS_ROUTES_PATH
              value: {{ printf "%s/routes.json" $routesMountPath | quote }}
            {{- end }}
            {{- if .Values.egress.kinds }}
            - name: OPENDDIL_EGRESS_KINDS_DIR
              value: {{ $kindsMountPath | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          {{- if or .Values.egress.routes .Values.egress.kinds }}
          volumeMounts:
            {{- if .Values.egress.routes }}
            - name: egress-routes
              mountPath: {{ $routesMountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.egress.kinds }}
            - name: egress-kinds
              mountPath: {{ $kindsMountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.egress.routes .Values.egress.kinds }}
      volumes:
        {{- if .Values.egress.routes }}
        - name: egress-routes
          configMap:
            name: {{ .Release.Name }}-egress-routes
        {{- end }}
        {{- if .Values.egress.kinds }}
        - name: egress-kinds
          configMap:
            name: {{ .Release.Name }}-egress-kinds
        {{- end }}
      {{- end }}
{{- if .Values.egress.routes }}
---
# The route table itself (routes.py's own JSON shape). The C2 route is
# first, built from the SAME values the gate's env-fallback route has always
# used (sourceTopic/destination/sinkTopic) -- so adding no extra routes
# leaves OPENDDIL_EGRESS_ROUTES_PATH unset and the gate on its original,
# single env-derived route.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-routes
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  routes.json: {{ $routesJSON | quote }}
{{- end }}
{{- if .Values.egress.kinds }}
---
# One <Kind>.schema.json per declared kind (kinds.py's SCHEMA_SUFFIX),
# mounted read-only wherever OPENDDIL_EGRESS_KINDS_DIR points: the gate
# above, and the assembler below when it is enabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-kinds
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  {{- range $name, $schema := .Values.egress.kinds }}
  {{ $name }}.schema.json: {{ toJson $schema | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-egress-pane-api
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.egress.paneApi.port }}
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "egress-pane-api" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-pane-api
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-pane-api" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-pane-api" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-pane-api" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pane-api
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "-u", "/app/pane_api.py"]
          env:
            - name: OPENDDIL_EGRESS_PANE_PORT
              value: {{ .Values.egress.paneApi.port | quote }}
            - name: OPENDDIL_EGRESS_DESTINATION
              value: {{ .Values.egress.destination | quote }}
            - name: OPENDDIL_TOPAZ_URL
              value: {{ $topazUrl | quote }}
            - name: POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: http
              containerPort: {{ .Values.egress.paneApi.port }}
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
{{- if .Values.egress.assembler.enabled }}
---
# egress-assembler (ADR-0046) — reads the CM episode stream (and, when a
# config entry names one, a parts-availability stream) and assembles each
# into a declared kind's record. Own process, own consumer group: see the
# group-naming note on egress-gate-c2 above for why the gate's group stays
# untouched by anything this chart adds alongside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-assembler-config
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  config.json: {{ toJson .Values.egress.assembler.config | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-assembler
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-assembler" "root" .) | nindent 4 }}
  annotations:
    openddil.io/consumer-groups: "hq/egress-assembler"
    {{- with (include "openddil.egressConfigTopics" (dict "entries" .Values.egress.assembler.config "field" "output_topic")) }}
    # openddil.io/produces-topics -- each config entry's output_topic, on
    # hq, read from the SAME egress.assembler.config list the ConfigMap
    # above passes to the assembler. Omitted when no entry declares one.
    openddil.io/produces-topics: {{ . | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-assembler" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-assembler" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.egress.assembler.config | sha256sum | quote }}
        {{- if .Values.egress.kinds }}
        checksum/kinds: {{ toJson .Values.egress.kinds | sha256sum | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: assembler
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "-u", "/app/assembler.py"]
          env:
            - name: OPENDDIL_EGRESS_BROKERS
              value: {{ $hqBroker | quote }}
            - name: POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: OPENDDIL_ASSEMBLER_CONFIG
              value: {{ printf "%s/config.json" $assemblerConfigMountPath | quote }}
            {{- if .Values.egress.kinds }}
            - name: OPENDDIL_EGRESS_KINDS_DIR
              value: {{ $kindsMountPath | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: "INFO"
            {{- if .Values.picture.enabled }}
            - name: OPENDDIL_PICTURE_ENABLED
              value: "1"
            - name: OPENDDIL_PICTURE_PORT
              value: {{ .Values.picture.port | quote }}
            # Every picture answer is decided by the egress gate, so the
            # assembler reaches the same PDP as the other gate consumers.
            - name: OPENDDIL_TOPAZ_URL
              value: {{ $topazUrl | quote }}
            {{- end }}
          {{- if .Values.picture.enabled }}
          ports:
            - name: picture
              containerPort: {{ .Values.picture.port }}
          {{- end }}
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          volumeMounts:
            - name: egress-assembler-config
              mountPath: {{ $assemblerConfigMountPath }}
              readOnly: true
            {{- if .Values.egress.kinds }}
            - name: egress-kinds
              mountPath: {{ $kindsMountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: egress-assembler-config
          configMap:
            name: {{ .Release.Name }}-egress-assembler-config
        {{- if .Values.egress.kinds }}
        - name: egress-kinds
          configMap:
            name: {{ .Release.Name }}-egress-kinds
        {{- end }}
{{- if .Values.picture.enabled }}
---
# The assembler's picture endpoint, for the hub PEP to proxy to.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-egress-picture
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.picture.port }}
      targetPort: picture
      name: picture
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "egress-assembler" "root" .) | nindent 4 }}
---
# BYPASS PREVENTION, SAME SHAPE AS the *-pep-only policies. The picture
# endpoint does no authentication; the hub PEP's Bearer check is the only
# door, so only the hub PEP pod may reach that port.
#
# Selecting the assembler pod makes it default-deny for ingress. The
# assembler declares no other containerPort today (it is a Kafka consumer
# and serves nothing else), so there is no existing inbound traffic for this
# policy to preserve and no second rule is needed. A rule that allowed "all
# other ports" cannot be written (NetworkPolicy has no "except port"), and
# an allow-all rule would reopen the picture port. If the assembler ever
# exposes another port, add an explicit rule for it here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress-picture-pep-only
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-assembler" "root" .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # A: the hub PEP, on the picture port only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" "pep" "root" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.picture.port }}
{{- end }}
{{- end }}
{{- if .Values.egress.intake.enabled }}
---
# egress-intake (ADR-0046 §5) — polls a destination's artifacts by kind and
# turns each into a record the rest of the pipeline can carry. It PRODUCES
# from a destination's artifacts feed rather than consuming Kafka, so unlike
# the assembler/forwarder/gate it carries no openddil.io/consumer-groups
# annotation here.
#
# Its openddil.io/produces-topics is each config entry's onward_topic, on
# hq, read the same way as the assembler's output_topic above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-intake-config
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  config.json: {{ toJson .Values.egress.intake.config | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-intake
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-intake" "root" .) | nindent 4 }}
  {{- with (include "openddil.egressConfigTopics" (dict "entries" .Values.egress.intake.config "field" "onward_topic")) }}
  annotations:
    openddil.io/produces-topics: {{ . | quote }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-intake" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-intake" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.egress.intake.config | sha256sum | quote }}
        {{- if .Values.egress.kinds }}
        checksum/kinds: {{ toJson .Values.egress.kinds | sha256sum | quote }}
        {{- end }}
        # The intake resolves subjects through topaz too -- identical
        # computation to the gate's checksum/registries above
        # (egress-gate-c2), on purpose. With releasability.liveReload it
        # re-asks on the interval, so a registry change no longer restarts it;
        # with liveReload off it must roll with the registries.
        checksum/registries: {{ include "openddil.policyChecksum" (dict "root" . "extra" (ternary (list) (list (toJson .Values.releasability.destinations)) .Values.releasability.liveReload.enabled)) | sha256sum | quote }}
        {{- if .Values.egress.trust.caConfigMap }}
        checksum/egress-trust: {{ .Values.egress.trust.caConfigMap | sha256sum | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.egress.trust.caConfigMap }}
      # Extra CA trust (egress.trust.caConfigMap): assembles the image's own
      # system CA bundle plus every PEM in the ConfigMap into one file on an
      # emptyDir, so a destination behind a private/corporate CA verifies --
      # IN ADDITION to the system bundle, never instead of it. See
      # values.yaml's comment on egress.trust for the full contract.
      initContainers:
        - name: trust-bundle
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              system_bundle=/etc/ssl/certs/ca-certificates.crt
              if [ ! -f "$system_bundle" ]; then
                echo "trust-bundle: missing system CA bundle $system_bundle" >&2
                exit 1
              fi
              cat "$system_bundle" > {{ $egressTrustMountPath }}/ca-bundle.crt
              count=0
              for f in {{ $egressTrustExtraMountPath }}/*; do
                if [ -f "$f" ]; then
                  cat "$f" >> {{ $egressTrustMountPath }}/ca-bundle.crt
                  printf '\n' >> {{ $egressTrustMountPath }}/ca-bundle.crt
                  count=$((count + 1))
                fi
              done
              if [ "$count" -eq 0 ]; then
                echo "trust-bundle: no CA files found in {{ $egressTrustExtraMountPath }}" >&2
                exit 1
              fi
              echo "trust-bundle: $(grep -c 'BEGIN CERTIFICATE' {{ $egressTrustMountPath }}/ca-bundle.crt) certificates in bundle"
          volumeMounts:
            - name: egress-trust-extra
              mountPath: {{ $egressTrustExtraMountPath }}
              readOnly: true
            - name: egress-trust
              mountPath: {{ $egressTrustMountPath }}
      {{- end }}
      containers:
        - name: intake
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "-u", "/app/intake.py"]
          env:
            - name: OPENDDIL_EGRESS_BROKERS
              value: {{ $hqBroker | quote }}
            - name: OPENDDIL_EGRESS_INTAKE_CONFIG
              value: {{ printf "%s/config.json" $intakeConfigMountPath | quote }}
            - name: OPENDDIL_EGRESS_KINDS_DIR
              value: {{ $kindsMountPath | quote }}
            - name: POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: OPENDDIL_TOPAZ_URL
              value: {{ $topazUrl | quote }}
            - name: OPENDDIL_REGISTRY_REFRESH_S
              value: {{ ternary (.Values.releasability.liveReload.intervalSeconds | toString) "0" .Values.releasability.liveReload.enabled | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            {{- if .Values.egress.trust.caConfigMap }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/ca-bundle.crt" $egressTrustMountPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          volumeMounts:
            - name: egress-intake-config
              mountPath: {{ $intakeConfigMountPath }}
              readOnly: true
            {{- if .Values.egress.kinds }}
            - name: egress-kinds
              mountPath: {{ $kindsMountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.egress.credentials.existingSecret }}
            - name: egress-credentials
              mountPath: {{ $credentialsMountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.egress.trust.caConfigMap }}
            - name: egress-trust
              mountPath: {{ $egressTrustMountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: egress-intake-config
          configMap:
            name: {{ .Release.Name }}-egress-intake-config
        {{- if .Values.egress.kinds }}
        - name: egress-kinds
          configMap:
            name: {{ .Release.Name }}-egress-kinds
        {{- end }}
        {{- if .Values.egress.credentials.existingSecret }}
        # A destination's OAuth2 client secret (egress.credentials):
        # created out of band, mounted whole, read-only. The chart never
        # reads, creates or renders its value -- only the mount. `optional:
        # true` means a Secret that hasn't arrived yet shows up as
        # `no_credential` in the intake's own logs, not as this pod stuck
        # in ContainerCreating holding up the upgrade.
        - name: egress-credentials
          secret:
            secretName: {{ .Values.egress.credentials.existingSecret }}
            optional: true
            defaultMode: 0440
        {{- end }}
        {{- if .Values.egress.trust.caConfigMap }}
        # egress.trust.caConfigMap: created out of band, every key a PEM file
        # of one or more CA certificates. `optional: false` here, unlike
        # egress-credentials above -- a name set in values is a promise the
        # ConfigMap exists, and the trust-bundle initContainer already fails
        # the pod if it's missing or empty, so a silently-absent mount would
        # just move that failure somewhere harder to read.
        - name: egress-trust-extra
          configMap:
            name: {{ .Values.egress.trust.caConfigMap }}
            optional: false
        - name: egress-trust
          emptyDir: {}
        {{- end }}
{{- end }}
{{- if .Values.egress.forwarder.enabled }}
---
# egress-forwarder — the last hop: consumes one or more sink topics and
# POSTs each admitted record to its route's destination URL (forwarder.py).
# Own process, own consumer group, same reason as the assembler above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-forwarder-config
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  config.json: {{ toJson .Values.egress.forwarder.config | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-forwarder
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-forwarder" "root" .) | nindent 4 }}
  annotations:
    openddil.io/consumer-groups: "hq/egress-forwarder"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-forwarder" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-forwarder" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.egress.forwarder.config | sha256sum | quote }}
        {{- if .Values.egress.trust.caConfigMap }}
        checksum/egress-trust: {{ .Values.egress.trust.caConfigMap | sha256sum | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.egress.trust.caConfigMap }}
      # Extra CA trust (egress.trust.caConfigMap): assembles the image's own
      # system CA bundle plus every PEM in the ConfigMap into one file on an
      # emptyDir, so a destination behind a private/corporate CA verifies --
      # IN ADDITION to the system bundle, never instead of it. See
      # values.yaml's comment on egress.trust for the full contract.
      initContainers:
        - name: trust-bundle
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              system_bundle=/etc/ssl/certs/ca-certificates.crt
              if [ ! -f "$system_bundle" ]; then
                echo "trust-bundle: missing system CA bundle $system_bundle" >&2
                exit 1
              fi
              cat "$system_bundle" > {{ $egressTrustMountPath }}/ca-bundle.crt
              count=0
              for f in {{ $egressTrustExtraMountPath }}/*; do
                if [ -f "$f" ]; then
                  cat "$f" >> {{ $egressTrustMountPath }}/ca-bundle.crt
                  printf '\n' >> {{ $egressTrustMountPath }}/ca-bundle.crt
                  count=$((count + 1))
                fi
              done
              if [ "$count" -eq 0 ]; then
                echo "trust-bundle: no CA files found in {{ $egressTrustExtraMountPath }}" >&2
                exit 1
              fi
              echo "trust-bundle: $(grep -c 'BEGIN CERTIFICATE' {{ $egressTrustMountPath }}/ca-bundle.crt) certificates in bundle"
          volumeMounts:
            - name: egress-trust-extra
              mountPath: {{ $egressTrustExtraMountPath }}
              readOnly: true
            - name: egress-trust
              mountPath: {{ $egressTrustMountPath }}
      {{- end }}
      containers:
        - name: forwarder
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "-u", "/app/forwarder.py"]
          env:
            - name: OPENDDIL_EGRESS_BROKERS
              value: {{ $hqBroker | quote }}
            - name: OPENDDIL_FORWARD_CONFIG
              value: {{ printf "%s/config.json" $forwarderConfigMountPath | quote }}
            - name: POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            {{- if .Values.egress.trust.caConfigMap }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/ca-bundle.crt" $egressTrustMountPath | quote }}
            {{- end }}
            {{- with .Values.egress.forwarder.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: egress-forwarder-config
              mountPath: {{ $forwarderConfigMountPath }}
              readOnly: true
            {{- if .Values.egress.forwarder.tokenSecret }}
            - name: egress-forwarder-token
              mountPath: {{ $forwarderTokenMountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.egress.credentials.existingSecret }}
            - name: egress-credentials
              mountPath: {{ $credentialsMountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.egress.trust.caConfigMap }}
            - name: egress-trust
              mountPath: {{ $egressTrustMountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: egress-forwarder-config
          configMap:
            name: {{ .Release.Name }}-egress-forwarder-config
        {{- if .Values.egress.forwarder.tokenSecret }}
        # A config entry's `token_file` points at
        # {{ $forwarderTokenMountPath }}/token (documented on
        # egress.forwarder.tokenSecret in values.yaml). The chart never
        # reads, creates or renders the token itself -- only the mount.
        - name: egress-forwarder-token
          secret:
            secretName: {{ .Values.egress.forwarder.tokenSecret }}
            items:
              - key: token
                path: token
        {{- end }}
        {{- if .Values.egress.credentials.existingSecret }}
        # A destination's OAuth2 client secret (egress.credentials):
        # created out of band, mounted whole, read-only. The chart never
        # reads, creates or renders its value -- only the mount. `optional:
        # true` means a Secret that hasn't arrived yet shows up as
        # `no_credential` in the forwarder's own logs, not as this pod
        # stuck in ContainerCreating holding up the upgrade.
        - name: egress-credentials
          secret:
            secretName: {{ .Values.egress.credentials.existingSecret }}
            optional: true
            defaultMode: 0440
        {{- end }}
        {{- if .Values.egress.trust.caConfigMap }}
        # egress.trust.caConfigMap: created out of band, every key a PEM file
        # of one or more CA certificates. `optional: false` here, unlike
        # egress-credentials above -- a name set in values is a promise the
        # ConfigMap exists, and the trust-bundle initContainer already fails
        # the pod if it's missing or empty, so a silently-absent mount would
        # just move that failure somewhere harder to read.
        - name: egress-trust-extra
          configMap:
            name: {{ .Values.egress.trust.caConfigMap }}
            optional: false
        - name: egress-trust
          emptyDir: {}
        {{- end }}
{{- end }}
{{- if .Values.egress.stubSink.enabled }}
---
# egress-stub-sink (stub_sink.py) — the stand-in destination for a
# destination with no credential yet; see values.yaml's comment on
# egress.stubSink for the emptyDir persistence note.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-egress-stub-sink
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.egress.stubSink.port }}
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "egress-stub-sink" "root" .) | nindent 4 }}
---
# Artifacts the stub serves back out at GET /artifacts (stub_sink.py), for an
# intake polling a destination's artifacts by kind, per ADR-0046 §5. A
# separate ConfigMap from the stub's own emptyDir /data: that volume is the
# stub's received-records log, this one is read-only input the stub was
# given to answer with.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-stub-artifacts
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  artifacts.json: {{ toJson .Values.egress.stubSink.artifacts | quote }}
  {{- if .Values.egress.stubSink.respond }}
  response.json: {{ toJson .Values.egress.stubSink.respond | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-stub-sink
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-stub-sink" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-stub-sink" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-stub-sink" "root" .) | nindent 8 }}
      annotations:
        # A changed artifact list must roll the stub, the same way a changed
        # config rolls the assembler/forwarder above.
        {{- /* The answer config rolls it too, but only when set: an empty one
             keeps the expression below unchanged so existing releases don't roll. */}}
        {{- if .Values.egress.stubSink.respond }}
        checksum/artifacts: {{ toJson (list .Values.egress.stubSink.artifacts .Values.egress.stubSink.respond) | sha256sum | quote }}
        {{- else }}
        checksum/artifacts: {{ toJson .Values.egress.stubSink.artifacts | sha256sum | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: stub-sink
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "-u", "/app/stub_sink.py"]
          env:
            - name: STUB_SINK_DIR
              value: "/data"
            - name: STUB_SINK_PORT
              value: {{ .Values.egress.stubSink.port | quote }}
            - name: STUB_SINK_KIND_FIELD
              value: {{ .Values.egress.stubSink.kindField | quote }}
            - name: STUB_SINK_ID_FIELD
              value: {{ .Values.egress.stubSink.idField | quote }}
            - name: OPENDDIL_STUB_ARTIFACTS_PATH
              value: {{ printf "%s/artifacts.json" $stubArtifactsMountPath | quote }}
            {{- if .Values.egress.stubSink.respond }}
            - name: OPENDDIL_STUB_RESPONSE_PATH
              value: {{ printf "%s/response.json" $stubArtifactsMountPath | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: http
              containerPort: {{ .Values.egress.stubSink.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            # emptyDir, NOT a PVC: the cluster's PVCs are NFS-backed, and an
            # emptyDir survives a container restart but not a reschedule --
            # see values.yaml's comment on egress.stubSink.
            - name: data
              mountPath: /data
            - name: egress-stub-artifacts
              mountPath: {{ $stubArtifactsMountPath }}
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: egress-stub-artifacts
          configMap:
            name: {{ .Release.Name }}-egress-stub-artifacts
{{- end }}
{{- if .Values.egress.tak.enabled }}
{{- /*
---------------------------------------------------------------------------
TAK server + CoT adapter — the hub's stand-in C2, fed from the gate's sink
---------------------------------------------------------------------------
Off by default: see values.yaml's comment on egress.tak.enabled for why (the
image has to be reachable from the cluster's own registry first).

ONE TAK SERVER IS ONE AUDIENCE. taky replays every tracked non-stale `a-*`
event to a client on connect and broadcasts to every connected socket
(router.send_persist) — it has no per-client filtering. The NetworkPolicy in
releasability.yaml (`<rel>-tak-server-readers-only`) is what keeps that
single undifferentiated picture scoped to this destination's own audience.
*/}}
{{- $takImage := include "openddil.image" (dict "name" .Values.egress.tak.image.name "tag" .Values.egress.tak.image.tag "digest" .Values.egress.tak.image.digest "root" .) }}
{{- $takPullPolicy := include "openddil.pullPolicy" (dict "policy" .Values.egress.tak.image.pullPolicy "root" .) }}
{{- $tlsCfg := .Values.egress.tak.tls }}
{{- if $tlsCfg.enabled }}
{{- if not $tlsCfg.secretName }}
{{- fail "egress.tak.tls.enabled requires egress.tak.tls.secretName (Secret keys: server.pem, server.key, ca.pem)" }}
{{- end }}
{{- if not $tlsCfg.allowedClientCNs }}
{{- fail "egress.tak.tls.enabled requires at least one entry in egress.tak.tls.allowedClientCNs" }}
{{- end }}
{{- end }}
{{- $tlsImage := include "openddil.thirdPartyImage" $tlsCfg.proxy.image }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tak-server
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.egress.tak.port }}
      name: cot
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "tak-server" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tak-server
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "tak-server" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "tak-server" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "tak-server" "root" .) | nindent 8 }}
      {{- if $tlsCfg.enabled }}
      annotations:
        # Rolls the pod when the admitted-CN list or the cert Secret NAME
        # changes -- not the Secret's content, which this chart never reads.
        # A CN removed here and a pod left running on the old ghostunnel
        # --allow-cn list would keep admitting a "revoked" device until the
        # next unrelated rollout; this annotation makes removal self-enforcing.
        checksum/tak-tls: {{ printf "%s/%s" $tlsCfg.secretName (toJson $tlsCfg.allowedClientCNs) | sha256sum | quote }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        # No command override: the image's default command IS taky.
        - name: tak-server
          image: {{ $takImage }}
          imagePullPolicy: {{ $takPullPolicy }}
          ports:
            - name: cot
              containerPort: {{ .Values.egress.tak.port }}
          # TCP, not HTTP: CoT over this port is a raw XML stream, the same
          # bare-connect check compose's healthcheck uses.
          readinessProbe:
            tcpSocket: { port: {{ .Values.egress.tak.port }} }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: {{ .Values.egress.tak.port }} }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.egress.tak.resources | nindent 12 }}
          # taky's persistence is IN-MEMORY (router.send_persist tracks state
          # for the life of the process). A restart loses the whole picture
          # until the adapter's next records repopulate it — seconds on a
          # live hub — which is why no volume is mounted here: there is
          # nothing durable to mount.
        {{- if $tlsCfg.enabled }}
        # tls-proxy — a ghostunnel sidecar, NOT a change to taky. taky stays
        # plaintext on `egress.tak.port` exactly as above; this terminates
        # mutual TLS on its own port and forwards over loopback, which the
        # readers-only NetworkPolicy does not see (loopback never crosses a
        # pod's network namespace boundary) -- so 8087 stays scoped to the
        # adapter and declared in-namespace readers exactly as before, and
        # only this port is what opens to a source outside the cluster.
        #
        # WHY A SIDECAR, NOT TLS IN TAKY ITSELF: taky 0.10 has no per-client
        # admission of its own (router.send_persist broadcasts to every
        # connected socket -- see the file-level comment above), so putting
        # TLS in taky would still leave "anyone with a client cert from the
        # right CA" as the whole admission check. ghostunnel's --allow-cn
        # gets per-CN admission without touching taky: revoking a device is
        # removing its CN from `allowedClientCNs` and upgrading, not a code
        # change or a taky restart that drops the in-memory picture.
        #
        # THE AUDIENCE RULE (repeated at the point it bites): admitting a
        # CN here admits that device to everything this TAK server's
        # audience receives -- the same one-destination, no-per-client-
        # filter picture egress.destination already defines for every other
        # reader of port 8087.
        - name: tls-proxy
          image: {{ $tlsImage }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" "" "root" .) }}
          args:
            - server
            - --listen
            - {{ printf "0.0.0.0:%d" (int $tlsCfg.port) | quote }}
            - --target
            - {{ printf "127.0.0.1:%d" (int .Values.egress.tak.port) | quote }}
            - --cert
            - /certs/server.pem
            - --key
            - /certs/server.key
            - --cacert
            - /certs/ca.pem
            {{- range $tlsCfg.allowedClientCNs }}
            - --allow-cn
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: tak-tls
              containerPort: {{ $tlsCfg.port }}
          readinessProbe:
            tcpSocket: { port: {{ $tlsCfg.port }} }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: {{ $tlsCfg.port }} }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml $tlsCfg.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: tak-tls-certs
              mountPath: /certs
              readOnly: true
        {{- end }}
      {{- if $tlsCfg.enabled }}
      volumes:
        - name: tak-tls-certs
          secret:
            secretName: {{ $tlsCfg.secretName }}
      {{- end }}
{{- if $tlsCfg.enabled }}
---
# External mTLS entry point for the sidecar above. The existing ClusterIP
# Service (`{{ .Release.Name }}-tak-server`, port {{ .Values.egress.tak.port }}) is unchanged --
# this is an ADDITIONAL Service, selecting the SAME pod, on the TLS port only.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tak-server-tls
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  type: {{ $tlsCfg.service.type }}
  ports:
    - port: {{ $tlsCfg.port }}
      targetPort: tak-tls
      name: tak-tls
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "tak-server" "root" .) | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress-cot-adapter-c2
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "egress-cot-adapter-c2" "root" .) | nindent 4 }}
  annotations:
    openddil.io/consumer-groups: "hq/egress-cot-adapter-c2"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "egress-cot-adapter-c2" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "egress-cot-adapter-c2" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cot-adapter
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "-u", "/app/cot_adapter.py"]
          env:
            - name: OPENDDIL_COT_BROKERS
              value: {{ $hqBroker | quote }}
            # DERIVED FROM THE GATE'S SINK, NOT A SEPARATE KNOB -- ON PURPOSE.
            # The design measured the source topic as the connector's only
            # safeguard: pointed at the gate's SOURCE topic instead, it
            # carried 15 uids onto the picture instead of 8, because the
            # source carries every asset the gate has not yet decided on.
            # Giving this its own value would let it drift from the sink and
            # silently widen the audience back to "everyone upstream of the
            # gate" -- exactly the bypass the gate exists to prevent.
            - name: OPENDDIL_COT_SOURCE_TOPIC
              value: {{ .Values.egress.sinkTopic | quote }}
            - name: OPENDDIL_COT_GROUP
              value: "egress-cot-adapter-c2"
            - name: OPENDDIL_COT_TAK_HOST
              value: {{ printf "%s-tak-server%s" .Release.Name (include "openddil.svcDomain" .) | quote }}
            - name: OPENDDIL_COT_TAK_PORT
              value: {{ .Values.egress.tak.port | quote }}
            - name: OPENDDIL_COT_STALE_S
              value: {{ .Values.egress.tak.staleSeconds | quote }}
            - name: OPENDDIL_COT_TYPE
              value: {{ .Values.egress.tak.cotType | quote }}
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
{{- end }}
{{- end }}
