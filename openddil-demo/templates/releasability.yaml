{{- if .Values.releasability.enabled }}
{{- $root := . }}
# =============================================================================
# ADR-0029 Arc 2 Slice 1 — read-path releasability enforcement
# =============================================================================
# Two components, deployed together because neither is meaningful alone:
#
#   topaz-hq   the PDP. One Topaz at the HQ tier, per ADR-0029 §6 — the
#              read-path gateway it serves is an HQ-tier component. This is a
#              SCOPE decision, not a revision of the architecture: the
#              architecture is one local authorizer per tier, and per-tier
#              locals land with the tier-bridge slice, which is the first
#              slice where an edge must decide during severance.
#
#   pep        the read-path gateway. A reverse proxy in front of Electric's
#              shape endpoint that owns the WHERE clause.
#
# DEFAULT OFF. Enabling this changes what users can see, and a chart that
# turns on enforcement by default would turn it on in deployments whose §7
# completeness gate has never been run. Label first, enforce second.
#
# ---------------------------------------------------------------------------
# WHY THE PEP GOES HERE AND NOWHERE ELSE
# ---------------------------------------------------------------------------
# The PEP goes at the one read surface users actually touch, on the tier that
# serves them, and nothing else may reach that surface. Recorded so the
# alternatives are not re-litigated:
#
#   frontend filtering    bypassed by anyone with a dev-tools tab
#   Postgres RLS          Electric reads via replication as its OWN database
#                         role, not as the end user, so RLS never sees who is
#                         asking. Dead on arrival for this read path.
#   per-nation stores     ADR-0029 rejected it; the coalition liaison breaks
#   inside Electric       no policy hook exists; modifying it forks a dep
#
# BYPASS PREVENTION IS NETWORK TOPOLOGY, NOT APPLICATION LOGIC. Electric's
# shape endpoint is ClusterIP with no ingress route, and the NetworkPolicy
# below admits only the PEP. The frontend is given the PEP's URL and never
# holds an Electric URL.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES *NOT* COVER — say so, so "PEP live" is not read as "enforced"
# ---------------------------------------------------------------------------
#   * INTERNAL SERVICE READS (fusion into edge brokers, Restate
#     subscriptions, the projector) are system-to-system, inside one tier,
#     and not user-facing. ADR-0029 §4 does not gate them: the data has
#     already been admitted to that tier.
#   * EGRESS — connectors publishing outward, tier bridges forwarding upward
#     or laterally — is Slice 2 and is NOT enforced by anything here.
#
# Those are different gates against different adversaries. This one protects
# against the WRONG PERSON: a user asking for data they are not entitled to,
# decided per subject, and its failure mode is a human seeing a screen they
# should not. The egress gate protects against the WRONG DESTINATION, decided
# per link, and its failure mode is a system durably HOLDING data it should
# not, with no human in the loop to notice. Sharing the policy engine is what
# keeps them from drifting into two truths; separating the enforcement points
# is what makes each complete for its own threat.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-topaz-hq-config
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  # VERIFIED against topazd 0.33.16 by running it (2026-08-09 deployment
  # gate). `plugins` and `decision_logger` — both documented online and
  # present in the published JSON schema — are REJECTED by this build with
  # "'config.Config' has invalid keys", and the co-located reasoning plane
  # running the same generation carries no such block either. So there is no
  # newer version to inherit and no solved configuration to copy.
  #
  # Consequence, stated rather than left implicit: TOPAZ LOGS NO DECISIONS
  # HERE. The PEP's own decision log is the audit trail, not defence in depth
  # alongside a second independent record.
  config.yaml: |
    version: 2
    logging:
      prod: true
      log_level: info
    directory:
      db_path: /db/hq.db
      request_timeout: 5s
    api:
      health:
        listen_address: "0.0.0.0:9494"
      services:
        authorizer:
          grpc:
            connection_timeout_seconds: 2
            listen_address: "0.0.0.0:8282"
          gateway:
            listen_address: "0.0.0.0:8383"
            # Plaintext inside the cluster; the tier's mesh boundary is the
            # trust boundary. Revisit with mTLS.
            http: true
    opa:
      instance_id: openddil-hq
      graceful_shutdown_period_seconds: 2
      local_bundles:
        paths:
          - /policy
        skip_verification: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-topaz-hq
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8282
      name: grpc
    - port: 8383
      name: authz-http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "topaz-hq" "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-topaz-hq
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "topaz-hq" "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "topaz-hq" "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "topaz-hq" "root" $root) | nindent 8 }}
      annotations:
        # Roll the pod when the policy changes. The bundle image is a rolling
        # tag, so without this a helm upgrade that ships new policy leaves the
        # old policy running and reports success — the rolling-tag hazard, in
        # the one component where a stale artifact means stale ENFORCEMENT.
        openddil.io/policy-revision: {{ $root.Release.Revision | quote }}
    spec:
      initContainers:
        # THE ENTITLEMENTS FILE IS RENAMED IN TRANSIT, AND THAT IS CALLED OUT
        # IN BOTH PLACES. The reviewed artifact is policy/users.yaml; OPA's
        # bundle convention names data files `data.yaml`, and the bundle's
        # .manifest declares roots ["openddil"], so data outside that root is
        # refused outright. Hence /policy/openddil/data.yaml.
        #
        # A silent rename during transport is exactly how a reviewed file and
        # a running file drift apart, so: same content, different name, said
        # out loud here and in users.yaml's header.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/policy/.manifest"          "dst" "policy/.manifest")
            (dict "src" "demo/policy/releasability.rego" "dst" "policy/releasability.rego")
          ) "root" $root) | nindent 8 }}
        # THE ENTITLEMENTS CORPUS, SELECTED BY ENV RATHER THAN BY TEMPLATE.
        #
        # A separate init container from the one above, for one reason: the
        # variant must be changeable with a single command against a running
        # release, so the demo's last beat ("policy is configuration") is one
        # keystroke rather than a helm upgrade.
        #
        #   kubectl set env deploy/<release>-topaz-hq -c policy-loader \
        #       OPENDDIL_POLICY_VARIANT=users-promoted
        #
        # which rolls the authorizer with the other corpus mounted.
        #
        # THE RENAME IS STILL CALLED OUT. The reviewed artifact is
        # policy/<variant>.yaml; OPA's bundle convention names data files
        # `data.yaml`, and the .manifest declares roots ["openddil"], so data
        # outside that root is refused outright. Same content, different name
        # and path — said out loud here and in users.yaml's header, because a
        # silent rename in transport is how a reviewed file and a running file
        # drift apart.
        - name: policy-loader
          image: {{ include "openddil.image" (dict "name" $root.Values.bundle.image.name "tag" $root.Values.bundle.image.tag "digest" $root.Values.bundle.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.bundle.image.pullPolicy "root" $root) }}
          env:
            - name: OPENDDIL_POLICY_VARIANT
              value: {{ $root.Values.releasability.policyVariant | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              src="/bundle/demo/policy/${OPENDDIL_POLICY_VARIANT}.yaml"
              # A variant name that does not exist would otherwise produce an
              # EMPTY data document, and an empty corpus is a working
              # authorizer that denies everyone — indistinguishable from a
              # correctly-enforced revocation, and arriving without an error.
              # Refuse instead.
              if [ ! -f "$src" ]; then
                echo "FATAL: no entitlements corpus at $src" >&2
                echo "available:" >&2
                ls /bundle/demo/policy/*.yaml >&2
                exit 1
              fi
              mkdir -p /shared/policy/openddil
              cp "$src" /shared/policy/openddil/data.yaml
              echo "entitlements corpus: ${OPENDDIL_POLICY_VARIANT}.yaml -> /policy/openddil/data.yaml"
          resources:
            {{- toYaml $root.Values.bundle.initResources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /shared
      containers:
        - name: topaz
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.topaz.image.repository "tag" $root.Values.releasability.topaz.image.tag "digest" $root.Values.releasability.topaz.image.digest "root" $root) }}
          # THE PROVEN INVOCATION — established by running the image, not
          # inferred. `args: ["run"]` alone exits with
          #   required flag(s) "config-file" not set
          args: ["run", "--config-file", "/config/config.yaml"]
          ports:
            - containerPort: 8282
              name: grpc
            - containerPort: 8383
              name: authz-http
            - containerPort: 9494
              name: health
          # TCP, not HTTP. Topaz's health service on 9494 speaks the gRPC
          # health protocol; an HTTP GET never becomes ready and the pod sits
          # 0/1 forever while the logs say every server started.
          readinessProbe:
            tcpSocket: { port: 8282 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.releasability.topaz.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bundle-shared
              mountPath: /policy
              subPath: policy
            - name: db
              mountPath: /db
      volumes:
        - name: config
          configMap:
            name: {{ $root.Release.Name }}-topaz-hq-config
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.topaz.policyVolumeSize }}
        - name: db
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.topaz.dbVolumeSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-pep
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "pep" "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-pep
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "pep" "root" $root) | nindent 4 }}
spec:
  # ONE REPLICA, AND THE REASON IS AN AUTHORIZATION PROPERTY, NOT A CAPACITY
  # ONE. The PEP binds Electric shape handles to the subject they were minted
  # for, in memory. A second replica would not know the first replica's
  # bindings and would refuse valid resumptions — failing CLOSED, which is the
  # right direction, but confusingly. Scaling out needs shared handle storage;
  # Slice 1 says so rather than pretending the component is stateless.
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "pep" "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "pep" "root" $root) | nindent 8 }}
      annotations:
        openddil.io/policy-revision: {{ $root.Release.Revision | quote }}
    spec:
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/gateway" "dst" "app")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: pep
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.pep.image.repository "tag" $root.Values.releasability.pep.image.tag "digest" $root.Values.releasability.pep.image.digest "root" $root) }}
          # Stdlib-only source from the bundle, run by a stock python image.
          # No pip, so no network at boot and nothing to resolve — a component
          # whose job is to refuse requests must not have a dependency that
          # can fail to install.
          command: ["python", "-u", "/app/pep.py"]
          env:
            - name: OPENDDIL_ELECTRIC_URL
              value: {{ printf "http://%s-electric-sync%s:%v" $root.Release.Name (include "openddil.svcDomain" $root) $root.Values.electric.port | quote }}
            - name: OPENDDIL_TOPAZ_URL
              value: {{ printf "http://%s-topaz-hq%s:8383" $root.Release.Name (include "openddil.svcDomain" $root) | quote }}
            - name: OPENDDIL_PEP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ $root.Values.releasability.pep.logLevel | quote }}
            {{- if $root.Values.releasability.oidc.enabled }}
            # --- authentication (BFF) ---------------------------------------
            # Setting OPENDDIL_OIDC_ISSUER is what selects `oidc` auth mode.
            # The PEP refuses to start if the issuer is set and the secret or
            # redirect URI is not — a gateway that silently fell back to
            # header mode because a secret was missing would be a fail-open
            # wearing a configuration error as a disguise.
            - name: OPENDDIL_OIDC_ISSUER
              value: {{ include "openddil.keycloakIssuer" $root | quote }}
            # The address THIS PROCESS uses. Differs from the issuer because
            # the browser arrives through the ingress and this pod goes
            # straight to the Service; conflating them is the standard way
            # this breaks. See gateway/oidc.py, "the two-address problem".
            - name: OPENDDIL_OIDC_INTERNAL_ISSUER
              value: {{ printf "http://%s-keycloak%s:8080%s/realms/%s" $root.Release.Name (include "openddil.svcDomain" $root) ($root.Values.releasability.keycloak.basePath | trimSuffix "/") $root.Values.releasability.keycloak.realm | quote }}
            - name: OPENDDIL_OIDC_CLIENT_ID
              value: {{ $root.Values.releasability.oidc.clientId | quote }}
            - name: OPENDDIL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-pep-oidc
                  key: client-secret
            - name: OPENDDIL_OIDC_REDIRECT_URI
              value: {{ include "openddil.pepRedirectUri" $root | quote }}
            # SESSION LIFETIME IS A DDIL PARAMETER, NOT A SECURITY CONSTANT.
            # Existing sessions survive a severed link (validation is against
            # a cached JWKS and a local session table); NEW LOGINS DO NOT,
            # because the code exchange is a live call. So this value is
            # "long enough to outlast a plausible severance window, short
            # enough to bound a stolen cookie" — a deployment decision.
            - name: OPENDDIL_SESSION_TTL_SECONDS
              value: {{ $root.Values.releasability.oidc.sessionTtlSeconds | quote }}
            - name: OPENDDIL_COOKIE_SAMESITE
              value: {{ $root.Values.releasability.oidc.cookieSameSite | quote }}
            - name: OPENDDIL_COOKIE_SECURE
              value: {{ ternary "true" "false" (not (empty $root.Values.ingress.tls)) | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.releasability.pep.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app
              subPath: app
      volumes:
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.pep.appVolumeSize }}
{{- if $root.Values.releasability.oidc.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $root.Release.Name }}-pep-oidc
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
type: Opaque
stringData:
  # THE CONFIDENTIAL CLIENT-S CREDENTIAL. It is what makes this a
  # backend-for-frontend rather than a public SPA client: the browser never
  # sees it and never sees a token.
  #
  # A chart default is a published secret and is therefore only ever
  # acceptable in a lab. `helm upgrade` without an override reuses whatever
  # is in values, so a deployment that means it sets
  # releasability.oidc.clientSecret from its own secret store.
  client-secret: {{ required "releasability.oidc.clientSecret is required when oidc is enabled" $root.Values.releasability.oidc.clientSecret | quote }}
{{- end }}
{{- if $root.Values.releasability.keycloak.enabled }}
---
# ===========================================================================
# keycloak — the identity provider. AUTHENTICATION ONLY.
# ===========================================================================
# It answers WHO THIS IS. It does not answer what they may see: that is
# Topaz's job, decided against the git-asserted entitlements corpus. The one
# value that crosses the seam is the stable subject id (`sub`), used as the
# join key into policy/users.yaml.
#
# Keycloak may perfectly well carry groups or roles. Nothing here reads them,
# and nothing should start to — a deployment with entitlements in both places
# has two truths to keep in sync and no way to tell which one an operator's
# screen reflected.
#
# ⚠ THIS IS A DEMO IDENTITY PROVIDER. `start-dev`, an in-memory H2 database,
# published passwords in a realm file committed to a public repository, and
# no TLS. Every one of those is correct for a lab and disqualifying anywhere
# else. A real deployment points OPENDDIL_OIDC_ISSUER at the identity
# provider it already runs and deletes this block — which is the whole reason
# the PEP takes an issuer URL rather than embedding a Keycloak client.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-keycloak-realm
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  # The realm template arrives from the runtime bundle (it lives beside the
  # policy it is paired with). This ConfigMap holds only the substitutions,
  # so the reviewed realm file stays in one place and the deployment-specific
  # values stay in the chart.
  substitutions.sh: |
    set -eu
    # The client secret and the redirect URI are the two values the realm
    # cannot know. Substituting them here — rather than committing them —
    # keeps the realm file reviewable and the secret out of the repository.
    #
    # THE REDIRECT URI IS EXACT AND HAS NO WILDCARD. A wildcard redirect on
    # an OIDC client is how an authorization code ends up somewhere other
    # than the gateway that asked for it; the sibling project's UI client
    # carries `["*"]` and this one deliberately does not.
    #
    # TWO DISTINCT PLACEHOLDERS, SUBSTITUTED BY NAME. The first version of
    # this used ONE placeholder for both values and told them apart by
    # anchoring on what followed — which matched NEITHER, because one line
    # ends `",` and the other `" ],`. Nothing about that was visible in the
    # template; it surfaced as Keycloak importing a client whose secret was
    # the literal placeholder. Clever matching on a shared literal is how a
    # substitution silently does nothing.
    sed -e "s|__PEP_CLIENT_SECRET__|${OPENDDIL_PEP_CLIENT_SECRET}|g" \
        -e "s|__PEP_REDIRECT_URI__|${OPENDDIL_PEP_REDIRECT_URI}|g" \
        /bundle-realm/realm-openddil.json > /import/realm-openddil.json
    # THE GUARD CAUGHT THE BUG ABOVE, which is the argument for it existing
    # at all: a realm that imports with an unsubstituted secret produces a
    # client nobody can authenticate against, and the symptom appears three
    # components away, as a login failure.
    if grep -q "__[A-Z_]*__" /import/realm-openddil.json; then
      echo "FATAL: a placeholder survived substitution:" >&2
      grep -o "__[A-Z_]*__" /import/realm-openddil.json | sort -u >&2
      exit 1
    fi
    echo "realm prepared: $(grep -c '\"id\"' /import/realm-openddil.json) pinned ids"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-keycloak
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "keycloak" "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-keycloak
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "keycloak" "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "keycloak" "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "keycloak" "root" $root) | nindent 8 }}
      annotations:
        openddil.io/policy-revision: {{ $root.Release.Revision | quote }}
    spec:
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/policy/realm-openddil.json" "dst" "bundle-realm/realm-openddil.json")
          ) "root" $root) | nindent 8 }}
        - name: prepare-realm
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.keycloak.image.repository "tag" $root.Values.releasability.keycloak.image.tag "digest" $root.Values.releasability.keycloak.image.digest "root" $root) }}
          command: ["sh", "/subst/substitutions.sh"]
          env:
            - name: OPENDDIL_PEP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-pep-oidc
                  key: client-secret
            - name: OPENDDIL_PEP_REDIRECT_URI
              value: {{ include "openddil.pepRedirectUri" $root | quote }}
          volumeMounts:
            - { name: subst,         mountPath: /subst }
            - { name: bundle-shared, mountPath: /bundle-realm, subPath: bundle-realm }
            - { name: import,        mountPath: /import }
      containers:
        - name: keycloak
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.keycloak.image.repository "tag" $root.Values.releasability.keycloak.image.tag "digest" $root.Values.releasability.keycloak.image.digest "root" $root) }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ $root.Values.releasability.keycloak.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ $root.Values.releasability.keycloak.adminPassword | quote }}
            # Serve under a sub-path so the IdP shares the app's host, and
            # therefore its site. See the ingress rule and the SameSite note
            # in gateway/oidc.py.
            - name: KC_HTTP_RELATIVE_PATH
              value: {{ $root.Values.releasability.keycloak.basePath | quote }}
            # THE ISSUER THE BROWSER SEES. Without this, Keycloak derives the
            # issuer from the inbound request, so a token minted through the
            # ingress and a discovery document fetched through the Service
            # disagree — and the PEP's issuer check correctly rejects a token
            # that is, in every other respect, valid. Pinning it makes `iss`
            # one string regardless of how the request arrived.
            - name: KC_HOSTNAME
              value: {{ include "openddil.keycloakPublicUrl" $root | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # AN EXPLICIT HEAP CAP, NOT A BIGGER LIMIT.
            #
            # Keycloak was OOMKilled at 1Gi and again at 2Gi. Raising the
            # limit alone does not help, because the JVM sizes its heap as a
            # PERCENTAGE of whatever limit it is given and then needs
            # metaspace, code cache, thread stacks and direct buffers on top
            # — so a larger limit produces a proportionally larger heap and
            # the same overshoot.
            #
            # Capping the heap absolutely and leaving generous headroom above
            # it is the fix. The kill happens OUTSIDE the JVM, which is why
            # the container log ends mid-startup with no error: there is no
            # OutOfMemoryError to print, the process is simply gone.
            - name: JAVA_OPTS_APPEND
              value: {{ $root.Values.releasability.keycloak.javaOpts | quote }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: {{ printf "%s/realms/openddil/.well-known/openid-configuration" (trimSuffix "/" $root.Values.releasability.keycloak.basePath) }}
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml $root.Values.releasability.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: subst
          configMap:
            name: {{ $root.Release.Name }}-keycloak-realm
        - name: bundle-shared
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.keycloak.realmVolumeSize }}
        - name: import
          emptyDir:
            sizeLimit: {{ $root.Values.releasability.keycloak.realmVolumeSize }}
{{- end }}
{{- if $root.Values.releasability.lockDownElectric }}
---
# BYPASS PREVENTION. Without this the PEP is a suggestion: any pod in the
# namespace — including a browser reaching a port-forward — can talk to
# Electric directly and read every nation's rows. Enforcement that can be
# stepped around is not enforcement, and the step around it is one hostname.
#
# Off by default because it will break any existing direct consumer, and
# breaking reads is not something a chart should do without being asked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-electric-pep-only
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "electric-sync" "root" $root) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" "pep" "root" $root) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $root.Values.electric.port }}
{{- end }}
{{- end }}
