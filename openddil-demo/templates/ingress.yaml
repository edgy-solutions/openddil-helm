{{- if .Values.ingress.enabled }}
{{- /*
   ingress.yaml — single catch-all rule pointing at the frontend.

   /electric/v1/shape requests fall through to the frontend Service, where
   nginx's `location /electric/` block (frontend/nginx.conf) strips the
   prefix and proxies in-cluster to electric-sync. Same-origin, no CORS,
   no separate ingress rule for electric-sync.

   Earlier revisions had a second `/electric` rule pointing straight at
   electric-sync. That bypassed nginx, so the rewrite never ran and
   electric-sync received the unstripped `/electric/v1/shape` path and
   returned 404. Removed.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if and .Values.releasability.enabled .Values.releasability.keycloak.enabled }}
          # The identity provider, on the SAME HOST as the app.
          #
          # Same host means same-site under the eTLD+1 rule, which is what
          # lets the session cookie use SameSite=Strict if a deployment wants
          # it — and it removes CORS from the login round trip entirely.
          # A separate hostname works too and needs Lax; see the SameSite note
          # in gateway/oidc.py for why that choice is not free.
          #
          # LISTED FIRST BECAUSE INGRESS PATH MATCHING IS LONGEST-PREFIX PER
          # CONTROLLER, NOT DOCUMENT ORDER — but ordering it ahead of `/`
          # costs nothing and makes the intent legible to a reader who does
          # not know that.
          - path: {{ .Values.releasability.keycloak.basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  number: 8080
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
