{{- if .Values.ingress.enabled }}
{{- /*
   ingress.yaml — single catch-all rule pointing at the frontend.

   /electric/v1/shape requests fall through to the frontend Service, where
   nginx's `location /electric/` block (frontend/nginx.conf) strips the
   prefix and proxies in-cluster to electric-sync. Same-origin, no CORS,
   no separate ingress rule for electric-sync.

   Earlier revisions had a second `/electric` rule pointing straight at
   electric-sync. That bypassed nginx, so the rewrite never ran and
   electric-sync received the unstripped `/electric/v1/shape` path and
   returned 404. Removed.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
