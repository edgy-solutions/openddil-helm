{{- /*
==============================================================================
openddil-logistics-sim — per-element sub-component telemetry simulator
==============================================================================
Renamed from mrad-sim 2026-06-13 to reflect the wider framing: multi-
profile, covers MRAD today, LTAMDS / Patriot / future as config additions.

Discovers asset_profiles-matching assets from telemetry-latest-state on
every edge broker, tracks per-asset OperationalState (power_state /
health_state / actively_transmitting / actively_receiving), generates
synthetic per-element health/temp/load values from per-profile
synthesis knobs honoring the upstream operational state, publishes
one whole-asset snapshot per tick to asset-element-telemetry on HQ.

Gating: rendered only when .Values.logisticsSim.enabled. Disable to
demo without the sim (SensorArrayView falls back to seeded-RNG
synthesis -- demo still looks alive, just without cross-asset drift
that mirrors the customer-sim state).

Single replica by design. HPA NOT supported (double-publish would
just waste bytes; offsets idempotent per-tick).
*/ -}}
{{- if .Values.logisticsSim.enabled }}
{{- $cfg := .Values.logisticsSim }}
{{- $svcDomain := include "openddil.svcDomain" . }}
{{- $edgePairs := list }}
{{- range $edge := .Values.edges }}
{{- $edgePairs = append $edgePairs (printf "%s=%s-redpanda-%s%s:%d" $edge.id $.Release.Name $edge.id $svcDomain (int $.Values.redpandaEdge.internalPort)) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-logistics-sim-config
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "logistics-sim" "root" .) | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg.config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-logistics-sim
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "logistics-sim" "root" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "logistics-sim" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "logistics-sim" "root" .) | nindent 8 }}
      annotations:
        # Roll the pod when the config block changes -- the sim only reads
        # config at startup. Hash-on-checksum is the standard helm idiom.
        checksum/config: {{ toYaml $cfg.config | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # bundle-loader brings in:
        #   - openddil.* python proto bindings (for decoding the
        #     proto-encoded EntityTelemetryEvent on telemetry-latest-
        #     state; same pattern as asset-registry-service)
        #   - ontology/ (for platform_variant_aliases.yaml, which the
        #     sim uses to canonicalize upstream proprietary variants
        #     like "MRAD_Launcher" -> "MRAD_Interceptor" before
        #     matching against the asset_profiles config. The wire on
        #     telemetry-latest-state carries proprietary tokens
        #     because faust-edge does NOT canonicalize -- only the
        #     ingress Bloblang stage does, and that path produces
        #     raw-sensor-stream, not telemetry-latest-state.)
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/ontology"   "dst" "ontology")
          ) "root" .) | nindent 8 }}
      containers:
        - name: logistics-sim
          image: {{ include "openddil.image" (dict "name" $cfg.image.name "tag" $cfg.image.tag "digest" $cfg.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $cfg.image.pullPolicy "root" .) }}
          env:
            - name: LOGISTICS_SIM_CONFIG_PATH
              value: /etc/openddil/logistics-sim/config.yaml
            - name: LOGISTICS_SIM_EDGE_CLUSTERS
              value: {{ join "," $edgePairs | quote }}
            - name: LOGISTICS_SIM_HQ_BROKERS
              value: {{ printf "%s-redpanda-hq%s:%d" .Release.Name $svcDomain (int .Values.redpandaHq.kafkaPort) | quote }}
            - name: LOGISTICS_SIM_INPUT_TOPIC
              value: "telemetry-latest-state"
            - name: PYTHONPATH
              # /proto is needed for the proto-decode path on telemetry-
              # latest-state records. asset-registry-service had this exact
              # gap; same trap waiting here. /app/src is the sim's package
              # root.
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: config
              mountPath: /etc/openddil/logistics-sim
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            # Mount ontology/ at /ontology so aliases.py finds
            # platform_variant_aliases.yaml at the default path. The
            # customer overlay's overlay file replaces the bundle's
            # example version via standard volume layering (per
            # README.md). On dev/docker-compose without the file,
            # aliases.py falls back to canonical-only matching.
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-logistics-sim-config
        - name: bundle-shared
          emptyDir: {}
{{- end }}
