{{- /*
   infrastructure.yaml — stateful primitives the rest of the chart depends on:
     * One redpanda-edge StatefulSet + Service per entry in .Values.edges
     * One redpanda-hq StatefulSet + Service (advertises via toxiproxy)
     * Postgres-HQ StatefulSet + Service
     * Toxiproxy Deployment + Service + ConfigMap (DDIL sever mechanism)
     * topic-init Job (post-install hook) — creates the 17 Kafka topics on
       all four clusters
*/}}

# =============================================================================
# Toxiproxy — DDIL sever mechanism
# =============================================================================
# Mediates produce traffic from edge-hq-bridge to redpanda-hq. Disabling the
# hq-link proxy via toxiproxy's HTTP API severs the link for real (TCP socket
# is closed, in-flight produces fail, consumer-group lag at the bridge climbs).
# The frontend's WAN-link toggle hits /proxies/hq-link.
#
# P5: ONE PROXY PER TIER UPLINK, not just hq-link. openddil.uplinkLinks adds
# an `uplink-<id>` proxy for every edge and every tier-managed region, each
# severable on its own -- see openddil.bridgeTarget and
# openddil.toxiproxyConfigJson (the content both this ConfigMap and the
# Deployment's checksum/config annotation below render).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-toxiproxy-config
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  toxiproxy.json: |
{{- include "openddil.toxiproxyConfigJson" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-toxiproxy
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "toxiproxy" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "toxiproxy" "root" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Toxiproxy reads -config only at process start (see the args
        # comment below), so a link-set change -- a tier added or removed,
        # or a parent flip -- needs this to roll the pod; nothing else
        # would, since the ConfigMap's own content isn't in the pod spec.
        checksum/config: {{ include "openddil.toxiproxyConfigJson" . | sha256sum }}
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "toxiproxy" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: toxiproxy
          image: "{{ include "openddil.thirdPartyImage" .Values.toxiproxy.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.toxiproxy.image.pullPolicy "root" .) }}
          # Naming gotcha: the values keys here are bass-ackwards from their
          # actual roles, but consistently so across the chart:
          #   * .Values.toxiproxy.apiPort (default 8474) — where the hq-link
          #     toxic LISTENS for Kafka traffic from edge-hq bridges (the
          #     toxiproxy.json `listen` field below). Service port name "api".
          #   * .Values.toxiproxy.proxyPort (default 8475) — the toxiproxy
          #     admin REST API (where /proxies/* lives). Service port name
          #     "proxy". `-port` defaults to 8474 in toxiproxy-server, which
          #     collides with the hq-link toxic on apiPort; the proxy wins
          #     and the admin API fails to bind. Pinning -port to proxyPort
          #     puts admin on 8475 — what nginx's /proxies/ and the
          #     projector's edge_buffer monitor both expect.
          args:
            - "-host=0.0.0.0"
            - "-port={{ .Values.toxiproxy.proxyPort }}"
            - "-config=/etc/toxiproxy.json"
          ports:
            - name: api
              containerPort: {{ .Values.toxiproxy.apiPort }}
            - name: proxy
              containerPort: {{ .Values.toxiproxy.proxyPort }}
            {{- range (include "openddil.uplinkLinks" . | fromYamlArray) }}
            - name: {{ .listenerName | replace "_" "-" }}
              containerPort: {{ .port | int }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/toxiproxy.json
              subPath: toxiproxy.json
          resources:
            {{- toYaml .Values.toxiproxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-toxiproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-toxiproxy
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "toxiproxy" "root" .) | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.toxiproxy.apiPort }}
      targetPort: api
    - name: proxy
      port: {{ .Values.toxiproxy.proxyPort }}
      targetPort: proxy
    {{- range (include "openddil.uplinkLinks" . | fromYamlArray) }}
    - name: {{ .listenerName | replace "_" "-" }}
      port: {{ .port | int }}
      targetPort: {{ .listenerName | replace "_" "-" }}
    {{- end }}
---
# =============================================================================
# Redpanda — one single-broker StatefulSet per edge cluster
# =============================================================================
# Each edge is its own Kafka cluster (ADR-0023 Phase 6a), not partitions of a
# shared one. Single broker is fine for the demo; scale via NumReplicas on
# the StatefulSet would require multi-broker redpanda config.
{{- /* A BROKER PER TIER THAT NEEDS ONE.

     ADR-0032 §a: a severance-tolerant tier owns its broker. A region reading
     HQ's broker, or its edges', is reachback by construction — its uplink
     drops and it has nothing local to serve from, so the two-dimension
     severance the regional package requires is unsatisfiable.

     Edges get one unconditionally: they are the ingest point whether or not
     a tier node runs there. Regions get one only when tier-managed, because
     a region with no tier node has nothing to put in it. */ -}}
{{- $tiers := include "openddil.tierList" . | fromYamlArray }}
{{- range $tier := $tiers }}
{{- if or (eq $tier.kind "edge") (include "openddil.isTierManaged" (dict "id" $tier.id "root" $)) }}
{{- $edge := $tier }}
{{- $name := printf "%s-redpanda-%s" $.Release.Name $edge.id }}
{{- $component := printf "redpanda-%s" $edge.id }}
{{- /* P5: this broker's OWN extra listeners -- one per uplink whose
       EFFECTIVE PARENT (openddil.uplinkLinks) is this tier. A leaf edge
       with no children of its own renders an empty list here, and the
       args/ports below are then byte-identical to pre-P5. */ -}}
{{- $childLinks := list -}}
{{- range (include "openddil.uplinkLinks" $ | fromYamlArray) }}
{{- if eq .parentBrokerHost $edge.id }}{{- $childLinks = append $childLinks . -}}{{- end }}
{{- end }}
{{- $extraKafkaAddr := "" -}}
{{- $extraAdvertiseAddr := "" -}}
{{- range $childLinks }}
{{- $extraKafkaAddr = printf "%s,%s://0.0.0.0:%d" $extraKafkaAddr .listenerName (.port | int) -}}
{{- $extraAdvertiseAddr = printf "%s,%s://%s-toxiproxy%s:%d" $extraAdvertiseAddr .listenerName $.Release.Name (include "openddil.svcDomain" $) (.port | int) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "openddil.labels" $ | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" $component "root" $) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" $component "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $ | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" $component "root" $) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The redpanda image runs as uid/gid 101. CSI volumes (vSphere etc.)
      # mount root-owned, so without fsGroup the broker cannot write
      # /var/lib/redpanda/data and exits 1 at storage init (CrashLoopBackOff).
      # fsGroup makes kubelet chown the data PVC to gid 101. postgres and
      # restate run as root and self-handle their volumes — no fsGroup needed.
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: "{{ include "openddil.thirdPartyImage" $.Values.redpandaEdge.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $.Values.redpandaEdge.image.pullPolicy "root" $) }}
          # k8s `command:` overrides the image ENTRYPOINT; this image's
          # entrypoint is the `rpk` wrapper (it execs `rpk redpanda ...`).
          # Use `args:` so the wrapper is kept — `command:` here runs the
          # bare `redpanda` binary, which rejects rpk flags like
          # `--kafka-addr` (cli_parser.cc). docker-compose `command:` maps
          # to k8s `args:`, NOT k8s `command:`.
          args:
            - redpanda
            - start
            - --smp
            - "1"
            - --reserve-memory
            - "0M"
            - --overprovisioned
            - --node-id
            - "0"
            - --kafka-addr
            # P5: plus one `uplink_<n>://0.0.0.0:<port>` per child link whose
            # effective parent is THIS broker ($extraKafkaAddr above) --
            # empty, hence no change, for a tier with no children.
            - PLAINTEXT://0.0.0.0:{{ $.Values.redpandaEdge.internalPort }},OUTSIDE://0.0.0.0:{{ $.Values.redpandaEdge.outsidePort }}{{ $extraKafkaAddr }}
            - --advertise-kafka-addr
            # In-cluster clients hit the Service DNS; OUTSIDE listener kept for
            # kubectl port-forward debugging (advertise localhost so the
            # forwarded client can resolve). Plus one matching
            # `uplink_<n>://<release>-toxiproxy<svcDomain>:<port>` per child
            # link ($extraAdvertiseAddr above), so metadata for that
            # listener answers with the severable toxiproxy address.
            - PLAINTEXT://{{ $name }}{{ include "openddil.svcDomain" $ }}:{{ $.Values.redpandaEdge.internalPort }},OUTSIDE://localhost:{{ $.Values.redpandaEdge.outsidePort }}{{ $extraAdvertiseAddr }}
            # NO AUTO-CREATED TOPICS.
            #
            # This is the FRESH-INSTALL path and it is deliberately not the only
            # one. `redpanda start --set` seeds a CLUSTER property, and cluster
            # properties live in the controller log -- seeded at first cluster
            # formation and never re-read from the command line again. So on a
            # cluster that already existed BEFORE this line shipped (a PVC-backed
            # cluster, as opposed to a fresh install or a fresh
            # persistence.redpandaUseEmptyDir reform), this line does NOTHING.
            #
            # THE EXISTING-CLUSTER PATH is the post-install/post-upgrade/post-rollback
            # hook Job {{ $.Release.Name }}-redpanda-auto-create-off
            # (templates/hook-redpanda-auto-create-off.yaml, gated by
            # .Values.redpandaAutoCreateTopics.enforceOff): it runs
            # `rpk cluster config set auto_create_topics_enabled false` plus a
            # read-back against every broker's Admin API -- 9644 for edges and
            # regions, 19644 for hq, NOT the Kafka port -- on every
            # install/upgrade/rollback, so a cluster this `--set` arg cannot
            # reach still gets corrected. Shipping only this arg and believing
            # an existing lab changed is the trap the hook Job exists to
            # close: it reads the property back per broker and never infers
            # it from this arg being present.
            #
            # Why off: an auto-created topic is born at broker DEFAULTS -- 1
            # partition, cleanup.policy=delete -- so a latest-state topic that
            # must be retained by KEY silently becomes one retained by AGE, and
            # can drop an asset entirely. topic-init declares every topic this
            # system uses, so anything else appearing is a defect and should
            # fail loudly rather than be invented looking plausible.
            #
            # Know the failure shape before turning this off: a produce to a
            # topic that does not exist HANGS AND RETRIES SILENTLY (measured
            # 2026-09-27). It does not fail fast naming the topic, so an
            # operator expecting a clean error will look for the wrong thing
            # and conclude the setting never applied.
            - --set
            - redpanda.auto_create_topics_enabled=false
          ports:
            - name: kafka
              containerPort: {{ $.Values.redpandaEdge.internalPort }}
            - name: outside
              containerPort: {{ $.Values.redpandaEdge.outsidePort }}
            - name: admin
              containerPort: {{ $.Values.redpandaEdge.adminPort }}
            {{- range $childLinks }}
            - name: {{ .listenerName | replace "_" "-" }}
              containerPort: {{ .port | int }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
                - --exit-when-healthy
                - -X
                - brokers=localhost:{{ $.Values.redpandaEdge.internalPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $.Values.redpandaEdge.resources | nindent 12 }}
      {{- if $.Values.persistence.redpandaUseEmptyDir }}
      # NFS-incompatible cluster mode: redpanda refuses to start on NFS
      # because rocksdb's fcntl-based locking returns ENOLCK over NFS
      # mounts (CrashLoopBackOff at storage init). When the only available
      # PVC storage class on this cluster is NFS-backed, switch the broker
      # to a node-local emptyDir so it comes up cleanly. Trade-off:
      # redpanda state lives on the node, NOT a PVC -- a pod restart loses
      # ALL topic data, consumer offsets, and partition metadata. Acceptable
      # for dev / demo clusters where state durability isn't the contract;
      # NEVER set true in prod. Toggle via .Values.persistence.redpandaUseEmptyDir.
      #
      # sizeLimit mirrors persistence.redpandaSize deliberately: the PVC path
      # below is bounded by that value, and an escape hatch must not silently
      # drop a bound the path it replaces carried.
      #
      # WITHOUT it, the failure is node-wide and misattributed. An unbounded
      # emptyDir is charged against the node's ephemeral storage with no cap,
      # so a broker that fills the disk triggers kubelet eviction across that
      # node -- and the pods evicted are chosen by usage, so the victims are
      # frequently NOT the broker that caused it. WITH it, the broker alone is
      # evicted, for a legible reason, and nothing else on the node notices.
      #
      # Same principle as the probe rule: make the failure attributable to
      # its cause rather than to whoever happened to be nearby.
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ $.Values.persistence.redpandaSize }}
      {{- end }}
  {{- if not $.Values.persistence.redpandaUseEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        {{- with ($.Values.persistence.redpandaStorageClass | default $.Values.persistence.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.persistence.redpandaSize }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "openddil.labels" $ | nindent 4 }}
spec:
  # ClusterIP for in-cluster Kafka access. Headless variant not needed —
  # single replica per cluster, no stable per-pod hostnames required.
  selector:
    {{- include "openddil.selectorLabels" (dict "component" $component "root" $) | nindent 4 }}
  ports:
    - name: kafka
      port: {{ $.Values.redpandaEdge.internalPort }}
      targetPort: kafka
    - name: admin
      port: {{ $.Values.redpandaEdge.adminPort }}
      targetPort: admin
    {{- range $childLinks }}
    - name: {{ .listenerName | replace "_" "-" }}
      port: {{ .port | int }}
      targetPort: {{ .listenerName | replace "_" "-" }}
    {{- end }}
---
# ===========================================================================
# topic-init-{{ $edge.id }} — creates this tier's Kafka topics on its own broker
# ===========================================================================
# RENDERED FROM THE SAME RANGE AND THE SAME `if` AS THE BROKER STATEFULSET
# ABOVE, ON PURPOSE -- not a second predicate claimed to match it. This Job
# used to live in tier-node.yaml, gated ADDITIONALLY by `tierNode.enabled`
# and `tierNode.tiers` -- a predicate strictly narrower than "every edge, or
# a tier-managed region." A default render (tierNode.enabled=false, the
# chart default) or a tier-node render whose `tierNode.tiers` excluded this
# edge rendered this broker with NO topic-init at all: every topic on it
# would then exist only through auto-create, at broker defaults --
# `cleanup.policy=delete` on a topic that must be retained by KEY, silently
# dropping an asset. That is the SAME failure shape the pre-split "BROKER
# LIST" predicate caused once already (see the hub topic-init Job's header
# comment below): two lists describing the same set of brokers, kept
# apart, drifted. The fix there was deriving both loops from one predicate;
# the fix here is deriving this Job from the identical range/if the
# StatefulSet above uses, so there is no second copy of the predicate left
# to drift.
#
# Same topic spec as the hub's topic-init (below) and every other tier's:
# openddil.topicInitCreateLoop (_helpers.tpl) is the single shared
# definition.
#
# HOOK PHASE CHOSEN AT RENDER TIME, PER TIER, same reasoning as
# tier-schema-init-{{ $edge.id }} (tier-node.yaml):
#   install            -> post-install
#   existing backend   -> pre-upgrade   (so a consumer never starts before
#                          its topic exists)
#   new backend        -> post-upgrade  (a pre-upgrade hook against a broker
#                          that does not exist yet would fail this hook, and
#                          a failed hook fails the whole release)
# "existing backend" is decided by `lookup "v1" "Service" <namespace> <this
# tier's redpanda Service, $name above>` returning non-empty -- `lookup`
# returns nothing under `helm template` and client-side dry runs, so those
# render the install branch, or the new-backend branch once rendered with
# `--is-upgrade`; only a server-side dry run or a real `helm upgrade` can
# see the existing-backend branch, because only those actually query the
# live API server.
#
# post-rollback stays on EVERY branch, unlike pre-upgrade/post-upgrade which
# pick exactly one: re-creating an existing topic on a rollback is a no-op
# (rpk topic create's || true swallows it), so there is no branch where
# keeping it is wrong.
{{- $topicHook := "post-install" }}
{{- if not $.Release.IsInstall }}
{{- if lookup "v1" "Service" $.Release.Namespace $name }}
{{- $topicHook = "pre-upgrade" }}
{{- else }}
{{- $topicHook = "post-upgrade" }}
{{- end }}
{{- end }}
{{- $brokerAddr := printf "%s%s:%d" $name (include "openddil.svcDomain" $) (int $.Values.redpandaEdge.internalPort) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-topic-init-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $topicHook }},post-rollback
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $ | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: "{{ include "openddil.thirdPartyImage" $.Values.redpandaEdge.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $.Values.redpandaEdge.image.pullPolicy "root" $) }}
          resources:
            {{- toYaml $.Values.jobs.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              # Probe with `rpk topic list`, not `rpk cluster health` -- same
              # reasoning as the hub Job below: health hits the Admin API and
              # falls back to localhost with no -X admin.hosts, which never
              # succeeds from this pod. Bounded at 300s (150 x 2s), matching
              # tier-schema-init-{{ $edge.id }}'s wait.
              echo "Waiting for {{ $brokerAddr }} (Kafka API)..."
              attempts=0
              until rpk topic list -X brokers={{ $brokerAddr }} >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 150 ]; then
                  echo "TOPIC_INIT_REFUSED broker_unready {{ $edge.id }}"
                  exit 1
                fi
                sleep 2
              done
              {{- include "openddil.topicInitCreateLoop" (dict "broker" $brokerAddr) | nindent 14 }}
---
{{- end }}
{{- end }}
# =============================================================================
# Redpanda-HQ — advertises via toxiproxy
# =============================================================================
# PLAINTEXT listener ADVERTISES toxiproxy's address (not the broker's own)
# so the edge-hq-bridge's Kafka client is actually mediated by toxiproxy.
# Without this, the bridge bootstraps through toxiproxy then jumps directly
# to the broker, and DDIL sever never severs anything.
#
# P5: plus one extra listener per uplink whose effective parent is hq
# itself (openddil.uplinkLinks, parentBrokerHost == "hq") -- same mechanism
# as the per-tier brokers above, just keyed to the literal "hq" rather than
# a tier id, since hq isn't a tierList entry.
{{- $hqChildLinks := list -}}
{{- range (include "openddil.uplinkLinks" . | fromYamlArray) }}
{{- if eq .parentBrokerHost "hq" }}{{- $hqChildLinks = append $hqChildLinks . -}}{{- end }}
{{- end }}
{{- $hqExtraKafkaAddr := "" -}}
{{- $hqExtraAdvertiseAddr := "" -}}
{{- range $hqChildLinks }}
{{- $hqExtraKafkaAddr = printf "%s,%s://0.0.0.0:%d" $hqExtraKafkaAddr .listenerName (.port | int) -}}
{{- $hqExtraAdvertiseAddr = printf "%s,%s://%s-toxiproxy%s:%d" $hqExtraAdvertiseAddr .listenerName $.Release.Name (include "openddil.svcDomain" $) (.port | int) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redpanda-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "redpanda-hq" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-redpanda-hq
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "redpanda-hq" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "redpanda-hq" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # fsGroup 101 — redpanda runs non-root; see the redpanda-edge
      # StatefulSet above for the full rationale.
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: "{{ include "openddil.thirdPartyImage" .Values.redpandaHq.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.redpandaHq.image.pullPolicy "root" .) }}
          # k8s `command:` overrides the image ENTRYPOINT; this image's
          # entrypoint is the `rpk` wrapper (it execs `rpk redpanda ...`).
          # Use `args:` so the wrapper is kept — `command:` here runs the
          # bare `redpanda` binary, which rejects rpk flags like
          # `--kafka-addr` (cli_parser.cc). docker-compose `command:` maps
          # to k8s `args:`, NOT k8s `command:`.
          args:
            - redpanda
            - start
            - --smp
            - "1"
            - --reserve-memory
            - "0M"
            - --overprovisioned
            - --node-id
            - "0"
            - --kafka-addr
            # P5: plus one `uplink_<n>://0.0.0.0:<port>` per $hqChildLinks
            # entry above -- empty, hence no change, when nothing bridges
            # straight to hq (every tier under a tier-managed subtree).
            - PLAINTEXT://0.0.0.0:{{ .Values.redpandaHq.kafkaPort }},OUTSIDE://0.0.0.0:{{ .Values.redpandaHq.outsidePort }}{{ $hqExtraKafkaAddr }}
            - --advertise-kafka-addr
            # PLAINTEXT advertises TOXIPROXY (load-bearing — see docker-compose
            # comment + ADR for rationale). OUTSIDE for kubectl port-forward.
            # Plus one matching `uplink_<n>://<release>-toxiproxy<svcDomain>:<port>`
            # per $hqChildLinks entry, same reasoning as the per-tier brokers.
            - PLAINTEXT://{{ .Release.Name }}-toxiproxy{{ include "openddil.svcDomain" . }}:{{ .Values.toxiproxy.apiPort }},OUTSIDE://localhost:{{ .Values.redpandaHq.outsidePort }}{{ $hqExtraAdvertiseAddr }}
            # NO AUTO-CREATED TOPICS.
            #
            # This is the FRESH-INSTALL path and it is deliberately not the only
            # one. `redpanda start --set` seeds a CLUSTER property, and cluster
            # properties live in the controller log -- seeded at first cluster
            # formation and never re-read from the command line again. So on a
            # cluster that already existed BEFORE this line shipped (a PVC-backed
            # cluster, as opposed to a fresh install or a fresh
            # persistence.redpandaUseEmptyDir reform), this line does NOTHING.
            #
            # THE EXISTING-CLUSTER PATH is the post-install/post-upgrade/post-rollback
            # hook Job {{ .Release.Name }}-redpanda-auto-create-off
            # (templates/hook-redpanda-auto-create-off.yaml, gated by
            # .Values.redpandaAutoCreateTopics.enforceOff): it runs
            # `rpk cluster config set auto_create_topics_enabled false` plus a
            # read-back against every broker's Admin API -- 9644 for edges and
            # regions, 19644 for hq, NOT the Kafka port -- on every
            # install/upgrade/rollback, so a cluster this `--set` arg cannot
            # reach still gets corrected. Shipping only this arg and believing
            # an existing lab changed is the trap the hook Job exists to
            # close: it reads the property back per broker and never infers
            # it from this arg being present.
            #
            # Why off: an auto-created topic is born at broker DEFAULTS -- 1
            # partition, cleanup.policy=delete -- so a latest-state topic that
            # must be retained by KEY silently becomes one retained by AGE, and
            # can drop an asset entirely. topic-init declares every topic this
            # system uses, so anything else appearing is a defect and should
            # fail loudly rather than be invented looking plausible.
            #
            # Know the failure shape before turning this off: a produce to a
            # topic that does not exist HANGS AND RETRIES SILENTLY (measured
            # 2026-09-27). It does not fail fast naming the topic, so an
            # operator expecting a clean error will look for the wrong thing
            # and conclude the setting never applied.
            - --set
            - redpanda.auto_create_topics_enabled=false
          ports:
            - name: kafka
              containerPort: {{ .Values.redpandaHq.kafkaPort }}
            - name: outside
              containerPort: {{ .Values.redpandaHq.outsidePort }}
            - name: admin
              containerPort: {{ .Values.redpandaHq.adminPort }}
            {{- range $hqChildLinks }}
            - name: {{ .listenerName | replace "_" "-" }}
              containerPort: {{ .port | int }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
                - --exit-when-healthy
                - -X
                - brokers=localhost:{{ .Values.redpandaHq.kafkaPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.redpandaHq.resources | nindent 12 }}
      {{- if .Values.persistence.redpandaUseEmptyDir }}
      # See redpanda-edge StatefulSet above for the NFS-incompatible-cluster
      # rationale + trade-offs, and for why sizeLimit mirrors redpandaSize.
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.persistence.redpandaSize }}
      {{- end }}
  {{- if not .Values.persistence.redpandaUseEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        {{- with (.Values.persistence.redpandaStorageClass | default .Values.persistence.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.redpandaSize }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redpanda-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "redpanda-hq" "root" .) | nindent 4 }}
  ports:
    - name: kafka
      port: {{ .Values.redpandaHq.kafkaPort }}
      targetPort: kafka
    # The hq broker's args set no admin address, so Redpanda listens on its
    # default 9644 -- NOT on the container port named `admin` (adminPort,
    # 19644, a compose host-port mapping carried over). targetPort: admin
    # therefore hit a closed port: connection refused, measured 2026-09-29.
    # Service port stays adminPort so callers keep one address per broker.
    # Changing the containerPort instead would roll the broker.
    - name: admin
      port: {{ .Values.redpandaHq.adminPort }}
      targetPort: 9644
    {{- range $hqChildLinks }}
    - name: {{ .listenerName | replace "_" "-" }}
      port: {{ .port | int }}
      targetPort: {{ .listenerName | replace "_" "-" }}
    {{- end }}
---
# =============================================================================
# Redpanda broker alias Services — bare names for docker-compose-baked configs
# =============================================================================
# restate-config.toml (baked into the runtime-bundle) and other configs of
# docker-compose origin hardcode BARE broker hostnames — redpanda-edge-01:9092,
# redpanda-hq:19092. In k8s the real Services are release-prefixed
# (<release>-redpanda-*), so the bare names do not resolve and restate's Kafka
# ingress dies with "Name or service not known". These alias Services point the
# bare names at the same broker pods. (The customer-overlay proprietary overlay ships
# its own redpanda-edge-01 alias for the same reason — once these are in the
# chart, that overlay copy is redundant.)
{{- range .Values.edges }}
apiVersion: v1
kind: Service
metadata:
  name: redpanda-{{ .id }}
  labels:
    {{- include "openddil.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-%s" .id) "root" $) | nindent 4 }}
  ports:
    - name: kafka
      port: {{ $.Values.redpandaEdge.internalPort }}
      targetPort: kafka
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: redpanda-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "redpanda-hq" "root" .) | nindent 4 }}
  ports:
    - name: kafka
      port: {{ .Values.redpandaHq.kafkaPort }}
      targetPort: kafka
---
# =============================================================================
# Postgres-HQ — single-replica StatefulSet, ElectricSQL needs wal_level=logical
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER:     {{ .Values.postgresHq.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresHq.auth.password | quote }}
  POSTGRES_DB:       {{ .Values.postgresHq.auth.database | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "postgres-hq" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres-hq
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "postgres-hq" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "postgres-hq" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ include "openddil.thirdPartyImage" .Values.postgresHq.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.postgresHq.image.pullPolicy "root" .) }}
          # wal_level=logical required for ElectricSQL publication.
          args: ["postgres", "-c", "wal_level=logical"]
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-postgres-hq
          ports:
            - name: postgres
              containerPort: {{ .Values.postgresHq.port }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresHq.auth.username | quote }}
                - -d
                - {{ .Values.postgresHq.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresHq.auth.username | quote }}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.postgresHq.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        {{- with (.Values.persistence.postgresStorageClass | default .Values.persistence.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.postgresSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "postgres-hq" "root" .) | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgresHq.port }}
      targetPort: postgres
---
# =============================================================================
# Topic-init Job (hub) — creates all Kafka topics on the hq broker
# =============================================================================
# Runs as a post-install,pre-upgrade Helm hook. On install it fires AFTER the
# StatefulSets are scheduled, because nothing exists to migrate into before
# then. On upgrade it fires BEFORE the broker StatefulSets apply this
# release's spec, so a topic a new consumer expects exists before that
# consumer's new pod starts -- otherwise the pod comes up first and the topic
# it depends on isn't there yet. Topic creation stays idempotent either way
# (rpk topic create returns nonzero if the topic exists — the || true
# swallows it), which is also what makes it safe to still run post-rollback:
# re-creating an existing topic on a rollback is a no-op.
#
# The ordering constraint this creates: a topic's config changed here must be
# additive for one release -- a partition/retention/compaction change a new
# consumer depends on is fine, but deleting a topic a release-old consumer
# still reads must wait a release, same as a database migration that must
# stay expand-only across the same pre-upgrade/post-upgrade boundary.
#
# HUB-ONLY, NOT LOOKUP-GATED. This Job used to loop over every edge/region
# broker too; that per-tier work now lives ABOVE, in THIS FILE, as its own
# topic-init-<id> Job rendered from the identical range/if the broker
# StatefulSet loop uses (edge unconditionally, region only when
# tier-managed) -- not in tier-node.yaml, and not a second predicate claimed
# to match that one. Each per-tier Job chooses its OWN hook phase at render
# time via `lookup` against that tier's broker Service (see its header
# comment above for the install/existing-backend/new-backend reasoning).
# This Job keeps post-install,pre-upgrade unconditionally
# because the hq broker is part of the hub stack this same chart always
# creates -- there is no "new backend" case for hq to distinguish between
# installs and upgrades, so there is nothing for a lookup to gate.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-topic-init
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade,post-rollback
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "topic-init" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rpk
          image: "{{ include "openddil.thirdPartyImage" .Values.redpandaEdge.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.redpandaEdge.image.pullPolicy "root" .) }}
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              # Wait for the hq broker's Kafka API, then create topics. The
              # Helm hook fires right after the StatefulSet is created, so the
              # broker pod may still be warming. Probe with `rpk topic list` —
              # a plain Kafka-API (9092) call, the same surface the
              # topic-create calls below use. NOT `rpk cluster health`: that
              # hits the Admin API (9644), and with no -X admin.hosts it falls
              # back to localhost, never succeeds from this pod, and silently
              # wedges the entire post-install hook chain. Bounded at 300s
              # (150 x 2s), the same bound tier-schema-init-<tier> and each
              # topic-init-<tier> apply to their own waits, so a genuinely-down
              # broker fails the Job visibly instead of wedging the upgrade.
              HQB={{ .Release.Name }}-redpanda-hq:{{ .Values.redpandaHq.kafkaPort }}
              echo "Waiting for $HQB (Kafka API)..."
              attempts=0
              until rpk topic list -X brokers=$HQB >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 150 ]; then
                  echo "TOPIC_INIT_REFUSED broker_unready hq"
                  exit 1
                fi
                sleep 2
              done
              {{- include "openddil.topicInitCreateLoop" (dict "broker" "$HQB") | nindent 14 }}

              # ---------------------------------------------------------
              # HQ-ONLY TOPICS -- the release boundary
              # ---------------------------------------------------------
              # `egress-c2-status` is created on HQ and DELIBERATELY NOT on the
              # edge or region brokers. A topic that exists on a tier is a
              # topic something on that tier can produce to, and the egress
              # gate's whole claim is that there is ONE boundary. Five copies
              # of this topic would be five places a release decision could be
              # asserted, four of them unreviewed -- so the placement is part
              # of the control, not a deployment detail.
              #
              # The config MIRRORS `asset-logistics-status` exactly (compacted,
              # 8 partitions, keyed by asset_id, retention.ms=-1) so that a
              # difference between what the source holds and what this holds is
              # A DECISION THE GATE MADE, never an artifact of how the two
              # topics were configured. That diffability is the one property
              # the gate's claim rests on, which is why this is compacted
              # rather than retained by age: the per-record audit trail lives
              # in the gate's own DECISION log, not in this topic's history.
              #
              # Kept byte-identical to the compose declaration so the two
              # environments cannot disagree about what the boundary is.
              # Ledger row LR-0043-C.
              HQB={{ .Release.Name }}-redpanda-hq:{{ .Values.redpandaHq.kafkaPort }}
              echo "INFO: Initializing HQ-only egress topics on $HQB"
              {{- if .Values.releasability.enabled }}
              for spec in                 "egress-c2-status|-p 8 -r 1 -c cleanup.policy=compact -c min.cleanable.dirty.ratio=0.1 -c segment.ms=60000 -c retention.ms=-1" "parts-availability|-p 8 -r 1 -c cleanup.policy=compact -c min.cleanable.dirty.ratio=0.1 -c segment.ms=60000 -c retention.ms=-1"{{- range .Values.egress.hubTopics }} "{{ . }}"{{- end }}               ; do
              {{- else }}
              for spec in                 "egress-c2-status|-p 8 -r 1 -c cleanup.policy=compact -c min.cleanable.dirty.ratio=0.1 -c segment.ms=60000 -c retention.ms=-1"               ; do
              {{- end }}
                topic="${spec%%|*}"
                args="${spec##*|}"
                rpk -X brokers=$HQB topic create $topic $args || true
                setargs=$(printf ' %s' "$args" | sed -E 's/ -p [0-9]+//; s/ -r [0-9]+//; s/ -c / --set /g')
                if [ -n "$setargs" ]; then
                  rpk -X brokers=$HQB topic alter-config $topic $setargs || true
                fi
              done
              echo "INFO: HQ-only egress topics initialized on $HQB"
