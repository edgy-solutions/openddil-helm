{{- /*
   regional.yaml — one faust-regional Deployment per .Values.regions entry.
   The REGIONAL_EDGES env is generated from the edges-by-region grouping
   in values.yaml — each region gets a comma-separated list of its edges
   as id=broker pairs, matching the docker-compose env format.
*/}}
{{- $root := . -}}
{{- $hqBroker := printf "%s-redpanda-hq%s:%d" $root.Release.Name (include "openddil.svcDomain" $root) (int $root.Values.redpandaHq.kafkaPort) }}
{{- range .Values.regions }}
{{- $region := . }}
{{- $regionBroker := printf "%s-redpanda-%s%s:%d" $root.Release.Name $region.id (include "openddil.svcDomain" $root) (int $root.Values.redpandaEdge.internalPort) }}
{{- $edgesInRegion := list }}
{{- range $root.Values.edges }}
{{- if eq .region $region.id }}
{{- $edgesInRegion = append $edgesInRegion (printf "%s=%s-redpanda-%s%s:%d" .id $root.Release.Name .id (include "openddil.svcDomain" $root) (int $root.Values.redpandaEdge.internalPort)) }}
{{- end }}
{{- end }}

{{- /* Declared consumer groups (SPEC-consumer-declarations.md Part A).
       "region-<id>-aggregator" / "-hq-source" / "-source-<sourceId>" are
       FAUST-REGIONAL'S NAMES -- CODE DEFAULTS for the composed per-source
       Faust Apps this service runs in-process, not visible in this chart.
       Reuses the SAME $tierManaged flag and source list this Deployment
       already computes below, so the declaration cannot name a source this
       Deployment does not actually have.
       - aggregator + hq-source read REGIONAL_HQ_BROKERS's target: the
         region's own broker once tier-managed, hq otherwise (same cutover
         as REGIONAL_HQ_BROKERS below).
       - one "source-<id>" per REGIONAL_EDGES entry, on that source's own
         broker (an edge's own broker normally; the region's own broker,
         keyed by the region's own id, once tier-managed -- see
         REGIONAL_EDGES below). */ -}}
{{- $tierManaged := include "openddil.isTierManaged" (dict "id" $region.id "root" $root) }}
{{- $aggHqBrokerId := "hq" }}
{{- $sourceIds := list }}
{{- if $tierManaged }}
{{- $aggHqBrokerId = $region.id }}
{{- $sourceIds = list $region.id }}
{{- else }}
{{- range $root.Values.edges }}
{{- if eq .region $region.id }}
{{- $sourceIds = append $sourceIds .id }}
{{- end }}
{{- end }}
{{- end }}
{{- $regionalPairs := list (printf "%s/region-%s-aggregator" $aggHqBrokerId $region.id) (printf "%s/region-%s-hq-source" $aggHqBrokerId $region.id) }}
{{- range $sourceIds }}
{{- $regionalPairs = append $regionalPairs (printf "%s/region-%s-source-%s" . $region.id .) }}
{{- end }}
{{- /* Declared produces-topics. The
       aggregator sub-app's outputs all land on $aggHqBrokerId -- SAME
       variable the consumer-groups block above already computes, per the
       "Its outputs land on the region broker too" note on
       REGIONAL_HQ_BROKERS below. $regionFanInTopic is read again (not
       re-typed) by REGIONAL_FAN_IN_TOPIC further down -- the source sub-
       apps fan each source's state IN to this one topic, on the
       aggregator's own broker, for the aggregator to read.
       region-fleet-summary / region-top-factors / region-wear-trends are
       CODE DEFAULTS (the aggregator's own topic names), not chart values.
       The changelog is the aggregator's one Faust Table
       (openddil.faustRegionalAggregatorTable), named from the SAME
       $region.id this whole file already keys on. */ -}}
{{- $regionFanInTopic := printf "%s-fan-in" $region.id }}
{{- $regionAggregatorAppId := printf "region-%s-aggregator" $region.id }}
{{- $regionalProduces := list
    (printf "%s/%s" $aggHqBrokerId $regionFanInTopic)
    (printf "%s/region-fleet-summary" $aggHqBrokerId)
    (printf "%s/region-top-factors" $aggHqBrokerId)
    (printf "%s/region-wear-trends" $aggHqBrokerId)
    (printf "%s/%s" $aggHqBrokerId (include "openddil.faustChangelogTopic" (dict "appId" $regionAggregatorAppId "table" (include "openddil.faustRegionalAggregatorTable" $region.id))))
  }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-faust-regional-{{ $region.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "faust-regional-%s" $region.id) "root" $root) | nindent 4 }}
  annotations:
    openddil.io/consumer-groups: {{ join " " $regionalPairs | quote }}
    # openddil.io/produces-topics -- see the $regionalProduces comment
    # above.
    openddil.io/produces-topics: {{ join " " $regionalProduces | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "faust-regional-%s" $region.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "faust-regional-%s" $region.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python/openddil" "dst" "app-openddil")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: faust-regional
          image: {{ include "openddil.image" (dict "name" $root.Values.faustRegional.image.name "tag" $root.Values.faustRegional.image.tag "digest" $root.Values.faustRegional.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.faustRegional.image.pullPolicy "root" $root) }}
          workingDir: /tmp
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: OPENDDIL_REGION_ID
              value: {{ $region.id | quote }}
            {{- /* THE CUTOVER, AS RELOCATION.

                   The process does not move host or change shape; its WIRING
                   moves. While the region has no tier node, the aggregator
                   reads each edge's broker directly and HQ's broker for the
                   rest — which is UD-10's condition exactly, and was six of
                   the six reachbacks the census reported: it reached DOWN
                   into edge-01 and edge-02 for `asset-telemetry-windows` and
                   `derived-sustainment`, the two topics nothing carried up.

                   Once the region is tier-managed, both source addresses
                   become the REGION'S OWN BROKER. The edge bridges now carry
                   those topics upward (see the input contract), so the
                   aggregator consumes what its children published instead of
                   reaching into their clusters — which is the same act as
                   retiring the reachback, not a second one.

                   Its outputs land on the region broker too, and the uplink
                   carries region-fleet-summary / -top-factors / -wear-trends
                   to HQ, where the root's projectors read them unchanged.
                   Only the producer moved. */ -}}
            {{- $tierManaged := include "openddil.isTierManaged" (dict "id" $region.id "root" $root) }}
            - name: REGIONAL_EDGES
              {{- if $tierManaged }}
              # ONE ENTRY, and it is this region's own broker. Not a list of
              # children: a tier consumes its subtree's state from what was
              # bridged to it, and an entry per child here would be the
              # reachback rebuilt from the same values that used to build it.
              value: {{ printf "%s=%s" $region.id $regionBroker | quote }}
              {{- else }}
              # Comma-separated edge=broker pairs for THIS region only.
              value: {{ join "," $edgesInRegion | quote }}
              {{- end }}
            - name: REGIONAL_HQ_BROKERS
              {{- if $tierManaged }}
              # The tier's own broker. The name still says HQ because the app
              # calls this source "hq"; what it means is "the cluster holding
              # the state this tier aggregates over", and for a tier-managed
              # region that is the region.
              value: {{ $regionBroker | quote }}
              {{- else }}
              value: {{ $hqBroker | quote }}
              {{- end }}
            - name: REGIONAL_FAN_IN_TOPIC
              value: {{ $regionFanInTopic | quote }}
            - name: REGIONAL_HEARTBEAT_INTERVAL_S
              value: "30"
            - name: REGIONAL_TOP_FACTORS_N
              value: "10"
            - name: REGIONAL_ASSET_REGISTRY_TOPIC
              # ADR-0028 Phase 2: HQ topic the HQ source App subscribes
              # to so it can resolve empty provenance.region_id on
              # cm-state / logistics-status events. Matches the
              # assetRegistry.outputTopic value the asset-registry-
              # service Deployment publishes to.
              value: {{ $root.Values.assetRegistry.outputTopic | default "asset-registry-events" | quote }}
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            # google.protobuf ships in the image's `protobuf` pip package;
            # gen/python/google is empty and not bundled — see faust-edge.
            - name: bundle-shared
              mountPath: /app/openddil
              subPath: app-openddil
          resources:
            {{- toYaml $root.Values.faustRegional.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
{{- end }}
