{{- /*
   hub.yaml — HQ-tier services that depend on infrastructure (postgres-hq,
   redpanda-hq, toxiproxy) being up:
     * electric-sync (ElectricSQL HTTP gateway over postgres-hq replication)
     * restate-server (StatefulSet with PVC for /restate-data)
     * restate-hub (consumer bridge — mounts restate_hub.py from bundle)
     * cm-service + cm-service-bootstrap (post-install Job)
     * asset-registry-service (ADR-0028: canonical writer for
       public.asset_registry; one pod, multi-broker Faust composition
       consuming telemetry-latest-state from every edge, publishes
       asset-registry-events on HQ broker for consumer cache pub/sub)
     * logistics-fusion-service + logistics-fusion-bootstrap (post-install Job)
     * projector-hq (HQ-cluster topic projection to postgres-hq)
     * frontend (nginx-served static + /proxies/ proxy to toxiproxy)
*/}}
{{- $hqBroker := printf "%s-redpanda-hq%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.redpandaHq.kafkaPort) }}
{{- $pgDsn := printf "postgres://%s:%s@%s-postgres-hq%s:%d/%s"
    .Values.postgresHq.auth.username
    .Values.postgresHq.auth.password
    .Release.Name
    (include "openddil.svcDomain" .)
    (int .Values.postgresHq.port)
    .Values.postgresHq.auth.database }}
{{- $pgDsnElectric := printf "postgresql://%s:%s@%s-postgres-hq%s:%d/%s"
    .Values.postgresHq.auth.username
    .Values.postgresHq.auth.password
    .Release.Name
    (include "openddil.svcDomain" .)
    (int .Values.postgresHq.port)
    .Values.postgresHq.auth.database }}
{{- $cmEdgeClusters := list }}
{{- range .Values.edges }}
{{- $cmEdgeClusters = append $cmEdgeClusters (printf "%s=%s-redpanda-%s:%d" .id $.Release.Name .id (int $.Values.redpandaEdge.internalPort)) }}
{{- end }}

# ===========================================================================
# electric-sync — ElectricSQL HTTP gateway
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-electric-sync
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "electric-sync" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "electric-sync" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "electric-sync" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: electric
          image: "{{ include "openddil.thirdPartyImage" .Values.electric.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.electric.image.pullPolicy "root" .) }}
          env:
            - name: DATABASE_URL
              value: {{ $pgDsnElectric | quote }}
            - name: LOGICAL_PUBLISHER_HOST
              value: {{ printf "%s-electric-sync%s" .Release.Name (include "openddil.svcDomain" .) | quote }}
            - name: AUTH_JWT_ALG
              value: "HS256"
            - name: AUTH_JWT_KEY
              value: "secret"
            - name: ELECTRIC_INSECURE
              value: "true"
            # ElectricSQL bind port — explicit so it matches the Service.
            - name: ELECTRIC_PORT
              value: {{ .Values.electric.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.electric.port }}
          resources:
            {{- toYaml .Values.electric.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-electric-sync
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "electric-sync" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.electric.port }}
      targetPort: http
---
# Alias Service so the frontend nginx's hardcoded `electric-sync:5133`
# upstream resolves (used by the /electric/ proxy_pass block added when
# VITE_ELECTRIC_URL was made build-time-overridable). Same pattern as
# the `toxiproxy` alias below — unprefixed name matching docker-compose's
# container hostname so nginx.conf is portable between the two envs.
apiVersion: v1
kind: Service
metadata:
  name: electric-sync
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    openddil.io/alias: "true"
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "electric-sync" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.electric.port }}
      targetPort: http
---
# ===========================================================================
# restate-server — StatefulSet with PVC for /restate-data
# ===========================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-restate-server
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "restate-server" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-restate-server
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "restate-server" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "restate-server" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/restate-config.toml" "dst" "restate-config.toml")
          ) "root" .) | nindent 8 }}
      containers:
        - name: restate
          image: "{{ include "openddil.thirdPartyImage" .Values.restate.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.restate.image.pullPolicy "root" .) }}
          args: ["-c", "/config/restate-config.toml"]
          ports:
            - name: ingress
              containerPort: {{ .Values.restate.ingressPort }}
            - name: admin
              containerPort: {{ .Values.restate.adminPort }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /config/restate-config.toml
              subPath: restate-config.toml
            - name: data
              mountPath: /restate-data
          resources:
            {{- toYaml .Values.restate.resources | nindent 12 }}
      volumes:
        # Name must be `bundle-shared` — the openddil.bundleInit helper
        # hardcodes that name on the bundle-loader initContainer's mount.
        - name: bundle-shared
          emptyDir: {}        # populated by the bundle-loader initContainer
        {{- if .Values.persistence.restateUseEmptyDir }}
        # NFS-incompatible cluster mode (same rationale as redpanda above):
        # restate's RocksDB requires POSIX file locks that NFS doesn't
        # honor, so on cluster where only NFS PVCs are available we run
        # restate on a node-local emptyDir. Trade-off: a pod restart loses
        # ALL Virtual Object state -- which we have a separate story for
        # (`restate.ephemeralOnUpgrade` + flush-assets.sh --deep), so the
        # state-loss isn't a new failure mode. Toggle via
        # .Values.persistence.restateUseEmptyDir.
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if not .Values.persistence.restateUseEmptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        {{- with (.Values.persistence.restateStorageClass | default .Values.persistence.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.restateSize }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-restate-server
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "restate-server" "root" .) | nindent 4 }}
  ports:
    - name: ingress
      port: {{ .Values.restate.ingressPort }}
      targetPort: ingress
    - name: admin
      port: {{ .Values.restate.adminPort }}
      targetPort: admin
---
# ===========================================================================
# restate-hub — consumer bridge. NOTE: docker-compose mounts restate_hub.py
# over /app/restate_hub.py because the published hub-restate-projector image
# bakes hub_restate_projector.py, not restate_hub.py. We do the same.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-restate-hub
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "restate-hub" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "restate-hub" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "restate-hub" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "agents/hub/restate_hub.py" "dst" "restate_hub.py")
          ) "root" .) | nindent 8 }}
      containers:
        - name: restate-hub
          image: {{ include "openddil.image" (dict "name" .Values.restateHub.image.name "tag" .Values.restateHub.image.tag "digest" .Values.restateHub.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.restateHub.image.pullPolicy "root" .) }}
          command: ["/opt/venv/bin/python", "/app/restate_hub.py"]
          env:
            - name: DB_PATH
              value: "/tmp/edge_state.db"
          resources:
            {{- toYaml .Values.restateHub.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app/restate_hub.py
              subPath: restate_hub.py
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# cm-service — Configuration Management on Restate
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cm-service
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "cm-service" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "cm-service" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "cm-service" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/baselines"  "dst" "baselines")
          ) "root" .) | nindent 8 }}
      containers:
        - name: cm-service
          image: {{ include "openddil.image" (dict "name" .Values.cmService.image.name "tag" .Values.cmService.image.tag "digest" .Values.cmService.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.cmService.image.pullPolicy "root" .) }}
          env:
            # cm-service multi-directory baseline support (CM_BASELINES_DIRS)
            # is intentionally NOT wired here. Customer overlays that want to
            # layer additional baselines follow the same overlay-patch pattern
            # the frontend + projector overlays use: a post-install Job in
            # the customer chart `kubectl patch`es this Deployment to add a
            # /baselines-overlay volumeMount + CM_BASELINES_DIRS env. Keeps
            # the OSS chart customer-agnostic. See
            # openddil-customer-bundle-customer-overlay/chart/templates/
            # hook-patch-cm-service.yaml for the canonical example.
            - name: CM_BASELINES_DIR
              value: "/baselines"
            - name: CM_KAFKA_BROKERS
              value: {{ $hqBroker | quote }}
            - name: CM_HTTP_PORT
              value: {{ .Values.cmService.port | quote }}
            - name: CM_STALENESS_WINDOW_S
              value: "900"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app/src"
          ports:
            - name: http
              containerPort: {{ .Values.cmService.port }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /baselines
              subPath: baselines
          resources:
            {{- toYaml .Values.cmService.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cm-service
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "cm-service" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.cmService.port }}
      targetPort: http
---
# ===========================================================================
# asset-registry-service (ADR-0028) — canonical asset->edge->region writer
# ===========================================================================
# One pod composes per-edge Faust Apps in-process. Consumes
# telemetry-latest-state from each edge broker, runs edge-assignment to
# compute (edge_id, region_id), upserts asset_registry on HQ postgres,
# publishes asset-registry-events on HQ broker for consumer cache
# invalidation. Single writer for the asset_registry table by design --
# any future static-assignment input lands via a separate admin write
# path, not a second Faust pod.
#
# Bundle init brings in /proto (contracts/gen/python) and
# /etc/openddil/edge-assignment/edge-assignment.yaml (the FOB list +
# strategy chain, same file the projector reads).
#
# Depends on:
#   - postgres-schema-init having applied the 20260604202813 migration
#     (CHECK constraint on assignment_source enforces the four ADR-0028
#     values; older migrations would let the service start but every
#     upsert would fail).
#   - The asset-registry-events topic existing (topic-init creates it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-asset-registry-service
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "asset-registry-service" "root" .) | nindent 4 }}
spec:
  replicas: 1   # Single writer by design (ADR-0028). DO NOT scale up.
  strategy:
    type: Recreate   # Faust state recovery prefers a stop-then-start cycle.
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "asset-registry-service" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "asset-registry-service" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" .) | nindent 8 }}
      containers:
        - name: asset-registry-service
          image: {{ include "openddil.image" (dict "name" .Values.assetRegistry.image.name "tag" .Values.assetRegistry.image.tag "digest" .Values.assetRegistry.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.assetRegistry.image.pullPolicy "root" .) }}
          env:
            - name: ASSET_REGISTRY_POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: ASSET_REGISTRY_EDGES
              # Comma-separated edge=broker pairs across ALL edges.
              # Each pair becomes one Faust App in the composed worker.
              {{- $edgePairs := list }}
              {{- range $edge := .Values.edges }}
              {{- $edgePairs = append $edgePairs (printf "%s=%s-redpanda-%s%s:%d" $edge.id $.Release.Name $edge.id (include "openddil.svcDomain" $) (int $.Values.redpandaEdge.internalPort)) }}
              {{- end }}
              value: {{ join "," $edgePairs | quote }}
            - name: ASSET_REGISTRY_KAFKA_BROKERS
              value: {{ printf "%s-redpanda-hq%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.redpandaHq.kafkaPort) | quote }}
            - name: ASSET_REGISTRY_INPUT_TOPIC
              value: "telemetry-latest-state"
            - name: ASSET_REGISTRY_OUTPUT_TOPIC
              value: {{ .Values.assetRegistry.outputTopic | quote }}
            # EDGE_ASSIGNMENT_CONFIG is intentionally NOT set in the OSS
            # chart. The OSS chart has no embedded FOB list -- without an
            # overlay, every asset assigns to "unspecified" via the
            # service's built-in fallback (still useful: divergence
            # tracking + asset_id->edge cache for downstream consumers).
            # Customer overlays patch this in via the same post-install
            # hook pattern they use to point the projectors at their
            # FOB file:
            #   kubectl patch deploy/<release>-asset-registry-service \
            #     --type strategic -p '{"spec":{"template":{"spec":{
            #       "containers":[{"name":"asset-registry-service",
            #         "volumeMounts":[{"name":"edge-assignment",
            #           "mountPath":"/etc/openddil/edge-assignment"}],
            #         "env":[{"name":"EDGE_ASSIGNMENT_CONFIG",
            #           "value":"/etc/openddil/edge-assignment/edge-assignment.yaml"}]
            #       }],
            #       "volumes":[{"name":"edge-assignment","configMap":
            #         {"name":"<slug>-edge-assignment"}}]
            #     }}}}'
            - name: ASSET_REGISTRY_WEB_PORT
              value: {{ .Values.assetRegistry.webPort | quote }}
            - name: PYTHONPATH
              # bundle-loader writes contracts/gen/python -> /shared/proto;
              # this container mounts the same volume with subPath=proto at
              # /proto, so the generated bindings live at
              # /proto/openddil/telemetry/v1/telemetry_pb2.py. Python won't
              # see them without /proto on sys.path -- _try_decode_event
              # then silently returns None for every event, ADR-0028's
              # asset-registry-events stays empty, source-app's region
              # cache stays empty, and the whole regional aggregation
              # chain stays dark. Mirrors what cm-service / logistics-
              # fusion / regional / projector all already do.
              value: "/proto:/app/src"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: faust-web
              containerPort: {{ .Values.assetRegistry.webPort }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
          resources:
            {{- toYaml .Values.assetRegistry.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-asset-registry-service
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "asset-registry-service" "root" .) | nindent 4 }}
  ports:
    - name: faust-web
      port: {{ .Values.assetRegistry.webPort }}
      targetPort: faust-web
---
# cm-service-bootstrap — Job: registers CM service with Restate + creates
# subscriptions per edge cluster. Helm hook, fires after CM service is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cm-service-bootstrap
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "cm-service-bootstrap" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/bootstrap" "dst" "openddil_bootstrap")
          ) "root" .) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "openddil.image" (dict "name" .Values.cmService.image.name "tag" .Values.cmService.image.tag "digest" .Values.cmService.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.cmService.image.pullPolicy "root" .) }}
          command: ["python", "/app/bootstrap/register_subscriptions.py"]
          env:
            - name: RESTATE_ADMIN_URL
              value: {{ printf "http://%s-restate-server%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.restate.adminPort) | quote }}
            - name: CM_SERVICE_ENDPOINT
              value: {{ printf "http://%s-cm-service%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.cmService.port) | quote }}
            - name: CM_EDGE_CLUSTERS
              value: {{ join "," $cmEdgeClusters | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/app"
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app/openddil_bootstrap
              subPath: openddil_bootstrap
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# logistics-fusion-service
# ===========================================================================
