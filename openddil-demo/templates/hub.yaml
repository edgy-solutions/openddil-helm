              subPath: ontology
          resources:
            {{- toYaml .Values.logisticsFusion.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-logistics-fusion-service
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "logistics-fusion-service" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.logisticsFusion.port }}
      targetPort: http
---
# logistics-fusion-bootstrap — Job, hooks at weight 21 (after CM bootstrap)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-logistics-fusion-bootstrap
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "21"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "logistics-fusion-bootstrap" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/bootstrap" "dst" "openddil_bootstrap")
          ) "root" .) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "openddil.image" (dict "name" .Values.logisticsFusion.image.name "tag" .Values.logisticsFusion.image.tag "digest" .Values.logisticsFusion.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.logisticsFusion.image.pullPolicy "root" .) }}
          command: ["python", "/app/bootstrap/register_subscriptions.py"]
          env:
            - name: RESTATE_ADMIN_URL
              value: {{ printf "http://%s-restate-server%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.restate.adminPort) | quote }}
            - name: FUSION_SERVICE_ENDPOINT
              value: {{ printf "http://%s-logistics-fusion-service%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.logisticsFusion.port) | quote }}
            - name: FUSION_EDGE_CLUSTERS
              value: {{ join "," $cmEdgeClusters | quote }}
            - name: FUSION_HQ_CLUSTER
              value: {{ $hqBroker | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/app"
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app/openddil_bootstrap
              subPath: openddil_bootstrap
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# projector-hq — HQ-cluster topic projection to postgres-hq
# ===========================================================================
# Same image as per-edge projector; different broker (hq), different
# edge/region labels (unspecified), buffer monitor off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-projector-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "projector-hq" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "projector-hq" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "projector-hq" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" .) | nindent 8 }}
      containers:
        - name: projector
          image: {{ include "openddil.image" (dict "name" .Values.projector.image.name "tag" .Values.projector.image.tag "digest" .Values.projector.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.projector.image.pullPolicy "root" .) }}
          env:
            - name: KAFKA_BROKERS
              value: {{ $hqBroker | quote }}
            - name: POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: METRICS_PORT
              value: {{ .Values.projector.port | quote }}
            - name: RATE_LIMIT_PER_SEC
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: OPENDDIL_EDGE_ID
              value: "edge-unspecified"
            - name: OPENDDIL_REGION_ID
              value: "region-unspecified"
            - name: BUFFER_MONITOR_ENABLED
              value: "false"
          ports:
            - name: metrics
              containerPort: {{ .Values.projector.port }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
          resources:
            {{- toYaml .Values.projector.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# frontend
# ===========================================================================
# The frontend nginx hardcodes `toxiproxy` as the proxy upstream hostname.
# In k8s we satisfy that by adding a SECOND Service named exactly `toxiproxy`
# (no Release.Name prefix) that selects the same toxiproxy pod. See below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "openddil.image" (dict "name" .Values.frontend.image.name "tag" .Values.frontend.image.tag "digest" .Values.frontend.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.frontend.image.pullPolicy "root" .) }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
---
# Alias service so frontend nginx's hardcoded `toxiproxy:8475` resolves.
# This is intentionally unprefixed (not {{ .Release.Name }}-toxiproxy) —
# it's a fixed hostname the frontend image expects. One chart install per
# namespace, so the unqualified name is safe.
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    openddil.io/alias: "true"
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "toxiproxy" "root" .) | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.toxiproxy.apiPort }}
      targetPort: api
    - name: proxy
      port: {{ .Values.toxiproxy.proxyPort }}
      targetPort: proxy
