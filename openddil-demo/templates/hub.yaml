---
# ===========================================================================
# effector-declared-load config, HQ instance
# ===========================================================================
# Same rendered content every projector mounts (openddil.effectorDeclaredLoadYaml,
# _helpers.tpl) — declared load is a property of the launcher, not of which
# projector admits its Fire. One ConfigMap per projector instance because
# each runs on its own cluster/broker, not because the content differs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-effector-declared-load
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  effector-declared-load.yaml: |
    {{- include "openddil.effectorDeclaredLoadYaml" . | nindent 4 }}
---
# ===========================================================================
# projector-hq — HQ-cluster topic projection to postgres-hq
# ===========================================================================
# Same image as per-edge projector; different broker (hq), different
# edge/region labels (unspecified), buffer monitor off.
{{- $projectorHqPairs := list }}
{{- range include "openddil.projectorGroupIds" . | splitList " " }}
{{- $projectorHqPairs = append $projectorHqPairs (printf "hq/%s" .) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-projector-hq
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "projector-hq" "root" .) | nindent 4 }}
  annotations:
    # 12-group set from openddil.projectorGroupIds (_helpers.tpl) -- a CODE
    # DEFAULT (projector_config.yaml in openddil-projector), not visible in
    # this chart. Same set as the per-edge projector Deployments in
    # edge.yaml, here on the hq broker.
    openddil.io/consumer-groups: {{ join " " $projectorHqPairs | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "projector-hq" "root" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Hashes the rendered declared-load body, same reasoning as
        # checksum/projector-config on the tier projector: a ConfigMap
        # change with no checksum in the POD TEMPLATE updates the object
        # and restarts nothing, so a bumped declared load would not reload
        # until something else rolled this Deployment. On the Deployment's
        # own metadata it would roll nothing either.
        checksum/effector-declared-load: {{ include "openddil.effectorDeclaredLoadYaml" . | sha256sum }}
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "projector-hq" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" .) | nindent 8 }}
      containers:
        - name: projector
          image: {{ include "openddil.image" (dict "name" .Values.projector.image.name "tag" .Values.projector.image.tag "digest" .Values.projector.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.projector.image.pullPolicy "root" .) }}
          env:
            - name: KAFKA_BROKERS
              value: {{ $hqBroker | quote }}
            - name: POSTGRES_DSN
              value: {{ $pgDsn | quote }}
            - name: METRICS_PORT
              value: {{ .Values.projector.port | quote }}
            - name: RATE_LIMIT_PER_SEC
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: OPENDDIL_EDGE_ID
              value: "edge-unspecified"
            - name: OPENDDIL_REGION_ID
              value: "region-unspecified"
            - name: BUFFER_MONITOR_ENABLED
              value: "false"
            # declared-load reload path + the
            # Detonation timeout sweep's window, same two env vars on
            # every projector that carries the effector_launch mapping.
            - name: EFFECTOR_DECLARED_LOAD_PATH
              value: /etc/openddil/effector-declared-load/effector-declared-load.yaml
            - name: EFFECTOR_TERMINAL_TIMEOUT_S
              value: {{ .Values.effectors.terminalTimeoutSeconds | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.projector.port }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: effector-declared-load
              mountPath: /etc/openddil/effector-declared-load
          resources:
            {{- toYaml .Values.projector.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
        - name: effector-declared-load
          configMap:
            name: {{ .Release.Name }}-effector-declared-load
---
# ===========================================================================
# frontend
# ===========================================================================
# The frontend nginx hardcodes `toxiproxy` as the proxy upstream hostname.
# In k8s we satisfy that by adding a SECOND Service named exactly `toxiproxy`
# (no Release.Name prefix) that selects the same toxiproxy pod. See below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 8 }}
      {{- if or .Values.frontend.releasedRecordsPanes .Values.releasability.enabled }}
      annotations:
        checksum/deployment-config: {{ include "openddil.frontendDeploymentJson" . | sha256sum | quote }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "openddil.image" (dict "name" .Values.frontend.image.name "tag" .Values.frontend.image.tag "digest" .Values.frontend.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.frontend.image.pullPolicy "root" .) }}
          {{- if .Values.releasability.enabled }}
          env:
            # WHERE THE BROWSER-S READ PATH ACTUALLY GOES.
            #
            # The browser keeps requesting the same same-origin
            # `/electric/v1/shape`; nginx sends it to the PEP instead of to
            # Electric. No frontend rebuild, no CORS, and the session cookie
            # rides along because nothing about the origin changed.
            #
            # This and the NetworkPolicy are set from the SAME value on
            # purpose. If this were left pointing at Electric while
            # enforcement was on, the result would be a complete bypass that
            # looked like everything working — so the NetworkPolicy makes
            # that combination fail visibly instead.
            - name: OPENDDIL_ELECTRIC_UPSTREAM
              value: {{ printf "%s-pep" .Release.Name | quote }}
            - name: OPENDDIL_ELECTRIC_PORT
              value: "8080"
            - name: OPENDDIL_PEP_UPSTREAM
              value: {{ printf "%s-pep" .Release.Name | quote }}
            # THE SHELL REQUIRES A SESSION, not just the data paths.
            # Set from the SAME condition that puts this tier's PEP into
            # oidc mode, because the gate is only satisfiable when something
            # can answer /auth/me: with no PEP that is a 502 and in header
            # mode a 404, and nginx's auth_request turns either into a 500
            # for the whole app. Tying them to one condition is what stops a
            # deployment having a gate with nothing behind it.
            - name: OPENDDIL_SESSION_GATE
              value: {{ ternary "on" "off" .Values.releasability.oidc.enabled | quote }}
            # THE EGRESS ADMISSION PANE, HUB-ONLY, REACHED THROUGH THE HUB
            # PEP -- PA. The pane (egress.yaml's egress-pane-api) answers
            # once, for every nation on the wire; routing straight to it from
            # a gated shell was the cross-nation leak PA/measure-4.log
            # measured (every profile got the pane's identical 15 records).
            # VIA_PEP tells 40-resolver.sh to point this location at the same
            # $pep_upstream the read path already uses, path unchanged, so
            # the PEP's own /egress/decisions route can ask Topaz for THIS
            # viewer's nations and filter the pane's answer down to them
            # (gateway/egress_view.py) before the browser ever sees it. Not
            # set on tier-node.yaml frontends: nginx there substitutes the
            # __EGRESS_PANE_OFF__ 404 branch instead, because neither a PEP
            # nor a pane exists at that tier.
            - name: OPENDDIL_EGRESS_PANE_VIA_PEP
              value: "on"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # Branding is OPTIONAL and supplied by a separate overlay chart,
            # not this one. `optional: true` on the volume below is what
            # makes a missing ConfigMap a non-error instead of a stuck pod;
            # the kubelet populates this mount once the ConfigMap shows up,
            # with no restart needed. The SPA reads /branding/branding.json
            # and falls back to OpenDDIL defaults when the file is absent.
            - name: branding
              mountPath: /usr/share/nginx/html/branding
              readOnly: true
            {{- if or .Values.frontend.releasedRecordsPanes .Values.releasability.enabled }}
            # Only the hub view gets this: the tier frontends (tier-node.yaml)
            # have their own deployment.json carrying tier shape, not this.
            - name: deployment-config
              mountPath: /usr/share/nginx/html/deployment
              readOnly: true
            {{- end }}
      volumes:
        - name: branding
          configMap:
            name: {{ .Values.frontend.branding.configMap | default (printf "%s-branding" .Release.Name) }}
            optional: true
        {{- if or .Values.frontend.releasedRecordsPanes .Values.releasability.enabled }}
        - name: deployment-config
          configMap:
            name: {{ .Release.Name }}-frontend-deployment-config
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
{{- if or .Values.frontend.releasedRecordsPanes .Values.releasability.enabled }}
---
# The hub view's released-records panes (ADR-0046 §5): per-destination
# tables the hub shell renders from .Values.frontend.releasedRecordsPanes.
# With releasability on, it also carries `egressPane`: the hub serves the
# egress admission pane through its PEP, so the hub view renders it, opening
# on .Values.egress.destination. Without releasability there is no pane and
# the key is absent.
# Hub-only -- a tier frontend (tier-node.yaml's own deployment.json) carries
# tier shape, never this. Minimal on purpose: no title/tier/fobs keys, so
# every other field the app reads from deployment.json keeps its built-in
# default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-deployment-config
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
data:
  deployment.json: |
    {{ include "openddil.frontendDeploymentJson" . }}
{{- end }}
---
# Alias service so frontend nginx's hardcoded `toxiproxy:8475` resolves.
# This is intentionally unprefixed (not {{ .Release.Name }}-toxiproxy) —
# it's a fixed hostname the frontend image expects. One chart install per
# namespace, so the unqualified name is safe.
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
    openddil.io/alias: "true"
spec:
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "toxiproxy" "root" .) | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.toxiproxy.apiPort }}
      targetPort: api
