        {{- include "openddil.podLabels" . | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "logistics-fusion-bootstrap" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/bootstrap" "dst" "openddil_bootstrap")
          ) "root" .) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "openddil.image" (dict "name" .Values.logisticsFusion.image.name "tag" .Values.logisticsFusion.image.tag "digest" .Values.logisticsFusion.image.digest "root" .) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" .Values.logisticsFusion.image.pullPolicy "root" .) }}
          command: ["python", "/app/bootstrap/register_subscriptions.py"]
          env:
            - name: RESTATE_ADMIN_URL
              value: {{ printf "http://%s-restate-server%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.restate.adminPort) | quote }}
            - name: FUSION_SERVICE_ENDPOINT
              value: {{ printf "http://%s-logistics-fusion-service%s:%d" .Release.Name (include "openddil.svcDomain" .) (int .Values.logisticsFusion.port) | quote }}
            - name: FUSION_EDGE_CLUSTERS
              value: {{ join "," $cmEdgeClusters | quote }}
            - name: FUSION_HQ_CLUSTER
              value: {{ $hqBroker | quote }}
            - name: LOG_LEVEL
              value: "INFO"
