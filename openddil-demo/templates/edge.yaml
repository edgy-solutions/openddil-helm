{{- /*
   edge.yaml — per-edge services. Loops over .Values.edges to produce one
   of each below per edge:
     * sensor-ingest (DIS UDP ingestion, NodePort UDP service for external
       simulator access)
     * redpanda-connect (DIS Bronze → Silver mapper, ontology+proto-aware)
     * faust-edge (per-asset processing, prognostics)
     * edge-hq-bridge (Kafka MirrorMaker analogue: edge cluster → HQ cluster
       via toxiproxy)
     * projector (Kafka → Postgres projection for ElectricSQL consumers)
*/}}
{{- $root := . -}}
{{- range .Values.edges }}
{{- $edge := . }}
{{- $edgeBroker := printf "%s-redpanda-%s%s:%d" $root.Release.Name $edge.id (include "openddil.svcDomain" $root) (int $root.Values.redpandaEdge.internalPort) }}
{{- $hqBroker := printf "%s-redpanda-hq%s:%d" $root.Release.Name (include "openddil.svcDomain" $root) (int $root.Values.redpandaHq.kafkaPort) }}

# ===========================================================================
# sensor-ingest-{{ $edge.id }} — DIS UDP ingestion
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-sensor-ingest-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # ontology: DIS entity-appearance decoding reads dis_appearance.yaml
        # from /ontology (ADR-0026 / ADR-0030). Stage 1 gained this dependency
        # when appearance decoding landed; appearance.py defaults to that path.
        #
        # WITHOUT THE MOUNT THE DECODER IS INERT RATHER THAN BROKEN: a missing
        # table means it emits no appearance facts at all, which is the same
        # honest outcome as an undeclared source. Correct fail-safe behaviour —
        # and exactly why the gap was invisible on 2026-08-28: the pipeline
        # stayed green, no pod complained, and the health axis simply never
        # populated. A dependency that fails safely still has to be declared.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/ontology"   "dst" "ontology")
            (dict "src" "demo/ontology"       "dst" "ontology" "overlay" true)
          ) "root" $root) | nindent 8 }}
      containers:
        - name: sensor-ingest
          image: {{ include "openddil.image" (dict "name" $root.Values.sensorIngest.image.name "tag" $root.Values.sensorIngest.image.tag "digest" $root.Values.sensorIngest.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.sensorIngest.image.pullPolicy "root" $root) }}
          command: ["python", "dis_ingestor.py"]
          env:
            - name: KAFKA_BROKERS
              value: {{ $edgeBroker | quote }}
            - name: KAFKA_TOPIC
              value: "ingress-dis-raw"
            - name: OPENDDIL_EDGE_ID
              value: {{ $edge.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $edge.region | quote }}
            - name: UDP_PORT
              value: {{ $edge.udpPort | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app"
          ports:
            - name: dis-udp
              protocol: UDP
              containerPort: {{ $edge.udpPort }}
            - name: http
              containerPort: {{ $root.Values.sensorIngest.httpPort }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            # The init container COPIES the ontology into the shared volume;
            # this is what makes it visible to the process. Both halves are
            # required and only one of them is obvious — adding the copy alone
            # leaves /ontology absent and the appearance decoder silently
            # inert, which is how this was missed the first time.
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
          resources:
            {{- toYaml $root.Values.sensorIngest.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# Service exposing the UDP port. ClusterIP by default (in-namespace
# producers + kubectl port-forward). Set sensorIngest.externalAccess.
# enabled=true if a producer OUTSIDE the cluster needs UDP into this
# edge — that flips the type to NodePort and exposes udpPort on every
# node. ClusterIP is correct for 443-only / no-NodePort clusters.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-sensor-ingest-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  type: {{ if $root.Values.sensorIngest.externalAccess.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 4 }}
  ports:
    - name: dis-udp
      protocol: UDP
      port: {{ $edge.udpPort }}
      targetPort: dis-udp
      {{- if $root.Values.sensorIngest.externalAccess.enabled }}
      nodePort: {{ $edge.udpPort }}
      {{- end }}
    - name: http
      protocol: TCP
      port: {{ $root.Values.sensorIngest.httpPort }}
      targetPort: http
---
# ===========================================================================
# redpanda-connect-{{ $edge.id }} — DIS Bronze → Silver mapper
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-redpanda-connect-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $edge.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Connect yaml hardcodes /proto and /ontology. /proto must hold the
        # .proto SOURCE files — the connect `protobuf` processor parses them
        # at runtime to resolve message types like
        # openddil.telemetry.v1.EntityTelemetryEvent. It is NOT the generated
        # gen/python bindings (those are for the Python services). /ontology
        # is the sim-dis-mapping.yaml ontology file. Init container also
        # delivers the base connect.yaml and the dynamic mappings.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/proto"      "dst" "proto")
            (dict "src" "contracts/ontology"   "dst" "ontology")
            (dict "src" "demo/ontology"       "dst" "ontology" "overlay" true)
            (dict "src" "demo/openddil-base-connect.yaml" "dst" "connect.yaml")
            (dict "src" "demo/dynamic-mappings" "dst" "mappings")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: connect
          image: "{{ include "openddil.thirdPartyImage" $root.Values.redpandaConnect.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.redpandaConnect.image.pullPolicy "root" $root) }}
          args: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
          env:
            - name: REDPANDA_BROKER
              value: {{ $edgeBroker | quote }}
          ports:
            - name: http
              containerPort: {{ $root.Values.redpandaConnect.httpPort }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
            - name: bundle-shared
              mountPath: /connect.yaml
              subPath: connect.yaml
            - name: bundle-shared
              mountPath: /mappings
              subPath: mappings
          resources:
            {{- toYaml $root.Values.redpandaConnect.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# faust-edge-{{ $edge.id }} — per-asset processing + prognostics
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-faust-edge-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "faust-edge-%s" $edge.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "faust-edge-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "faust-edge-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python/openddil" "dst" "app-openddil")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: faust-edge
          image: {{ include "openddil.image" (dict "name" $root.Values.faustEdge.image.name "tag" $root.Values.faustEdge.image.tag "digest" $root.Values.faustEdge.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.faustEdge.image.pullPolicy "root" $root) }}
          workingDir: /tmp
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: FAUST_APP_ID
              value: {{ printf "openddil-%s" $edge.id | quote }}
            - name: KAFKA_BROKERS
              value: {{ $edgeBroker | quote }}
            - name: OPENDDIL_EDGE_ID
              value: {{ $edge.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $edge.region | quote }}
            {{- range $k, $v := $root.Values.faustEdge.prognosticsEnv }}
            - name: {{ printf "PROGNOSTICS_%s" $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            # The generated openddil/ proto package is subPath-mounted into
            # /app (PYTHONPATH=/app). google.protobuf is NOT bundled — it
            # ships in the image's `protobuf` pip package; gen/python/google
            # is an empty dir and bundling it crashed the bundle-loader.
            - name: bundle-shared
              mountPath: /app/openddil
              subPath: app-openddil
          resources:
            {{- toYaml $root.Values.faustEdge.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# edge-hq-bridge-config-{{ $edge.id }} — GENERATED, not copied from the bundle
# ===========================================================================
# ROOT-TIER CONVERGENCE ON TIER-NODE MECHANICS (GD-09, ADR-0033).
#
# This config used to be a baked per-edge file in the runtime-bundle image
# (demo/redpanda-connect-edge-NN.yaml), which made edge identity a property of
# a SHIPPED ARTIFACT rather than of declared topology — the direct opposite of
# ADR-0033's "tier names are deployment configuration". An overlay naming its
# edges anything but edge-01/02/03 got:
#   cp: can't stat '/bundle/demo/redpanda-connect-<edge>.yaml'
#
# The tier node already proved the conformant mechanism: its restate.toml is
# chart-generated from values because Restate 1.6.x has no runtime /clusters
# API (see tier-node.yaml). Same pattern applied here — the OVERLAY DECLARES
# topology as data, the CHART GENERATES the runtime wiring from it. Renaming
# an edge is now a one-line values change rather than an N-file edit.
#
# Baked per-edge runtime files are NOT an overlay artifact class and must not
# become one: that would relocate this exact name-coupling one layer up and
# bless it as a contract, obliging every overlay author to ship N wiring files
# for N edges.
#
# Diffing the three bundled variants showed they differed ONLY in a comment,
# the broker address and the consumer-group name — pure topology, nothing
# authored. Nothing is lost by generating them.
#
# It also removes a dependency on the bare-name ALIAS Services.
#
# The bundled files hardcoded docker-compose hostnames
# (`redpanda-edge-01:9092`, `toxiproxy:8474`). Those DO resolve, because
# infrastructure.yaml and hub.yaml deliberately publish unprefixed alias
# Services for exactly this reason — a documented compatibility shim for
# compose-era configs, not an accident. So the bridge worked wherever the
# edge ids matched the baked filenames; the lab failure was the missing FILE
# alone, and never reached hostname resolution.
#
# Generating removes the coupling to those aliases: this config now carries
# release-prefixed Service names and works whether or not the shim exists.
#
# One genuine piece of dead weight confirmed on the way: the baked configs
# never referenced the ${EDGE_BROKER}/${HQ_BROKER} env this chart injected,
# despite a comment claiming they did. Cosmetic rather than breaking — but it
# is why the configuration looked parameterised while the real coupling was a
# filename.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-edge-hq-bridge-config-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  connect.yaml: |
    # {{ $edge.id }} → HQ bridge (ADR-0023 Phase 6a). GENERATED by the chart.
    # Consumer group is distinct per edge so `rpk group describe` reads
    # per-edge bridge lag without ambiguity.
    input:
      kafka:
        addresses:
          - {{ $edgeBroker }}
        topics:
          - raw-sensor-stream
          - tactical-events
          {{- if include "openddil.isTierManaged" (dict "id" $edge.id "root" $root) }}
          # THE TIER'S DERIVED STATE, carried up because the root no longer
          # computes it for this edge (see hub.yaml, the detection cutover).
          #
          # The root's cm-service and fusion have retired their downward
          # subscriptions here; this is what replaces them. Same topic names
          # on the HQ broker as when the root produced them, so the HQ
          # projector and fusion's HQ-cluster subscription are unchanged —
          # only the producer moved, from the root reaching down to the tier
          # publishing up.
          #
          # Labels are already stamped: the tier's own fusion and cm-service
          # propagate releasability onto these rows before they leave the
          # edge, so the completeness gate's question is answered at the tier
          # and the answer travels with the data.
          - asset-logistics-status
          - asset-cm-state
          #
          # AND THE ONE THAT IS NOT DERIVED STATE, carried for a different
          # reason: `telemetry-latest-state` is what HQ's `telemetry_latest_state`
          # table is projected FROM, and on the HQ broker that topic had never
          # been produced to at all (high-watermark 0, measured 2026-09-05).
          # Every row HQ held for this edge was written by the downward
          # per-edge projector below. Retire that projector without bridging
          # this topic and HQ's view of the edge does not go stale — IT GOES
          # EMPTY, and "no rows" is not the degraded mode ADR-0036 clause 4
          # specifies. `projector-hq` is already subscribed to this topic and
          # has simply been sitting on an empty partition; bridging it is what
          # gives that subscription something to read.
          - telemetry-latest-state
          {{- end }}
        consumer_group: "bridge-group-{{ $edge.id }}"

    output:
      kafka:
        addresses:
          - {{ printf "%s-toxiproxy%s:%d" $root.Release.Name (include "openddil.svcDomain" $root) (int $root.Values.toxiproxy.apiPort) }}
        topic: "${! meta(\"kafka_topic\") }"
        max_retries: 0
---
# ===========================================================================
# edge-hq-bridge-{{ $edge.id }} — edge cluster → HQ cluster via toxiproxy
# ===========================================================================
# Config comes from the generated ConfigMap above, NOT from the bundle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-edge-hq-bridge-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "edge-hq-bridge-%s" $edge.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "edge-hq-bridge-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "edge-hq-bridge-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bridge
          image: "{{ include "openddil.thirdPartyImage" $root.Values.edgeHqBridge.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.edgeHqBridge.image.pullPolicy "root" $root) }}
          args: ["--chilled", "run", "/connect.yaml"]
          # NO bundle-loader initContainer and NO broker env vars.
          #
          # Both were vestigial. The generated ConfigMap carries fully
          # resolved Service addresses, so there is nothing to substitute at
          # runtime — and the env vars were never read by the config they
          # claimed to parameterise. Keeping them would preserve the
          # appearance of configurability while the real coupling lived
          # somewhere else, which is how this stayed broken.
          #
          # The bridge consumes from the edge cluster and produces to HQ
          # THROUGH toxiproxy, which is why the output address is toxiproxy
          # rather than redpanda-hq — that is the severance-injection seam,
          # not an accident.
          volumeMounts:
            - name: connect-config
              mountPath: /connect.yaml
              subPath: connect.yaml
          resources:
            {{- toYaml $root.Values.edgeHqBridge.resources | nindent 12 }}
      volumes:
        - name: connect-config
          configMap:
            name: {{ $root.Release.Name }}-edge-hq-bridge-config-{{ $edge.id }}
---
# ===========================================================================
# projector-{{ $edge.id }} — Kafka → Postgres projection
# ===========================================================================
# Subscribes to per-edge topics on the edge cluster, projects state into
# postgres-hq. Per-edge projectors run alongside projector-hq (in hub.yaml)
# so per-edge topics like telemetry-latest-state populate on every edge
# while hq-only topics (regional rollups) populate from projector-hq.
#
# ---------------------------------------------------------------------------
# NOT DEPLOYED FOR A TIER-MANAGED EDGE (UD-11) — THE LAST REACHBACK.
# ---------------------------------------------------------------------------
# This Deployment is edge-local at its INPUT and root-owned at its OUTPUT: it
# reads the edge's broker directly and writes the ROOT's store. In the
# pre-tier topology that was the root's legitimate feed. Once the edge has a
# tier node it is a consumer above the tier reading that tier's streams —
# the same rule the detection cutover applied to cm-service and fusion,
# which this Deployment was missed by.
#
# It also read the edge broker DIRECTLY, never through toxiproxy, and that
# is how it stayed invisible: the severance rehearsal cut the bridge and
# this path was not on it, so HQ stayed fresh through every sever anyone
# ever ran. HQ was never observed to diverge, so "HQ converges" was
# convergence onto a value it had never left.
#
# The replacement is not a gate alone but a REPOINT: HQ's view of this edge
# is now projected by `projector-hq` from the BRIDGED topics on the HQ
# broker — derived state with the tier's releasability labels already
# stamped, plus `telemetry-latest-state` (see the bridge config above).
# One writer per edge, and for a tier-managed edge that writer is behind
# the bridge, so cutting the bridge is now visible at HQ.
{{- if not (include "openddil.isTierManaged" (dict "id" $edge.id "root" $root)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-projector-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "projector-%s" $edge.id) "root" $root) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "projector-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.labels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "projector-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: projector
          image: {{ include "openddil.image" (dict "name" $root.Values.projector.image.name "tag" $root.Values.projector.image.tag "digest" $root.Values.projector.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.projector.image.pullPolicy "root" $root) }}
          env:
            - name: KAFKA_BROKERS
              value: {{ $edgeBroker | quote }}
            - name: POSTGRES_DSN
              value: {{ printf "postgres://%s:%s@%s-postgres-hq%s:%d/%s"
                  $root.Values.postgresHq.auth.username
                  $root.Values.postgresHq.auth.password
                  $root.Release.Name
                  (include "openddil.svcDomain" $root)
                  (int $root.Values.postgresHq.port)
                  $root.Values.postgresHq.auth.database
                | quote }}
            - name: METRICS_PORT
              value: {{ $root.Values.projector.port | quote }}
            - name: RATE_LIMIT_PER_SEC
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: OPENDDIL_EDGE_ID
              value: {{ $edge.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $edge.region | quote }}
            - name: BUFFER_MONITOR_ENABLED
              value: "true"
            # THE GROUP NAME IS PER-EDGE AND MUST BE PASSED.
            #
            # edge_buffer_monitor.py defaults BRIDGE_CONSUMER_GROUP to the
            # bare "bridge-group", but the bridge commits under
            # "bridge-group-<edge_id>" — deliberately, so per-edge lag is
            # unambiguous. Leaving the default makes the monitor query a group
            # that has NEVER EXISTED.
            #
            # It then fails silently: a missing group yields no committed
            # offsets, and the probe's own contract is "returns 0 if the group
            # has not committed any offsets yet". A broken lookup and a quiet
            # link produce the identical reading, so the UI buffer counter
            # reads 0 forever and looks plausible while doing so.
            #
            # Measured on a real cluster 2026-08-08: with the link severed,
            # `rpk group describe bridge-group-<edge>` climbed 32 -> 265 over
            # 160s while this monitor reported 0 throughout. The DDIL
            # buffering was working the whole time; only its instrument was
            # blind.
            - name: BRIDGE_CONSUMER_GROUP
              value: "bridge-group-{{ $edge.id }}"
          ports:
            - name: metrics
              containerPort: {{ $root.Values.projector.port }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
          resources:
            {{- toYaml $root.Values.projector.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
{{- end }}
---
{{- end }}
