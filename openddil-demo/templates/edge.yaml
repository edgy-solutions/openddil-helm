{{- /*
   edge.yaml — per-edge services. Loops over .Values.edges to produce one
   of each below per edge:
     * sensor-ingest (DIS UDP ingestion, NodePort UDP service for external
       simulator access)
     * redpanda-connect (DIS Bronze → Silver mapper, ontology+proto-aware)
     * faust-edge (per-asset processing, prognostics)
     * edge-hq-bridge (Kafka MirrorMaker analogue: edge cluster → its parent
       cluster, through its own severable proxy when linkControl.enabled)
     * projector (Kafka → Postgres projection for ElectricSQL consumers)
*/}}
{{- $root := . -}}
{{- /* sensorIngest.entityAssignment (values.yaml) -- validated and grouped
   by edge ONCE here, outside the range below, so a failure names the
   whole list's state rather than whichever edge happens to render first.
   Produces $entityIdsByEdge: edge id -> sorted list of admitted DIS ids. */ -}}
{{- $entityAssignment := $root.Values.sensorIngest.entityAssignment | default list }}
{{- $validEdgeIds := list }}
{{- range $root.Values.edges }}
{{- $validEdgeIds = append $validEdgeIds .id }}
{{- end }}
{{- $seenEntityIds := dict }}
{{- $entityIdsByEdge := dict }}
{{- range $entityAssignment }}
{{- $entityId := .id }}
{{- $assignedEdge := .edge }}
{{- if not (regexMatch "^dis:[0-9]+:[0-9]+:[0-9]+$" ($entityId | toString)) }}
{{- fail (printf "sensorIngest.entityAssignment: malformed id %q -- must match dis:<site>:<application>:<entity>" $entityId) }}
{{- end }}
{{- if hasKey $seenEntityIds $entityId }}
{{- fail (printf "sensorIngest.entityAssignment: id %q is assigned to more than one edge (%s and %s)" $entityId (get $seenEntityIds $entityId) $assignedEdge) }}
{{- end }}
{{- $_ := set $seenEntityIds $entityId $assignedEdge }}
{{- if not (has $assignedEdge $validEdgeIds) }}
{{- fail (printf "sensorIngest.entityAssignment: entry for id %q names edge %q, which is not in edges[]" $entityId $assignedEdge) }}
{{- end }}
{{- $existingIds := get $entityIdsByEdge $assignedEdge | default list }}
{{- $entityIdsByEdge = set $entityIdsByEdge $assignedEdge (append $existingIds $entityId | sortAlpha) }}
{{- end }}
{{- /* sensorIngest.unassignedEdge -- the fallback edge: its sidecar admits
   every entity not assigned to another edge (DIS_DENIED_ENTITY_IDS). */ -}}
{{- $unassignedEdge := $root.Values.sensorIngest.unassignedEdge | default "" }}
{{- if and (gt (len $entityAssignment) 0) (eq $unassignedEdge "") }}
{{- fail "sensorIngest.unassignedEdge: required once sensorIngest.entityAssignment is non-empty -- an entity on no list would be dropped at every edge, so a true arrival could never be seen" }}
{{- end }}
{{- if and (eq (len $entityAssignment) 0) (ne $unassignedEdge "") }}
{{- fail (printf "sensorIngest.unassignedEdge: %q is set but sensorIngest.entityAssignment is empty -- it has no meaning there, every sidecar already admits all entities" $unassignedEdge) }}
{{- end }}
{{- if and (ne $unassignedEdge "") (not (has $unassignedEdge $validEdgeIds)) }}
{{- fail (printf "sensorIngest.unassignedEdge: %q is not in edges[]" $unassignedEdge) }}
{{- end }}
{{- /* sensorIngest.nonAssetSources -- (site, application[, kind]) sources
   that are not sensors; dropped and counted at every sidecar. */ -}}
{{- $nonAssetSources := $root.Values.sensorIngest.nonAssetSources | default list }}
{{- $nonAssetTokens := list }}
{{- $nonAssetWide := list }}
{{- range $nonAssetSources }}
{{- $nas := "*" }}
{{- if not (kindIs "invalid" .site) }}
{{- $nas = (toString .site) }}
{{- end }}
{{- $naa := (toString .application) }}
{{- if or (and (ne $nas "*") (or (not (regexMatch "^[0-9]{1,5}$" $nas)) (gt (int $nas) 65535))) (not (regexMatch "^[0-9]{1,5}$" $naa)) (gt (int $naa) 65535) }}
{{- fail (printf "sensorIngest.nonAssetSources: site %q / application %q must each be an integer 0-65535" $nas $naa) }}
{{- end }}
{{- $nak := "" }}
{{- if hasKey . "kind" }}
{{- if not (kindIs "invalid" .kind) }}
{{- $nak = (toString .kind) }}
{{- if or (not (regexMatch "^[0-9]{1,3}$" $nak)) (gt (int $nak) 255) }}
{{- fail (printf "sensorIngest.nonAssetSources: kind %q (source %s:%s) must be an integer 0-255" $nak $nas $naa) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not (.name | default "" | toString) }}
{{- fail (printf "sensorIngest.nonAssetSources: source %s:%s has no name" $nas $naa) }}
{{- end }}
{{- $nat := printf "%d:%d" (int $nas) (int $naa) }}
{{- if eq $nas "*" }}
{{- $nat = printf "*:%d" (int $naa) }}
{{- end }}
{{- if ne $nak "" }}
{{- $nat = printf "%s:%d" $nat (int $nak) }}
{{- else }}
{{- $nonAssetWide = append $nonAssetWide $nat }}
{{- end }}
{{- if has $nat $nonAssetTokens }}
{{- fail (printf "sensorIngest.nonAssetSources: source %s is listed twice" $nat) }}
{{- end }}
{{- $nonAssetTokens = append $nonAssetTokens $nat }}
{{- end }}
{{- range $entityAssignment }}
{{- $eparts := splitList ":" (.id | toString) }}
{{- $esrc := printf "%d:%d" (int (index $eparts 1)) (int (index $eparts 2)) }}
{{- if or (has $esrc $nonAssetWide) (has (printf "*:%d" (int (index $eparts 2))) $nonAssetWide) }}
{{- fail (printf "sensorIngest.entityAssignment: id %q comes from source %s, which is declared in sensorIngest.nonAssetSources -- an asset cannot come from a non-asset source" .id $esrc) }}
{{- end }}
{{- end }}
{{- /* sensorIngest.assignment (values.yaml) -- the rules model. Validated
   once here, like entityAssignment above; the sidecar fails closed on the
   regex, geofence numbers and country ints, so those are not re-checked. */ -}}
{{- $assignment := $root.Values.sensorIngest.assignment | default dict }}
{{- $assignRules := $assignment.rules | default list }}
{{- $assignFallback := $assignment.fallbackEdge | default "" }}
{{- $rulesMode := gt (len $assignRules) 0 }}
{{- if and $rulesMode (gt (len $entityAssignment) 0) }}
{{- fail "sensorIngest.assignment.rules and sensorIngest.entityAssignment are both set -- one model per deployment" }}
{{- end }}
{{- if and $rulesMode (eq $assignFallback "") }}
{{- fail "sensorIngest.assignment.fallbackEdge: required once sensorIngest.assignment.rules is non-empty -- an entity matching no rule would be dropped at every edge" }}
{{- end }}
{{- if and (not $rulesMode) (ne $assignFallback "") }}
{{- fail (printf "sensorIngest.assignment.fallbackEdge: %q is set but sensorIngest.assignment.rules is empty -- it has no meaning there" $assignFallback) }}
{{- end }}
{{- if and (ne $assignFallback "") (not (has $assignFallback $validEdgeIds)) }}
{{- fail (printf "sensorIngest.assignment.fallbackEdge: %q is not in edges[]" $assignFallback) }}
{{- end }}
{{- $seenRuleNames := list }}
{{- $seenRuleIds := list }}
{{- range $ri, $rule := $assignRules }}
{{- $rname := $rule.name | default "" | toString }}
{{- if eq $rname "" }}
{{- fail (printf "sensorIngest.assignment.rules[%d].name: required and must be non-empty" $ri) }}
{{- end }}
{{- if has $rname $seenRuleNames }}
{{- fail (printf "sensorIngest.assignment.rules: name %q is used twice" $rname) }}
{{- end }}
{{- $seenRuleNames = append $seenRuleNames $rname }}
{{- if not (has ($rule.edge | default "" | toString) $validEdgeIds) }}
{{- fail (printf "sensorIngest.assignment.rules[%s].edge: %q is not in edges[]" $rname ($rule.edge | default "" | toString)) }}
{{- end }}
{{- $rmatch := $rule.match | default dict }}
{{- $rmKeys := keys $rmatch }}
{{- if not (and (eq (len $rmKeys) 1) (has (index $rmKeys 0) (list "ids" "geofence" "marking" "country"))) }}
{{- fail (printf "sensorIngest.assignment.rules[%s].match: must have exactly one of ids, geofence, marking, country" $rname) }}
{{- end }}
{{- if hasKey $rmatch "ids" }}
{{- range $rmatch.ids }}
{{- $rid := . | toString }}
{{- if not (regexMatch "^dis:[0-9]+:[0-9]+:[0-9]+$" $rid) }}
{{- fail (printf "sensorIngest.assignment.rules[%s].match.ids: malformed id %q -- must match dis:<site>:<application>:<entity>" $rname $rid) }}
{{- end }}
{{- if has $rid $seenRuleIds }}
{{- fail (printf "sensorIngest.assignment.rules[%s].match.ids: id %q is listed twice" $rname $rid) }}
{{- end }}
{{- $seenRuleIds = append $seenRuleIds $rid }}
{{- $rparts := splitList ":" $rid }}
{{- $rsrc := printf "%d:%d" (int (index $rparts 1)) (int (index $rparts 2)) }}
{{- if or (has $rsrc $nonAssetWide) (has (printf "*:%d" (int (index $rparts 2))) $nonAssetWide) }}
{{- fail (printf "sensorIngest.assignment.rules[%s].match.ids: id %q comes from source %s, which is declared in sensorIngest.nonAssetSources -- an asset cannot come from a non-asset source" $rname $rid $rsrc) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* sensorIngest.nationStamping (values.yaml) -- the nation stamp. */ -}}
{{- $nationStamping := $root.Values.sensorIngest.nationStamping | default dict }}
{{- $nationOverrides := $nationStamping.overrides | default dict }}
{{- $nationRules := $nationStamping.rules | default list }}
{{- range $okey, $oval := $nationOverrides }}
{{- if not (regexMatch "^dis:[0-9]+:[0-9]+:[0-9]+$" ($okey | toString)) }}
{{- fail (printf "sensorIngest.nationStamping.overrides: malformed id %q -- must match dis:<site>:<application>:<entity>" $okey) }}
{{- end }}
{{- if not (or (regexMatch "^[A-Z]{3}$" ($oval | toString)) (eq ($oval | toString) "exempt")) }}
{{- fail (printf "sensorIngest.nationStamping.overrides: nation %q for id %q must be three capital letters or \"exempt\"" $oval $okey) }}
{{- end }}
{{- end }}
{{- $seenNationNames := list }}
{{- range $ni, $nrule := $nationRules }}
{{- $nname := $nrule.name | default "" | toString }}
{{- if eq $nname "" }}
{{- fail (printf "sensorIngest.nationStamping.rules[%d].name: required and must be non-empty" $ni) }}
{{- end }}
{{- if has $nname $seenNationNames }}
{{- fail (printf "sensorIngest.nationStamping.rules: name %q is used twice" $nname) }}
{{- end }}
{{- $seenNationNames = append $seenNationNames $nname }}
{{- if not (regexMatch "^[A-Z]{3}$" ($nrule.nation | default "" | toString)) }}
{{- fail (printf "sensorIngest.nationStamping.rules[%s].nation: %q must be three capital letters" $nname ($nrule.nation | default "" | toString)) }}
{{- end }}
{{- $nmKeys := keys ($nrule.match | default dict) }}
{{- if not (and (eq (len $nmKeys) 1) (has (index $nmKeys 0) (list "geofence" "marking" "country"))) }}
{{- fail (printf "sensorIngest.nationStamping.rules[%s].match: must have exactly one of geofence, marking, country" $nname) }}
{{- end }}
{{- end }}
{{- /* Fallback edge's deny list: ids assigned to every OTHER edge. */ -}}
{{- $deniedAtFallback := list }}
{{- range $entityAssignment }}
{{- if ne .edge $unassignedEdge }}
{{- $deniedAtFallback = append $deniedAtFallback .id }}
{{- end }}
{{- end }}
{{- $deniedAtFallback = $deniedAtFallback | sortAlpha }}
{{- if gt (len $entityAssignment) 0 }}
{{- range $validEdgeIds }}
{{- if and (not (hasKey $entityIdsByEdge .)) (ne . $unassignedEdge) }}
{{- fail (printf "sensorIngest.entityAssignment: edge %q has no entries while the list is non-empty -- a sidecar given no list admits every entity it hears, so this edge would be wide open while its neighbours are scoped" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* redpandaConnect.entityKinds (values.yaml) -- the asset and track kind
   sets must each be integer 0-255 tokens and must not intersect, or one kind
   would be both a fleet asset and an in-flight track. */ -}}
{{- $assetKinds := splitList "," (toString $root.Values.redpandaConnect.entityKinds.asset | replace " " "") }}
{{- $trackKinds := splitList "," (toString $root.Values.redpandaConnect.entityKinds.track | replace " " "") }}
{{- range (concat $assetKinds $trackKinds) }}
{{- if or (not (regexMatch "^[0-9]{1,3}$" .)) (gt (int .) 255) }}
{{- fail (printf "redpandaConnect.entityKinds: token %q is not an integer 0-255" .) }}
{{- end }}
{{- end }}
{{- range $assetKinds }}
{{- if has . $trackKinds }}
{{- fail (printf "redpandaConnect.entityKinds: kind %s is in both asset and track -- the two sets must not intersect" .) }}
{{- end }}
{{- end }}
{{- range .Values.edges }}
{{- $edge := . }}
{{- $edgeBroker := printf "%s-redpanda-%s%s:%d" $root.Release.Name $edge.id (include "openddil.svcDomain" $root) (int $root.Values.redpandaEdge.internalPort) }}
{{- $hqBroker := printf "%s-redpanda-hq%s:%d" $root.Release.Name (include "openddil.svcDomain" $root) (int $root.Values.redpandaHq.kafkaPort) }}
{{- /* This edge's DIS Event Report path is on only when cmReports.eventReport
   is configured AND this edge is also a tierNode tier -- tier-cm-intake-
   {{ $edge.id }} (tier-node.yaml) is the only cm-intake this chart ever
   renders that this edge's redpanda-connect could reach. See cmReports
   .eventReport's values.yaml comment. */ -}}
{{- $eventReportOn := and $root.Values.cmReports.enabled $root.Values.cmReports.eventReport.eventType $root.Values.tierNode.enabled (or (not $root.Values.tierNode.tiers) (has $edge.id $root.Values.tierNode.tiers)) }}
{{- /* sensor-ingest's own output topic -- one variable, read by both the
   KAFKA_TOPIC env below and the produces-topics annotation, so the two can
   never drift apart. */ -}}
{{- $sensorIngestTopic := "ingress-dis-raw" }}

# ===========================================================================
# sensor-ingest-{{ $edge.id }} — DIS UDP ingestion
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-sensor-ingest-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 4 }}
  annotations:
    # openddil.io/produces-topics -- same
    # shape as openddil.io/consumer-groups, space-separated <broker-id>/
    # <topic> pairs, on the workload that ORIGINATES the records. Reads the
    # SAME $sensorIngestTopic the KAFKA_TOPIC env below reads.
    openddil.io/produces-topics: {{ printf "%s/%s" $edge.id $sensorIngestTopic | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      {{- /* checksum/dis-condition-baselines rides sensor-ingest only: it is the
         only reader of that file (see the helper). */}}
      {{- $siAnn := compact (list (include "openddil.ontologyDeploymentAnnotation" $root) (include "openddil.disConditionBaselinesAnnotation" $root)) }}
      {{- if $siAnn }}
      annotations:
        {{- range $siAnn }}
        {{ . }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # ontology: DIS entity-appearance decoding reads dis_appearance.yaml
        # from /ontology (ADR-0026 / ADR-0030). Stage 1 gained this dependency
        # when appearance decoding landed; appearance.py defaults to that path.
        #
        # WITHOUT THE MOUNT THE DECODER IS INERT RATHER THAN BROKEN: a missing
        # table means it emits no appearance facts at all, which is the same
        # honest outcome as an undeclared source. Correct fail-safe behaviour —
        # and exactly why the gap was invisible on 2026-08-28: the pipeline
        # stayed green, no pod complained, and the health axis simply never
        # populated. A dependency that fails safely still has to be declared.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
            (dict "src" "contracts/ontology"   "dst" "ontology")
            (dict "src" "demo/ontology"       "dst" "ontology" "overlay" true)
          ) "root" $root) | nindent 8 }}
      containers:
        - name: sensor-ingest
          image: {{ include "openddil.image" (dict "name" $root.Values.sensorIngest.image.name "tag" $root.Values.sensorIngest.image.tag "digest" $root.Values.sensorIngest.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.sensorIngest.image.pullPolicy "root" $root) }}
          command: ["python", "dis_ingestor.py"]
          env:
            - name: KAFKA_BROKERS
              value: {{ $edgeBroker | quote }}
            - name: KAFKA_TOPIC
              value: {{ $sensorIngestTopic | quote }}
            - name: OPENDDIL_EDGE_ID
              value: {{ $edge.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $edge.region | quote }}
            - name: UDP_PORT
              value: {{ $edge.udpPort | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app"
            {{- if $root.Values.sensorIngest.spool.enabled }}
            - name: INGEST_SPOOL_DIR
              value: "/var/spool/ingest"
            - name: INGEST_SPOOL_MAX
              value: {{ $root.Values.sensorIngest.spool.maxEntries | quote }}
            - name: INGEST_SPOOL_STALL_S
              value: {{ $root.Values.sensorIngest.spool.stallSeconds | quote }}
            {{- end }}
            {{- if $rulesMode }}
            # Rules model (sensorIngest.assignment, values.yaml): the same
            # rule list and fallback edge on every sidecar; no admit or deny
            # list in this mode.
            - name: DIS_ASSIGNMENT_RULES
              value: {{ $assignRules | toJson | quote }}
            - name: DIS_FALLBACK_EDGE
              value: {{ $assignFallback | quote }}
            {{- else if and (ne $unassignedEdge "") (eq $edge.id $unassignedEdge) }}
            {{- if gt (len $deniedAtFallback) 0 }}
            # Fallback edge (sensorIngest.unassignedEdge, values.yaml): admits
            # every entity not assigned to another edge, so it denies exactly
            # the ids the other edges own. Sorted, comma-joined.
            - name: DIS_DENIED_ENTITY_IDS
              value: {{ $deniedAtFallback | join "," | quote }}
            {{- end }}
            {{- else if hasKey $entityIdsByEdge $edge.id }}
            # Per-edge DIS entity allow-list (sensorIngest.entityAssignment,
            # values.yaml). Comma-joined, sorted ids; the sidecar image
            # reads this to admit only these entities on its UDP port.
            - name: DIS_ADMITTED_ENTITY_IDS
              value: {{ get $entityIdsByEdge $edge.id | join "," | quote }}
            {{- end }}
            {{- if gt (len $nonAssetTokens) 0 }}
            # Sources on this sensor net that are not sensors
            # (sensorIngest.nonAssetSources): dropped and counted here.
            - name: DIS_NON_ASSET_SOURCES
              value: {{ $nonAssetTokens | sortAlpha | join "," | quote }}
            {{- end }}
            {{- if or (gt (len $nationOverrides) 0) (gt (len $nationRules) 0) }}
            # Nation stamp (sensorIngest.nationStamping, values.yaml).
            - name: DIS_NATION_RULES
              value: {{ dict "overrides" $nationOverrides "rules" $nationRules | toJson | quote }}
            {{- end }}
          ports:
            - name: dis-udp
              protocol: UDP
              containerPort: {{ $edge.udpPort }}
            - name: http
              containerPort: {{ $root.Values.sensorIngest.httpPort }}
          {{- if $root.Values.sensorIngest.stallProbe.enabled }}
          # STALL DETECTION GATES LIVENESS, NOT READINESS.
          #
          # Readiness removes a pod from Service endpoints, which means
          # nothing for a Kafka client: nobody routes to it, and the pod that
          # is stuck stays stuck. The remedy for a wedge is a RESTART, and
          # restart is what liveness does. Wiring this to readiness would ship
          # a probe that flips endpoints nobody reads while the wedged process
          # runs forever — a check that appears to act and does not.
          #
          # The endpoint answers 503 only when INPUT ADVANCED AND OUTPUT DID
          # NOT. Both terms are load-bearing: "output stopped" alone fires on
          # a quiet fleet, and a liveness probe that restarts healthy pods
          # every window is a worse outage than the wedge it was added to
          # catch.
          #
          # THRESHOLDS ARE MINUTES. failureThreshold x periodSeconds is the
          # real budget, and it is deliberately long — a wedge that persists
          # for minutes is still caught far sooner than a person would notice
          # it, while a flapping probe is an outage of its own making.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: {{ $root.Values.sensorIngest.stallProbe.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.sensorIngest.stallProbe.periodSeconds }}
            failureThreshold: {{ $root.Values.sensorIngest.stallProbe.failureThreshold }}
            timeoutSeconds: 5
          {{- end }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            # The init container COPIES the ontology into the shared volume;
            # this is what makes it visible to the process. Both halves are
            # required and only one of them is obvious — adding the copy alone
            # leaves /ontology absent and the appearance decoder silently
            # inert, which is how this was missed the first time.
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
            {{- if $root.Values.sensorIngest.spool.enabled }}
            - name: ingest-spool
              mountPath: /var/spool/ingest
            {{- end }}
          resources:
            {{- toYaml $root.Values.sensorIngest.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
        {{- if $root.Values.sensorIngest.spool.enabled }}
        - name: ingest-spool
          emptyDir:
            sizeLimit: {{ $root.Values.sensorIngest.spool.sizeLimit | quote }}
        {{- end }}
        {{- with (include "openddil.ontologyDeploymentVolume" $root) }}
        {{- . | nindent 8 }}
        {{- end }}
---
# Service exposing the UDP port. ClusterIP by default (in-namespace
# producers + kubectl port-forward). Set sensorIngest.externalAccess.
# enabled=true if a producer OUTSIDE the cluster needs UDP into this
# edge — that flips the type to NodePort and exposes udpPort on every
# node. ClusterIP is correct for 443-only / no-NodePort clusters.
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-sensor-ingest-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  type: {{ if $root.Values.sensorIngest.externalAccess.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" $edge.id) "root" $root) | nindent 4 }}
  ports:
    - name: dis-udp
      protocol: UDP
      port: {{ $edge.udpPort }}
      targetPort: dis-udp
      {{- if $root.Values.sensorIngest.externalAccess.enabled }}
      nodePort: {{ $edge.udpPort }}
      {{- end }}
    - name: http
      protocol: TCP
      port: {{ $root.Values.sensorIngest.httpPort }}
      targetPort: http
---
# ===========================================================================
# redpanda-connect-{{ $edge.id }} — DIS Bronze → Silver mapper
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-redpanda-connect-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $edge.id) "root" $root) | nindent 4 }}
  annotations:
    # openddil.io/consumer-groups (SPEC-consumer-declarations.md Part A) --
    # declares (broker-id/group-id) pairs this WORKLOAD owns, on the
    # WORKLOAD's own metadata (not spec.template: that would roll the pod on
    # every annotation edit). reset-scenario.sh reads this instead of
    # resolving ownership from connection source IP -- every consumer that
    # reaches a broker through a proxy resolved to PROXY/... there and was
    # silently skipped by a reset.
    #
    # "connect-dis-mapper" is a CODE DEFAULT baked into the DIS Bronze->Silver
    # mapper's connect.yaml (demo/openddil-base-connect.yaml in the runtime
    # bundle), not a value this chart sets -- identical across edges since
    # only the broker differs per pod.
    openddil.io/consumer-groups: {{ printf "%s/connect-dis-mapper" $edge.id | quote }}
    # openddil.io/produces-topics -- the
    # mapper reads ingress-dis-raw (sensor-ingest's own output, above) on
    # this edge's broker and writes the mapped record back to the SAME
    # broker. "raw-sensor-stream" is, like connect-dis-mapper above, a CODE
    # DEFAULT baked into the same connect.yaml, not a value this chart sets.
    # The same connect.yaml also routes effector PDUs to effector-events,
    # in-flight munition entities to munition-tracks, and unparseable records
    # to ingress-dlq on this broker.
    openddil.io/produces-topics: {{ printf "%s/raw-sensor-stream %s/effector-events %s/munition-tracks %s/ingress-dlq" $edge.id $edge.id $edge.id $edge.id | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      {{- with (include "openddil.ontologyDeploymentAnnotation" $root) }}
      annotations:
        {{ . }}
      {{- end }}
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "redpanda-connect-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Connect yaml hardcodes /proto and /ontology. /proto must hold the
        # .proto SOURCE files — the connect `protobuf` processor parses them
        # at runtime to resolve message types like
        # openddil.telemetry.v1.EntityTelemetryEvent. It is NOT the generated
        # gen/python bindings (those are for the Python services). /ontology
        # is the sim-dis-mapping.yaml ontology file. Init container also
        # delivers the base connect.yaml and the dynamic mappings.
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/proto"      "dst" "proto")
            (dict "src" "contracts/ontology"   "dst" "ontology")
            (dict "src" "demo/ontology"       "dst" "ontology" "overlay" true)
            (dict "src" "demo/openddil-base-connect.yaml" "dst" "connect.yaml")
            (dict "src" "demo/dynamic-mappings" "dst" "mappings")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: connect
          image: "{{ include "openddil.thirdPartyImage" $root.Values.redpandaConnect.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.redpandaConnect.image.pullPolicy "root" $root) }}
          args: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
          env:
            - name: REDPANDA_BROKER
              value: {{ $edgeBroker | quote }}
            # DIS entity kinds per ingress path (redpandaConnect.entityKinds).
            - name: DIS_ADMITTED_ENTITY_KINDS
              value: {{ $root.Values.redpandaConnect.entityKinds.asset | quote }}
            - name: DIS_TRACK_ENTITY_KINDS
              value: {{ $root.Values.redpandaConnect.entityKinds.track | quote }}
            # --- declared-label lookup (ADR-0050 s3; dynamic-mappings/
            # declared-label.yaml). The mapper reads the store its edge's
            # declarations land in: the edge's own tier store when the edge is
            # tier-managed, else the root store. EVERY mapper pod needs the
            # PG* set -- the mapping interpolates them with no defaults.
            {{- if include "openddil.isTierManaged" (dict "id" $edge.id "root" $root) }}
            {{- include "openddil.pgTierEnv" (dict "root" $root "tier" $edge.id) | nindent 12 }}
            {{- else }}
            {{- include "openddil.pgHqEnv" $root | nindent 12 }}
            {{- end }}
            - name: DECLARED_LABEL_TTL
              value: {{ $root.Values.arrivals.labelLookupTtl | quote }}
            {{- if $eventReportOn }}
            # --- the DIS Event Report -> CmEvent path, this edge's own
            # tier-cm-intake (see $eventReportOn above and dis-event-report
            # .yaml, dynamic-mappings/) -----------------------------------
            - name: CM_EVENT_REPORT_TYPE
              value: {{ $root.Values.cmReports.eventReport.eventType | quote }}
            - name: CM_EVENT_REPORT_COMPONENT_DATUM
              value: {{ $root.Values.cmReports.eventReport.componentDatum | quote }}
            - name: CM_EVENT_REPORT_FAULT_CODE_DATUM
              value: {{ $root.Values.cmReports.eventReport.faultCodeDatum | quote }}
            {{- if $root.Values.cmReports.eventReport.descriptionDatum }}
            - name: CM_EVENT_REPORT_DESCRIPTION_DATUM
              value: {{ $root.Values.cmReports.eventReport.descriptionDatum | quote }}
            {{- end }}
            - name: CM_EVENT_REPORT_SEVERITY
              value: {{ $root.Values.cmReports.eventReport.severity | quote }}
            {{- if $root.Values.cmReports.eventReport.recordedBy }}
            - name: CM_EVENT_REPORT_RECORDED_BY
              value: {{ $root.Values.cmReports.eventReport.recordedBy | quote }}
            {{- end }}
            - name: CM_EVENT_REPORT_SOURCE
              value: {{ $root.Values.cmReports.eventReport.source | quote }}
            - name: CM_INTAKE_URL
              value: {{ printf "http://%s-tier-cm-intake-%s%s:4197/cm-events" $root.Release.Name $edge.id (include "openddil.svcDomain" $root) | quote }}
            {{- end }}
            {{- if $root.Values.relayStallProbe.enabled }}
            # Two-term stall probe: no DEST_HOST, because the destination is
            # this edge's own broker. The mapper's Connect HTTP server is not
            # on the probe's default port, so name it here.
            - name: METRICS_URL
              value: {{ printf "http://localhost:%v/metrics" $root.Values.redpandaConnect.httpPort | quote }}
            {{- end }}
          {{- if $root.Values.relayStallProbe.enabled }}
          # STALL -> LIVENESS, two-term (see files/relay-stall-probe.sh).
          # Caveat: the mapper drops some input by design, so a window in
          # which EVERY arriving PDU is filtered reads as input-advanced /
          # output-flat. It takes 3 consecutive such windows (3 min) to
          # restart, and the remedy is a mapper restart, which is cheap.
          livenessProbe:
            exec:
              command: ["/bin/sh", "/probe/relay-stall-probe.sh"]
            initialDelaySeconds: {{ $root.Values.relayStallProbe.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.relayStallProbe.periodSeconds }}
            failureThreshold: {{ $root.Values.relayStallProbe.failureThreshold }}
            timeoutSeconds: 10
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $root.Values.redpandaConnect.httpPort }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: bundle-shared
              mountPath: /ontology
              subPath: ontology
            - name: bundle-shared
              mountPath: /connect.yaml
              subPath: connect.yaml
            - name: bundle-shared
              mountPath: /mappings
              subPath: mappings
            {{- if $root.Values.relayStallProbe.enabled }}
            - name: stall-probe
              mountPath: /probe
            {{- end }}
          resources:
            {{- toYaml $root.Values.redpandaConnect.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
        {{- if $root.Values.relayStallProbe.enabled }}
        - name: stall-probe
          configMap:
            name: {{ $root.Release.Name }}-relay-stall-probe
            defaultMode: 0755
        {{- end }}
        {{- with (include "openddil.ontologyDeploymentVolume" $root) }}
        {{- . | nindent 8 }}
        {{- end }}
---
{{- /* faust-edge's own app id -- ONE expression, read by the consumer-
   groups annotation below, FAUST_APP_ID in env, and the changelog topics
   in produces-topics, so none of the three can drift from the others. */ -}}
{{- $faustEdgeAppId := printf "openddil-%s" $edge.id }}
{{- $faustEdgeProduces := list }}
{{- range (list "telemetry-latest-state" "asset-telemetry-windows" "tactical-events" "derived-sustainment") }}
{{- $faustEdgeProduces = append $faustEdgeProduces (printf "%s/%s" $edge.id .) }}
{{- end }}
{{- range (include "openddil.faustEdgeTables" . | fromYamlArray) }}
{{- $faustEdgeProduces = append $faustEdgeProduces (printf "%s/%s" $edge.id (include "openddil.faustChangelogTopic" (dict "appId" $faustEdgeAppId "table" .))) }}
{{- end }}
# ===========================================================================
# faust-edge-{{ $edge.id }} — per-asset processing + prognostics
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-faust-edge-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "faust-edge-%s" $edge.id) "root" $root) | nindent 4 }}
  annotations:
    # Group == the Faust app id, SAME expression as FAUST_APP_ID below
    # (Faust defaults a consumer group to the app's own app_id).
    openddil.io/consumer-groups: {{ printf "%s/%s" $edge.id $faustEdgeAppId | quote }}
    # openddil.io/produces-topics --
    # the four topics this app sends to, all CODE DEFAULTS in the app
    # rather than values this chart sets: telemetry-latest-state (decoded
    # state), asset-telemetry-windows (window summaries), tactical-events
    # (threshold events) and derived-sustainment (the prognostics agent,
    # registered into this same Faust app). Plus one changelog per Faust
    # Table this app keeps (openddil.faustEdgeTables above). All on this
    # edge's own broker.
    openddil.io/produces-topics: {{ join " " $faustEdgeProduces | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "faust-edge-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "faust-edge-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python/openddil" "dst" "app-openddil")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: faust-edge
          image: {{ include "openddil.image" (dict "name" $root.Values.faustEdge.image.name "tag" $root.Values.faustEdge.image.tag "digest" $root.Values.faustEdge.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.faustEdge.image.pullPolicy "root" $root) }}
          workingDir: /tmp
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: FAUST_APP_ID
              value: {{ $faustEdgeAppId | quote }}
            - name: KAFKA_BROKERS
              value: {{ $edgeBroker | quote }}
            - name: OPENDDIL_EDGE_ID
              value: {{ $edge.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $edge.region | quote }}
            {{- range $k, $v := $root.Values.faustEdge.prognosticsEnv }}
            - name: {{ printf "PROGNOSTICS_%s" $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            # The generated openddil/ proto package is subPath-mounted into
            # /app (PYTHONPATH=/app). google.protobuf is NOT bundled — it
            # ships in the image's `protobuf` pip package; gen/python/google
            # is an empty dir and bundling it crashed the bundle-loader.
            - name: bundle-shared
              mountPath: /app/openddil
              subPath: app-openddil
          resources:
            {{- toYaml $root.Values.faustEdge.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
---
# ===========================================================================
# edge-hq-bridge-config-{{ $edge.id }} — GENERATED, not copied from the bundle
# ===========================================================================
# ROOT-TIER CONVERGENCE ON TIER-NODE MECHANICS (GD-09, ADR-0033).
#
# This config used to be a baked per-edge file in the runtime-bundle image
# (demo/redpanda-connect-edge-NN.yaml), which made edge identity a property of
# a SHIPPED ARTIFACT rather than of declared topology — the direct opposite of
# ADR-0033's "tier names are deployment configuration". An overlay naming its
# edges anything but edge-01/02/03 got:
#   cp: can't stat '/bundle/demo/redpanda-connect-<edge>.yaml'
#
# The tier node already proved the conformant mechanism: its restate.toml is
# chart-generated from values because Restate 1.6.x has no runtime /clusters
# API (see tier-node.yaml). Same pattern applied here — the OVERLAY DECLARES
# topology as data, the CHART GENERATES the runtime wiring from it. Renaming
# an edge is now a one-line values change rather than an N-file edit.
#
# Baked per-edge runtime files are NOT an overlay artifact class and must not
# become one: that would relocate this exact name-coupling one layer up and
# bless it as a contract, obliging every overlay author to ship N wiring files
# for N edges.
#
# Diffing the three bundled variants showed they differed ONLY in a comment,
# the broker address and the consumer-group name — pure topology, nothing
# authored. Nothing is lost by generating them.
#
# It also removes a dependency on the bare-name ALIAS Services.
#
# The bundled files hardcoded docker-compose hostnames
# (`redpanda-edge-01:9092` and a compose-era proxy host). Those names only resolve
# where an unprefixed alias Service exists. So the bridge worked wherever the
# edge ids matched the baked filenames; the lab failure was the missing FILE
# alone, and never reached hostname resolution.
#
# Generating removes the coupling to those aliases: this config now carries
# release-prefixed Service names and works whether or not the shim exists.
#
# One genuine piece of dead weight confirmed on the way: the baked configs
# never referenced the ${EDGE_BROKER}/${HQ_BROKER} env this chart injected,
# despite a comment claiming they did. Cosmetic rather than breaking — but it
# is why the configuration looked parameterised while the real coupling was a
# filename.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-edge-hq-bridge-config-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  connect.yaml: |
{{- include "openddil.edgeBridgeConnectYaml" (dict "edge" $edge "root" $root "edgeBroker" $edgeBroker) | nindent 4 }}
---
# ===========================================================================
# edge-hq-bridge-{{ $edge.id }} — edge cluster → its parent cluster
# ===========================================================================
# Config comes from the generated ConfigMap above, NOT from the bundle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-edge-hq-bridge-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "edge-hq-bridge-%s" $edge.id) "root" $root) | nindent 4 }}
  annotations:
    # Group PARSED from the generated connect.yaml (openddil.edgeBridgeConnectYaml
    # in _helpers.tpl), not re-typed -- so this can never disagree with what
    # the bridge actually commits under.
    openddil.io/consumer-groups: {{ printf "%s/%s" $edge.id (include "openddil.edgeBridgeConnectYaml" (dict "edge" $edge "root" $root "edgeBroker" $edgeBroker) | fromYaml).input.kafka.consumer_group | quote }}
    # No openddil.io/produces-topics here:
    # a bridge forwards records between two clusters, it does not originate
    # them, so it has no local "writer" identity for the census to quiesce.
    # The reset instead reads this Deployment's own DEST_HOST/DEST_PORT env
    # below as a bridge-graph edge (source broker = this consumer-groups
    # pair's broker-id, destination = the parent broker, or the proxy that
    # fronts it when linkControl.enabled, on DEST_PORT) to order phase 4's trim sources-before-destinations.
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "edge-hq-bridge-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the bridge when its config changes. Without this the
        # ConfigMap updates and the running pod keeps the old topic list
        # until something unrelated restarts it -- which is exactly what
        # happened when telemetry-latest-state was added for tier-managed
        # edges: the chart was right, the render was right, and the bridge
        # carried the old set for as long as its pod happened to live.
        # A config change that does not reach the process is not a change.
        # HASHES THE RENDERED CONFIG, not a hand-listed tuple of the values
        # that go into it. The previous version hashed edge id + edge broker +
        # tier-managed flag -- all INPUT-side -- so the retarget, which changes
        # only the OUTPUT address, produced an identical hash. The pod template
        # was unchanged, nothing rolled, and the bridges published to the old
        # target for two days while the ConfigMap on disk said otherwise.
        # Connect reads its file once at startup, so that is not a stale
        # annotation, it is a stale PROCESS.
        checksum/connect-config: {{ include "openddil.edgeBridgeConnectYaml" (dict "edge" $edge "root" $root "edgeBroker" $edgeBroker) | sha256sum }}
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "edge-hq-bridge-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bridge
          image: "{{ include "openddil.thirdPartyImage" $root.Values.edgeHqBridge.image }}"
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.edgeHqBridge.image.pullPolicy "root" $root) }}
          args: ["--chilled", "run", "/connect.yaml"]
          # NO bundle-loader initContainer and NO broker env vars.
          #
          # Both were vestigial. The generated ConfigMap carries fully
          # resolved Service addresses, so there is nothing to substitute at
          # runtime — and the env vars were never read by the config they
          # claimed to parameterise. Keeping them would preserve the
          # appearance of configurability while the real coupling lived
          # somewhere else, which is how this stayed broken.
          #
          # The bridge consumes from the edge cluster and produces to its
          # parent: directly by default, or THROUGH its own `uplink-<id>`
          # link proxy when linkControl.enabled — that is the
          # severance-injection seam, not an accident.
          {{- if $root.Values.relayStallProbe.enabled }}
          # STALL -> LIVENESS. Readiness stays Connect's own notion of
          # connected; the remedy for a wedge is a restart, and restart is
          # what liveness does. See files/relay-stall-probe.sh for why each
          # term is required -- in particular why an UNREACHABLE DESTINATION
          # IS NOT STALLED, which is what stops a severance becoming a crash
          # loop: under a cut this relay's output legitimately stops, because
          # buffering is the designed degraded mode.
          env:
            - name: DEST_HOST
              value: {{ include "openddil.bridgeTarget" (dict "tier" $edge "root" $root) | splitList ":" | first | quote }}
            - name: DEST_PORT
              value: {{ include "openddil.bridgeTarget" (dict "tier" $edge "root" $root) | splitList ":" | last | quote }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "/probe/relay-stall-probe.sh"]
            initialDelaySeconds: {{ $root.Values.relayStallProbe.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.relayStallProbe.periodSeconds }}
            failureThreshold: {{ $root.Values.relayStallProbe.failureThreshold }}
            timeoutSeconds: 10
          {{- end }}
          volumeMounts:
            - name: connect-config
              mountPath: /connect.yaml
              subPath: connect.yaml
            {{- if $root.Values.relayStallProbe.enabled }}
            - name: stall-probe
              mountPath: /probe
            {{- end }}
          resources:
            {{- toYaml $root.Values.edgeHqBridge.resources | nindent 12 }}
      volumes:
        {{- if $root.Values.relayStallProbe.enabled }}
        - name: stall-probe
          configMap:
            name: {{ $root.Release.Name }}-relay-stall-probe
            defaultMode: 0755
        {{- end }}
        - name: connect-config
          configMap:
            name: {{ $root.Release.Name }}-edge-hq-bridge-config-{{ $edge.id }}
---
# ===========================================================================
# projector-{{ $edge.id }} — Kafka → Postgres projection
# ===========================================================================
# Subscribes to per-edge topics on the edge cluster, projects state into
# postgres-hq. Per-edge projectors run alongside projector-hq (in hub.yaml)
# so per-edge topics like telemetry-latest-state populate on every edge
# while hq-only topics (regional rollups) populate from projector-hq.
#
# ---------------------------------------------------------------------------
# NOT DEPLOYED FOR A TIER-MANAGED EDGE (UD-11) — THE LAST REACHBACK.
# ---------------------------------------------------------------------------
# This Deployment is edge-local at its INPUT and root-owned at its OUTPUT: it
# reads the edge's broker directly and writes the ROOT's store. In the
# pre-tier topology that was the root's legitimate feed. Once the edge has a
# tier node it is a consumer above the tier reading that tier's streams —
# the same rule the detection cutover applied to cm-service and fusion,
# which this Deployment was missed by.
#
# It also read the edge broker DIRECTLY, never through a severable link, and that
# is how it stayed invisible: the severance rehearsal cut the bridge and
# this path was not on it, so HQ stayed fresh through every sever anyone
# ever ran. HQ was never observed to diverge, so "HQ converges" was
# convergence onto a value it had never left.
#
# The replacement is not a gate alone but a REPOINT: HQ's view of this edge
# is now projected by `projector-hq` from the BRIDGED topics on the HQ
# broker — derived state with the tier's releasability labels already
# stamped, plus `telemetry-latest-state` (see the bridge config above).
# One writer per edge, and for a tier-managed edge that writer is behind
# the bridge, so cutting the bridge is now visible at HQ.
{{- if not (include "openddil.isTierManaged" (dict "id" $edge.id "root" $root)) }}
{{- $projectorPairs := list }}
{{- range include "openddil.projectorGroupIds" $root | splitList " " }}
{{- $projectorPairs = append $projectorPairs (printf "%s/%s" $edge.id .) }}
{{- end }}
# ===========================================================================
# effector-declared-load-{{ $edge.id }} config
# ===========================================================================
# Same rendered content every projector mounts (openddil.effectorDeclaredLoadYaml,
# _helpers.tpl). One ConfigMap per instance because each runs on its own
# cluster/broker, not because the content differs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-effector-declared-load-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  effector-declared-load.yaml: |
    {{- include "openddil.effectorDeclaredLoadYaml" $root | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-projector-{{ $edge.id }}
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" (printf "projector-%s" $edge.id) "root" $root) | nindent 4 }}
  annotations:
    # 13-group set from openddil.projectorGroupIds (_helpers.tpl) -- a CODE
    # DEFAULT (projector_config.yaml in openddil-projector), not visible in
    # this chart. This Deployment is the ROOT projector reading an
    # untier-managed edge's own broker (see NOT DEPLOYED FOR A TIER-MANAGED
    # EDGE below), so it carries the full root set, same as projector-hq.
    openddil.io/consumer-groups: {{ join " " $projectorPairs | quote }}
    {{- if $root.Values.linkStatus.enabled }}
    # The buffer monitor inside this projector produces one link-heartbeat
    # record per period to this edge's broker. Declared so the reset's writer
    # census attributes the local write instead of halting on it.
    openddil.io/produces-topics: {{ printf "%s/link-heartbeat" $edge.id | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" (printf "projector-%s" $edge.id) "root" $root) | nindent 6 }}
  template:
    metadata:
      annotations:
        # See checksum/effector-declared-load on projector-hq (hub.yaml)
        # for why this hashes the rendered body in the pod template.
        checksum/effector-declared-load: {{ include "openddil.effectorDeclaredLoadYaml" $root | sha256sum }}
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" (printf "projector-%s" $edge.id) "root" $root) | nindent 8 }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "contracts/gen/python" "dst" "proto")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: projector
          image: {{ include "openddil.image" (dict "name" $root.Values.projector.image.name "tag" $root.Values.projector.image.tag "digest" $root.Values.projector.image.digest "root" $root) }}
          imagePullPolicy: {{ include "openddil.pullPolicy" (dict "policy" $root.Values.projector.image.pullPolicy "root" $root) }}
          env:
            - name: KAFKA_BROKERS
              value: {{ $edgeBroker | quote }}
            {{- include "openddil.pgHqEnv" $root | nindent 12 }}
            - name: METRICS_PORT
              value: {{ $root.Values.projector.port | quote }}
            - name: RATE_LIMIT_PER_SEC
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/proto:/app/src"
            - name: OPENDDIL_EDGE_ID
              value: {{ $edge.id | quote }}
            - name: OPENDDIL_REGION_ID
              value: {{ $edge.region | quote }}
            - name: BUFFER_MONITOR_ENABLED
              value: "true"
            # THE GROUP NAME IS PER-EDGE AND MUST BE PASSED.
            #
            # edge_buffer_monitor.py defaults BRIDGE_CONSUMER_GROUP to the
            # bare "bridge-group", but the bridge commits under
            # "bridge-group-<edge_id>" — deliberately, so per-edge lag is
            # unambiguous. Leaving the default makes the monitor query a group
            # that has NEVER EXISTED.
            #
            # It then fails silently: a missing group yields no committed
            # offsets, and the probe's own contract is "returns 0 if the group
            # has not committed any offsets yet". A broken lookup and a quiet
            # link produce the identical reading, so the UI buffer counter
            # reads 0 forever and looks plausible while doing so.
            #
            # Measured on a real cluster 2026-08-08: with the link severed,
            # `rpk group describe bridge-group-<edge>` climbed 32 -> 265 over
            # 160s while this monitor reported 0 throughout. The DDIL
            # buffering was working the whole time; only its instrument was
            # blind.
            - name: BRIDGE_CONSUMER_GROUP
              value: "bridge-group-{{ $edge.id }}"
            # This is the hub-attached edge, not a tier bridge: its relay
            # commits every 5.0s measured at rest, not the 0.5-1.5s of a
            # tier bridge/uplink, so it needs its own exchange period
            # rather than the module's tier-sized default. Threshold =
            # 2*(E+H) = 2*(5+2) = 14s with no exchange before SEVERED.
            - name: LINK_EXCHANGE_PERIOD_S
              value: "5"
            # SAME HELPER THE RELAY RENDERS ITS TOPIC LIST FROM. This
            # monitor used to take the code default, so the hub-attached
            # edge's measurement and its relay disagreed about what the
            # bridge carries; see openddil.edgeBridgeTopics.
            - name: BRIDGE_TOPICS
              value: {{ include "openddil.edgeBridgeTopics" (dict "edge" $edge "root" $root) | quote }}
            # Link heartbeat: one record per period on this edge's own
            # broker, keyed by the link id, relayed to HQ with the data.
            # Runs inside the buffer loop, hence BUFFER_MONITOR_ENABLED above.
            - name: LINK_HEARTBEAT_ENABLED
              value: {{ $root.Values.linkStatus.enabled | quote }}
            - name: LINK_ID
              value: {{ $edge.id | quote }}
            - name: LINK_TRAFFIC_TOPICS
              value: {{ include "openddil.linkTrafficTopics" (dict "tier" $edge "root" $root) | quote }}
            - name: LINK_HEARTBEAT_PERIOD_S
              value: {{ $root.Values.linkStatus.heartbeatPeriodS | quote }}
            - name: LINK_IDLE_AFTER_S
              value: {{ $root.Values.linkStatus.idleAfterS | quote }}
            # see the identical pair on projector-hq
            # (hub.yaml) for what these do.
            - name: EFFECTOR_DECLARED_LOAD_PATH
              value: /etc/openddil/effector-declared-load/effector-declared-load.yaml
            - name: EFFECTOR_TERMINAL_TIMEOUT_S
              value: {{ $root.Values.effectors.terminalTimeoutSeconds | quote }}
            - name: MUNITION_TRACK_SILENCE_S
              value: {{ $root.Values.munitionTracks.silenceSeconds | quote }}
            {{- if $root.Values.edgeAssignment.configMap }}
            {{- include "openddil.edgeAssignmentEnv" $root | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $root.Values.projector.port }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /proto
              subPath: proto
            - name: effector-declared-load
              mountPath: /etc/openddil/effector-declared-load
            {{- if $root.Values.edgeAssignment.configMap }}
            {{- include "openddil.edgeAssignmentBackendMount" $root | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $root.Values.projector.resources | nindent 12 }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
        - name: effector-declared-load
          configMap:
            name: {{ $root.Release.Name }}-effector-declared-load-{{ $edge.id }}
        {{- if $root.Values.edgeAssignment.configMap }}
        {{- include "openddil.edgeAssignmentVolume" $root | nindent 8 }}
        {{- end }}
{{- end }}
---
{{- end }}
