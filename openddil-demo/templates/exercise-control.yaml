{{- if and .Values.exerciseControl.enabled .Values.releasability.enabled }}
{{- $root := . }}
# =============================================================================
# Exercise control: HQ-only adapter driving pause/resume/stop/restart/run
# operations against an external endpoint, and watching the edge sensor
# rate against a floor (see exercise/control.py). Off by default
# (exerciseControl.enabled: false); only rendered alongside the read-path
# releasability stack, since the root pep is its one permitted caller.
# =============================================================================
{{- $adapter := $root.Values.exerciseControl.adapter | default dict }}
{{- /*
RENDER-TIME VALIDATION, mirroring control.py's own startup refusal
(AdapterConfigError) so a bad adapter map fails `helm template`, not a
CrashLoop three stages later. Checked only when this component is actually
going to render -- a disabled exerciseControl may carry a stale or empty
adapter block with no consequence.
*/}}
{{- if not $adapter }}
{{- fail "exerciseControl.enabled is true but exerciseControl.adapter is empty -- control.py refuses to start with no adapter configured" }}
{{- end }}
{{- if not $adapter.endpoint }}
{{- fail "exerciseControl.enabled is true but exerciseControl.adapter.endpoint is empty -- control.py refuses to start with no endpoint configured" }}
{{- end }}
{{- $allowedOps := list "pause" "restart" "resume" "run" "stop" }}
{{- range $op, $opDef := ($adapter.operations | default dict) }}
{{- if not (has $op $allowedOps) }}
{{- fail (printf "exerciseControl.adapter.operations entry %q is not one of %s" $op (toJson $allowedOps)) }}
{{- end }}
{{- $steps := list }}
{{- if kindIs "slice" $opDef }}
{{- if not $opDef }}
{{- fail (printf "exerciseControl.adapter.operations.%s must not be an empty list" $op) }}
{{- end }}
{{- $steps = $opDef }}
{{- else }}
{{- $steps = list $opDef }}
{{- end }}
{{- range $i, $step := $steps }}
{{- if not (kindIs "map" $step) }}
{{- fail (printf "exerciseControl.adapter.operations.%s: each call must be an object {method, path, body}" $op) }}
{{- end }}
{{- if or (not $step.method) (not $step.path) }}
{{- fail (printf "exerciseControl.adapter.operations.%s: call %d is missing method or path" $op $i) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
SEQUENCES (exerciseControl.sequences), checked here with the rules of
control.py's load_sequences, so a bad map fails `helm template` instead of
crash-looping the pod. Every failure names the sequence and, for a step, its
index.
*/}}
{{- range $sname, $seq := ($root.Values.exerciseControl.sequences | default dict) }}
{{- if not (regexMatch "^[a-z]{1,32}$" $sname) }}
{{- fail (printf "exerciseControl.sequences: name %q must match [a-z]{1,32}" $sname) }}
{{- end }}
{{- if or (has $sname $allowedOps) (eq $sname "reset") }}
{{- fail (printf "exerciseControl.sequences: name %q collides with a built-in op" $sname) }}
{{- end }}
{{- if not (kindIs "map" $seq) }}
{{- fail (printf "exerciseControl.sequences.%s must be an object" $sname) }}
{{- end }}
{{- if or (not (kindIs "string" $seq.label)) (not (trim $seq.label)) }}
{{- fail (printf "exerciseControl.sequences.%s: 'label' must be a non-empty string" $sname) }}
{{- end }}
{{- if and (hasKey $seq "description") (not (kindIs "string" $seq.description)) }}
{{- fail (printf "exerciseControl.sequences.%s: 'description' must be a string" $sname) }}
{{- end }}
{{- if or (not (kindIs "slice" $seq.steps)) (lt (len $seq.steps) 1) (gt (len $seq.steps) 32) }}
{{- fail (printf "exerciseControl.sequences.%s: 'steps' must be a list of 1..32 entries" $sname) }}
{{- end }}
{{- $totalWait := 0.0 }}
{{- range $i, $step := $seq.steps }}
{{- if not (kindIs "map" $step) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: must be an object" $sname $i) }}
{{- end }}
{{- if hasKey $step "wait_s" }}
{{- if or (not (has (kindOf $step.wait_s) (list "float64" "float32" "int" "int64" "int32"))) (le (float64 $step.wait_s) 0.0) (gt (float64 $step.wait_s) 900.0) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: wait_s must be a number > 0 and <= 900" $sname $i) }}
{{- end }}
{{- $totalWait = addf $totalWait $step.wait_s }}
{{- else }}
{{- if or (not (kindIs "string" $step.method)) (not (trim $step.method)) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: missing 'method'" $sname $i) }}
{{- end }}
{{- if or (not (kindIs "string" $step.url)) (not (hasPrefix "http://" $step.url)) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: 'url' must be a string starting http://" $sname $i) }}
{{- end }}
{{- $netloc := regexReplaceAll "[/?#].*$" (trimPrefix "http://" $step.url) "" }}
{{- if or (not $netloc) (hasPrefix ":" $netloc) (contains "@" $netloc) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: 'url' needs a host and must not carry credentials" $sname $i) }}
{{- end }}
{{- if and (hasKey $step "body") (not (kindIs "map" $step.body)) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: 'body' must be an object" $sname $i) }}
{{- end }}
{{- if and (hasKey $step "name") (not (kindIs "invalid" $step.name)) (not (kindIs "string" $step.name)) }}
{{- fail (printf "exerciseControl.sequences.%s step %d: 'name' must be a string" $sname $i) }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt $totalWait 1800.0 }}
{{- fail (printf "exerciseControl.sequences.%s: total wait_s %v exceeds 1800" $sname $totalWait) }}
{{- end }}
{{- end }}
{{- /*
RESET JOB (exerciseControl.resetJob.enabled). The Job template the control
service's reset op instantiates, built once here so the ConfigMap and the
Deployment's checksum annotation are over nearly the same bytes. The
checksum is taken over a copy without the helm.sh/chart label, so a chart
version bump alone does not roll the control service. The consequence: after
a version-only bump the running pod's reset Jobs keep the previous
helm.sh/chart label until its next roll (cosmetic). Any change to what the
Job runs, or to any other label, still moves the checksum. Nothing in this
block renders while resetJob is off.
*/}}
{{- $rj := $root.Values.exerciseControl.resetJob | default dict }}
{{- $rjOn := $rj.enabled | default false }}
{{- $rjMode := $rj.mode | default "quick" }}
{{- $job := dict }}
{{- $jobSum := dict }}
{{- if $rjOn }}
{{- if not (has $rjMode (list "quick" "full")) }}
{{- fail (printf "exerciseControl.resetJob.mode must be \"quick\" or \"full\", got %q" (toString $rjMode)) }}
{{- end }}
{{- if ($rj.declareUnmeasured | default list) }}
{{- fail "exerciseControl.resetJob.declareUnmeasured is retired (chart 0.1.141): the regional rollup check no longer needs it; remove it from your values." }}
{{- end }}
{{- $cmd := list }}
{{- $env := list }}
{{- if eq $rjMode "quick" }}
{{- $cmd = list "bash" "/opt/openddil/scripts/reset-scenario.sh" "--quick" }}
{{- $cmd = concat $cmd ($rj.extraArgs | default list) }}
{{- $env = list
      (dict "name" "OPENDDIL_EXPECT_CONTEXT" "value" (printf "in-cluster:%s" $root.Release.Namespace))
      (dict "name" "NS" "value" $root.Release.Namespace)
      (dict "name" "RELEASE" "value" $root.Release.Name)
      (dict "name" "RESTART_SUBJECT" "value" "") }}
{{- else }}
{{- $cmd = list "bash" "/opt/openddil/scripts/restart-exercise.sh" "--release" $root.Release.Name "--namespace" $root.Release.Namespace }}
{{- $cmd = concat $cmd ($rj.extraArgs | default list) }}
{{- $env = list
      (dict "name" "OPENDDIL_EXPECT_CONTEXT" "value" (printf "in-cluster:%s" $root.Release.Namespace))
      (dict "name" "EXERCISE_CONTROL_URL" "value" (printf "http://%s-exercise-control%s:%v" $root.Release.Name (include "openddil.svcDomain" $root) $root.Values.exerciseControl.port))
      (dict "name" "RESTART_SUBJECT" "value" "")
      (dict "name" "POLL_TIMEOUT_S" "value" (toString $rj.pollTimeoutSeconds)) }}
{{- end }}
{{- if $rj.haltBeforePhase }}
{{- $env = append $env (dict "name" "RESET_HALT_BEFORE_PHASE" "value" (toString $rj.haltBeforePhase)) }}
{{- end }}
{{- $env = append $env (dict "name" "RESTATE_MAX_OPEN" "value" (toString ($rj.maxOpen | default 300))) }}
{{- $clearDecl := $rj.clearExerciseDeclarations }}
{{- if kindIs "invalid" $clearDecl }}{{- $clearDecl = false }}{{- end }}
{{- if not (kindIs "bool" $clearDecl) }}
{{- fail (printf "exerciseControl.resetJob.clearExerciseDeclarations must be true or false, got %q" (toString $clearDecl)) }}
{{- end }}
{{- $env = append $env (dict "name" "RESET_CLEAR_DECLARATIONS" "value" (ternary "1" "0" $clearDecl)) }}
{{- /* Phase 7 clears an Electric PVC with a one-shot Job (reset-scenario.sh); it needs the Electric image, the runner image for its guard, and the release's pull secrets. */}}
{{- $pullNames := list }}
{{- range ($root.Values.global.imagePullSecrets | default list) }}{{- $pullNames = append $pullNames .name }}{{- end }}
{{- $env = append $env (dict "name" "ELECTRIC_IMAGE" "value" (include "openddil.thirdPartyImage" $root.Values.electric.image)) }}
{{- $env = append $env (dict "name" "RESET_RUNNER_IMAGE" "value" (include "openddil.resetRunnerImage" $root)) }}
{{- $env = append $env (dict "name" "IMAGE_PULL_SECRETS" "value" (join "," $pullNames)) }}
{{- $jobLabels := merge (include "openddil.labels" $root | fromYaml) (include "openddil.selectorLabels" (dict "component" "exercise-reset" "root" $root) | fromYaml) }}
{{- $podSpec := dict
      "restartPolicy" "Never"
      "terminationGracePeriodSeconds" (int64 $rj.terminationGracePeriodSeconds)
      "serviceAccountName" (printf "%s-exercise-reset" $root.Release.Name)
      "containers" (list (dict
        "name" "reset"
        "image" (include "openddil.resetRunnerImage" $root)
        "imagePullPolicy" ($rj.image.pullPolicy | default "IfNotPresent")
        "command" $cmd
        "env" $env
        "resources" ($rj.resources | default dict)
        "securityContext" (dict "allowPrivilegeEscalation" false))) }}
{{- with $root.Values.global.imagePullSecrets }}
{{- $_ := set $podSpec "imagePullSecrets" . }}
{{- end }}
{{- $job = dict
      "apiVersion" "batch/v1"
      "kind" "Job"
      "metadata" (dict "generateName" (printf "%s-exercise-reset-" $root.Release.Name) "labels" $jobLabels)
      "spec" (dict
        "backoffLimit" 0
        "activeDeadlineSeconds" (int64 $rj.activeDeadlineSeconds)
        "ttlSecondsAfterFinished" (int64 $rj.ttlSecondsAfterFinished)
        "template" (dict "metadata" (dict "labels" $jobLabels) "spec" $podSpec)) }}
{{- $jobSum = deepCopy $job }}
{{- $_ := set (index $jobSum "metadata") "labels" (omit $jobLabels "helm.sh/chart") }}
{{- $_ := set (index $jobSum "spec" "template" "metadata") "labels" (omit $jobLabels "helm.sh/chart") }}
{{- end }}
{{- /*
Restate runtimes the reset pre-flight counts open invocations on: the root
restate-server plus one tier-restate-<id> per tier node, mirroring the
conditions that render those Services (hub.yaml; tier-node.yaml: tierNode.enabled
and the tier is in tierList and in tierNode.tiers when that is set). name = Service name.
*/}}
{{- $restateAdmin := list (dict "name" (printf "%s-restate-server" $root.Release.Name) "port" (int $root.Values.restate.adminPort) "component" "restate-server") }}
{{- if $root.Values.tierNode.enabled }}
{{- range $tier := (include "openddil.tierList" $root | fromYamlArray) }}
{{- if or (not $root.Values.tierNode.tiers) (has $tier.id $root.Values.tierNode.tiers) }}
{{- $restateAdmin = append $restateAdmin (dict "name" (printf "%s-tier-restate-%s" $root.Release.Name $tier.id) "port" 9070 "component" (printf "tier-restate-%s" $tier.id)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $restateUrls := list }}
{{- range $restateAdmin }}
{{- $restateUrls = append $restateUrls (printf "%s=http://%s%s:%d" .name .name (include "openddil.svcDomain" $root) (int .port)) }}
{{- end }}
{{- /*
Rate sources: empty -> one URL per edges[] entry, against the edge's
sensor-ingest Service. That Service has no port named "metrics"
(templates/edge.yaml exposes "dis-udp" and "http"); the "http" port is the
one that serves /metrics.
*/}}
{{- $rateSources := $root.Values.exerciseControl.rateSources }}
{{- if not $rateSources }}
{{- $rateSources = list }}
{{- range $root.Values.edges }}
{{- $rateSources = append $rateSources (printf "http://%s-sensor-ingest-%s%s:%v/metrics" $root.Release.Name .id (include "openddil.svcDomain" $root) $root.Values.sensorIngest.httpPort) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-exercise-control-adapter
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  adapter.json: {{ toJson $adapter | quote }}
  sequences.json: {{ toJson $root.Values.exerciseControl.sequences | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-exercise-control
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $root.Values.exerciseControl.port }}
      name: http
  selector:
    {{- include "openddil.selectorLabels" (dict "component" "exercise-control" "root" $root) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-exercise-control
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
    {{- include "openddil.selectorLabels" (dict "component" "exercise-control" "root" $root) | nindent 4 }}
spec:
  # ONE REPLICA: a second would double-apply the same operation against the
  # external endpoint on every call, which is not a capacity question.
  replicas: 1
  selector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "exercise-control" "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openddil.podLabels" $root | nindent 8 }}
        {{- include "openddil.selectorLabels" (dict "component" "exercise-control" "root" $root) | nindent 8 }}
      annotations:
        {{- /*
        The checksum covers the adapter AND the sequences, so a sequence change
        rolls the pod. Declared consequence: this moves the checksum, so the
        exercise-control pod rolls once on the upgrade that first ships this
        form of it, even with no sequences.
        */}}
        checksum/config: {{ toJson (dict "adapter" $adapter "sequences" $root.Values.exerciseControl.sequences) | sha256sum | quote }}
        {{- if $rjOn }}
        checksum/reset-job: {{ toJson $jobSum | sha256sum | quote }}
        {{- end }}
    spec:
      {{- if $rjOn }}
      serviceAccountName: {{ $root.Release.Name }}-exercise-control
      {{- end }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "openddil.bundleInit" (dict "paths" (list
            (dict "src" "demo/exercise" "dst" "app")
          ) "root" $root) | nindent 8 }}
      containers:
        - name: exercise-control
          # Same pattern as the pep (releasability.yaml): stdlib-only source
          # from the bundle, run by a stock python image. No pip, so no
          # network dependency at boot.
          image: {{ include "openddil.thirdPartyImage" (dict "repository" $root.Values.releasability.pep.image.repository "tag" $root.Values.releasability.pep.image.tag "digest" $root.Values.releasability.pep.image.digest "root" $root) }}
          command: ["python", "-u", "/app/control.py"]
          env:
            - name: EXERCISE_ADAPTER_FILE
              value: /etc/exercise/adapter.json
            - name: EXERCISE_SEQUENCES_FILE
              value: /etc/exercise/sequences.json
            - name: EXERCISE_RATE_SOURCES
              value: {{ join "," $rateSources | quote }}
            - name: EXERCISE_RATE_WINDOW_S
              value: {{ $root.Values.exerciseControl.rateWindowSeconds | quote }}
            - name: EXERCISE_RATE_MIN
              value: {{ $root.Values.exerciseControl.rateMin | quote }}
            - name: EXERCISE_SCRAPE_INTERVAL_S
              value: {{ $root.Values.exerciseControl.scrapeIntervalSeconds | quote }}
            - name: EXERCISE_PORT
              value: {{ $root.Values.exerciseControl.port | quote }}
            - name: EXERCISE_RESTART_MAX_ZERO_AGE_S
              value: {{ $root.Values.exerciseControl.restartMaxZeroAgeSeconds | quote }}
            - name: EXERCISE_RESET_RECORD_FILE
              value: /etc/exercise-reset/record.json
            - name: EXERCISE_RESTATE_ADMIN_URLS
              value: {{ join "," $restateUrls | quote }}
            - name: EXERCISE_RESET_MAX_OPEN
              value: {{ $rj.maxOpen | default 300 | quote }}
            {{- if $rjOn }}
            - name: EXERCISE_RESET_JOB_FILE
              value: /etc/exercise-reset-job/job.json
            - name: EXERCISE_RESET_MODE
              value: {{ $rjMode | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $root.Values.exerciseControl.port }}
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: {{ $root.Values.exerciseControl.port }} }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $root.Values.exerciseControl.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.exerciseControl.resources | nindent 12 }}
          volumeMounts:
            - name: bundle-shared
              mountPath: /app
              subPath: app
            - name: adapter
              mountPath: /etc/exercise
              readOnly: true
            - name: reset-record
              mountPath: /etc/exercise-reset
              readOnly: true
            {{- if $rjOn }}
            - name: reset-job
              mountPath: /etc/exercise-reset-job
              readOnly: true
            {{- end }}
      volumes:
        - name: bundle-shared
          emptyDir: {}
        - name: adapter
          configMap:
            name: {{ $root.Release.Name }}-exercise-control-adapter
        - name: reset-record
          # optional: true -- a release rolled before scripts/reset-scenario.sh
          # ever wrote this ConfigMap (or one that has never had a passing
          # reset) must still start; see that script's own write-gate.
          configMap:
            name: {{ $root.Release.Name }}-exercise-reset-record
            optional: true
        {{- if $rjOn }}
        - name: reset-job
          configMap:
            name: {{ $root.Release.Name }}-exercise-reset-job
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-exercise-control-only
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openddil.selectorLabels" (dict "component" "exercise-control" "root" $root) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ONLY the root pep may call this adapter -- same ingress-only idiom as
    # every other NetworkPolicy in this chart (hub.yaml, releasability.yaml,
    # tier-node.yaml), restricting who may REACH this backend.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" "pep" "root" $root) | nindent 14 }}
      ports:
        - port: {{ $root.Values.exerciseControl.port }}
    {{- if $rjOn }}
    # The reset Job's restart POST.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" "exercise-reset" "root" $root) | nindent 14 }}
      ports:
        - port: {{ $root.Values.exerciseControl.port }}
    {{- end }}
  egress:
    # NO EXISTING NETWORKPOLICY IN THIS CHART HAS AN EGRESS SECTION -- every
    # other policy here is Ingress-only, restricting who may reach a
    # backend, never what a backend may reach outward. There is therefore no
    # pre-existing DNS-allow idiom to copy; the block below is a new pattern
    # for this chart, not a copy of one that already existed.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range $root.Values.edges }}
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" (printf "sensor-ingest-%s" .id) "root" $root) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ $root.Values.sensorIngest.httpPort }}
    # The reset pre-flight's open-invocation count: Restate admin, read-only query.
    - to:
        {{- range $restateAdmin }}
        - podSelector:
            matchLabels:
              {{- include "openddil.selectorLabels" (dict "component" .component "root" $root) | nindent 14 }}
        {{- end }}
      ports:
        - port: 9070
        {{- if ne (int $root.Values.restate.adminPort) 9070 }}
        - port: {{ $root.Values.restate.adminPort }}
        {{- end }}
    {{- range $root.Values.exerciseControl.adapterEgress }}
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
    {{- range $root.Values.exerciseControl.sequenceEgress }}
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
    {{- if $rjOn }}
    # The API server, for the control service creating reset Jobs.
    {{- range $rj.apiServerEgress }}
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
    {{- end }}
{{- if $rjOn }}
---
# The reset runs as a Job the control service's reset op creates from the
# template below. It is the same restart script an operator runs by hand, in
# its in-cluster mode: the same guards, and a halted reset is never retried
# (backoffLimit 0, restartPolicy Never). activeDeadlineSeconds bounds a hang;
# ttlSecondsAfterFinished keeps the log readable afterwards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Release.Name }}-exercise-reset-job
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
data:
  job.json: {{ toJson $job | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $root.Release.Name }}-exercise-reset
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
---
# The set the reset uses, all namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $root.Release.Name }}-exercise-reset
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "patch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $root.Release.Name }}-exercise-reset
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $root.Release.Name }}-exercise-reset
subjects:
  - kind: ServiceAccount
    name: {{ $root.Release.Name }}-exercise-reset
    namespace: {{ $root.Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $root.Release.Name }}-exercise-control
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
---
# Control only creates and reads the reset Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $root.Release.Name }}-exercise-control
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $root.Release.Name }}-exercise-control
  labels:
    {{- include "openddil.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $root.Release.Name }}-exercise-control
subjects:
  - kind: ServiceAccount
    name: {{ $root.Release.Name }}-exercise-control
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
