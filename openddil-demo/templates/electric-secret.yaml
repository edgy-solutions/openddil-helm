{{- /*
   electric-secret.yaml -- the shared secret each Electric requires on
   /v1/shape in secure mode (electric.secure.enabled). One key per Electric
   instance: "hub" and each rendered tier id. Values persist across upgrades
   through lookup; only missing keys are generated. Also runs the guard that
   refuses secure mode without a PEP in front of every Electric.
*/ -}}
{{- include "openddil.electricSecureGuard" . }}
{{- if and .Values.electric.secure.enabled (not .Values.electric.secure.existingSecret) }}
{{- $name := include "openddil.electricSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openddil.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := (include "openddil.electricInstances" . | fromJsonArray) }}
  {{- if and $existing $existing.data (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
