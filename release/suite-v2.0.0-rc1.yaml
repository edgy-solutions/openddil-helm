blockers:
  - "egress: the image was built by a pull_request run from a commit that is not on the default branch; a retag release cannot name it. Needs a build from a default-branch commit (a new digest), or a ruling."
  - "faust-edge: the running deployment mounts three source files over the image; the image alone is not what runs. Needs the change merged and built (a new digest)."
  - "dis-sim (exercise stub adapter): the image is a script runner; its script comes from a ConfigMap created outside the chart, its tag 1.0 is floating, and its build has no provenance. Not listed above."
  - "pep and exercise-control have no image of their own: they run on the stock python image with code from a chart ConfigMap and from the runtime bundle."
  - "bundle: the release runs two bundle digests (the chart default and the per-workload loader pins)."
  - "base images: every Dockerfile FROM names a tag, none a digest."
  - "chart: the chart version that would ship is not on the default branch yet; chart.commit is empty."
  - "reset-runner: the chart references it by :latest; the digest above is what :latest named when this was written, and the chart does not pin it."
